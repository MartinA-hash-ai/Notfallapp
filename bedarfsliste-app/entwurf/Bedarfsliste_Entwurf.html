<title>Bedarfsliste Fundraising</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Kopfzeile mit Reitern wie in der Jahresplanung; darunter entweder die Liste aller Bedarfe (Tabelle)
   oder die Seite eines Bedarfs mit vier Bereichen: Eckdaten · Freigabe und Unterlagen · Förderplan · Nacharbeit */
:root {
  --red: #E30714; --red-d: #b8000c; --onred: #ffffff;
  --ink: #262626; --ink2: #404040; --muted: #6b6b6b; --faint: #9a9a9a;
  --line: #e2e2e2; --line2: #d0d0d0; --line3: #efefed;
  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fbfbfa; --head: #f5f5f4; --hover: #f3f3f1; --chipbg: #ececea;
  --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12;
  --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20;
  --runbg: #e3f2fd; --runline: #9cc8f0; --runink: #0d47a1;
  --viobg: #f1ebfb; --violine: #cdb8f0; --vioink: #5b2ea6;
  --f-in: #2e7d32; --f-zu: #8fcf92; --f-eig: #a3a6ab; --f-be: #64b5f6; --f-ge: #b9b9b6; --track: #ececea;
  --focus: #1F77B4; --shadow: 0 8px 24px rgba(0,0,0,.14);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
    --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
    --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
    --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
    --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
    --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
    --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
    --f-in: #7fd08a; --f-zu: #3f7d46; --f-eig: #6b7078; --f-be: #2f6fa8; --f-ge: #5a5d63; --track: #33363a;
    --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
  --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
  --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
  --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
  --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
  --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
  --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
  --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
  --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
  --f-in: #7fd08a; --f-zu: #3f7d46; --f-eig: #6b7078; --f-be: #2f6fa8; --f-ge: #5a5d63; --track: #33363a;
  --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.25;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink); }
button:hover:not(:disabled), .btn:hover { border-color: var(--faint); }
button:disabled, .btn.disabled { opacity: .45; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: var(--onred); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; white-space: normal; display: inline; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.danger, .danger { color: var(--red-d); }
button.dangerfill { background: var(--red-d); border-color: var(--red-d); color: var(--onred); font-weight: 600; }
button.small, .small { font-size: 12.5px; }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 5px 7px; background: var(--input); min-width: 0; }
input[type=text], input[type=search], input:not([type]) { width: 100%; }
input.num { width: 112px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=date] { width: 142px; }
textarea { width: 100%; resize: vertical; field-sizing: content; min-height: 2.7em; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
button:focus-visible, .btn:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .15s; } }

/* ---------- Kopfzeile */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: stretch; gap: 6px 22px; flex-wrap: wrap;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; flex: none; }
.brand strong { display: block; font-size: 16px; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 12px 10px 9px; color: var(--ink2); font-weight: 500; font-size: 15px; }
.tab:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--line2); }
.tab.on { border-bottom-color: var(--red); color: var(--ink); font-weight: 600; }
.tab .cnt { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.actions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
.kartei-chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: var(--okbg); color: var(--okink); border: 1px solid var(--okline); cursor: help; }
.banner { padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--warnbg); border-bottom: 1px solid var(--warnline); font-size: 13px; color: var(--ink); }

main { padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1640px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; }

/* ---------- Status-Chips und Anzeigen */
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chipbg); color: var(--ink2); white-space: nowrap; border: 1px solid transparent; }
.chip.sw { font-size: 11px; padding: 0 6px; }
.chip.st { font-weight: 600; }
.c-warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.c-err { background: var(--errbg); color: var(--errink); border-color: var(--errline); }
.c-run { background: var(--runbg); color: var(--runink); border-color: var(--runline); }
.c-wait { background: transparent; color: var(--runink); border-color: var(--runline); }
.c-ok { background: var(--okbg); color: var(--okink); border-color: var(--okline); }
.c-info { background: var(--chipbg); color: var(--ink2); }
.c-nach { background: var(--viobg); color: var(--vioink); border-color: var(--violine); }
.c-pause { background: transparent; color: var(--muted); border: 1px dashed var(--line2); }
.inds { display: flex; gap: 3px; align-items: center; }
.ind { font-size: 10.5px; font-weight: 600; min-width: 30px; text-align: center; padding: 2px 3px; border-radius: 4px; border: 1px solid var(--line2); color: var(--faint); cursor: help; }
.ind.u { min-width: 20px; }
.ind.ok { background: var(--okbg); border-color: var(--okline); color: var(--okink); }
.ind.run { background: var(--runbg); border-color: var(--runline); color: var(--runink); }
.ind.mid { background: var(--warnbg); border-color: var(--warnline); color: var(--warn); }
.ind.no { background: var(--errbg); border-color: var(--errline); color: var(--errink); }
.ind.na { border-style: dashed; text-decoration: line-through; opacity: .75; }
.inds .sep { width: 1px; height: 16px; background: var(--line2); margin: 0 3px; }
.fbar { position: relative; display: flex; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; width: 100%; min-width: 120px; }
.fbar.big { height: 14px; border-radius: 7px; max-width: 640px; }
.fb { height: 100%; flex: none; }
.fb.in { background: var(--f-in); }
.fb.zu { background: var(--f-zu); }
.fb.eig { background: var(--f-eig); }
.fb.be { background: var(--f-be); }
.fb.ge { background: repeating-linear-gradient(135deg, var(--f-ge) 0 3px, transparent 3px 6px); }
.fmark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; gap: 5px; align-items: center; }
.lg i { width: 14px; height: 8px; border-radius: 2px; display: inline-block; }
.u-over { color: var(--red-d); font-weight: 700; }
.u-soon { color: var(--warn); font-weight: 700; }
.wicon { color: var(--warn); cursor: help; font-weight: 700; }

/* ---------- Liste */
.list-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.tools input[type=search] { width: 200px; }
.tools select { max-width: 200px; }
.tools select.on { border-color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; margin-bottom: 12px; }
table.list { width: 100%; border-collapse: collapse; min-width: 1200px; }
table.list th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
table.list th.r { text-align: right; }
table.list th button.th { border: 0; background: none; padding: 0; font-weight: 600; color: inherit; font-size: inherit; }
table.list th button.th.on { color: var(--ink); }
table.list td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover { background: var(--hover); }
table.list tbody tr.paused { opacity: .6; }
.c-titel { min-width: 260px; max-width: 360px; }
.c-titel .t { font-weight: 600; color: var(--ink); }
.c-st { min-width: 230px; max-width: 300px; }
.c-fin { width: 190px; }
.c-fr { min-width: 170px; }

/* ---------- Seite eines Bedarfs */
.d-top { display: grid; gap: 10px; margin-bottom: 16px; }
.back { justify-self: start; }
.d-head { display: flex; gap: 12px 20px; align-items: flex-start; flex-wrap: wrap; }
.d-titlewrap { flex: 1 1 380px; min-width: 0; }
.d-titlewrap h1 { font-size: 22px; margin: 0; text-wrap: balance; }
.d-meta { color: var(--muted); margin-top: 2px; }
.d-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.confirm { display: inline-flex; gap: 6px; align-items: center; color: var(--red-d); font-weight: 600; }
.d-statusrow { display: flex; gap: 10px 24px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
#d-status { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; flex: 1 1 360px; min-width: 0; }
.st-sub { color: var(--ink2); }
.st-warn { color: var(--warn); font-size: 13px; font-weight: 600; }
ol.steps { display: flex; flex-wrap: wrap; gap: 6px 0; list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps li { counter-increment: s; font-size: 12.5px; color: var(--faint); padding: 0 12px; display: flex; align-items: center; gap: 6px; }
ol.steps li + li { border-left: 1px solid var(--line); }
ol.steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
ol.steps li.done { color: var(--ink2); }
ol.steps li.done::before { content: "✓"; background: var(--f-in); border-color: var(--f-in); color: var(--card); }
ol.steps li.cur { color: var(--ink); font-weight: 600; }
ol.steps li.cur::before { border-color: var(--red); color: var(--red); }

.sec-head { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 17px; margin: 0; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 12px 16px; }
.grid.eck { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 30px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.span2 { grid-column: span 2; }
.span3 { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > .lab { font-size: 12px; font-weight: 600; color: var(--ink2); }
.fld > .help { font-size: 11.5px; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 220px; width: auto !important; }
.unit { color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 4px; background: var(--input); }
#zust-chips { display: contents; }
.pchip { display: inline-flex; align-items: center; gap: 2px; background: var(--chipbg); border-radius: 12px; padding: 1px 2px 1px 9px; font-size: 13px; }
.chips input.chip-in { border: 0; padding: 3px 4px; flex: 1 1 90px; width: auto; background: transparent; }
.chips input.chip-in:focus { outline: none; }
.chips:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; }
button.x { border: 0; background: none; color: var(--faint); padding: 1px 6px; font-size: 16px; line-height: 1; }
button.x:hover:not(:disabled) { color: var(--red-d); }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--card); align-self: flex-start; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line2); padding: 4px 9px; background: transparent; color: var(--ink2); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(.on) { background: var(--hover); }
.seg button.on { background: var(--ink2); color: var(--card); font-weight: 600; }
.seg button.on.t-ok { background: var(--okbg); color: var(--okink); box-shadow: inset 0 0 0 1px var(--okline); }
.seg button.on.t-run { background: var(--runbg); color: var(--runink); box-shadow: inset 0 0 0 1px var(--runline); }
.seg button.on.t-warn { background: var(--warnbg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warnline); }
.seg button.on.t-err { background: var(--errbg); color: var(--errink); box-shadow: inset 0 0 0 1px var(--errline); }
.seg.small button { padding: 3px 7px; font-size: 12px; }

.fr-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line3); }
.fr-lab { font-weight: 600; padding-top: 4px; }
.fr-lab .sub { font-weight: 400; }
.fr-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.fr-dates { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.fr-dates label { display: inline-flex; gap: 5px; align-items: center; }
.since { color: var(--warn); font-weight: 600; }
.fr-row.na .fr-lab { color: var(--muted); }
.fr-na { color: var(--muted); font-size: 13px; padding-top: 4px; }
.fr-foot { margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.fr-foot.ok { background: var(--okbg); color: var(--okink); }
.fr-foot.warn { background: var(--warnbg); color: var(--warn); }
.ul-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 28px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line3); }
.ul-name { font-weight: 500; min-width: 0; }
.ul-add { display: flex; gap: 6px; margin-top: 10px; }

.foe-list { display: grid; gap: 12px; }
.foe { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 26px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--soft); }
.foe.st-abgelehnt { background: var(--card); }
.foe.st-abgelehnt .foe-name input { text-decoration: line-through; color: var(--muted); }
.foe-l, .foe-r { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.foe-name input { font-weight: 600; font-size: 15px; }
.kv { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
.kv > .k { font-size: 12px; font-weight: 600; color: var(--ink2); min-width: 92px; }
.amounts { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: flex-end; }
.amt { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink2); font-weight: 600; }
.kartei-info { font-size: 12.5px; color: var(--ink2); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: grid; gap: 3px; }
.kartei-info .sel { user-select: all; }
.badge { justify-self: start; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--chipbg); color: var(--ink2); }
.badge.k { background: var(--okbg); color: var(--okink); }
.also { font-size: 12.5px; color: var(--warn); }
.hint-warn { color: var(--warn); }
.geld { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.geld.ok { color: var(--okink); font-weight: 600; }
.geld.form { padding: 8px 10px; border: 1px solid var(--line2); border-radius: 6px; background: var(--card); align-items: flex-end; }
.geld.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; }
.foe-foot { display: flex; justify-content: flex-end; margin-top: auto; }
.foe-add { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.eigen { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
.eigen .lab { font-weight: 600; min-width: 100px; }
.fin { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.fintab { border-collapse: collapse; width: 100%; max-width: 640px; font-variant-numeric: tabular-nums; }
.fintab th { text-align: left; font-weight: 500; padding: 4px 12px 4px 0; color: var(--ink2); }
.fintab td { padding: 4px 0 4px 16px; white-space: nowrap; }
.fintab tr.main th, .fintab tr.main td { font-weight: 700; color: var(--ink); }
.gap { color: var(--red-d); }
.over { color: var(--warn); }
.okc { color: var(--okink); }

.na-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; margin-bottom: 10px; background: var(--soft); }

  if (open.length && laufend.length) warn.push((laufend.some(f => f.durch === 'gl') ? 'Gliederung hat schon beantragt' : 'Antrag läuft schon') + ', Freigabe ist aber nicht vollständig');
  if (!b.summe) warn.push('Summe fehlt');
  if (rej.length) return { k: 'stop', step: 0, t: 'Freigabe abgelehnt', sub: rej.map(frName).join(', '), warn };
  if (open.length) return { k: 'frei', step: 0, t: 'Freigabe läuft', sub: 'fehlt: ' + open.map(frName).join(', '), warn };
  if (!fs.length) return { k: 'plan', step: 1, t: 'Förderplan aufstellen', sub: 'noch kein Förderer eingetragen', warn };
  const vor = fs.filter(f => f.status === 'geplant' || f.status === 'vorb'), wart = fs.filter(f => f.status === 'beantragt');
  if (vor.length) return { k: 'antrag', step: 1, t: 'Anträge stellen', sub: names(vor) + (wart.length ? ' · wartet auf ' + names(wart) : ''), warn };
  if (wart.length) return { k: 'warten', step: 1, t: 'Warten auf Antwort', sub: names(wart), warn };
  const F = fin(b), zu = fs.filter(f => f.status === 'zugesagt');
  if (!zu.length || (F.S && F.gedeckt < F.S)) return { k: 'luecke', step: 1, t: 'Finanzierungslücke', sub: (F.S ? eur(F.S - F.gedeckt) + ' offen' : 'keine Zusage') + ', weiteren Förderer suchen', warn };
  const geld = zu.filter(f => !(f.eingegangen > 0));
  if (geld.length) return { k: 'geld', step: 1, t: 'Geldeingang offen', sub: names(geld), warn };
  const na = nachOffen(b);
  if (na.length) return { k: 'nach', step: 2, t: 'Nacharbeit', sub: 'fehlt: ' + na.join(', '), warn };
  return { k: 'fertig', step: 3, t: 'Abgeschlossen', sub: b.archiv ? '' : 'kann ins Archiv', warn };
}
const CHIP = { frei: 'c-warn', stop: 'c-err', plan: 'c-info', antrag: 'c-run', warten: 'c-wait', luecke: 'c-err', geld: 'c-warn', nach: 'c-nach', fertig: 'c-ok', pause: 'c-pause' };
const PH_ORD = { stop: 0, frei: 1, plan: 2, antrag: 3, warten: 4, luecke: 5, geld: 6, nach: 7, fertig: 8, pause: 9 };

function fristen(b) {
  const p = phase(b), L = [];
  if (p.step === 0 || p.step === 1) { if (b.deadline) L.push({ d: b.deadline, t: 'Deadline des Bedarfs' }); }
  for (const f of b.foerderer) {
    if ((f.status === 'geplant' || f.status === 'vorb') && f.frist) L.push({ d: f.frist, t: 'Antragsfrist ' + short(f.name) });
    if (f.status === 'beantragt' && f.erwartet) L.push({ d: f.erwartet, t: 'Antwort ' + short(f.name) });
    if (f.status === 'zugesagt') for (const [k, l] of [['sb', 'Sachbericht'], ['vn', 'Verwendungsnachweis']]) if (f[k].noetig && !f[k].erledigt && f[k].frist) L.push({ d: f[k].frist, t: l + ' ' + short(f.name) });
  }
  const u = b.nach.ueb;
  if (u.noetig && u.st !== 'erledigt' && u.termin) L.push({ d: u.termin, t: 'Spendenübergabe' });
  return L.sort((x, y) => x.d.localeCompare(y.d));
}
const nextFrist = b => (b.archiv || b.manuell) ? null : (fristen(b)[0] || null);
const urg = d => { const n = days(TODAY, d); return n < 0 ? 'u-over' : n <= 14 ? 'u-soon' : ''; };
function rel(d) {
  const n = days(TODAY, d);
  if (n === 0) return 'heute';
  if (n === 1) return 'morgen';
  if (n === -1) return 'seit gestern überfällig';
  if (n < 0) return 'seit ' + (-n) + ' Tagen überfällig';
  return n > 60 ? 'in ' + Math.round(n / 30.4) + ' Monaten' : 'in ' + n + ' Tagen';
}

function getPath(o, p) { return p.split('.').reduce((x, k) => x == null ? x : x[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) x = x[ks[i]]; x[ks[ks.length - 1]] = v; }

}

const tarea = (o, p, x = '', ph = '') => `<textarea data-p="${p}" ${x} rows="2" placeholder="${esc(ph)}">${esc(getPath(o, p) ?? '')}</textarea>`;
const cbx = (o, p, lab, x = '') => `<label class="check"><input type="checkbox" data-p="${p}" ${x} ${getPath(o, p) ? 'checked' : ''}> ${lab}</label>`;
const seg = (opts, cur, attrs, cls = '') => `<div class="seg ${cls}" role="group">` + opts.map(([v, l, tone]) =>
  `<button type="button" class="${v === cur ? 'on ' + (tone || '') : ''}" data-act="set" data-v="${esc(v)}" ${attrs} aria-pressed="${v === cur}">${l}</button>`).join('') + '</div>';
const dl = (id, vals) => `<datalist id="${id}">${uniq(vals).map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`;

function finBar(b, big) {
  const F = fin(b), tot = F.zugesagt + F.eig + F.beantragt + F.geplant, max = Math.max(F.S, tot, 1);
  const s = (v, c, t) => v > 0 ? `<span class="fb ${c}" style="width:${(v / max * 100).toFixed(2)}%" title="${t}: ${eur(v)}"></span>` : '';
  return `<div class="fbar${big ? ' big' : ''}" role="img" aria-label="${esc(finText(b))}">${s(F.eingegangen, 'in', 'eingegangen')}${s(Math.max(0, F.zugesagt - F.eingegangen), 'zu', 'zugesagt')}${s(F.eig, 'eig', 'Eigenanteil')}${s(F.beantragt, 'be', 'beantragt')}${s(F.geplant, 'ge', 'geplant')}`
    + (tot > F.S && F.S > 0 ? `<span class="fmark" style="left:${(F.S / max * 100).toFixed(2)}%" title="Bedarf ${eur(F.S)}"></span>` : '') + '</div>';
}
function finText(b) {
  const F = fin(b);

  const gap = F.S - F.gedeckt;
  return gap > 0 ? `${Math.round(F.gedeckt / F.S * 100)} % gedeckt · Lücke ${eur(gap)}` : gap < 0 ? `überdeckt um ${eur(-gap)}` : 'voll gedeckt';
}

const SORTV = {

    }
    case 'geld-undo': { const f = b.foerderer.find(x => x.id === a.dataset.fid); f.eingegangen = null; f.eingangAm = ''; UI.geld = null; save(); break; }
    case 'mit': { const m = b.nach.ueb.mit, i = m.indexOf(a.dataset.fid); if (i >= 0) m.splice(i, 1); else m.push(a.dataset.fid); save(); break; }
    case 'copy-path': copyPath(b); return;
    default: return;
  }
  keep(render);
}

document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act, a, e); });
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.matches && el.matches('tr[data-act="open"]')) { e.preventDefault(); act('open', el, e); }
  if (e.key === 'Enter' && el.id === 'zust-new') { e.preventDefault(); addZust(); }
  if (e.key === 'Enter' && el.id === 'ul-new') { e.preventDefault(); addUl(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ui === 'q') { UI.q = el.value; const r = listBody(); swap('list-body', r.html, true); const c = document.getElementById('list-count'); if (c) c.textContent = r.n + ' von ' + D.filter(b => !!b.archiv === (UI.tab === 'archiv')).length; return; }
  if (!el.dataset.p || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  const b = cur(); if (!b) return;
  setPath(baseOf(el, b), el.dataset.p, 'num' in el.dataset ? parseNum(el.value) : el.value);
  save(); refresh();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'zust-new') { addZust(); return; }
  if (el.dataset.ui && el.dataset.ui !== 'q') { UI[el.dataset.ui] = el.value; keep(render); return; }
  if (!el.dataset.p || !(el.type === 'checkbox' || el.tagName === 'SELECT')) return;
  const b = cur(); if (!b) return;
  setPath(baseOf(el, b), el.dataset.p, el.type === 'checkbox' ? el.checked : el.value);
  save(); keep(render);
});
document.addEventListener('focusout', e => { const el = e.target; if (el.dataset && 'num' in el.dataset && el.dataset.p) el.value = fmtNum(parseNum(el.value)); });

render();
</script>
