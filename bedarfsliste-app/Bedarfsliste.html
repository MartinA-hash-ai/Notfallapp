<style id="bl-style">/* Layout: Kopfzeile mit Reitern wie in der Jahresplanung; darunter die Liste (nach Phase gruppiert) oder die Seite eines Bedarfs
   mit vier Bereichen. Farben als Tokens: hell auf :root, dunkel über das System oder data-theme="dark";
   die Einstellung im Programm (data-bl-theme) geht beidem vor. */
:root {
  --red: #E30714; --red-d: #b8000c; --onred: #ffffff;
  --ink: #262626; --ink2: #404040; --muted: #6b6b6b; --faint: #9a9a9a;
  --line: #e2e2e2; --line2: #d0d0d0; --line3: #efefed;
  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fbfbfa; --head: #f5f5f4; --hover: #f3f3f1; --chipbg: #ececea;
  --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12;
  --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20;
  --runbg: #e3f2fd; --runline: #9cc8f0; --runink: #0d47a1;
  --viobg: #f1ebfb; --violine: #cdb8f0; --vioink: #5b2ea6;
  --prio-h: #c0837c; --prio-m: #c9a467; --prio-l: #b3b5b8; --prio-off: #e3e3e0; --prio-t: #c8524a;
  --done: #9fcd9c; --strong: #4f8f55; --ghost: #cfcfcb;
  --ph1bg: #fbf5dc; --ph1ink: #7a5d0a; --ph1line: #eadb9c; --ph2bg: #fbede2; --ph2ink: #95501f; --ph2line: #edc8a8;
  --ph3bg: #f2eef8; --ph3ink: #5f4a86; --ph3line: #d8cdea; --ph4bg: #f0f0ee; --ph4ink: #5f6266; --ph4line: #d9d9d5;
  --e5: #dcefdc; --e5ink: #2f6a33; --e4: #ecf5e4; --e4ink: #4f6f2f; --e3: #f3f1ea; --e3ink: #6b6450; --e2: #fbece4; --e2ink: #95501f; --e1: #f8e1df; --e1ink: #8a2c22;
  --f-in: #4f8f55; --f-zu: #a9d3a7; --f-eig: #a3a6ab; --f-be: #e0c460; --f-ge: #c4c4bf; --track: #ececea;
  --focus: #1F77B4; --shadow: 0 8px 24px rgba(0,0,0,.14); --backdrop: rgba(0,0,0,.35);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) {
    --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
    --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
    --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
    --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
    --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
    --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
    --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
    --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b; --prio-t: #f0948b;
    --done: #4f7f55; --strong: #7fbf86; --ghost: #4c4f54;
    --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
    --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
    --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
    --f-in: #7fbf86; --f-zu: #3f6f45; --f-eig: #6b7078; --f-be: #9a8440; --f-ge: #55585d; --track: #33363a;
    --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) .logo.light { display: none; }
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) .logo.dark { display: block; }
}
:root[data-theme="dark"]:not([data-bl-theme="light"]), :root[data-bl-theme="dark"] {
  --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
  --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
  --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
  --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
  --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
  --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
  --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
  --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
  --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
  --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b; --prio-t: #f0948b;
  --done: #4f7f55; --strong: #7fbf86; --ghost: #4c4f54;
  --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
  --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
  --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
  --f-in: #7fbf86; --f-zu: #3f6f45; --f-eig: #6b7078; --f-be: #9a8440; --f-ge: #55585d; --track: #33363a;
  --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
  color-scheme: dark;
}
:root[data-theme="dark"]:not([data-bl-theme="light"]) .logo.light, :root[data-bl-theme="dark"] .logo.light { display: none; }
:root[data-theme="dark"]:not([data-bl-theme="light"]) .logo.dark, :root[data-bl-theme="dark"] .logo.dark { display: block; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.25;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink); }
button:hover:not(:disabled), .btn:hover { border-color: var(--faint); }
button:disabled, .btn.disabled { opacity: .45; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: var(--onred); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; white-space: normal; display: inline; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.danger, .danger { color: var(--red-d); }
button.dangerfill { background: var(--red-d); border-color: var(--red-d); color: var(--onred); font-weight: 600; }
button.icon { padding: 4px 10px; font-weight: 700; }
.small { font-size: 12.5px; }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 5px 7px; background: var(--input); min-width: 0; }
input[type=text], input[type=search], input:not([type]) { width: 100%; }
input.num { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=date] { width: 140px; }
textarea { width: 100%; resize: vertical; field-sizing: content; min-height: 2.7em; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
button:focus-visible, .btn:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.hint-warn { color: var(--warn); }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.pathbox { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

/* ---------- Kopfzeile und Hinweise */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: stretch; gap: 6px 22px; flex-wrap: wrap;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; flex: none; }
.brand .logo { height: 36px; width: auto; flex: none; }
.logo.dark { display: none; }
.brand strong { display: block; font-size: 16px; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 12px 10px 9px; color: var(--ink2); font-weight: 500; font-size: 15px; }
.tab:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--line2); }
.tab.on { border-bottom-color: var(--red); color: var(--ink); font-weight: 600; }
.tab .cnt { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
.kchip { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--chipbg); color: var(--ink2); border: 1px solid transparent; }
.kchip.ok { background: var(--okbg); color: var(--okink); border-color: var(--okline); }
.kchip.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.save { min-width: 132px; justify-content: center; }
.save.ok { color: var(--okink); }
.banners .banner { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--warnbg); border-bottom: 1px solid var(--warnline); font-size: 13px; color: var(--ink); }
.banner > span { flex: 1 1 320px; }
.banner.err { background: var(--errbg); border-bottom-color: var(--errline); }
.banner.upd { background: var(--runbg); border-bottom-color: var(--runline); }
.menu { position: fixed; z-index: 85; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 180px; }
.menu > button { display: flex; width: 100%; text-align: left; border: 0; padding: 8px 12px; border-radius: 5px; background: transparent; gap: 8px; }
.menu > button:hover, .menu > button.on { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
.menu-row > span { margin-right: auto; color: var(--muted); }
.mini-btn { padding: 2px 8px; font-size: 12px; }
.mini-btn.on { background: var(--ink2); color: var(--card); border-color: var(--ink2); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--card); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.toast.err { background: var(--red-d); color: var(--onred); }
.toast button.link { color: inherit; font-weight: 600; }
.toast.out { opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .3s; } }
.backdrop { position: fixed; inset: 0; z-index: 80; background: var(--backdrop); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); width: 100%; max-width: 540px; max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { max-width: 820px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.modal > header h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 6px 18px 12px; overflow: auto; }
.modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.help p { margin: 0 0 10px; }
.radios { display: grid; gap: 6px; margin-top: 8px; }
table.imp { border-collapse: collapse; width: 100%; font-size: 13px; }
table.imp th { text-align: left; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 6px; }
table.imp td { padding: 5px 6px; border-bottom: 1px solid var(--line3); vertical-align: top; }
table.imp .badge { margin-left: 6px; }

main { padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }

/* ---------- Phase, Priorität, kleine Anzeigen */
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chipbg); color: var(--ink2); white-space: nowrap; }
.chip.sw { font-size: 11px; padding: 0 6px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--chipbg); color: var(--ink2); }
.badge.k { background: var(--okbg); color: var(--okink); }
.phase { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 11px; border: 1px solid transparent; white-space: nowrap; }
.ph-frei { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1line); }
.ph-foer { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2line); }
.ph-nach { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3line); }
.ph-fertig { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4line); }
.ph-pause { background: transparent; color: var(--muted); border: 1px dashed var(--line2); }
.st-main.bad b { color: var(--red-d); }
.prio { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; padding: 2px 3px; border: 0; border-radius: 4px; background: none; vertical-align: -3px; flex: none; }
button.prio:hover { background: var(--hover); }
.prio i { width: 3.5px; background: var(--prio-off); border-radius: 1px; }
.prio i:nth-child(1) { height: 5px; } .prio i:nth-child(2) { height: 9px; } .prio i:nth-child(3) { height: 13px; }
.prio.p-hoch i { background: var(--prio-h); }
.prio.p-mittel i:nth-child(-n+2) { background: var(--prio-m); }
.prio.p-niedrig i:first-child { background: var(--prio-l); }
.fbar { position: relative; display: flex; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; width: 100%; min-width: 110px; }
.fbar.big { height: 14px; border-radius: 7px; }
.fb { height: 100%; flex: none; }
.fb + .fb { box-shadow: inset 2px 0 0 var(--card); }
.fb.in, .swa.in { background: var(--f-in); } .fb.zu, .swa.zu { background: var(--f-zu); } .fb.eig, .swa.eig { background: var(--f-eig); } .fb.be, .swa.be { background: var(--f-be); }
.fb.ge, .swa.ge { background: repeating-linear-gradient(135deg, var(--f-ge) 0 3px, transparent 3px 6px); }
.swa.ge { box-shadow: inset 0 0 0 1px var(--line2); }
.swa { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.fmark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.legend .sep { width: 1px; height: 14px; background: var(--line2); }
.lg { display: inline-flex; gap: 5px; align-items: center; }
.lg > i.swa { width: 14px; height: 8px; }
.u-over { color: var(--red-d); font-weight: 700; }
.u-soon { color: var(--warn); font-weight: 700; }

/* ---------- Liste */
.list-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.tools input[type=search] { width: 190px; }
.tools select { max-width: 190px; }
.tools select.on { border-color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; margin-bottom: 12px; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list th.r { text-align: right; }
table.list td { border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tbody tr[data-act] { cursor: pointer; }
table.list tbody tr[data-act]:hover { background: var(--hover); }
table.list tbody tr.paused { opacity: .6; }
/* Zeile: Kerninfo mittig in der Höhe, dann Freigabe, Finanzierungsplan ⋯ Verwendungsnachweis, Spendenübergabe – je Block ein feiner Strich */
table.list { min-width: 1180px; }
table.list th { vertical-align: bottom; background: none; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; color: var(--faint); padding: 4px 12px 8px; }
table.list td { padding: 14px 12px; font-size: 12.5px; line-height: 20px; }
table.list td.l-name, table.list td.l-sum, table.list td.l-meta { vertical-align: middle; }
table.list td.l-name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.35; min-width: 180px; }
table.list td.l-sum { font-size: 14.5px; font-weight: 700; text-align: right; white-space: nowrap; line-height: 1.35; padding-left: 4px; }
table.list td.l-meta { color: var(--muted); white-space: nowrap; width: 1%; }
td.l-meta .ort { color: var(--ink); font-weight: 700; }
.prio-t { color: var(--prio-t); font-weight: 600; white-space: nowrap; }
.pause-t { color: var(--muted); font-weight: 600; white-space: nowrap; }
.l-fr, .l-fin, .l-ueb { border-left: 1px solid var(--line3); }
table.list td.l-fr { white-space: nowrap; width: 1%; color: var(--ink2); }
.l-fin { width: 450px; }
.l-ueb { width: 215px; }
.nn { color: var(--ghost); }
.ml { display: flex; align-items: center; gap: 7px; }
.ml-sub { color: var(--muted); padding-left: 22px; }
.mi { width: 15px; height: 15px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 800; line-height: 1; border: 1.5px solid var(--line2); color: var(--faint); background: var(--card); }
.mi svg { width: 13px; height: 13px; fill: currentColor; display: block; }
.mi.m-ok { background: var(--e5); border-color: var(--f-in); color: var(--e5ink); }
.mi.m-run { background: var(--ph1bg); border-color: #d9b740; color: var(--ph1ink); }
.mi.m-no { background: var(--e1); border-color: #d9827a; color: var(--e1ink); font-size: 9px; }
.mi.m-none { border-color: transparent; background: none; }
.mi.m-dot { width: 10px; height: 10px; margin: 2.5px 2.5px 0; border: 0; background: var(--faint); }
/* Freigabe vollständig: blass grün, ohne Rand und Haken – das Thema ist durch */
.done .ml { color: var(--done); }
.done .ml.nn { color: var(--ghost); }
.done .mi.m-ok { width: 10px; height: 10px; margin: 0 2.5px; border: 0; background: var(--done); color: transparent; }
/* Finanzierungsplan: Kreis · Förderer · Betrag · gepunktet · Kreis · Verwendungsnachweis */
.fg { display: grid; grid-template-columns: 15px minmax(0, 1fr) auto 36px 15px 100px; column-gap: 8px; align-items: start; }
.fg .fr { display: contents; }
.fg > .fr > :first-child { grid-column: 1; }
.fg > .fr > .mi { margin-top: 2.5px; }
.fg-h { align-items: end; }
.fg-h > span:first-child { grid-column: 1 / 4; }
.fg-h > span:last-child { grid-column: 4 / 7; white-space: nowrap; }
.fn { overflow-wrap: anywhere; color: var(--ink2); }
.fa { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink2); }
.fr.ab .fn, .fr.ab .fa { color: var(--e1ink); text-decoration: line-through; }
.fr.sum .fn, .fr.sum .fa { color: var(--ink); font-weight: 600; }
.fline { grid-column: 2 / 4; border-top: 1px solid var(--line); margin: 3px 0 2px; }
.lead { border-bottom: 2px dotted var(--line2); height: 0; margin-top: 10px; }
.vt { white-space: nowrap; color: var(--ink2); }
.vt.nn { color: var(--ghost); }
/* Finanzierung steht: Zusagen mit offenem Nachweis kräftig, erledigte blass grün, alle übrigen blass grau */
.fr.strong .mi.m-dot { background: var(--strong); }
.fr.strong .fn, .fr.strong .fa { color: var(--ink); }
.fr.z .mi.m-dot { background: var(--done); }
.fr.z .fn, .fr.z .fa, .fr.z .vt:not(.nn) { color: var(--done); }
.fr.z .lead { border-color: var(--done); }
.fr.x .mi.m-dot { background: var(--ghost); }
.fr.x .fn, .fr.x .fa { color: var(--ghost); }
.warnl { color: var(--warn); font-weight: 600; }
.tri { width: 15px; height: 15px; color: #e8892b; flex: none; }
.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 4px; white-space: normal; }

/* ---------- Seite eines Bedarfs */
.st-main { color: var(--ink2); }
.st-warn { color: var(--warn); font-size: 13px; font-weight: 600; }
ol.steps { display: flex; flex-wrap: wrap; gap: 6px 0; list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps li { counter-increment: s; font-size: 13px; color: var(--faint); padding: 0 12px; display: flex; align-items: center; gap: 6px; }
ol.steps li:first-child { padding-left: 0; }
ol.steps li + li { border-left: 1px solid var(--line); }
ol.steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
ol.steps li.done { color: var(--ink2); }
ol.steps li.done::before { content: "✓"; background: var(--f-in); border-color: var(--f-in); color: var(--card); }
ol.steps li.cur { color: var(--ink); font-weight: 700; }
ol.steps li.cur::before { border-color: currentColor; }
ol.steps li.cur.ph-frei::before { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1ink); }
ol.steps li.cur.ph-foer::before { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2ink); }
ol.steps li.cur.ph-nach::before { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3ink); }
ol.steps li.cur.ph-fertig::before { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4ink); }
section.card { scroll-margin-top: 76px; }
.sec-head { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 17px; margin: 0; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 300px; }
.grid { display: grid; gap: 12px 16px; }
.g12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
/* Schreiblinien oben auf der Bedarfsseite: nur ein Strich, solange leer steht der Name des Feldes darin */
.grid.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid.frei { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > .lab { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
/* Beschreibung und Ordner nebeneinander, beide so hoch wie das höhere von beiden */
.o-row { display: grid; gap: 3px; }
.o-lab { font-size: 12px; color: var(--muted); }
button.info { width: 17px; height: 17px; padding: 0; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); color: var(--muted);
  font: italic 700 11px/1 Georgia, "Times New Roman", serif; justify-content: center; flex: none; text-transform: none; letter-spacing: 0; }
button.info:hover:not(:disabled) { color: var(--ink); border-color: var(--faint); }
.info-pop { max-width: 380px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: var(--ink2); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; width: auto !important; }
.unit { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 4px; background: var(--input); min-height: 33px; }
#zust-chips { display: contents; }

.chips input.chip-in:focus { outline: none; }
.chips:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--card); align-self: flex-start; }

.seg button.on.t-e5 { background: var(--e5); color: var(--e5ink); } .seg button.on.t-e4 { background: var(--e4); color: var(--e4ink); }
.seg button.on.t-e3 { background: var(--e3); color: var(--e3ink); } .seg button.on.t-e2 { background: var(--e2); color: var(--e2ink); }
.seg button.on.t-e1 { background: var(--e1); color: var(--e1ink); }

.geld { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }

.na-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; margin-bottom: 10px; background: var(--soft); }

/* ---------- Bedarfsseite: Phase und Stand hängen unter der Kopfzeile; darunter Name und Gliederung zum Anklicken, rechts Summe, ⋯ und Löschen */
.subbar { flex-basis: 100%; display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; padding: 7px 0 8px; border-top: 1px solid var(--line3); }

.sum-line { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; }

.d-right { min-width: 0; }

/* ---------- Förderplan: oben die Übersicht (Balken und Tabelle), darunter je Förderer eine eigene Karte */

.st-btn.s-beantragt { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1line); }

.pc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.pro, .contra { display: grid; gap: 3px; align-content: start; }
.pc-lab { font-size: 12.5px; font-weight: 700; }
.pro .pc-lab { color: var(--e5ink); } .contra .pc-lab { color: var(--e1ink); }

.fp-empty { margin-bottom: 16px; }

.det-more { display: grid; gap: 8px; margin-top: 10px; }

@media (max-width: 1100px) {
  .g12 .s6, .g12 .s8 { grid-column: span 12; }
  .g12 .s3, .g12 .s4, .g12 .s5 { grid-column: span 6; }
  .g12 .s2 { grid-column: span 6; }

}

  .fp-top { flex-direction: column; }
  .fp-fig { align-items: stretch; width: 100%; }
  .fp-grid { grid-template-columns: minmax(0, 1fr) auto; }
  dl.dl { grid-template-columns: minmax(0, 1fr); }
  table.fsum { font-size: 13px; }
  table.fsum td { padding-left: 8px; }
  .r-st { display: block; margin-left: 0; }
  .fp-grid { justify-content: end; }
  input.inline.fp-h { font-size: 17px; }
  textarea.title { font-size: 22px; }
  header.top { position: static; }
  .tools { margin-left: 0; }
  .tools input[type=search], .tools select { width: 100%; max-width: none; }
  .actions { margin-left: 0; }
  .save { min-width: 0; }
}

const z2 = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => isoDate(new Date());
const validIso = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; const d = new Date(s + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === s; };
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmtDate = s => validIso(s) ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';
const fmtStamp = iso => { if (!iso) return 'unbekannt'; const d = new Date(iso); return d.toLocaleDateString('de-DE') + ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; };
function rel(d) {
  const n = days(today(), d);
  if (n === 0) return 'heute';
  if (n === 1) return 'morgen';
  if (n === -1) return 'seit gestern überfällig';
  if (n < 0) return 'seit ' + (-n) + ' Tagen überfällig';
  return n > 60 ? 'in ' + Math.round(n / 30.4) + ' Monaten' : 'in ' + n + ' Tagen';
}
// Datum aus Excel oder Text: Excel-Zahl, „TT.MM.JJJJ“, „TT.MM.JJ“ oder „JJJJ-MM-TT“ → „JJJJ-MM-TT“ (sonst '')
function anyDate(v) {
  if (typeof v === 'number') return v > 20000 && v < 80000 ? new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10) : '';
  const s = String(v ?? '').trim(); let q;
  if ((q = /^(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})\b/.exec(s))) { const r = (q[3].length === 2 ? '20' + q[3] : q[3]) + '-' + z2(q[2]) + '-' + z2(q[1]); return validIso(r) ? r : ''; }
  if ((q = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) { const r = q[1] + '-' + z2(q[2]) + '-' + z2(q[3]); return validIso(r) ? r : ''; }
  return '';
}

// Zahlen deutsch eingeben: „1.500“ = 1500, „1.234,50“ = 1234,5; Ergebnis: Zahl, '' (leer) oder null (keine Zahl)
function deNum(t) {
  if (typeof t === 'number') return t;
  let s = String(t ?? '').replace(/\s|€|EUR/gi, '');
  if (!s) return '';
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^\d+(\.\d+)?$/.test(s) ? +s : null;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const PROPS = new Set(['value', 'checked', 'disabled', 'selected', 'type']);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (PROPS.has(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}

// kind: '' | 'ok' | 'warn' | 'err'; undo: Funktion für „Rückgängig“
function toast(text, kind = '', undo = null) {
  const box = $('#toasts'); if (!box) return;
  const t = h('div', { class: 'toast ' + kind, role: 'status' }, h('span', null, text),
    undo ? h('button', { class: 'link', onclick: () => { t.remove(); undo(); } }, 'Rückgängig') : null);
  while (box.children.length >= 3) box.firstChild.remove();
  box.append(t);
  const ms = undo ? 8000 : 3800;
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => t.remove(), ms + 400);
}
function modal(title, body, buttons, opts = {}) {
  return new Promise(resolve => {
    const opened = Date.now();
    const close = v => { back.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') close(null); };
    const box = h('div', { class: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('header', null, h('h2', null, title), h('button', { class: 'x', 'aria-label': 'Schließen', onclick: () => close(null) }, '×')),
      h('div', { class: 'modal-body' }, body),
      h('footer', null, (buttons || [['OK', true, 'primary']]).filter(Boolean).map(([label, val, cls]) =>
        h('button', { class: cls || '', onclick: () => close(typeof val === 'function' ? val() : val) }, label))));
    const back = h('div', { class: 'backdrop', onmousedown: e => { if (e.target === back && Date.now() - opened > 400) close(null); } }, box);
    if (opts.expose) opts.expose(close);
    document.body.append(back);
    document.addEventListener('keydown', key);
    const f = box.querySelector('footer button.primary') || box.querySelector('input,select,textarea');
    if (f) setTimeout(() => f.focus(), 30);
  });
}
const confirmBox = (title, text, yes = 'Ja', no = 'Abbrechen') => modal(title, h('p', null, text), [[no, false], [yes, true, 'primary']]).then(v => v === true);
function download(filename, blob) {
  if (DEMO) { toast('In der Vorschau lassen sich keine Dateien herunterladen. In der Programmdatei geht das.', 'warn'); return; }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function pickFile(accept) {
  return new Promise(resolve => {
    const inp = h('input', { type: 'file', accept, style: 'display:none' });
    inp.addEventListener('change', () => { const f = inp.files[0]; inp.remove(); resolve(f || null); });
    document.body.append(inp); inp.click();
  });
}

// Daten aus der Datei auf den aktuellen Aufbau bringen (fehlende Felder ergänzen, Unbrauchbares verwerfen)
function normalize(d) {

    const alt = isObj(b.freigabe) && isObj(b.freigabe.angebot) ? b.freigabe.angebot.st : null;

      const f = merge(ff({}), f0), v = f.vn, v0 = isObj(f0.vn) ? f0.vn : {}, sb = isObj(f0.sb) ? f0.sb : null;

/* ---------- Freigabe: Ortsführungskreis immer, Fachreferat und Verwaltung ab 1.000 € (darunter nur, wenn angefragt); dazu muss das Angebot vorliegen */
const FR_DEF = {
  ofk: { label: 'Ortsführungskreis', short: 'OFK', ok: 'zugestimmt', nein: 'abgelehnt', offen: 'noch nicht angefragt' },

  verw: { label: 'Verwaltung (Budgetierung)', short: 'Verwaltung', ok: 'budgetiert', nein: 'nicht budgetiert', offen: 'noch nicht angefragt' },

const ab1000 = b => (+b.summe || 0) >= 1000;
function frItems(b) {

    na: k === 'ofk' && b.gliederung === DIO ? 'entfällt, Bedarf der Diözese' : null, opt: (k === 'fach' || k === 'verw') && !ab1000(b) }, FR_DEF[k]));

const frNeeded = i => !i.na && !(i.opt && i.st === 'offen');

function frOffen(b) {
  const open = frItems(b).filter(i => frNeeded(i) && i.st !== 'ok'), ang = angebotUL(b);
  return { names: [...open.map(frName), ...(!ang || ang.st !== 'da' ? ['Angebot'] : [])], rej: open.filter(i => i.st === 'nein') };
}
const ulOpts = u => u.fest && u.name === 'Angebot' ? [['fehlt', 'fehlt'], ['arbeit', 'angefragt', 't-warn'], ['da', 'liegt vor', 't-ok']] : [['fehlt', 'fehlt'], ['arbeit', 'in Arbeit', 't-warn'], ['da', 'vorhanden', 't-ok']];
const ulText = u => (ulOpts(u).find(o => o[0] === u.st) || [, u.st])[1];

/* ---------- Finanzierung */
function fin(b) {
  let ge = 0, be = 0, zu = 0, ein = 0;
  for (const f of b.foerderer) {
    const v = +f.betrag || 0;
    if (f.status === 'geplant' || f.status === 'vorb') ge += v;
    else if (f.status === 'beantragt') be += v;
    else if (f.status === 'zugesagt') { zu += f.zugesagt != null ? +f.zugesagt : v; ein += +f.eingegangen || 0; }
  }

}
// Finanzierung steht, wenn Zusagen und Eigenmittel den Bedarf decken und kein Antrag mehr läuft; nie angegangene Förderer zählen dann nicht mehr.
// d: was noch fehlt (> 0) oder zu viel ist (< 0) – solange die Finanzierung nicht steht, zählen auch geplante und beantragte Förderer mit
function finState(b) {
  const S = +b.summe || 0, eig = +b.eigenanteil || 0, fs = b.foerderer.filter(f => f.name.trim() || f.betrag);
  const sum = L => L.reduce((a, f) => a + foeAmt(f), 0);
  const zu = sum(fs.filter(f => f.status === 'zugesagt')), plan = sum(fs.filter(f => f.status !== 'abgelehnt'));
  const done = (S ? zu + eig >= S : zu > 0) && !fs.some(f => f.status === 'beantragt');

}
// Wer deckt was: zugesagt (eingegangen zuerst), Eigenmittel, beantragt, geplant – in dieser Reihenfolge im Balken; abgelehnte fehlen
const KIND_L = { in: 'eingegangen', zu: 'zugesagt', eig: 'Eigenmittel', be: 'beantragt', ge: 'geplant' };

function finSegs(b) {

  const segs = b.foerderer.filter(f => f.status !== 'abgelehnt' && foeAmt(f) > 0).map(f => ({ id: f.id, v: foeAmt(f), name: f.name.trim() || '(ohne Namen)',
    k: f.status === 'zugesagt' ? (f.eingegangen > 0 ? 'in' : 'zu') : f.status === 'beantragt' ? 'be' : 'ge' }));
  if (+b.eigenanteil > 0) segs.push({ id: null, v: +b.eigenanteil, k: 'eig', name: 'Eigenmittel' });

}

  return gap > 0 ? `${Math.round(F.gedeckt / F.S * 100)} % gedeckt · Lücke ${eur(gap)}` : gap < 0 ? `überdeckt um ${eur(-gap)}` : 'voll gedeckt';

/* ---------- Phase und Stand: ergeben sich aus den Häkchen, nichts davon wird von Hand gepflegt */
const PHASES = [
  { k: 'frei', t: 'Freigabe' }, { k: 'foer', t: 'Förderung' }, { k: 'nach', t: 'Nacharbeit' }, { k: 'fertig', t: 'Abgeschlossen' },

const names = l => l.map(f => short(f.name)).join(', ');
function nachOffen(b) {
  const L = [];

    if (f.vn.noetig && f.vn.st !== 'erledigt') L.push('Verwendungsnachweis ' + short(f.name));
  }
  if (b.nach.ueb.noetig && b.nach.ueb.st !== 'erledigt' && b.foerderer.some(f => f.status === 'zugesagt')) L.push('Spendenübergabe');
  if (b.nach.pm.noetig && b.nach.pm.st !== 'veroeff') L.push('Pressemitteilung');

}
// step: 0 Freigabe · 1 Förderung · 2 Nacharbeit · 3 Abgeschlossen · -1 zurückgestellt/verworfen; bad: braucht Aufmerksamkeit
function phase(b) {

  const fo = frOffen(b);
  const fs = b.foerderer.filter(f => f.name.trim() || f.betrag);
  const laufend = fs.filter(f => f.status === 'beantragt' || f.status === 'zugesagt');
  if (fo.names.length && laufend.length) warn.push((laufend.some(f => f.durch === 'gl') ? 'Gliederung hat schon beantragt' : 'Antrag läuft schon') + ', Freigabe ist aber nicht vollständig');
  if (!b.summe) warn.push('Summe fehlt');
  if (fo.rej.length) return { k: 'stop', step: 0, t: 'Freigabe abgelehnt', sub: fo.rej.map(frName).join(', '), bad: true, warn };
  if (fo.names.length) return { k: 'frei', step: 0, t: 'Es fehlt', sub: fo.names.join(', '), bad: false, warn };
  if (!fs.length) return { k: 'plan', step: 1, t: 'Förderplan aufstellen', sub: 'noch kein Förderer eingetragen', bad: false, warn };

    if (wart.length) return { k: 'warten', step: 1, t: 'Warten auf Antwort', sub: names(wart), bad: false, warn };
    return { k: 'luecke', step: 1, t: 'Finanzierungslücke', sub: (FS.S ? eur(FS.S - FS.zu - FS.eig) + ' offen' : 'keine Zusage') + ', weiteren Förderer suchen', bad: true, warn };
  }
  const geld = zu.filter(f => !(f.eingegangen > 0));
  if (geld.length) return { k: 'geld', step: 1, t: 'Geldeingang offen', sub: names(geld), bad: false, warn };
  const na = nachOffen(b);
  if (na.length) return { k: 'nach', step: 2, t: 'Es fehlt', sub: na.join(', '), bad: false, warn };

}
const phaseName = p => p.step < 0 ? p.t : PHASES[p.step].t;
const PH_CLS = ['ph-frei', 'ph-foer', 'ph-nach', 'ph-fertig'];

/* ---------- Fristen: was steht als Nächstes an? */
function fristen(b) {
  const p = phase(b), L = [];
  if ((p.step === 0 || p.step === 1) && b.deadline) L.push({ d: b.deadline, t: 'Deadline des Bedarfs' });
  for (const f of b.foerderer) {
    if ((f.status === 'geplant' || f.status === 'vorb') && f.frist) L.push({ d: f.frist, t: 'Antragsfrist ' + short(f.name) });
    if (f.status === 'beantragt' && f.erwartet) L.push({ d: f.erwartet, t: 'Antwort ' + short(f.name) });
    if (f.status === 'zugesagt' && f.vn.noetig && f.vn.st !== 'erledigt' && f.vn.frist) L.push({ d: f.vn.frist, t: 'Verwendungsnachweis ' + short(f.name) });
  }
  const u = b.nach.ueb;
  if (u.noetig && u.st !== 'erledigt' && u.termin) L.push({ d: u.termin, t: 'Spendenübergabe' });

/* ===================================================================== Speichern: die Datei speichert sich selbst (Programm + Daten in einer HTML-Datei)
   Aufbau wie bei der Jahresplanung, vereinfacht für eine Person (kein Protokoll, keine Anwesenheit).
   Gespeichert wird im Ordner der Programmdatei (z. B. im OneDrive) – automatisch kurz nach jeder Änderung. */

const DEFAULT_FILE = 'Bedarfsliste.html';
const UPD_ZIP_RE = /^Bedarfsliste.*\.zip$/i;
let BROKEN = null;                            // Daten der geöffneten Datei unlesbar: Speichern gesperrt, bis gültige Daten geladen sind
const ST = { dir: null, html: null, htmlDir: null, stamp: null, conn: 'none', saving: false, again: false, timer: null, watch: null, tick: 0,
  conflict: null, lastSave: null, fail: null, retry: null, newer: null, zipUpd: null, perm: null, askArmed: false };
const FSA = !DEMO && 'showDirectoryPicker' in window;

const fileVersion = text => ((text || '').match(/const APP_INFO = \{"version": "([^"]+)"/) || [])[1] || null;
function verCmp(a, b) {
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; }

    '<title>Bedarfsliste</title>\n<link rel="icon" href="' + FAVICON + '">\n<style id="bl-style">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
    '<' + S + ' type="application/json" id="bl-data">' + json + '</' + S + '>\n<' + S + ' id="bl-app">' + js + '</' + S + '>\n</body>\n</html>\n';

/* ---------- Ordnerzugriff im Browser merken (IndexedDB), damit beim nächsten Start ein Klick reicht */
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('bedarfsliste', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

// Programmdatei im Ordner suchen (auch im Unterordner „Bedarfsliste …“)
async function findHtml(dir) {
  const name = currentFileName();
  try { return { file: await dir.getFileHandle(name), dir }; } catch (e) { /* weiter suchen */ }
  const subs = [], files = [];
  for await (const [n, e] of dir.entries()) { if (e.kind === 'directory' && /^Bedarfsliste/i.test(n)) subs.push(e); if (e.kind === 'file' && /^Bedarfsliste.*\.html?$/i.test(n)) files.push(e); }
  for (const sd of subs) { try { return { file: await sd.getFileHandle(name), dir: sd }; } catch (e) { /* */ } }

async function attachFolder(create) {

  const text = f.size ? await f.text() : '', other = text ? parseFileText(text) : null;

// Liegt im Ordner eine neuere Programmversion? Dann nicht mehr speichern (sonst käme die alte Version zurück)
function noteNewer(text, other) {

// Nach einem Neustart fragt der Browser beim ersten Klick, ob die App den Ordner wieder bearbeiten darf
function askPermissionOnFirstClick() {

    ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);

async function xlsxBook(buf, opts = {}) {

/* ===================================================================== Förder-Kartei: die Excel „Banken- und Stiftungsübersicht“ aus dem Ordner (nur lesen)
   Die Kartei wird weiter in Excel gepflegt. Die Liste liest sie beim Öffnen, beim Zurückkehren ins Fenster und etwa jede Minute neu ein,
   sobald sich die Datei geändert hat. Erkannt wird je Blatt die Kopfzeile mit „Gliederung“; die Namensspalte ist die Spalte links davon
   mit den meisten verschiedenen Einträgen. Verbundene Zellen (eine Bank für mehrere Gliederungen) gelten für alle ihre Zeilen. */

const KR = { list: [], byKey: new Map(), name: '', stamp: null, at: null, err: null, cut: false, busy: false, cands: [] };
const KARTEI_RE = /(bank|banken|stiftung|kartei|f(ö|oe)rderer)/i;
const kkey = s => norm(s).replace(/[„“"'’]/g, '');
const kartei = name => KR.byKey.get(kkey(name)) || null;
const truthy = v => v === true || v === 1 || /^(x|ja|wahr|true|1|✓)$/i.test(String(v ?? '').trim());
const cellStr = v => v === true ? 'ja' : v === false ? '' : String(v ?? '').trim();

function karteiSet(list) {
  KR.list = list.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  KR.byKey = new Map(list.map(k => [kkey(k.name), k]));
}
async function karteiScan(force) {
  if (DEMO || KR.busy || ST.conn !== 'ok' || !ST.htmlDir) return;
  KR.busy = true;
  try {
    const cands = [];
    for await (const [n, e] of ST.htmlDir.entries()) if (e.kind === 'file' && /\.xlsx$/i.test(n) && !/^~\$/.test(n)) cands.push([n, e]);
    KR.cands = cands.map(c => c[0]).sort((a, b) => a.localeCompare(b, 'de'));
    const want = D.settings.kartei;
    let hit = want ? cands.find(([n]) => n === want) : cands.find(([n]) => KARTEI_RE.test(n) && !/vorlage|f(ö|oe)rderplan/i.test(n));
    if (!hit) {
      const err = want ? '„' + want + '“ liegt nicht mehr im Ordner' : null;
      if (KR.list.length || KR.err !== err) { karteiSet([]); KR.name = ''; KR.stamp = null; KR.err = err; safeRender(); }
      return;
    }
    const f = await hit[1].getFile();
    if (!force && KR.name === hit[0] && KR.stamp === f.lastModified && !KR.err) return;
    const book = await xlsxBook(await f.arrayBuffer(), { max: 4e6 });
    karteiSet(parseKartei(book));
    KR.name = hit[0]; KR.stamp = f.lastModified; KR.at = new Date(); KR.err = null; KR.cut = book.sheets.some(s => s.cut);
    safeRender();
  } catch (e) {
    console.warn(e);
    const msg = e && e.name === 'NotReadableError' ? 'gerade nicht lesbar (in Excel geöffnet oder wird synchronisiert?) – neuer Versuch in einer Minute' : (e && e.message) || String(e);
    if (KR.err !== msg) { KR.err = msg; safeRender(); }
  } finally { KR.busy = false; }
}
function parseKartei(book) {
  const out = new Map();
  for (const sh of book.sheets) {
    const rows = sh.rows, hi = rows.findIndex(r => r.some(v => norm(v) === 'gliederung'));
    if (hi < 0) continue;
    const head = rows[hi].map(norm), gi = head.indexOf('gliederung');
    let ni = -1, best = 0;
    for (let c = 0; c < gi; c++) {
      const s = new Set(); for (let r = hi + 1; r < rows.length; r++) { const v = rows[r][c]; if (typeof v === 'string' && v.trim()) s.add(v.trim()); }
      if (s.size > best) { best = s.size; ni = c; }
    }
    if (ni < 0) continue;
    // Spalten rechts von „Gliederung“ zuordnen; „Mail“/„Telefon“ gehören zum Kontakt links davon
    const col = { years: [] }, kontakte = []; let curK = null;
    const above = c => { for (let r = hi - 1; r >= 0; r--) for (let k = c; k >= 0; k--) { const v = String(rows[r][k] ?? ''); if (/anschreiben/i.test(v)) return v; } return ''; };
    head.forEach((t, c) => {
      if (c <= gi) return;
      if (/^(kontakt|ansprech)/.test(t)) { curK = { n: c, hint: above(c) }; kontakte.push(curK); }
      else if (/^(e-?)?mail$/.test(t)) { if (curK) { if (curK.m == null) curK.m = c; } else if (col.perMail == null) col.perMail = c; }
      else if (/^tel/.test(t)) { if (curK && curK.t == null) curK.t = c; }
      else if (t === 'direkt') col.direkt = c;
      else if (t === 'portal') col.portal = c;
      else if (/notiz/.test(t)) col.notiz = c;
      else if (/schwerpunkt|zweck/.test(t)) col.schwer = c;
      else if (/homepage|website|internet/.test(t)) col.web = c;
      else if (/^(19|20)\d\d$/.test(t)) col.years.push([t, c]);
    });
    let cur = null;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], name = cellStr(row[ni]), gl = cellStr(row[gi]);
      if (name) {
        const k = kkey(name);
        cur = out.get(k) || { name, blatt: sh.name, gl: [], kontakte: [], hist: {}, weg: [], notiz: '', schwer: '', web: '' };
        out.set(k, cur);
      } else if (!gl) continue;                   // Leerzeile
      if (!cur) continue;
      if (gl && !cur.gl.includes(gl)) cur.gl.push(gl);
      if (col.direkt != null && truthy(row[col.direkt]) && !cur.weg.includes('direkt')) cur.weg.push('direkt');
      if (col.perMail != null && truthy(row[col.perMail]) && !cur.weg.includes('per Mail')) cur.weg.push('per Mail');
      if (col.portal != null && truthy(row[col.portal]) && !cur.weg.includes('Portal')) cur.weg.push('Portal');
      for (const [f, c] of [['notiz', col.notiz], ['schwer', col.schwer], ['web', col.web]]) if (c != null && !cur[f]) cur[f] = cellStr(row[c]);
      for (const kc of kontakte) {
        const n = cellStr(row[kc.n]); if (!n || /^[-–]$/.test(n)) continue;
        if (cur.kontakte.some(x => x.n === n)) continue;
        const m = kc.m != null ? cellStr(row[kc.m]) : '', t = kc.t != null ? cellStr(row[kc.t]) : '';
        cur.kontakte.push({ n, m: /@/.test(m) ? m : '', t, nicht: /nicht/i.test(kc.hint) });
      }
      for (const [y, c] of col.years) {
        const v = cellStr(row[c]); if (!v) continue;
        if (!cur.hist[y]) cur.hist[y] = v; else if (!cur.hist[y].includes(v)) cur.hist[y] += '\n' + v;
      }
    }
  }
  return [...out.values()];
}
async function karteiChoose() {
  if (ST.conn !== 'ok') { if (!await connectFolder()) return; }
  await karteiScan(true);
  const cands = KR.cands;
  let pick = D.settings.kartei || KR.name || '';
  const body = h('div', { class: 'help' },
    h('p', null, 'Welche Excel im Ordner ist deine Förder-Kartei? Die Liste liest sie nur – gepflegt wird weiter in Excel.'),
    cands.length ? h('div', { class: 'radios' }, ...cands.map(n => h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: n, checked: n === pick, onchange: () => { pick = n; } }), n)))
      : h('p', { class: 'muted' }, 'Im Ordner liegt noch keine Excel-Datei. Lege die Kartei in den Ordner der Bedarfsliste und öffne dieses Fenster erneut.'),
    h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: '', checked: !D.settings.kartei, onchange: () => { pick = ''; } }), 'automatisch erkennen (Dateiname mit „Bank“, „Stiftung“ oder „Kartei“)'));
  const ok = await modal('Förder-Kartei wählen', body, [['Abbrechen', false], ['Übernehmen', true, 'primary']]);
  if (!ok) return;
  if (pick === '' && !D.settings.kartei) { await karteiScan(true); renderNow(); return; }
  D.settings.kartei = pick; changed(); KR.stamp = null; await karteiScan(true); renderNow();
}

const FP_COLS = [

/* ---------- Förderplan aus einer Excel lesen */
async function readFoerderplan(buf) {
  const book = await xlsxBook(buf);
  for (const sh of [...book.sheets].sort((a, c) => (c.name === FP_SHEET) - (a.name === FP_SHEET))) {
    const hi = sh.rows.findIndex(r => fpHeadKey(r[0]) === 'förderer');
    if (hi < 0) continue;
    const map = {};
    const heads = c => [c.t, ...(c.alias || [])].map(fpHeadKey);
    sh.rows[hi].forEach((t, i) => { const k = fpHeadKey(t); const c = FP_COLS.find(c => heads(c).includes(k)) || FP_COLS.find(c => k && heads(c).some(x => k.startsWith(x.slice(0, 8)))); if (c && map[c.k] == null) map[c.k] = i; });
    const kenn = sh.rows.find(r => norm(r[0]) === 'kennung');
    const items = [];
    for (const r of sh.rows.slice(hi + 1)) {
      const name = cellStr(r[map.name]); if (!name) continue;
      const it = { name };
      for (const c of FP_COLS) {
        if (c.k === 'name' || map[c.k] == null) continue;
        const v = r[map[c.k]];
        if (c.date) it[c.k] = anyDate(v);
        else if (c.num) { const n = deNum(v); it[c.k] = typeof n === 'number' ? n : null; }
        else if (c.k === 'einsch') it[c.k] = einschKey(v);
        else it[c.k] = cellStr(v);
      }
      items.push(it);
    }
    return { items, kennung: kenn ? cellStr(kenn[1]) : '', sheet: sh.name };
  }
  return null;
}
// Einschätzung aus freiem Text (auch ältere Wörter wie „eher nicht“ oder „klappt“)
function einschKey(v) {
  const s = norm(v);
  if (!s) return '';
  if (/sehr\s*unwahrscheinlich|unmöglich|keine chance|sehr gering|sehr schlecht/.test(s)) return 'suw';
  if (/unwahrscheinlich|eher nicht|schwierig|schlecht|gering|niedrig/.test(s)) return 'uw';
  if (/unsicher|mittel|vielleicht|offen|möglich/.test(s)) return 'u';
  if (/sehr\s*wahrscheinlich|sehr gut|sehr hoch/.test(s)) return 'sw';
  if (/wahrscheinlich|klappt|gut|hoch/.test(s)) return 'w';
  return '';
}
// Felder eines Förderers aus der Recherche übernehmen: 'fill' = nur leere Felder füllen, 'all' = überschreiben
function applyResearch(f, it, mode) {
  for (const c of FP_COLS) {
    if (c.k === 'name') continue;
    const v = it[c.k]; if (v == null || v === '') continue;
    const empty = f[c.k] == null || f[c.k] === '';
    if (mode === 'all' || empty) f[c.k] = v;
  }
}
async function importFoerderplan(b, file) {

      h('td', { class: 'num' }, it.betrag ? eur(it.betrag) : '–'),

    h('div', { class: 'tablewrap' }, tbl),

  if (!neu && !erg) return;

const CMP = {

function cmp(x, y, k) { const a = CMP[k](x), c = CMP[k](y); return typeof a === 'number' ? a - c : String(a).localeCompare(String(c), 'de'); }
function filtered() {

  return L.sort((x, y) => cmp(x, y, 'prio') || cmp(x, y, 'frist') || cmp(x, y, 'titel'));

// Priorität ändern: kleines Menü am Balken (Seite des Bedarfs)
function prioMenu(btn) {

function placePop(m, btn, align) {
  document.body.append(m);

  m.style.left = Math.max(8, Math.min(align === 'right' ? r.right - m.offsetWidth : r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + 4 + m.offsetHeight > innerHeight ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + 'px';
}
function closeMenus() { $$('.menu').forEach(m => m.remove()); }
document.addEventListener('mousedown', e => { if (!e.target.closest('.menu, [data-act="prio-menu"], [data-act="menu"], [data-act="info"], [data-act="circ"], [data-act="st-menu"], [data-act="more"]')) closeMenus(); }, true);

/* ===================================================================== Seite eines Bedarfs

   Eingabefelder tragen data-p (Pfad im Bedarf), bei Förderern zusätzlich data-fid, bei Unterlagen data-uid.
   Tippen ändert nur die Daten und zeichnet abgeleitete Teile neu (refresh); Knöpfe und Auswahlfelder zeichnen die Seite neu. */

const fld = (lab, inner, cls = '', info = '') => `<div class="fld ${cls}"><span class="lab">${lab}${info ? ' ' + infoBtn(info) : ''}</span>${inner}</div>`;
const tin = (o, p, x = '', ph = '') => `<input type="text" data-p="${p}" ${x} value="${esc(getPath(o, p) ?? '')}" placeholder="${esc(ph)}">`;

  `<button type="button" class="${v === cur ? 'on ' + (tone || '') : ''}" data-act="set" data-v="${esc(v)}" ${attrs} aria-pressed="${v === cur}">${l}</button>`).join('') + '</div>';
const dl = (id, vals) => `<datalist id="${id}">${uniq(vals).map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`;

const metaRest = b => (b.stichwort ? `<span class="chip sw">${esc(b.stichwort)}</span> · ` : '') + (b.angelegt ? 'angelegt ' + fmtDate(b.angelegt) : '');
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-.9 11.1A2 2 0 0 1 15.1 22H8.9a2 2 0 0 1-2-1.9L6 9zm4 2v8h1.6v-8H10zm2.4 0v8H14v-8h-1.6z"/></svg>';

/* ---------- Rechts: Freigaben, Unterlagen, Ordner – je Punkt ein Kreis (grün ✓, gelb …, rot ✗); ein Klick darauf bietet die anderen Stände an */
const CIRC_SYM = { ok: '✓', run: '…', no: '✗', off: '', na: '–' };
const circ = (kind, attrs, label) => `<button class="circ c-${kind}" data-act="circ" ${attrs} aria-label="${esc(label)} – Stand ändern" title="Stand ändern">${CIRC_SYM[kind]}</button>`;
const frKind = i => i.na ? 'na' : ({ ok: 'ok', angefragt: 'run', nein: 'no', offen: 'off' })[i.st];
const ulKind = u => ({ da: 'ok', arbeit: 'run', fehlt: 'no' })[u.st] || 'no';
function freigabeList(b) {
  const rows = frItems(b).map(i => {
    const p = 'freigabe.' + i.k;

      : `<span class="ci-n" title="${esc(i.label)}">${i.k === 'verw' ? 'Verwaltung' : esc(i.label)}</span>`;
    const hint = i.na ? 'entfällt' : i.opt && i.st === 'offen' ? 'nicht nötig' : i.st === 'offen' ? 'noch nicht angefragt' : '';
    const since = i.st === 'angefragt' && validIso(i.item.angefragt) ? 'angefragt am ' + fmtDate(i.item.angefragt) + ', seit ' + days(i.item.angefragt, today()) + ' Tagen' : 'angefragt am';
    const date = !i.na && (i.st === 'angefragt' || i.st === 'nein') ? `<input type="date" class="inline date" data-p="${p}.angefragt" value="${esc(i.item.angefragt || '')}" aria-label="angefragt am" title="${esc(since)}">` : '';
    return `<div class="ci-row" id="fr-${i.k}">${i.na ? '<span class="circ c-na" aria-hidden="true">–</span>' : circ(frKind(i), `data-kind="fr" data-k="${i.k}"`, i.label)}
      <div class="ci-t">${name}${hint ? `<span class="ci-hint">${hint}</span>` : ''}</div>${date}</div>`;
  }).join('');
  const fo = frOffen(b);
  return rows + (fo.names.length ? `<div class="ci-foot warn">Es fehlt noch: ${esc(fo.names.join(', '))}</div>` : '<div class="ci-foot ok">✓ Freigabe vollständig</div>')
    + dl('dl-fach', [...FACH_LIST, ...D.bedarfe.map(x => x.freigabe.fach.name)]);

    + `<div class="ci-row add"><span class="circ c-add" aria-hidden="true">+</span><input type="text" id="ul-new" class="inline" list="dl-ul" placeholder="weitere Unterlage" aria-label="Weitere Unterlage hinzufügen"></div>`
    + dl('dl-ul', ['Bilder', 'Presseartikel', 'Studien', 'Kostenplan', 'Zeitplan', 'Unterstützerschreiben'].filter(n => !b.unterlagen.some(u => u.name === n)));
}
function sidePanel(b) {

// kleines Fenster mit den möglichen Ständen, am angeklickten Kreis
function circMenu(btn) {
  closeMenus();

  let opts, cur0, attrs = {};

    const i = frItems(b).find(x => x.k === btn.dataset.k);

/* ---------- Förderplan: je Förderer eine Überschrift (Name), rechts groß die Summe mit Anteil, daneben der Stand mit Fristen, oben rechts die Einschätzung;
   darunter Pro und Contra, Kontakt und Details zum Aufklappen */
const F_ST = [['geplant', 'geplant'], ['vorb', 'in Vorbereitung', 't-warn'], ['beantragt', 'beantragt', 't-run'], ['zugesagt', 'zugesagt', 't-ok'], ['abgelehnt', 'abgelehnt', 't-err']];
const F_ST_L = Object.fromEntries(F_ST.map(([v, l]) => [v, l]));
const LVL = ['suw', 'uw', 'u', 'w', 'sw'];                 // Einschätzung als Punkte 1 (rot) … 5 (grün)
const artFromKartei = (k, name) => /stiftung/i.test(name) || /stift/i.test(k.blatt) ? 'Stiftung' : /sparkasse/i.test(name) ? 'Sparkasse' : /bank/i.test(name) ? 'Volksbank / Bank' : '';
// Hinweise, die immer zu sehen sind: andere Region laut Kartei, derselbe Förderer bei anderen Bedarfen
function foeWarn(b, f) {
  if (!f.name.trim()) return '';
  const k = kartei(f.name), key = kkey(f.name);
  const other = D.bedarfe.filter(x => x !== b && !x.archiv && x.foerderer.some(g => kkey(g.name) === key && g.status !== 'abgelehnt'));
  const L = [];
  if (k && b.gliederung && b.gliederung !== DIO && k.gl.length && !k.gl.some(g => /^alle$/i.test(g)) && !k.gl.includes(b.gliederung)) L.push('Laut Kartei zuständig für ' + esc(k.gl.join(', ')));
  if (other.length) L.push('Auch im Förderplan von: ' + other.map(x => `<button class="link" data-act="open" data-id="${x.id}">${esc(x.titel || '(ohne Namen)')}</button> (${F_ST_L[x.foerderer.find(g => kkey(g.name) === key).status]})`).join(', '));
  return L.length ? `<div class="foe-warn">${L.map(t => `<div>${t}</div>`).join('')}</div>` : '';
}
function detSummary(f) {

function saveBox() {
  if (DEMO) return '';
  const dirty = isDirty(), t = ST.lastSave ? ST.lastSave.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : null;
  let label, cls = 'save', tip;
  if (!FSA) { label = dirty ? '● Speichern' : '✓ Gespeichert'; cls += dirty ? ' primary' : ''; tip = 'Speichern lädt die Datei herunter (Browser ohne Ordnerzugriff)'; }
  else if (ST.saving) { label = 'Speichert …'; tip = 'wird gespeichert'; }
  else if (BROKEN) { label = '⚠ Speichern gesperrt'; cls += ' primary'; tip = 'Die Daten dieser Datei waren beschädigt – siehe Hinweis oben'; }
  else if (ST.newer) { label = '⚠ Neustart nötig'; cls += ' primary'; tip = 'Im Ordner liegt eine neuere Programmversion – siehe Hinweis oben'; }
  else if (ST.conflict) { label = '⚠ Zwei Stände'; cls += ' primary'; tip = 'Die Datei wurde woanders geändert – siehe Hinweis oben'; }
  else if (ST.conn === 'none') { label = 'Speichern …'; cls += ' primary'; tip = 'Einmal den Ordner wählen – danach speichert die Liste automatisch'; }
  else if (ST.conn === 'needs-permission') { label = 'Speichern aktivieren'; cls += ' primary'; tip = 'Ein Klick: der Browser fragt, ob die Liste den Ordner bearbeiten darf'; }
  else if (ST.fail && dirty) { label = '⚠ Nicht gespeichert'; cls += ' primary'; tip = 'Speichern fehlgeschlagen: ' + ST.fail.msg + '. Neuer Versuch läuft automatisch – oder hier klicken.'; }
  else if (dirty) { label = '● wird gespeichert …'; tip = 'Jetzt speichern (Strg+S)'; }
  else { label = '✓ Gespeichert' + (t ? ' ' + t : ''); cls += ' ok'; tip = 'Alles gespeichert'; }
  return `<button id="savebox" class="${cls}" data-act="save" title="${esc(tip)}">${esc(label)}</button>`;
}

    <nav class="tabs" aria-label="Ansicht">${tab('aktiv', 'Bedarfe', nA)}${tab('archiv', 'Archiv', nR)}</nav>
    <div class="actions">${karteiChip()}${saveBox()}<button class="primary" data-act="new">+ Bedarf</button><button class="icon gear" data-act="menu" aria-label="Einstellungen" title="Einstellungen: Darstellung hell oder dunkel, Sicherung, Update">${ICON_GEAR}</button></div>
    ${b ? `<div class="subbar"><button class="back" data-act="back">‹ Alle Bedarfe</button><div id="d-steps">${steps(b)}</div><div id="d-status">${statusBlock(b)}</div></div>` : ''}

}
function bannersHtml() {
  const B = [], ban = (cls, text, btns = '') => B.push(`<div class="banner ${cls}"><span>${text}</span>${btns}</div>`);
  if (DEMO) ban('', '<b>Vorschau</b> mit erfundenen Beispieldaten. Änderungen merkt sich nur dieser Browser; Speichern, Förder-Kartei und Excel gibt es in der Programmdatei.', '<button class="link" data-act="demo-reset">Beispieldaten zurücksetzen</button>');

  if (ST.newer) ban('err', 'Im Ordner liegt eine neuere Version der Bedarfsliste (' + esc(ST.newer.version) + '). Bitte neu laden, damit nichts mit der alten Version überschrieben wird.', '<button class="primary" data-act="reload">Neu laden</button>');

  if (FSA && ST.conn === 'none') ban('', 'Einmal den Ordner wählen, in dem diese Datei liegt – dann speichert die Liste automatisch und liest deine Förder-Kartei mit ein.', '<button class="primary" data-act="connect">Ordner wählen …</button>');
  if (FSA && ST.conn === 'needs-permission') ban('', 'Ein Klick irgendwo in die Liste, dann fragt der Browser, ob sie den Ordner wieder bearbeiten darf („Bearbeiten zulassen“).');
  if (KR.cut) ban('', 'Die Förder-Kartei „' + esc(KR.name) + '“ ist bis ganz unten formatiert und deshalb sehr groß. Gelesen wurde nur der vordere Teil – in Excel die leeren Zeilen unter der Tabelle löschen, dann geht es schneller.');

}

/* ---------- Zeichnen */
const app = document.getElementById('app');

    let sel = null; try { sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null; } catch (e) { /* */ }

    if (fk) { const e = $(fk, app); if (e) { e.focus({ preventScroll: true }); if (sel && 'setSelectionRange' in e) try { e.setSelectionRange(sel[0], sel[1]); } catch (x) { /* */ } } }
    document.title = (isDirty() ? '● ' : '') + 'Bedarfsliste';
    saveUI();
  } finally { _rendering = false; }
}
function keep(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
// neu zeichnen, aber nicht mitten im Tippen
function safeRender() {
  const ae = document.activeElement;

function swap(id, html, force) { const el = document.getElementById(id); if (!el || (!force && el.contains(document.activeElement))) return; el.innerHTML = html; }
// nach jeder Eingabe: nur die abgeleiteten Teile neu zeichnen, das Eingabefeld behält den Fokus

  const b = cur();

  swap('fr-body', freigabeList(b)); swap('fin-bar', finBarBlock(b)); swap('fin-rows', finRows(b)); swap('fin-eig', finEigPct(b)); swap('link-btn', linkBtn(b)); swap('copy-btn', copyBtn(b));
  b.foerderer.forEach(f => { swap('fw-' + f.id, foeWarn(b, f)); swap('dk-' + f.id, detKartei(f)); swap('ds-' + f.id, detSummary(f)); swap('sh-' + f.id, foeShare(b, f)); });

}

/* ---------- Bedienung */
function effects(b, base, p, v) {
  const m = p.match(/^freigabe\.(\w+)\.st$/);
  if (m) {
    const it = b.freigabe[m[1]];
    if (v === 'offen') { it.angefragt = ''; it.erledigt = ''; }
    if (v === 'angefragt') { if (!it.angefragt) it.angefragt = today(); it.erledigt = ''; }
    if ((v === 'ok' || v === 'nein') && !it.erledigt) it.erledigt = today();
  }
  if (p === 'status' && base !== b) {
    const f = base;
    if (['beantragt', 'zugesagt', 'abgelehnt'].includes(v) && !f.beantragtAm) f.beantragtAm = today();
    if (v === 'zugesagt' || v === 'abgelehnt') { if (!f.entscheidungAm) f.entscheidungAm = today(); } else f.entscheidungAm = '';
    if (v === 'zugesagt') { if (f.zugesagt == null) f.zugesagt = f.betrag; if (b.nach.ueb.noetig && !b.nach.ueb.mit.includes(f.id)) b.nach.ueb.mit.push(f.id); }
    if (v === 'abgelehnt') b.nach.ueb.mit = b.nach.ueb.mit.filter(id => id !== f.id);
  }
}
function baseOf(el, b) {
  if (el.dataset.fid) return b.foerderer.find(f => f.id === el.dataset.fid);
  if (el.dataset.uid) return b.unterlagen.find(u => u.id === el.dataset.uid);
  return b;
}
function addZust() {
  const b = cur(), el = $('#zust-new'), v = el ? el.value.trim() : '';
  if (!b || !v) return;
  if (!b.zust.includes(v)) b.zust.push(v);
  el.value = ''; changed(); swap('zust-chips', zustChips(b), true);
}
function addUl(refocus) {
  const b = cur(), el = $('#ul-new'), v = el ? el.value.trim() : '';
  if (!b || !v) return;
  b.unterlagen.push(UL(v, 'fehlt')); el.value = ''; changed(); swap('ul-body', unterlagenList(b), true);
  if (refocus) { const n = $('#ul-new'); if (n) n.focus(); }
}
function copyPath(b) {
  const p = (b.pfad || '').trim(); if (!p) return;
  const done = () => toast('Pfad kopiert. Im Explorer: Strg+L, dann Strg+V', 'ok');
  const fail = () => { const el = $('input[data-p="pfad"]'); if (el) { el.focus(); el.select(); } toast('Pfad markiert – jetzt mit Strg+C kopieren'); };
  try { navigator.clipboard.writeText(p).then(done, fail); } catch (e) { fail(); }
}
const undoTo = before => () => { D = normalize(JSON.parse(before)); changed(); keep(renderNow); };
function mainMenu(btn) {
  closeMenus();
  const item = (act, label, v) => h('button', { role: 'menuitem', 'data-act': act, 'data-v': v || '' }, label);
  const th = themeGet();

    h('div', { class: 'menu-row' }, h('span', null, 'Darstellung'), ...[['light', 'hell'], ['dark', 'dunkel'], ['system', 'wie Windows']].map(([v, l]) =>
      h('button', { class: 'mini-btn' + (th === v ? ' on' : ''), 'data-act': 'theme', 'data-v': v }, l))),
    h('hr'),
    item('vorlage-leer', 'Leere Förderplan-Vorlage (Excel)'),
    DEMO ? null : item('kartei', 'Förder-Kartei wählen oder neu einlesen …'),

  const r = btn.getBoundingClientRect();
  m.style.top = (r.bottom + 4) + 'px'; m.style.right = Math.max(8, innerWidth - r.right) + 'px';

}
function about() {
  modal('Bedarfsliste ' + APP_INFO.version, h('div', { class: 'help' },
    h('p', null, 'Strategischer Überblick über die Bedarfe der Diözese: Freigabe, Unterlagen, Förderplan und Nacharbeit. Programm und Daten stecken zusammen in dieser einen Datei; es wird nichts ins Internet gesendet.'),
    ...CHANGELOG.slice(0, 5).map(c => h('div', null, h('h3', null, 'Version ' + c.version + (c.date ? ' · ' + fmtDate(c.date.slice(0, 10)) : '')), h('ul', null, c.items.map(i => h('li', null, i)))))), null, { wide: true });
}

async function act(k, a, e) {
  const b = cur();
  switch (k) {
    case 'tab': UI.tab = a.dataset.v; UI.view = 'list'; renderNow(); scrollTo(0, 0); return;
    case 'open': UI.view = 'detail'; UI.id = a.dataset.id; UI.geld = null; renderNow(); scrollTo(0, 0); return;
    case 'back': UI.view = 'list'; UI.geld = null; renderNow(); scrollTo(0, 0); return;
    case 'new': {
      const nb = blank(); D.bedarfe.unshift(nb); changed();
      UI.tab = 'aktiv'; UI.view = 'detail'; UI.id = nb.id; renderNow(); scrollTo(0, 0);
      const t = $('#f-titel'); if (t) t.focus(); return;
    }
    case 'clear': Object.assign(UI, { q: '', fSw: '' }); keep(renderNow); return;
    case 'info': if ($('.info-pop')) { closeMenus(); return; } infoPop(a, INFO[a.dataset.v] || ''); return;
    case 'circ': circMenu(a); return;
    case 'st-menu': stMenu(a); return;
    case 'more': if ($('#mmenu')) closeMenus(); else moreMenu(a); return;
    case 'pen': { const el = $(`#foe-${a.dataset.fid} .fp-h`); if (el) { el.focus(); el.select(); } return; }
    case 'prio-menu': e.stopPropagation(); prioMenu(a); return;
    case 'prio-set': { const x = D.bedarfe.find(y => y.id === a.dataset.id); if (x) { x.prio = a.dataset.v; changed(); } closeMenus(); keep(renderNow); return; }
    case 'menu': if ($('#mmenu')) closeMenus(); else mainMenu(a); return;
    case 'theme': applyTheme(a.dataset.v); $$('#mmenu .mini-btn').forEach(x => x.classList.toggle('on', x === a)); return;
    case 'about': closeMenus(); about(); return;
    case 'save': closeMenus(); if (FSA && ST.conn === 'none') await connectFolder(); else saveAll({}); renderNow(); return;
    case 'connect': await connectFolder(); renderNow(); return;
    case 'kartei': closeMenus(); if (ST.conn !== 'ok' && !await connectFolder()) return; await karteiChoose(); return;
    case 'kartei-info': toast('In der Programmdatei liest die Liste deine Excel „Banken- und Stiftungsübersicht“ aus dem Ordner ein. Hier stehen erfundene Förderer.'); return;
    case 'backup': closeMenus(); saveBackup(); return;
    case 'restore': closeMenus(); openBackup(); return;
    case 'update': closeMenus(); updateProgram(); return;
    case 'vorlage-leer': closeMenus(); vorlageDownload(null); return;
    case 'reload': window.__blReload = true; location.reload(); return;
    case 'conflict-mine': resolveConflict('mine'); return;
    case 'conflict-theirs': resolveConflict('theirs'); return;
    case 'zip-go': { const z = ST.zipUpd; const f = z && await z.handle.getFile().catch(() => null); if (!f) { toast('Das Paket ist nicht mehr da.', 'warn'); ST.zipUpd = null; renderNow(); return; } updateProgram(Object.assign(await programFromFile(f), { pkg: z })); return; }
    case 'zip-later': UI.zipHide = ST.zipUpd.name + '@' + ST.zipUpd.info.version; renderNow(); return;
    case 'draft-restore': restoreDraft(); return;
    case 'draft-drop': clearDraft(); renderNow(); return;
    case 'demo-reset': { const before = JSON.stringify(D); D = normalize({ bedarfe: demoBedarfe() }); changed(); UI.view = 'list'; renderNow(); toast('Beispieldaten wiederhergestellt', 'ok', undoTo(before)); return; }
    case 'link': {
      let host = ''; try { host = new URL(a.getAttribute('href')).hostname; } catch (er) { /* ungültiger Link */ }
      if (DEMO && host.endsWith('.example')) { e.preventDefault(); toast('Beispiel-Link: In der Programmdatei öffnet sich hier der Ordner bzw. die Seite im Browser.'); }
      return;
    }
  }
  if (!b || UI.view !== 'detail') return;
  switch (k) {
    case 'set': {
      const base = baseOf(a, b), p = a.dataset.p; let v = a.dataset.v;
      if (v === 'true') v = true; else if (v === 'false') v = false;
      if (a.dataset.toggle != null && getPath(base, p) === v) v = a.dataset.toggle;   // zweiter Klick auf den gewählten Stand nimmt ihn zurück
      setPath(base, p, v); effects(b, base, p, v); changed(); break;
    }
    case 'archive': { const before = JSON.stringify(D); b.archiv = true; changed(); UI.view = 'list'; renderNow(); scrollTo(0, 0); toast(`„${b.titel || 'Bedarf'}“ liegt jetzt im Archiv`, 'ok', undoTo(before)); return; }
    case 'unarchive': b.archiv = false; changed(); toast('Wieder in der Liste der Bedarfe', 'ok'); break;
    case 'del': {
      if (!await confirmBox('Bedarf löschen?', '„' + (b.titel || 'Neuer Bedarf') + '“ wird mit Förderplan und Nacharbeit gelöscht. Direkt danach lässt sich das noch rückgängig machen.', 'Löschen')) return;
      const before = JSON.stringify(D); D.bedarfe = D.bedarfe.filter(x => x !== b); changed(); UI.view = 'list'; renderNow(); scrollTo(0, 0); toast('Bedarf gelöscht', 'ok', undoTo(before)); return;
    }
    case 'rm-zust': b.zust.splice(+a.dataset.i, 1); changed(); swap('zust-chips', zustChips(b), true); return;
    case 'rm-ul': b.unterlagen = b.unterlagen.filter(u => u.id !== a.dataset.uid); changed(); break;
    case 'add-foe': {
      const f = ff({}); b.foerderer.push(f); changed(); keep(renderNow);
      const el = $(`#foe-${f.id} input[data-p="name"]`); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
      return;
    }
    case 'rm-foe': {
      const f0 = b.foerderer.find(f => f.id === a.dataset.fid);
      if (!await confirmBox('Förderer entfernen?', '„' + ((f0 && f0.name) || 'Ohne Namen') + '“ wird mit Summe, Stand, Pro und Contra aus dem Förderplan entfernt. Direkt danach lässt sich das noch rückgängig machen.', 'Entfernen')) return;
      const before = JSON.stringify(D); b.foerderer = b.foerderer.filter(f => f.id !== a.dataset.fid); b.nach.ueb.mit = b.nach.ueb.mit.filter(id => id !== a.dataset.fid); changed(); keep(renderNow); toast('Förderer entfernt', 'ok', undoTo(before)); return; }
    case 'det': UI.open['det-' + a.dataset.v] = !UI.open['det-' + a.dataset.v]; break;
    case 'geld': UI.geld = a.dataset.fid; keep(renderNow); { const el = $('#geld-betrag'); if (el) el.focus(); } return;
    case 'geld-no': UI.geld = null; break;
    case 'geld-ok': {
      const f = b.foerderer.find(x => x.id === a.dataset.fid), v = deNum($('#geld-betrag').value), d = $('#geld-datum').value;
      if (!(typeof v === 'number' && v > 0)) { toast('Bitte einen Betrag eintragen (z. B. 5000 oder 5.000)', 'warn'); return; }
      f.eingegangen = v; f.eingangAm = validIso(d) ? d : today(); UI.geld = null; changed(); toast('Geldeingang bestätigt: ' + eur(v), 'ok'); break;
    }
    case 'geld-undo': { const f = b.foerderer.find(x => x.id === a.dataset.fid); f.eingegangen = null; f.eingangAm = ''; UI.geld = null; changed(); break; }
    case 'mit': { const m = b.nach.ueb.mit, i = m.indexOf(a.dataset.fid); if (i >= 0) m.splice(i, 1); else m.push(a.dataset.fid); changed(); break; }
    case 'copy-path': copyPath(b); return;
    case 'vorlage': vorlageDownload(b); return;
    case 'import': if (DEMO) { toast('In der Vorschau lassen sich keine Dateien einlesen. In der Programmdatei geht das.', 'warn'); return; } importFoerderplan(b); return;
    default: return;
  }

}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || !(a.closest('#app') || a.closest('.menu') || a.closest('#toasts'))) return;

});
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (!DEMO) saveAll({}); return; }
  if (e.key === 'Enter' && el.matches && el.matches('tr[data-act="open"]')) { e.preventDefault(); act('open', el, e); }
  if (e.key === 'Enter' && el.id === 'zust-new') { e.preventDefault(); addZust(); }

  if (e.key === 'Enter' && el.id === 'f-titel') { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && el.classList && el.classList.contains('inline') && el.tagName === 'INPUT' && el.type !== 'date') { e.preventDefault(); el.blur(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.closest || !el.closest('#app')) return;
  if (el.dataset.ui === 'q') {
    UI.q = el.value; const r = listBody(); swap('list-body', r.html, true);
    const c = $('#list-count'); if (c) c.textContent = r.n + ' von ' + D.bedarfe.filter(b => !!b.archiv === (UI.tab === 'archiv')).length;

  else setPath(base, el.dataset.p, el.value);
  if (el.dataset.p === 'name' && el.dataset.fid && !base.art) {               // Förderer aus der Kartei: Art gleich mit eintragen
    const k = kartei(base.name), art = k ? artFromKartei(k, base.name) : '';
    if (art) { base.art = art; const s = $('#art-' + base.id); if (s) { s.value = art; s.classList.remove('empty'); } }
  }
  changed(); refresh();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.closest || !el.closest('#app')) return;
  if (el.id === 'zust-new') { addZust(); return; }
  if (el.id === 'ul-new') { addUl(false); return; }
  if (el.dataset.ui && el.dataset.ui !== 'q') { UI[el.dataset.ui] = el.type === 'checkbox' ? el.checked : el.value; keep(renderNow); return; }
  if (!el.dataset.p || !(el.type === 'checkbox' || el.tagName === 'SELECT')) return;
  const b = cur(); if (!b) return;

});
document.addEventListener('focusout', e => {
  const el = e.target;

  const b = cur(); if (!b) return;
  const v = deNum(el.value), base = baseOf(el, b);
  if (v === null) { toast('„' + el.value + '“ ist keine Zahl – nicht übernommen (z. B. 1500 oder 1.234,50).', 'warn'); el.value = fmtNum(getPath(base, el.dataset.p)); return; }
  el.value = fmtNum(v === '' ? null : v);
});

/* ---------- Start */
function boot() {
  loadUI(); applyTheme();
  document.body.append(h('div', { id: 'toasts', 'aria-live': 'polite' }));
  let d = null, broken = null;
  if (DEMO) {
    try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) { d = null; }
    if (!isData(d)) d = { bedarfe: demoBedarfe() };
    karteiSet(DEMO_KARTEI.map(k => Object.assign({ gl: [], kontakte: [], hist: {}, weg: [], notiz: '', schwer: '', web: '' }, k)));
  } else {
    const el = $('#bl-data'), raw = el ? el.textContent.trim() : '';
    if (raw) try { d = JSON.parse(raw); if (!isData(d)) throw new Error('keine Bedarfsliste gefunden'); } catch (e) { console.error(e); broken = (e && e.message) || String(e); d = null; }
  }
  D = normalize(d || emptyData()); SAVED_JSON = JSON.stringify(D);
  if (broken) BROKEN = { reason: broken.replace(/^JSON\.parse: /, '').slice(0, 120) };
  if (!DEMO) checkDraft();
  renderNow();
  if (DEMO) return;
  restoreFolder().then(() => { renderNow(); askPermissionOnFirstClick(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (isDirty() && ST.conn === 'ok' && !ST.conflict) saveAll({ auto: true }); }
    else karteiScan();
  });
  window.addEventListener('beforeunload', e => { if (isDirty() && !window.__blReload) { saveDraft(); e.preventDefault(); e.returnValue = ''; } });
}
document.addEventListener('DOMContentLoaded', boot);
