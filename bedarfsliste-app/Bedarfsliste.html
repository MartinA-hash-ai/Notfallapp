<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedarfsliste</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23E30714'/%3E%3Crect x='14' y='11' width='36' height='43' rx='5' fill='white'/%3E%3Cg fill='%23E30714'%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3Crect x='20' y='30' width='6' height='6' rx='1'/%3E%3Crect x='20' y='40' width='6' height='6' rx='1'/%3E%3C/g%3E%3Cg fill='%23404040'%3E%3Crect x='30' y='21' width='14' height='4' rx='2'/%3E%3Crect x='30' y='31' width='14' height='4' rx='2'/%3E%3Crect x='30' y='41' width='10' height='4' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style id="bl-style">/* Layout: Kopfzeile mit Reitern wie in der Jahresplanung; darunter die Liste (nach Phase gruppiert) oder die Seite eines Bedarfs
   mit vier Bereichen. Farben als Tokens: hell auf :root, dunkel über das System oder data-theme="dark". */
:root {
  --red: #E30714; --red-d: #b8000c; --onred: #ffffff;
  --ink: #262626; --ink2: #404040; --muted: #6b6b6b; --faint: #9a9a9a;
  --line: #e2e2e2; --line2: #d0d0d0; --line3: #efefed;
  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fbfbfa; --head: #f5f5f4; --hover: #f3f3f1; --chipbg: #ececea;
  --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12;
  --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20;
  --runbg: #e3f2fd; --runline: #9cc8f0; --runink: #0d47a1;
  --viobg: #f1ebfb; --violine: #cdb8f0; --vioink: #5b2ea6;
  --prio-h: #c0837c; --prio-m: #c9a467; --prio-l: #b3b5b8; --prio-off: #e3e3e0;
  --ph1bg: #fbf5dc; --ph1ink: #7a5d0a; --ph1line: #eadb9c; --ph2bg: #fbede2; --ph2ink: #95501f; --ph2line: #edc8a8;
  --ph3bg: #f2eef8; --ph3ink: #5f4a86; --ph3line: #d8cdea; --ph4bg: #f0f0ee; --ph4ink: #5f6266; --ph4line: #d9d9d5;
  --e5: #dcefdc; --e5ink: #2f6a33; --e4: #ecf5e4; --e4ink: #4f6f2f; --e3: #f3f1ea; --e3ink: #6b6450; --e2: #fbece4; --e2ink: #95501f; --e1: #f8e1df; --e1ink: #8a2c22;
  --f-in: #4f8f55; --f-zu: #a9d3a7; --f-eig: #a3a6ab; --f-be: #c9b48a; --f-ge: #c4c4bf; --track: #ececea;
  --focus: #1F77B4; --shadow: 0 8px 24px rgba(0,0,0,.14); --backdrop: rgba(0,0,0,.35);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
    --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
    --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
    --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
    --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
    --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
    --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
    --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b;
    --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
    --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
    --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
    --f-in: #7fbf86; --f-zu: #3f6f45; --f-eig: #6b7078; --f-be: #8a7a55; --f-ge: #55585d; --track: #33363a;
    --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .logo.light { display: none; }
  :root:not([data-theme="light"]) .logo.dark { display: block; }
}
:root[data-theme="dark"] {
  --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
  --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
  --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
  --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
  --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
  --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
  --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6;
  --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
  --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
  --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b;
  --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
  --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
  --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
  --f-in: #7fbf86; --f-zu: #3f6f45; --f-eig: #6b7078; --f-be: #8a7a55; --f-ge: #55585d; --track: #33363a;
  --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
  color-scheme: dark;
}
:root[data-theme="dark"] .logo.light { display: none; }
:root[data-theme="dark"] .logo.dark { display: block; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.25;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink); }
button:hover:not(:disabled), .btn:hover { border-color: var(--faint); }
button:disabled, .btn.disabled { opacity: .45; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: var(--onred); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; white-space: normal; display: inline; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.danger, .danger { color: var(--red-d); }
button.dangerfill { background: var(--red-d); border-color: var(--red-d); color: var(--onred); font-weight: 600; }
button.icon { padding: 4px 10px; font-weight: 700; }
.small { font-size: 12.5px; }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 5px 7px; background: var(--input); min-width: 0; }
input[type=text], input[type=search], input:not([type]) { width: 100%; }
input.num { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=date] { width: 140px; }
textarea { width: 100%; resize: vertical; field-sizing: content; min-height: 2.7em; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
button:focus-visible, .btn:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.hint-warn { color: var(--warn); }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.pathbox { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

/* ---------- Kopfzeile und Hinweise */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: stretch; gap: 6px 22px; flex-wrap: wrap;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; flex: none; }
.brand .logo { height: 36px; width: auto; flex: none; }
.logo.dark { display: none; }
.brand strong { display: block; font-size: 16px; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 12px 10px 9px; color: var(--ink2); font-weight: 500; font-size: 15px; }
.tab:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--line2); }
.tab.on { border-bottom-color: var(--red); color: var(--ink); font-weight: 600; }
.tab .cnt { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
.kchip { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--chipbg); color: var(--ink2); border: 1px solid transparent; }
.kchip.ok { background: var(--okbg); color: var(--okink); border-color: var(--okline); }
.kchip.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.save { min-width: 132px; justify-content: center; }
.save.ok { color: var(--okink); }
.banners .banner { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--warnbg); border-bottom: 1px solid var(--warnline); font-size: 13px; color: var(--ink); }
.banner > span { flex: 1 1 320px; }
.banner.err { background: var(--errbg); border-bottom-color: var(--errline); }
.banner.upd { background: var(--runbg); border-bottom-color: var(--runline); }
.menu { position: fixed; z-index: 85; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 180px; }
.menu > button { display: flex; width: 100%; text-align: left; border: 0; padding: 8px 12px; border-radius: 5px; background: transparent; gap: 8px; }
.menu > button:hover, .menu > button.on { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
.menu-row > span { margin-right: auto; color: var(--muted); }
.mini-btn { padding: 2px 8px; font-size: 12px; }
.mini-btn.on { background: var(--ink2); color: var(--card); border-color: var(--ink2); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--card); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.toast.err { background: var(--red-d); color: var(--onred); }
.toast button.link { color: inherit; font-weight: 600; }
.toast.out { opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .3s; } }
.backdrop { position: fixed; inset: 0; z-index: 80; background: var(--backdrop); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); width: 100%; max-width: 540px; max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { max-width: 820px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.modal > header h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 6px 18px 12px; overflow: auto; }
.modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.help p { margin: 0 0 10px; }
.radios { display: grid; gap: 6px; margin-top: 8px; }
table.imp { border-collapse: collapse; width: 100%; font-size: 13px; }
table.imp th { text-align: left; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 6px; }
table.imp td { padding: 5px 6px; border-bottom: 1px solid var(--line3); vertical-align: top; }
table.imp .badge { margin-left: 6px; }

main { padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }

/* ---------- Phase, Priorität, kleine Anzeigen */
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chipbg); color: var(--ink2); white-space: nowrap; }
.chip.sw { font-size: 11px; padding: 0 6px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--chipbg); color: var(--ink2); }
.badge.k { background: var(--okbg); color: var(--okink); }
.phase { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 11px; border: 1px solid transparent; white-space: nowrap; }
.phase .dots { display: inline-flex; gap: 2px; }
.phase .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .35; }
.phase .dots i.d { background: currentColor; opacity: .7; }
.phase .dots i.c { background: currentColor; opacity: 1; }
.ph-frei { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1line); }
.ph-foer { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2line); }
.ph-nach { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3line); }
.ph-fertig { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4line); }
.ph-pause { background: transparent; color: var(--muted); border: 1px dashed var(--line2); }
.st-line { font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
.st-line.bad b, .st-main.bad b { color: var(--red-d); }
.prio { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; padding: 2px 3px; border: 0; border-radius: 4px; background: none; vertical-align: -3px; flex: none; }
button.prio:hover { background: var(--hover); }
.prio i { width: 3.5px; background: var(--prio-off); border-radius: 1px; }
.prio i:nth-child(1) { height: 5px; } .prio i:nth-child(2) { height: 9px; } .prio i:nth-child(3) { height: 13px; }
.prio.p-hoch i { background: var(--prio-h); }
.prio.p-mittel i:nth-child(-n+2) { background: var(--prio-m); }
.prio.p-niedrig i:first-child { background: var(--prio-l); }
.fbar { position: relative; display: flex; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; width: 100%; min-width: 110px; }
.fbar.big { height: 14px; border-radius: 7px; }
.fb { height: 100%; flex: none; }
.fb + .fb { box-shadow: inset 2px 0 0 var(--card); }
.fb.in, .swa.in { background: var(--f-in); } .fb.zu, .swa.zu { background: var(--f-zu); } .fb.eig, .swa.eig { background: var(--f-eig); } .fb.be, .swa.be { background: var(--f-be); }
.fb.ge, .swa.ge { background: repeating-linear-gradient(135deg, var(--f-ge) 0 3px, transparent 3px 6px); }
.swa.ge { box-shadow: inset 0 0 0 1px var(--line2); }
.swa { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.fbar.hl .fb:not(.on) { opacity: .28; }
.fc-top { font-size: 12.5px; margin-bottom: 4px; white-space: nowrap; }
.fc-list { display: grid; gap: 1px; margin-top: 5px; font-size: 12px; }
.fc-i { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 6px; align-items: center; color: var(--ink2); }
.fc-i .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-i .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.fmark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.legend .sep { width: 1px; height: 14px; background: var(--line2); }
.lg { display: inline-flex; gap: 5px; align-items: center; }
.lg > i.swa { width: 14px; height: 8px; }
.u-over { color: var(--red-d); font-weight: 700; }
.u-soon { color: var(--warn); font-weight: 700; }
.wicon { color: var(--warn); cursor: help; font-weight: 700; }
.tline { display: flex; align-items: flex-start; gap: 6px; }

/* ---------- Liste */
.list-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 18px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.tools input[type=search] { width: 190px; }
.tools select { max-width: 190px; }
.tools select.on { border-color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; margin-bottom: 12px; }
table.list { width: 100%; border-collapse: collapse; min-width: 1040px; }
table.list th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
table.list th.r { text-align: right; }
button.th { border: 0; background: none; padding: 0; font-weight: 600; color: inherit; font-size: inherit; }
button.th.on { color: var(--ink); }
table.list td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tbody tr[data-act] { cursor: pointer; }
table.list tbody tr[data-act]:hover { background: var(--hover); }
table.list tbody tr.paused { opacity: .6; }
.c-titel { min-width: 270px; max-width: 360px; }
.c-titel .t { font-weight: 600; color: var(--ink); }
.c-titel .sub { padding-left: 25px; }
.c-st { min-width: 220px; max-width: 290px; }
.c-sum b { font-size: 14px; color: var(--ink); white-space: nowrap; }
.c-fin { width: 300px; min-width: 240px; }
.c-fr { min-width: 160px; }

/* ---------- Seite eines Bedarfs */
.d-top { display: grid; gap: 10px; margin-bottom: 16px; }
.back { justify-self: start; }
.d-head { display: flex; gap: 12px 20px; align-items: flex-start; flex-wrap: wrap; }

.d-meta { color: var(--muted); margin-top: 2px; padding-left: 25px; }

.confirm { display: inline-flex; gap: 6px; align-items: center; color: var(--red-d); font-weight: 600; }
.d-status { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.d-statusrow { display: flex; gap: 10px 22px; align-items: center; flex-wrap: wrap; padding: 10px 14px; }

.st-main { color: var(--ink2); }
.st-warn { color: var(--warn); font-size: 13px; font-weight: 600; }
.jump { display: flex; gap: 6px 18px; flex-wrap: wrap; padding: 7px 14px; border-top: 1px solid var(--line3); font-size: 13px; }
ol.steps { display: flex; flex-wrap: wrap; gap: 6px 0; list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps li { counter-increment: s; font-size: 13px; color: var(--faint); padding: 0 12px; display: flex; align-items: center; gap: 6px; }
ol.steps li:first-child { padding-left: 0; }
ol.steps li + li { border-left: 1px solid var(--line); }
ol.steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
ol.steps li.done { color: var(--ink2); }
ol.steps li.done::before { content: "✓"; background: var(--f-in); border-color: var(--f-in); color: var(--card); }
ol.steps li.cur { color: var(--ink); font-weight: 700; }
ol.steps li.cur::before { border-color: currentColor; }
ol.steps li.cur.ph-frei::before { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1ink); }
ol.steps li.cur.ph-foer::before { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2ink); }
ol.steps li.cur.ph-nach::before { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3ink); }
ol.steps li.cur.ph-fertig::before { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4ink); }
section.card { scroll-margin-top: 76px; }
.sec-head { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 17px; margin: 0; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 300px; }
.sec-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.grid { display: grid; gap: 12px 16px; }
.g12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
/* Schreiblinien oben auf der Bedarfsseite: nur ein Strich, solange leer steht der Name des Feldes darin */
.eck .grid { row-gap: 16px; }
.lf { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input.line { border: 0; border-bottom: 1.5px solid var(--line2); border-radius: 0; background: transparent; padding: 4px 2px 5px; }
input.line:hover { border-bottom-color: var(--faint); }
input.line:focus { outline: none; border-bottom: 2px solid var(--focus); padding-bottom: 4.5px; }
input.line::placeholder { color: var(--faint); font-weight: 400; }
input.line.big { font-size: 19px; font-weight: 700; }
.sum-f { align-items: flex-end; }
.sum-f .seg { align-self: flex-end; }
.sum-line { display: flex; align-items: baseline; gap: 6px; width: 100%; }

input.line.sum { width: 100%; font-size: 24px; font-weight: 700; text-align: right; }
.grid.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid.frei { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > .lab { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
/* Beschreibung und Ordner nebeneinander, beide so hoch wie das höhere von beiden */
.desc-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
textarea.desc { min-height: 9.5em; height: auto; }
.ordner { background: var(--soft); border: 1px solid var(--line3); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.o-head { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.o-row { display: grid; gap: 3px; }
.o-lab { font-size: 12px; color: var(--muted); }
button.info { width: 17px; height: 17px; padding: 0; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); color: var(--muted);
  font: italic 700 11px/1 Georgia, "Times New Roman", serif; justify-content: center; flex: none; text-transform: none; letter-spacing: 0; }
button.info:hover:not(:disabled) { color: var(--ink); border-color: var(--faint); }
.info-pop { max-width: 380px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: var(--ink2); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; width: auto !important; }
.unit { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 4px; background: var(--input); min-height: 33px; }
#zust-chips { display: contents; }

.chips input.chip-in:focus { outline: none; }
.chips:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; }

button.x:hover:not(:disabled) { color: var(--red-d); }

.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line2); padding: 4px 9px; background: transparent; color: var(--ink2); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(.on) { background: var(--hover); }
.seg button.on { background: var(--ink2); color: var(--card); font-weight: 600; }
.seg button.on.t-ok { background: var(--okbg); color: var(--okink); box-shadow: inset 0 0 0 1px var(--okline); }
.seg button.on.t-run { background: var(--runbg); color: var(--runink); box-shadow: inset 0 0 0 1px var(--runline); }
.seg button.on.t-warn { background: var(--warnbg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warnline); }
.seg button.on.t-err { background: var(--errbg); color: var(--errink); box-shadow: inset 0 0 0 1px var(--errline); }
.seg.small button { padding: 3px 8px; font-size: 12.5px; }
.seg button.on.t-e5 { background: var(--e5); color: var(--e5ink); } .seg button.on.t-e4 { background: var(--e4); color: var(--e4ink); }
.seg button.on.t-e3 { background: var(--e3); color: var(--e3ink); } .seg button.on.t-e2 { background: var(--e2); color: var(--e2ink); }
.seg button.on.t-e1 { background: var(--e1); color: var(--e1ink); }
.seg.einsch button.on { box-shadow: inset 0 0 0 1px currentColor; }

.fr-row { display: grid; grid-template-columns: 150px auto minmax(0, 1fr); grid-template-areas: "lab seg note" "lab dates dates"; gap: 4px 14px; padding: 9px 0; border-bottom: 1px solid var(--line3); align-items: center; }
.fr-lab { grid-area: lab; font-weight: 600; align-self: start; padding-top: 3px; display: grid; gap: 3px; }

.fr-dates:empty { display: none; }
.fr-dates label { display: inline-flex; gap: 5px; align-items: center; }

.fr-na { grid-area: seg; color: var(--muted); font-size: 13px; }
.fr-foot { margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.fr-foot.ok { background: var(--okbg); color: var(--okink); }
.fr-foot.warn { background: var(--warnbg); color: var(--warn); }

.ul-name { font-weight: 500; min-width: 0; }
.ul-add { display: flex; gap: 6px; margin-top: 10px; }

.research { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 9px 12px; margin-bottom: 14px; background: var(--soft); border: 1px solid var(--line3); border-radius: 8px; }
.r-lab { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; }
.foe-list { display: grid; gap: 12px; }

.foe-name { flex: 1 1 260px; min-width: 0; }

select.art { width: 190px; }

.foe-warn { font-size: 12.5px; color: var(--warn); display: grid; gap: 2px; }
.kv { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }

.dates { display: flex; gap: 8px 16px; flex-wrap: wrap; }
.why { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.foe-sum { border-left: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); border-radius: 0 8px 8px 0; }
.amt-lab { font-size: 12px; font-weight: 600; color: var(--muted); }
.amt-big { display: flex; align-items: center; gap: 6px; }

.det { border-top: 1px solid var(--line3); padding-top: 4px; }

.det-btn .tw { width: 12px; color: var(--muted); }

.det-k { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; }

dl.dl dd { margin: 0; color: var(--ink2); }
table.kt { width: 100%; border-collapse: collapse; font-size: 12.5px; }

.na-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; margin-bottom: 10px; background: var(--soft); }

.na-title { font-weight: 600; }
.nl { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; min-height: 32px; }

.nl.open > label.check:first-child { font-weight: 600; }
.mit { display: grid; gap: 4px; }

  .grid.two, .grid.frei, .desc-row, .det-panel { grid-template-columns: minmax(0, 1fr); }
  .foe { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 640px) {
  .g12 .s2, .g12 .s3, .g12 .s4, .g12 .s5 { grid-column: span 12; }
  .grid2, .own-grid, .why { grid-template-columns: minmax(0, 1fr); }
  dl.dl { grid-template-columns: minmax(0, 1fr); }
  .fintab { flex-basis: 100%; font-size: 12.5px; }
  .fintab th, .fintab td { white-space: normal; padding-left: 6px; }

  .fr-row, .fr-row.na { grid-template-columns: minmax(0, 1fr); grid-template-areas: "lab" "seg" "dates" "note"; }
  .tools { margin-left: 0; }
  .tools input[type=search], .tools select { width: 100%; max-width: none; }
  .actions { margin-left: 0; }
  .save { min-width: 0; }
}

function anyDate(v) {

function deNum(t) {

const $ = (sel, root = document) => root.querySelector(sel);

const PROPS = new Set(['value', 'checked', 'disabled', 'selected', 'type']);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (PROPS.has(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}

// kind: '' | 'ok' | 'warn' | 'err'; undo: Funktion für „Rückgängig“
function toast(text, kind = '', undo = null) {
  const box = $('#toasts'); if (!box) return;
  const t = h('div', { class: 'toast ' + kind, role: 'status' }, h('span', null, text),
    undo ? h('button', { class: 'link', onclick: () => { t.remove(); undo(); } }, 'Rückgängig') : null);
  while (box.children.length >= 3) box.firstChild.remove();
  box.append(t);
  const ms = undo ? 8000 : 3800;
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => t.remove(), ms + 400);
}
function modal(title, body, buttons, opts = {}) {
  return new Promise(resolve => {
    const opened = Date.now();
    const close = v => { back.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') close(null); };
    const box = h('div', { class: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('header', null, h('h2', null, title), h('button', { class: 'x', 'aria-label': 'Schließen', onclick: () => close(null) }, '×')),
      h('div', { class: 'modal-body' }, body),
      h('footer', null, (buttons || [['OK', true, 'primary']]).filter(Boolean).map(([label, val, cls]) =>
        h('button', { class: cls || '', onclick: () => close(typeof val === 'function' ? val() : val) }, label))));
    const back = h('div', { class: 'backdrop', onmousedown: e => { if (e.target === back && Date.now() - opened > 400) close(null); } }, box);
    if (opts.expose) opts.expose(close);
    document.body.append(back);
    document.addEventListener('keydown', key);
    const f = box.querySelector('footer button.primary') || box.querySelector('input,select,textarea');
    if (f) setTimeout(() => f.focus(), 30);
  });
}
const confirmBox = (title, text, yes = 'Ja', no = 'Abbrechen') => modal(title, h('p', null, text), [[no, false], [yes, true, 'primary']]).then(v => v === true);

  const a = h('a', { href: URL.createObjectURL(blob), download: filename });

}

  return new Promise(resolve => {

function fin(b) {

/* ===================================================================== Förder-Kartei: die Excel „Banken- und Stiftungsübersicht“ aus dem Ordner (nur lesen)
   Die Kartei wird weiter in Excel gepflegt. Die Liste liest sie beim Öffnen, beim Zurückkehren ins Fenster und etwa jede Minute neu ein,
   sobald sich die Datei geändert hat. Erkannt wird je Blatt die Kopfzeile mit „Gliederung“; die Namensspalte ist die Spalte links davon
   mit den meisten verschiedenen Einträgen. Verbundene Zellen (eine Bank für mehrere Gliederungen) gelten für alle ihre Zeilen. */

const KR = { list: [], byKey: new Map(), name: '', stamp: null, at: null, err: null, cut: false, busy: false, cands: [] };
const KARTEI_RE = /(bank|banken|stiftung|kartei|f(ö|oe)rderer)/i;
const kkey = s => norm(s).replace(/[„“"'’]/g, '');
const kartei = name => KR.byKey.get(kkey(name)) || null;
const truthy = v => v === true || v === 1 || /^(x|ja|wahr|true|1|✓)$/i.test(String(v ?? '').trim());
const cellStr = v => v === true ? 'ja' : v === false ? '' : String(v ?? '').trim();

function karteiSet(list) {
  KR.list = list.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  KR.byKey = new Map(list.map(k => [kkey(k.name), k]));
}
async function karteiScan(force) {
  if (DEMO || KR.busy || ST.conn !== 'ok' || !ST.htmlDir) return;
  KR.busy = true;
  try {
    const cands = [];
    for await (const [n, e] of ST.htmlDir.entries()) if (e.kind === 'file' && /\.xlsx$/i.test(n) && !/^~\$/.test(n)) cands.push([n, e]);
    KR.cands = cands.map(c => c[0]).sort((a, b) => a.localeCompare(b, 'de'));
    const want = D.settings.kartei;
    let hit = want ? cands.find(([n]) => n === want) : cands.find(([n]) => KARTEI_RE.test(n) && !/vorlage|f(ö|oe)rderplan/i.test(n));
    if (!hit) {
      const err = want ? '„' + want + '“ liegt nicht mehr im Ordner' : null;
      if (KR.list.length || KR.err !== err) { karteiSet([]); KR.name = ''; KR.stamp = null; KR.err = err; safeRender(); }
      return;
    }
    const f = await hit[1].getFile();
    if (!force && KR.name === hit[0] && KR.stamp === f.lastModified && !KR.err) return;
    const book = await xlsxBook(await f.arrayBuffer(), { max: 4e6 });
    karteiSet(parseKartei(book));
    KR.name = hit[0]; KR.stamp = f.lastModified; KR.at = new Date(); KR.err = null; KR.cut = book.sheets.some(s => s.cut);
    safeRender();
  } catch (e) {
    console.warn(e);
    const msg = e && e.name === 'NotReadableError' ? 'gerade nicht lesbar (in Excel geöffnet oder wird synchronisiert?) – neuer Versuch in einer Minute' : (e && e.message) || String(e);
    if (KR.err !== msg) { KR.err = msg; safeRender(); }
  } finally { KR.busy = false; }
}
function parseKartei(book) {
  const out = new Map();
  for (const sh of book.sheets) {
    const rows = sh.rows, hi = rows.findIndex(r => r.some(v => norm(v) === 'gliederung'));
    if (hi < 0) continue;
    const head = rows[hi].map(norm), gi = head.indexOf('gliederung');
    let ni = -1, best = 0;
    for (let c = 0; c < gi; c++) {
      const s = new Set(); for (let r = hi + 1; r < rows.length; r++) { const v = rows[r][c]; if (typeof v === 'string' && v.trim()) s.add(v.trim()); }
      if (s.size > best) { best = s.size; ni = c; }
    }
    if (ni < 0) continue;
    // Spalten rechts von „Gliederung“ zuordnen; „Mail“/„Telefon“ gehören zum Kontakt links davon
    const col = { years: [] }, kontakte = []; let curK = null;
    const above = c => { for (let r = hi - 1; r >= 0; r--) for (let k = c; k >= 0; k--) { const v = String(rows[r][k] ?? ''); if (/anschreiben/i.test(v)) return v; } return ''; };
    head.forEach((t, c) => {
      if (c <= gi) return;
      if (/^(kontakt|ansprech)/.test(t)) { curK = { n: c, hint: above(c) }; kontakte.push(curK); }
      else if (/^(e-?)?mail$/.test(t)) { if (curK) { if (curK.m == null) curK.m = c; } else if (col.perMail == null) col.perMail = c; }
      else if (/^tel/.test(t)) { if (curK && curK.t == null) curK.t = c; }
      else if (t === 'direkt') col.direkt = c;
      else if (t === 'portal') col.portal = c;
      else if (/notiz/.test(t)) col.notiz = c;
      else if (/schwerpunkt|zweck/.test(t)) col.schwer = c;
      else if (/homepage|website|internet/.test(t)) col.web = c;
      else if (/^(19|20)\d\d$/.test(t)) col.years.push([t, c]);
    });
    let cur = null;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], name = cellStr(row[ni]), gl = cellStr(row[gi]);
      if (name) {
        const k = kkey(name);
        cur = out.get(k) || { name, blatt: sh.name, gl: [], kontakte: [], hist: {}, weg: [], notiz: '', schwer: '', web: '' };
        out.set(k, cur);
      } else if (!gl) continue;                   // Leerzeile
      if (!cur) continue;
      if (gl && !cur.gl.includes(gl)) cur.gl.push(gl);
      if (col.direkt != null && truthy(row[col.direkt]) && !cur.weg.includes('direkt')) cur.weg.push('direkt');
      if (col.perMail != null && truthy(row[col.perMail]) && !cur.weg.includes('per Mail')) cur.weg.push('per Mail');
      if (col.portal != null && truthy(row[col.portal]) && !cur.weg.includes('Portal')) cur.weg.push('Portal');
      for (const [f, c] of [['notiz', col.notiz], ['schwer', col.schwer], ['web', col.web]]) if (c != null && !cur[f]) cur[f] = cellStr(row[c]);
      for (const kc of kontakte) {
        const n = cellStr(row[kc.n]); if (!n || /^[-–]$/.test(n)) continue;
        if (cur.kontakte.some(x => x.n === n)) continue;
        const m = kc.m != null ? cellStr(row[kc.m]) : '', t = kc.t != null ? cellStr(row[kc.t]) : '';
        cur.kontakte.push({ n, m: /@/.test(m) ? m : '', t, nicht: /nicht/i.test(kc.hint) });
      }
      for (const [y, c] of col.years) {
        const v = cellStr(row[c]); if (!v) continue;
        if (!cur.hist[y]) cur.hist[y] = v; else if (!cur.hist[y].includes(v)) cur.hist[y] += '\n' + v;
      }
    }
  }
  return [...out.values()];
}
async function karteiChoose() {
  if (ST.conn !== 'ok') { if (!await connectFolder()) return; }
  await karteiScan(true);
  const cands = KR.cands;
  let pick = D.settings.kartei || KR.name || '';
  const body = h('div', { class: 'help' },
    h('p', null, 'Welche Excel im Ordner ist deine Förder-Kartei? Die Liste liest sie nur – gepflegt wird weiter in Excel.'),
    cands.length ? h('div', { class: 'radios' }, ...cands.map(n => h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: n, checked: n === pick, onchange: () => { pick = n; } }), n)))
      : h('p', { class: 'muted' }, 'Im Ordner liegt noch keine Excel-Datei. Lege die Kartei in den Ordner der Bedarfsliste und öffne dieses Fenster erneut.'),
    h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: '', checked: !D.settings.kartei, onchange: () => { pick = ''; } }), 'automatisch erkennen (Dateiname mit „Bank“, „Stiftung“ oder „Kartei“)'));
  const ok = await modal('Förder-Kartei wählen', body, [['Abbrechen', false], ['Übernehmen', true, 'primary']]);
  if (!ok) return;
  if (pick === '' && !D.settings.kartei) { await karteiScan(true); renderNow(); return; }
  D.settings.kartei = pick; changed(); KR.stamp = null; await karteiScan(true); renderNow();
}

/* ===================================================================== Förderplan-Excel: Vorlage für die Recherche (von Hand oder per KI) und Übernahme in den Förderplan
   Die Vorlage hat zwei Blätter: „Förderplan“ (oben der Bedarf, darunter je Förderer eine Zeile) und „Anleitung“ (was in jede Spalte gehört).
   Eingelesen wird die Zeile mit „Förderer“ in Spalte A als Kopfzeile; die Spalten werden über ihre Überschrift erkannt. */

const FP_SHEET = 'Förderplan', FP_HEAD_ROW = 10;
const FP_COLS = [

const fpHeadKey = t => norm(t).replace(/[^a-zäöüß0-9]/g, '');

/* ---------- Vorlage schreiben (leer oder mit Bedarf und bisherigem Förderplan) */
function vorlageBlob(b) {
  const W = FP_COLS.length, last = colName(W - 1), head = { b: true, color: '#FFFFFF', fill: '#404040', v: 'center', wrap: true, border: 'thin' };
  const lab = { b: true, color: '#404040' }, note = { i: true, sz: 9, color: '#6B6B6B' }, val = { border: 'thin', fill: '#FAFAF8', v: 'top', wrap: true };
  const rows = [], heights = { 0: 24, [FP_HEAD_ROW - 1]: 32 }, merges = ['A1:' + last + '1', 'A2:' + last + '2'];
  rows[0] = [{ v: 'Förderplan' + (b && b.titel ? ': ' + b.titel : ''), st: { b: true, sz: 15 } }];
  rows[1] = [{ v: 'Je möglichem Förderer eine Zeile ausfüllen. Spaltenüberschriften und Blattnamen nicht ändern. Was in jede Spalte gehört, steht im Blatt „Anleitung“. Danach in der Bedarfsliste „Aus Excel übernehmen“ wählen.', st: note }];
  const info = [['Bedarf', b ? b.titel : ''], ['Gliederung', b ? (b.gliederung === DIO ? 'Diözese (ohne Gliederung)' : b.gliederung) : ''], ['Summe (€)', b && b.summe ? +b.summe : ''],
    ['Deadline', b && b.deadline ? { v: b.deadline, t: 'd' } : ''], ['Beschreibung', b ? b.beschreibung : ''], ['Kennung', b ? b.id : '']];
  info.forEach(([k, v], i) => {
    const r = 3 + i;
    rows[r] = [{ v: k, st: lab }, typeof v === 'object' && v ? Object.assign(v, { st: val }) : { v, st: k === 'Kennung' ? { sz: 8, color: '#9A9A9A' } : val }];
    if (k === 'Beschreibung') { merges.push('B' + (r + 1) + ':' + colName(Math.min(W - 1, 8)) + (r + 1)); heights[r] = 60; }
    else if (k !== 'Kennung') merges.push('B' + (r + 1) + ':D' + (r + 1));
  });
  rows[FP_HEAD_ROW - 1] = FP_COLS.map(c => ({ v: c.t, st: head }));
  const cell = (c, v) => ({ v: v ?? '', t: c.date ? 'd' : c.num ? 'n' : undefined, st: { border: 'thin', v: 'top', wrap: !!c.wrap } });
  (b ? b.foerderer.filter(f => f.name.trim()) : []).forEach((f, i) => {
    rows[FP_HEAD_ROW + i] = FP_COLS.map(c => {
      let v = f[c.k];
      if (c.k === 'einsch') v = (EINSCH.find(e => e[0] === v) || [])[1] || '';

  const plan = { name: FP_SHEET, cols: FP_COLS.map(c => c.w), rows: Array.from(rows, r => r || []), merges, heights, freeze: 'B' + (FP_HEAD_ROW + 1), lists, grid: false };

/* ---------- Förderplan aus einer Excel lesen */
async function readFoerderplan(buf) {
  const book = await xlsxBook(buf);
  for (const sh of [...book.sheets].sort((a, c) => (c.name === FP_SHEET) - (a.name === FP_SHEET))) {
    const hi = sh.rows.findIndex(r => fpHeadKey(r[0]) === 'förderer');
    if (hi < 0) continue;
    const map = {};
    const heads = c => [c.t, ...(c.alias || [])].map(fpHeadKey);
    sh.rows[hi].forEach((t, i) => { const k = fpHeadKey(t); const c = FP_COLS.find(c => heads(c).includes(k)) || FP_COLS.find(c => k && heads(c).some(x => k.startsWith(x.slice(0, 8)))); if (c && map[c.k] == null) map[c.k] = i; });
    const kenn = sh.rows.find(r => norm(r[0]) === 'kennung');
    const items = [];
    for (const r of sh.rows.slice(hi + 1)) {
      const name = cellStr(r[map.name]); if (!name) continue;
      const it = { name };
      for (const c of FP_COLS) {
        if (c.k === 'name' || map[c.k] == null) continue;
        const v = r[map[c.k]];
        if (c.date) it[c.k] = anyDate(v);
        else if (c.num) { const n = deNum(v); it[c.k] = typeof n === 'number' ? n : null; }
        else if (c.k === 'einsch') it[c.k] = einschKey(v);
        else it[c.k] = cellStr(v);
      }
      items.push(it);
    }
    return { items, kennung: kenn ? cellStr(kenn[1]) : '', sheet: sh.name };
  }
  return null;
}
// Einschätzung aus freiem Text (auch ältere Wörter wie „eher nicht“ oder „klappt“)
function einschKey(v) {
  const s = norm(v);
  if (!s) return '';
  if (/sehr\s*unwahrscheinlich|unmöglich|keine chance|sehr gering|sehr schlecht/.test(s)) return 'suw';
  if (/unwahrscheinlich|eher nicht|schwierig|schlecht|gering|niedrig/.test(s)) return 'uw';
  if (/unsicher|mittel|vielleicht|offen|möglich/.test(s)) return 'u';
  if (/sehr\s*wahrscheinlich|sehr gut|sehr hoch/.test(s)) return 'sw';
  if (/wahrscheinlich|klappt|gut|hoch/.test(s)) return 'w';
  return '';
}
// Felder eines Förderers aus der Recherche übernehmen: 'fill' = nur leere Felder füllen, 'all' = überschreiben
function applyResearch(f, it, mode) {
  for (const c of FP_COLS) {
    if (c.k === 'name') continue;
    const v = it[c.k]; if (v == null || v === '') continue;
    const empty = f[c.k] == null || f[c.k] === '';
    if (mode === 'all' || empty) f[c.k] = v;
  }
}
async function importFoerderplan(b, file) {
  file = file || await pickFile('.xlsx'); if (!file) return;
  let got = null;
  try { got = await readFoerderplan(await file.arrayBuffer()); } catch (e) { console.warn(e); }
  if (!got) { modal('Kein Förderplan gefunden', h('p', null, 'In „' + file.name + '“ steht keine Tabelle mit der Überschrift „Förderer“ in Spalte A. Bitte die Förderplan-Vorlage der Bedarfsliste verwenden.')); return; }
  if (!got.items.length) { modal('Keine Förderer', h('p', null, 'In „' + file.name + '“ ist noch kein Förderer eingetragen.')); return; }
  const other = got.kennung && got.kennung !== b.id ? D.bedarfe.find(x => x.id === got.kennung) : null;
  const byName = n => b.foerderer.find(f => kkey(f.name) === kkey(n));
  const sel = got.items.map(() => true);
  let mode = 'fill';
  const tbl = h('table', { class: 'imp' },
    h('thead', null, h('tr', null, h('th', null, ''), h('th', null, 'Förderer'), h('th', { class: 'num' }, 'Summe'), h('th', null, 'Antragsfrist'), h('th', null, 'Einschätzung'), h('th', null, ''))),
    h('tbody', null, got.items.map((it, i) => h('tr', null,
      h('td', null, h('input', { type: 'checkbox', checked: true, 'aria-label': it.name + ' übernehmen', onchange: e => { sel[i] = e.target.checked; } })),
      h('td', null, h('b', null, it.name), kartei(it.name) ? h('span', { class: 'badge k' }, 'in der Kartei') : null),
      h('td', { class: 'num' }, it.betrag ? eur(it.betrag) : '–'),
      h('td', null, fmtDate(it.frist) || '–'),
      h('td', null, (EINSCH.find(e => e[0] === it.einsch) || [, '–'])[1]),
      h('td', { class: 'muted small' }, byName(it.name) ? 'schon im Förderplan' : 'neu')))));
  const dup = got.items.some(it => byName(it.name));
  const body = h('div', { class: 'help' },
    other ? h('p', { class: 'hint-warn' }, 'Achtung: Diese Excel wurde für den Bedarf „' + (other.titel || 'ohne Namen') + '“ erstellt.') : null,
    h('p', null, got.items.length + (got.items.length === 1 ? ' Förderer' : ' Förderer') + ' in „' + file.name + '“. Neue Förderer kommen mit dem Stand „geplant“ in den Förderplan.'),
    h('div', { class: 'tablewrap' }, tbl),
    dup ? h('div', { class: 'radios' }, h('p', { class: 'small' }, h('b', null, 'Förderer, die schon im Förderplan stehen:')),
      ...[['fill', 'nur leere Felder ergänzen'], ['all', 'Angaben aus der Excel übernehmen (überschreibt)'], ['skip', 'nicht anfassen']].map(([v, l]) =>
        h('label', { class: 'check' }, h('input', { type: 'radio', name: 'impmode', value: v, checked: v === mode, onchange: () => { mode = v; } }), l))) : null);
  if (!await modal('Ausgefüllte Förderplan-Excel übernehmen', body, [['Abbrechen', false], ['Übernehmen', true, 'primary']], { wide: true })) return;
  const before = JSON.stringify(D);
  let neu = 0, erg = 0;
  got.items.forEach((it, i) => {
    if (!sel[i]) return;
    const f = byName(it.name);
    if (f) { if (mode !== 'skip') { applyResearch(f, it, mode); erg++; } }
    else { const n = ff({ name: it.name }); applyResearch(n, it, 'all'); b.foerderer.push(n); neu++; }
  });
  if (!neu && !erg) return;
  changed(); keep(renderNow);
  toast([neu ? neu + ' Förderer übernommen' : '', erg ? erg + ' ergänzt' : ''].filter(Boolean).join(', '), 'ok', () => { D = normalize(JSON.parse(before)); changed(); keep(renderNow); });
}

/* ===================================================================== Liste aller Bedarfe: Priorität am Namen, Summe gleich daneben, Deadline, Phase als farbiges Feld,
   Finanzierung mit den Förderern. Zuständige, Freigabe und Unterlagen stehen erst auf der Seite des Bedarfs. */

const prioMark = b => `<button class="prio p-${b.prio}" data-act="prio-menu" data-id="${b.id}" title="Priorität: ${b.prio} – klicken zum Ändern" aria-label="Priorität ${b.prio}, ändern"><i></i><i></i><i></i></button>`;
function phaseChip(p) {
  const dots = p.step < 0 ? '' : '<span class="dots" aria-hidden="true">' + [0, 1, 2, 3].map(i => `<i class="${i < p.step || p.step === 3 ? 'd' : i === p.step ? 'c' : ''}"></i>`).join('') + '</span>';
  return `<span class="phase ${phCls(p)}">${dots}${esc(phaseName(p))}</span>`;
}
const stLine = p => p.t && p.step >= 0 ? `<div class="st-line${p.bad ? ' bad' : ''}"><b>${esc(p.t)}</b>${p.sub ? ': ' + esc(p.sub) : ''}</div>` : '';
// Balken der Finanzierung: je Förderer ein Stück (Farbe nach Stand); hl = Förderer, der hervorgehoben wird (die anderen blass)
function segBar(b, opts = {}) {
  const F = fin(b), segs = finSegs(b), tot = segs.reduce((a, s) => a + s.v, 0), max = Math.max(F.S, tot, 1);

    + segs.map(s => `<span class="fb ${s.k}${opts.hl && s.id === opts.hl ? ' on' : ''}" style="width:${(s.v / max * 100).toFixed(2)}%" title="${esc(s.name + ': ' + eur(s.v) + ' (' + KIND_L[s.k] + ')')}"></span>`).join('')
    + (tot > F.S && F.S > 0 ? `<span class="fmark" style="left:${(F.S / max * 100).toFixed(2)}%" title="Bedarf ${eur(F.S)}"></span>` : '') + '</div>';
}
function finCell(b) {
  const F = fin(b), segs = finSegs(b);
  const top = F.S ? `<div class="fc-top"><b>${eur(F.gedeckt)}</b> von ${eur(F.S)} gedeckt <span class="muted">· ${Math.round(F.gedeckt / F.S * 100)} %</span></div>` : '<div class="fc-top faint">Summe fehlt</div>';
  const list = segs.length ? '<div class="fc-list">' + segs.map(s => `<div class="fc-i" title="${esc(s.name + ': ' + KIND_L[s.k])}"><i class="swa ${s.k}"></i><span class="n">${esc(short(s.name))}</span><span class="v">${eur(s.v)}</span></div>`).join('') + '</div>'
    : '<div class="sub">noch kein Förderer</div>';

}
const LEGEND_FIN = Object.entries(KIND_L).map(([k, l]) => `<span class="lg"><i class="swa ${k}"></i>${l}</span>`).join('');
const glName = b => b.gliederung === DIO ? 'Diözese (ohne Gliederung)' : (b.gliederung || 'Gliederung fehlt');

/* ---------- Filtern und Sortieren */
const CMP = {
  prio: b => PRIO_ORD[b.prio], titel: b => (b.titel || '').toLowerCase(), zust: b => (b.zust[0] || '~').toLowerCase(), summe: b => -(+b.summe || 0),
  deadline: b => b.deadline || '9999', stand: b => { const p = phase(b); return p.step < 0 ? 9 : p.step; }, fin: b => { const F = fin(b); return F.S ? F.gedeckt / F.S : 9; },
  frist: b => (nextFrist(b) || {}).d || '9999',
};
function cmp(x, y, k) { const a = CMP[k](x), c = CMP[k](y); return typeof a === 'number' ? a - c : String(a).localeCompare(String(c), 'de'); }
function filtered() {
  const arch = UI.tab === 'archiv', q = norm(UI.q);
  let L = D.bedarfe.filter(b => !!b.archiv === arch);
  if (UI.fGl) L = L.filter(b => glName(b) === UI.fGl);
  if (UI.fZu) L = L.filter(b => b.zust.includes(UI.fZu));
  if (UI.fPh) L = L.filter(b => phaseName(phase(b)) === UI.fPh);
  if (UI.fPr) L = L.filter(b => b.prio === UI.fPr);
  if (UI.fSw) L = L.filter(b => b.stichwort === UI.fSw);
  if (q) L = L.filter(b => norm([b.titel, b.gliederung, b.beschreibung, b.stichwort, ...b.zust, ...b.foerderer.map(f => f.name)].join(' ')).includes(q));
  const chain = [UI.sort, ...['prio', 'frist', 'titel'].filter(k => k !== UI.sort)];
  return L.sort((x, y) => { for (let i = 0; i < chain.length; i++) { const r = cmp(x, y, chain[i]) * (i === 0 ? UI.dir : 1); if (r) return r; } return 0; });
}
const anyFilter = () => !!(UI.q || UI.fGl || UI.fZu || UI.fPh || UI.fPr || UI.fSw);

function row(b) {

}

  deadline: 'Bis wann der Bedarf gedeckt sein muss. Ohne Deadline steht in der Liste ein Strich.',

  recherche: 'Die Excel enthält den Bedarf (Beschreibung, Summe, Gliederung) und den bisherigen Förderplan. Im Blatt „Anleitung“ steht, was in jede Spalte gehört – so kann eine KI sie direkt als Vorlage für die Förderrecherche nehmen. Die ausgefüllte Datei hier wieder übernehmen: neue Förderer kommen dazu, vorhandene werden ergänzt.',
  freigabe: 'Ortsführungskreis immer, Fachreferat und Verwaltung ab 1.000 € – darunter nur, wenn sie angefragt wurden. Dazu muss das Angebot vorliegen (bei den Unterlagen). Ein zweiter Klick auf den gewählten Stand nimmt ihn zurück.',
};
const infoBtn = k => `<button class="info" data-act="info" data-v="${k}" aria-label="Hinweis anzeigen" title="Hinweis">i</button>`;
const okLink = s => /^https?:\/\//i.test((s || '').trim());
const linkBtn = b => okLink(b.link) ? `<a class="btn" href="${esc(b.link.trim())}" target="_blank" rel="noopener" data-act="link">Öffnen ↗</a>` : `<span class="btn disabled" aria-disabled="true" title="Erst einen Link einfügen (https://…)">Öffnen ↗</span>`;
const copyBtn = b => `<button data-act="copy-path" ${b.pfad ? '' : 'disabled'}>Kopieren</button>`;
const zustChips = b => b.zust.map((n, i) => `<span class="pchip">${esc(n)}<button class="x" data-act="rm-zust" data-i="${i}" aria-label="${esc(n)} entfernen">×</button></span>`).join('');
const metaLine = b => esc(glName(b)) + (b.stichwort ? ` · <span class="chip sw">${esc(b.stichwort)}</span>` : '') + (b.angelegt ? ` · angelegt ${fmtDate(b.angelegt)}` : '');

function steps(b) {
  const p = phase(b);
  if (p.step < 0) return `<div class="steps"><span class="phase ph-pause">${esc(p.t)}</span></div>`;
  return '<ol class="steps">' + PHASES.map((s, i) => `<li class="${p.step > i || p.step === 3 ? 'done' : p.step === i ? 'cur ' + PH_CLS[i] : ''}">${s.t}</li>`).join('') + '</ol>';
}
function statusBlock(b) {
  const p = phase(b);
  return (p.step >= 0 ? `<span class="st-main${p.bad ? ' bad' : ''}"><b>${esc(p.t)}</b>${p.sub ? ': ' + esc(p.sub) : ''}</span>` : '<span class="muted">Der Bedarf ruht – oben rechts wieder auf „Bedarf läuft“ stellen.</span>')
    + p.warn.map(w => `<span class="st-warn">⚠ ${esc(w)}</span>`).join('');
}

function bedarfView(b) {
  const nav = [['sec-eck', 'Bedarf'], ['sec-frei', 'Freigabe und Unterlagen'], ['sec-foe', 'Förderplan'], ['sec-nach', 'Nacharbeit']];
  return `<main class="bedarf">
    <div class="d-top">
      <button class="back" data-act="back">‹ Alle Bedarfe</button>
      <div class="d-head">
        <div class="d-titlewrap"><div class="tline">${prioMark(b)}<h1 id="d-title">${esc(b.titel || 'Neuer Bedarf')}</h1></div><div class="d-meta" id="d-meta">${metaLine(b)}</div></div>
        <div class="d-actions">
          <select data-p="manuell" aria-label="Bedarf läuft, ist zurückgestellt oder verworfen">${[['', 'Bedarf läuft'], ['zurückgestellt', 'zurückgestellt'], ['verworfen', 'verworfen']].map(([v, l]) => `<option value="${v}" ${b.manuell === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          ${b.archiv ? '<button data-act="unarchive">Aus dem Archiv holen</button>' : '<button data-act="archive">Archivieren</button>'}
          ${UI.delAsk ? '<span class="confirm">Wirklich löschen? <button class="dangerfill" data-act="del-ok">Löschen</button><button data-act="del-no">Abbrechen</button></span>' : '<button class="ghost danger" data-act="del">Löschen</button>'}
        </div>
      </div>
      <div class="d-status">
        <div class="d-statusrow"><div id="d-steps">${steps(b)}</div><div id="d-status">${statusBlock(b)}</div></div>
        <nav class="jump" aria-label="Bereiche">${nav.map(([id, l]) => `<button class="link" data-act="jump" data-v="${id}">${l}</button>`).join('')}</nav>
      </div>
    </div>
    ${secEck(b)}${secFrei(b)}${secFoe(b)}${secNach(b)}
  </main>`;
}

/* ---------- Kopf des Bedarfs: Name, Gliederung und Summe als Schreiblinien (ohne Überschriften), darunter Zuständig, Deadline, Stichwort;
   Beschreibung und Ordner nebeneinander, gleich hoch */
function secEck(b) {
  return `<section class="card eck" id="sec-eck">
    <div class="grid g12">
      <div class="s6 lf">${tin(b, 'titel', 'id="f-titel" class="line big" aria-label="Bedarf"', 'Bedarf')}</div>
      <div class="s3 lf">${tin(b, 'gliederung', 'list="dl-gl" class="line" aria-label="Gliederung"', 'Gliederung (Ort oder Diözese)')}</div>
      <div class="s3 lf sum-f"><div class="sum-line"><input type="text" inputmode="decimal" class="num line sum" data-num data-p="summe" aria-label="Summe in Euro" value="${esc(fmtNum(b.summe))}" placeholder="Summe"><span class="unit">€</span></div>
        ${seg([['Schätzung', 'Schätzung'], ['Angebot', 'laut Angebot']], b.summeArt, 'data-p="summeArt"', 'small')}</div>
      ${fld('Zuständig', `<div class="chips"><span id="zust-chips">${zustChips(b)}</span><input id="zust-new" class="chip-in" list="dl-zust" placeholder="+ Name, Enter" aria-label="Zuständige Person hinzufügen"></div>`, 's4')}
      ${fld('Deadline', din(b, 'deadline', 'aria-label="Deadline"'), 's3', 'deadline')}
      ${fld('Stichwort oder Fördertopf', tin(b, 'stichwort', 'list="dl-sw" aria-label="Stichwort oder Fördertopf"', 'z. B. Landesprogramm Digitalisierung'), 's5', 'stichwort')}
      <div class="fld s12"><span class="lab">Beschreibung</span>
        <div class="desc-row">
          ${tarea(b, 'beschreibung', 'aria-label="Beschreibung" class="desc"', 'Kurzbeschreibung aus der UPL oder in eigenen Worten', 6)}
          <div class="ordner"><div class="o-head">Ordner ${infoBtn('ordner')}</div>
            <div class="o-row"><span class="o-lab">OneDrive / SharePoint</span><div class="row">${tin(b, 'link', 'class="grow" aria-label="Link zum Ordner"', 'Link einfügen (https://…)')}<span id="link-btn">${linkBtn(b)}</span></div></div>
            <div class="o-row"><span class="o-lab">Pfad im Explorer</span><div class="row">${tin(b, 'pfad', 'class="grow mono" aria-label="Ordnerpfad"', 'C:\\Users\\…\\OneDrive - Malteser\\…')}<span id="copy-btn">${copyBtn(b)}</span></div></div>
          </div>
        </div>
      </div>
    </div>
    ${dl('dl-gl', [DIO, ...GL_LIST, ...D.bedarfe.map(x => x.gliederung)])}${dl('dl-sw', D.bedarfe.map(x => x.stichwort))}${dl('dl-zust', D.bedarfe.flatMap(x => x.zust))}
  </section>`;
}

/* ---------- Freigabe (ohne „offen“: ein Stand beginnt mit „angefragt“) und Unterlagen (mit dem Angebot) */
function freigabeBody(b) {
  const rows = frItems(b).map(i => {
    const p = 'freigabe.' + i.k;
    if (i.na) return `<div class="fr-row na"><div class="fr-lab">${i.label}</div><div class="fr-na">${esc(i.na)}</div></div>`;
    const since = i.st === 'angefragt' && validIso(i.item.angefragt) ? `<span class="since">seit ${days(i.item.angefragt, today())} Tagen</span>` : '';
    return `<div class="fr-row st-${i.st}">
      <div class="fr-lab">${i.label}${i.k === 'ofk' && b.gliederung ? `<span class="sub">${esc(b.gliederung)}</span>` : ''}${i.opt ? '<span class="sub">unter 1.000 € nicht nötig</span>' : ''}${i.k === 'fach' ? tin(b, p + '.name', 'list="dl-fach" class="fach" aria-label="Welches Fachreferat"', 'welches?') : ''}</div>
      <div class="fr-seg">${seg([['angefragt', 'angefragt', 't-run'], ['ok', i.ok, 't-ok'], ['nein', i.nein, 't-err']], i.st, `data-p="${p}.st" data-toggle="offen"`, 'small')}</div>
      <div class="fr-dates">${i.st === 'offen' ? '' : `<label>angefragt am ${din(b, p + '.angefragt', 'aria-label="angefragt am"')}</label>${since}`}</div>
      <div class="fr-note">${tin(b, p + '.notiz', 'aria-label="Notiz"', 'Notiz')}</div>
    </div>`;
  }).join('');
  const fo = frOffen(b);
  return rows + (fo.names.length ? `<div class="fr-foot warn">Es fehlt noch: ${esc(fo.names.join(', '))}</div>` : '<div class="fr-foot ok">✓ Freigabe vollständig, die Anträge können raus</div>')
    + dl('dl-fach', [...FACH_LIST, ...D.bedarfe.map(x => x.freigabe.fach.name)]);
}
function unterlagenBody(b) {
  return b.unterlagen.map(u => `<div class="ul-row"><div class="ul-name">${u.fest ? esc(u.name) : tin(u, 'name', `data-uid="${u.id}" aria-label="Name der Unterlage"`)}</div>
      ${seg(ulOpts(u), u.st, `data-p="st" data-uid="${u.id}"`, 'small')}
      ${u.fest ? '<span></span>' : `<button class="x" data-act="rm-ul" data-uid="${u.id}" aria-label="${esc(u.name)} entfernen">×</button>`}</div>`).join('')
    + `<div class="ul-add"><input type="text" id="ul-new" list="dl-ul" placeholder="Weitere Unterlage, z. B. Bilder" aria-label="Weitere Unterlage"><button data-act="add-ul">+ Unterlage</button></div>`
    + dl('dl-ul', ['Bilder', 'Presseartikel', 'Studien', 'Kostenplan', 'Zeitplan', 'Unterstützerschreiben'].filter(n => !b.unterlagen.some(u => u.name === n)));
}
function secFrei(b) {
  return `<section class="card" id="sec-frei">
    <div class="sec-head"><h2>Freigabe und Unterlagen</h2></div>
    <div class="grid frei"><div><h3>Freigabe ${infoBtn('freigabe')}</h3><div id="fr-body">${freigabeBody(b)}</div></div><div><h3>Unterlagen</h3><div id="ul-body">${unterlagenBody(b)}</div></div></div>
  </section>`;
}

/* ---------- Förderplan: je Förderer links das Wesentliche (wer, Stand, warum, Knackpunkte), rechts die Summe und ihr Anteil am Bedarf */
const F_ST = [['geplant', 'geplant'], ['vorb', 'in Vorbereitung', 't-warn'], ['beantragt', 'beantragt', 't-run'], ['zugesagt', 'zugesagt', 't-ok'], ['abgelehnt', 'abgelehnt', 't-err']];
const F_ST_L = Object.fromEntries(F_ST.map(([v, l]) => [v, l]));
const artFromKartei = (k, name) => /stiftung/i.test(name) || /stift/i.test(k.blatt) ? 'Stiftung' : /sparkasse/i.test(name) ? 'Sparkasse' : /bank/i.test(name) ? 'Volksbank / Bank' : '';
// Hinweise, die immer zu sehen sind: andere Region laut Kartei, derselbe Förderer bei anderen Bedarfen
function foeWarn(b, f) {
  if (!f.name.trim()) return '';
  const k = kartei(f.name), key = kkey(f.name);
  const other = D.bedarfe.filter(x => x !== b && !x.archiv && x.foerderer.some(g => kkey(g.name) === key && g.status !== 'abgelehnt'));
  const L = [];
  if (k && b.gliederung && b.gliederung !== DIO && k.gl.length && !k.gl.some(g => /^alle$/i.test(g)) && !k.gl.includes(b.gliederung)) L.push('Laut Kartei zuständig für ' + esc(k.gl.join(', ')));
  if (other.length) L.push('Auch im Förderplan von: ' + other.map(x => `<button class="link" data-act="open" data-id="${x.id}">${esc(x.titel || '(ohne Namen)')}</button> (${F_ST_L[x.foerderer.find(g => kkey(g.name) === key).status]})`).join(', '));
  return L.length ? `<div class="foe-warn">${L.map(t => `<div>${t}</div>`).join('')}</div>` : '';
}
function detSummary(f) {
  const k = kartei(f.name), c = k && k.kontakte[0];
  const parts = [c ? c.n : f.kontakt, k && k.weg.length ? 'Antrag ' + k.weg.join(' oder ') : f.weg, !c && f.mail].filter(Boolean);
  return esc(parts.join(' · ') || (k ? 'aus der Förder-Kartei' : 'Ansprechperson, Antragsweg, Quellen …'));
}
function detKartei(f) {
  const k = kartei(f.name);
  if (!k) return KR.list.length && f.name.trim() ? '<p class="muted small">Nicht in der Förder-Kartei.</p>' : '';
  const hist = Object.entries(k.hist).sort((a, c) => c[0] - a[0]);
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${v}</dd>` : '';
  return `<div class="det-k"><h4>Aus der Förder-Kartei <span class="badge k">${esc(k.blatt)}</span></h4>
    <dl class="dl">${row('Antragsweg', esc(k.weg.join(' oder ')))}${row('Website', k.web ? `<a href="${esc(/^https?:/i.test(k.web) ? k.web : 'https://' + k.web)}" target="_blank" rel="noopener" data-act="link">${esc(k.web.replace(/^https?:\/\//, '').slice(0, 60))}</a>` : '')}
      ${row('Gliederungen', esc(k.gl.join(', ')))}${row('Schwerpunkte', esc(k.schwer))}${row('Notiz', esc(k.notiz))}
      ${row('Bisher gefördert', hist.length ? hist.map(([y, v]) => `<div>${y}: ${esc(v.replace(/\n/g, ', '))}</div>`).join('') : '<span class="muted">nichts eingetragen</span>')}</dl>
    ${k.kontakte.length ? `<table class="kt"><thead><tr><th>Kontakt</th><th>E-Mail</th><th>Telefon</th></tr></thead><tbody>${k.kontakte.map(c => `<tr><td>${esc(c.n)}${c.nicht ? '<div class="sub">nicht direkt anschreiben</div>' : ''}</td><td class="sel">${esc(c.m)}</td><td>${esc(c.t)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`;
}
const OWN_FIELDS = [['kontakt', 'Ansprechperson oder Portal'], ['mail', 'E-Mail'], ['tel', 'Telefon'], ['web', 'Website oder Portal-Link'], ['weg', 'Antragsweg'],
  ['fristInfo', 'Weitere Fristen und Termine'], ['hoehe', 'Übliche Fördersumme'], ['eigenInfo', 'Eigenanteil gefordert'], ['quellen', 'Quellen'], ['notiz', 'Notizen']];
function detPanel(b, f) {
  const a = `data-fid="${f.id}"`, area = k => k === 'quellen' || k === 'notiz' || k === 'fristInfo';
  return `<div class="det-panel"><div id="dk-${f.id}">${detKartei(f)}</div>
    <div class="det-o"><h4>Eigene Angaben und Recherche</h4><div class="grid own-grid">${OWN_FIELDS.map(([k, l]) => fld(l, area(k) ? tarea(f, k, a + ` aria-label="${l}"`) : tin(f, k, a + ` aria-label="${l}"`), area(k) ? 'wide' : '')).join('')}</div></div></div>`;
}
const AMT_LAB = { geplant: 'Erwartete Summe', vorb: 'Erwartete Summe', beantragt: 'Beantragt', zugesagt: 'Zugesagt', abgelehnt: 'Beantragt (abgelehnt)' };
function foeShare(b, f) {
  const S = +b.summe || 0, v = f.status === 'abgelehnt' ? 0 : foeAmt(f);
  return segBar(b, { hl: f.id }) + `<div class="share-t">${S ? `<b>${Math.round(v / S * 100)} %</b> des Bedarfs (${eur(S)})` : 'Summe des Bedarfs fehlt'}</div>`;
}
function geldBlock(f) {
  const a = `data-fid="${f.id}"`;
  if (UI.geld === f.id) return `<div class="geld form"><label>Betrag<span class="row"><input id="geld-betrag" type="text" inputmode="decimal" class="num" value="${esc(fmtNum(f.eingegangen ?? f.zugesagt ?? f.betrag))}"><span class="unit">€</span></span></label>
      <label>eingegangen am<input id="geld-datum" type="date" value="${esc(f.eingangAm || today())}"></label><div class="row"><button class="primary" data-act="geld-ok" ${a}>Bestätigen</button><button data-act="geld-no">Abbrechen</button></div>
      ${f.eingegangen > 0 ? `<button class="link small" data-act="geld-undo" ${a}>Eingang zurücknehmen</button>` : ''}</div>`;
  if (f.eingegangen > 0) return `<div class="geld ok">✓ ${eur(f.eingegangen)} eingegangen am ${fmtDate(f.eingangAm) || '–'} <button class="link small" data-act="geld" ${a}>ändern</button></div>`;
  return `<div class="geld"><button class="primary" data-act="geld" ${a}>Geldeingang bestätigen</button></div>`;
}
function foeCard(b, f) {
  const a = `data-fid="${f.id}"`, st = f.status, open = !!UI.open['det-' + f.id];
  const dates = st === 'geplant' || st === 'vorb'
    ? fld('Antragsfrist', din(f, 'frist', a + ' aria-label="Antragsfrist"'))
    : fld('beantragt am', din(f, 'beantragtAm', a + ' aria-label="beantragt am"'))
      + (st === 'beantragt' ? fld('Antwort erwartet', din(f, 'erwartet', a + ' aria-label="Antwort erwartet"')) : fld(st === 'zugesagt' ? 'zugesagt am' : 'abgelehnt am', din(f, 'entscheidungAm', a + ' aria-label="Entscheidung am"')));
  const arts = uniq([...ART, f.art]);
  return `<article class="foe st-${st}" id="foe-${f.id}">
    <div class="foe-main">
      <div class="foe-head">
        <div class="foe-name">${tin(f, 'name', a + ' list="dl-kartei" aria-label="Förderer"', 'Wer fördert? z. B. Sparkasse …')}</div>
        <select data-p="art" ${a} id="art-${f.id}" class="art${f.art ? '' : ' empty'}" aria-label="Art des Förderers"><option value="">Art …</option>${arts.map(x => `<option ${x === f.art ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        <button class="x" data-act="rm-foe" ${a} title="Förderer entfernen" aria-label="Förderer entfernen">×</button>
      </div>
      <div id="fw-${f.id}">${foeWarn(b, f)}</div>
      <div class="kv"><span class="k">Stand</span>${seg(F_ST, st, `data-p="status" ${a}`, 'small')}</div>
      <div class="kv"><span class="k">Einschätzung</span>${seg(EINSCH, f.einsch, `data-p="einsch" data-toggle="" ${a}`, 'small einsch')}</div>
      <div class="kv"><span class="k">Antrag stellt</span>${seg([['ich', 'ich'], ['gl', 'Gliederung selbst']], f.durch, `data-p="durch" ${a}`, 'small')}</div>
      <div class="dates">${dates}</div>
      <div class="why">${fld('Warum passt das?', tarea(f, 'warum', a + ' aria-label="Warum passt das"', 'Satzungszweck, Förderschwerpunkt, Regionalbezug …'))}
      ${fld('Knackpunkte', tarea(f, 'knackpunkte', a + ' aria-label="Knackpunkte"', 'Wo hakt es? Worauf muss der Antrag den Fokus legen?'))}</div>
      <div class="det">
        <button class="det-btn" data-act="det" data-v="${f.id}" aria-expanded="${open}"><span class="tw">${open ? '▾' : '▸'}</span>Kontakt und Details <span class="muted" id="ds-${f.id}">${detSummary(f)}</span></button>
        ${open ? detPanel(b, f) : ''}
      </div>
    </div>
    <aside class="foe-sum">
      <label class="amt-lab" for="amt-${f.id}">${AMT_LAB[st]}</label>
      <div class="amt-big">${nin(f, st === 'zugesagt' ? 'zugesagt' : 'betrag', a + ` id="amt-${f.id}" aria-label="${AMT_LAB[st]}"`)}<span class="unit">€</span></div>
      ${st === 'zugesagt' ? `<div class="amt-small">beantragt ${nin(f, 'betrag', a + ' aria-label="beantragter Betrag"')} €</div>` : ''}
      <div id="sh-${f.id}" class="share">${foeShare(b, f)}</div>
      ${st === 'zugesagt' ? geldBlock(f) : ''}
    </aside>
  </article>`;
}
function finSummary(b) {
  const F = fin(b), S = F.S;
  if (!S) return '<div class="fin muted">Trag oben rechts die Summe ein, dann rechnet die Liste die Deckung aus.</div>';
  const line = (lab, v, cls = '') => { const gap = S - v; return `<tr class="${cls}"><th>${lab}</th><td class="num">${eur(v)}</td><td class="num">${Math.round(v / S * 100)} %</td>
    <td class="num ${gap > 0 ? 'gap' : gap < 0 ? 'over' : 'okc'}">${gap > 0 ? 'Lücke ' + eur(gap) : gap < 0 ? 'überdeckt um ' + eur(-gap) : 'gedeckt'}</td></tr>`; };
  return `<div class="fin"><div class="fin-l">${segBar(b, { big: true })}<div class="legend">${LEGEND_FIN}</div>
    ${F.mitGe > S ? '<div class="small hint-warn">Geplant ist mehr als der Bedarf. Kommt am Ende mehr Geld zusammen als nötig, fällt das spätestens im Verwendungsnachweis auf.</div>' : ''}</div>
    <table class="fintab"><tbody>
      <tr><th>Bedarf</th><td class="num">${eur(S)}</td><td></td><td></td></tr>
      ${line('Zugesagt und Eigenanteil', F.gedeckt, 'main')}${line('… wenn alles Beantragte kommt', F.mitBe)}${line('… wenn auch alles Geplante kommt', F.mitGe)}
      <tr><th>Eingegangen</th><td class="num">${eur(F.eingegangen)}</td><td></td><td class="num muted">${F.zugesagt > F.eingegangen ? 'noch offen: ' + eur(F.zugesagt - F.eingegangen) : ''}</td></tr>
    </tbody></table></div>`;
}
function secFoe(b) {
  return `<section class="card" id="sec-foe">
    <div class="sec-head"><h2>Förderplan</h2></div>
    <div class="research"><span class="r-lab">Recherche ${infoBtn('recherche')}</span>
      <button data-act="vorlage">⤓ Excel-Vorlage für die KI-Recherche</button><button data-act="import">Ausgefüllte Excel übernehmen …</button></div>
    <div class="foe-list">${b.foerderer.map(f => foeCard(b, f)).join('') || '<div class="empty">Noch kein Förderer eingetragen – einzeln mit „+ Förderer“ oder viele auf einmal aus einer ausgefüllten Recherche-Excel.</div>'}</div>

/* ---------- Bedienung */
function effects(b, base, p, v) {
  const m = p.match(/^freigabe\.(\w+)\.st$/);
  if (m) {
    const it = b.freigabe[m[1]];
    if (v === 'offen') { it.angefragt = ''; it.erledigt = ''; }
    if (v === 'angefragt') { if (!it.angefragt) it.angefragt = today(); it.erledigt = ''; }
    if ((v === 'ok' || v === 'nein') && !it.erledigt) it.erledigt = today();
  }
  if (p === 'status' && base !== b) {
    const f = base;
    if (['beantragt', 'zugesagt', 'abgelehnt'].includes(v) && !f.beantragtAm) f.beantragtAm = today();
    if (v === 'zugesagt' || v === 'abgelehnt') { if (!f.entscheidungAm) f.entscheidungAm = today(); } else f.entscheidungAm = '';
    if (v === 'zugesagt') { if (f.zugesagt == null) f.zugesagt = f.betrag; if (b.nach.ueb.noetig && !b.nach.ueb.mit.includes(f.id)) b.nach.ueb.mit.push(f.id); }
    if (v === 'abgelehnt') b.nach.ueb.mit = b.nach.ueb.mit.filter(id => id !== f.id);
  }
}

async function act(k, a, e) {
  const b = cur();

    case 'tab': UI.tab = a.dataset.v; UI.view = 'list'; renderNow(); scrollTo(0, 0); return;
    case 'open': UI.view = 'detail'; UI.id = a.dataset.id; UI.delAsk = false; UI.geld = null; renderNow(); scrollTo(0, 0); return;

    case 'new': {
      const nb = blank(); D.bedarfe.unshift(nb); changed();

    case 'about': closeMenus(); about(); return;
    case 'save': closeMenus(); if (FSA && ST.conn === 'none') await connectFolder(); else saveAll({}); renderNow(); return;
    case 'connect': await connectFolder(); renderNow(); return;
    case 'kartei': closeMenus(); if (ST.conn !== 'ok' && !await connectFolder()) return; await karteiChoose(); return;
    case 'kartei-info': toast('In der Programmdatei liest die Liste deine Excel „Banken- und Stiftungsübersicht“ aus dem Ordner ein. Hier stehen erfundene Förderer.'); return;
    case 'backup': closeMenus(); saveBackup(); return;
    case 'restore': closeMenus(); openBackup(); return;
    case 'update': closeMenus(); updateProgram(); return;
    case 'vorlage-leer': closeMenus(); vorlageDownload(null); return;
    case 'reload': window.__blReload = true; location.reload(); return;

    case 'conflict-theirs': resolveConflict('theirs'); return;
    case 'zip-go': { const z = ST.zipUpd; const f = z && await z.handle.getFile().catch(() => null); if (!f) { toast('Das Paket ist nicht mehr da.', 'warn'); ST.zipUpd = null; renderNow(); return; } updateProgram(Object.assign(await programFromFile(f), { pkg: z })); return; }
    case 'zip-later': UI.zipHide = ST.zipUpd.name + '@' + ST.zipUpd.info.version; renderNow(); return;

    case 'demo-reset': { const before = JSON.stringify(D); D = normalize({ bedarfe: demoBedarfe() }); changed(); UI.view = 'list'; renderNow(); toast('Beispieldaten wiederhergestellt', 'ok', undoTo(before)); return; }
    case 'jump': { const s = document.getElementById(a.dataset.v); if (s) s.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
    case 'link': {

      if (DEMO && host.endsWith('.example')) { e.preventDefault(); toast('Beispiel-Link: In der Programmdatei öffnet sich hier der Ordner bzw. die Seite im Browser.'); }

  if (!b || UI.view !== 'detail') return;
