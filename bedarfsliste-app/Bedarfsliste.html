<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedarfsliste</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23E30714'/%3E%3Crect x='14' y='11' width='36' height='43' rx='5' fill='white'/%3E%3Cg fill='%23E30714'%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3Crect x='20' y='30' width='6' height='6' rx='1'/%3E%3Crect x='20' y='40' width='6' height='6' rx='1'/%3E%3C/g%3E%3Cg fill='%23404040'%3E%3Crect x='30' y='21' width='14' height='4' rx='2'/%3E%3Crect x='30' y='31' width='14' height='4' rx='2'/%3E%3Crect x='30' y='41' width='10' height='4' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style id="bl-style">/* Layout: Kopfzeile mit Reitern wie in der Jahresplanung; darunter die Liste (nach Phase gruppiert) oder die Seite eines Bedarfs
   mit vier Bereichen. Farben als Tokens: hell auf :root, dunkel über das System oder data-theme="dark";
   die Einstellung im Programm (data-bl-theme) geht beidem vor. */
:root {
  --red: #E30714; --red-d: #b8000c; --onred: #ffffff;
  --ink: #262626; --ink2: #404040; --muted: #6b6b6b; --faint: #9a9a9a;
  --line: #e2e2e2; --line2: #d0d0d0; --line3: #efefed;
  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fbfbfa; --head: #f5f5f4; --hover: #f3f3f1; --chipbg: #ececea;
  --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12;
  --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20; --okmuted: #5a9a5f;
  --runbg: #e3f2fd; --runline: #9cc8f0; --runink: #0d47a1;
  --viobg: #f1ebfb; --violine: #cdb8f0; --vioink: #5b2ea6;
  --prio-h: #c0837c; --prio-m: #c9a467; --prio-l: #b3b5b8; --prio-off: #e3e3e0; --prio-t: #c8524a;
  --done: #9fcd9c; --strong: #4f8f55; --ghost: #cfcfcb; --blitz: #ffc9c2; --blitz-rand: #d4170c;
  --ph1bg: #fbf5dc; --ph1ink: #7a5d0a; --ph1line: #eadb9c; --ph2bg: #fbede2; --ph2ink: #95501f; --ph2line: #edc8a8;
  --ph3bg: #f2eef8; --ph3ink: #5f4a86; --ph3line: #d8cdea; --ph4bg: #f0f0ee; --ph4ink: #5f6266; --ph4line: #d9d9d5;
  --e5: #dcefdc; --e5ink: #2f6a33; --e4: #ecf5e4; --e4ink: #4f6f2f; --e3: #f3f1ea; --e3ink: #6b6450; --e2: #fbece4; --e2ink: #95501f; --e1: #f8e1df; --e1ink: #8a2c22;
  --f-in: #3f7d46; --f-zu: #3f7d46; --f-eig: #6f7c8c; --f-be: #d29a17; --f-ge: #cdcfd4; --track: #f0f0ee; --off-st: #e0e0dc;
  --focus: #1F77B4; --shadow: 0 8px 24px rgba(0,0,0,.14); --backdrop: rgba(0,0,0,.35);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) {
    --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
    --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
    --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
    --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
    --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6; --okmuted: #86c08b;
    --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
    --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
    --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b; --prio-t: #f0948b;
    --done: #4f7f55; --strong: #7fbf86; --ghost: #4c4f54; --blitz: #7a2b25; --blitz-rand: #ff5a4d;
    --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
    --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
    --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
    --f-in: #5fae69; --f-zu: #5fae69; --f-eig: #8592a1; --f-be: #d0a432; --f-ge: #4a4d53; --track: #303236; --off-st: #3a3d42;
    --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) .logo.light { display: none; }
  :root:not([data-theme="light"]):not([data-bl-theme="light"]) .logo.dark { display: block; }
}
:root[data-theme="dark"]:not([data-bl-theme="light"]), :root[data-bl-theme="dark"] {
  --red: #ff3b3b; --red-d: #ff6b6b; --onred: #ffffff;
  --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d;
  --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
  --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2a2c30; --head: #303236; --hover: #33363a; --chipbg: #3a3c40;
  --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22;
  --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab;
  --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6; --okmuted: #86c08b;
  --runbg: #1a2c40; --runline: #2f5d8a; --runink: #9ccaff;
  --viobg: #2c2340; --violine: #5a4688; --vioink: #cdb5ff;
  --prio-h: #b98b86; --prio-m: #b9a072; --prio-l: #7d8086; --prio-off: #43464b; --prio-t: #f0948b;
  --done: #4f7f55; --strong: #7fbf86; --ghost: #4c4f54; --blitz: #7a2b25; --blitz-rand: #ff5a4d;
  --ph1bg: #3a3317; --ph1ink: #e3cf86; --ph1line: #6b5d26; --ph2bg: #3b2a1d; --ph2ink: #e7b48c; --ph2line: #6e4b2f;
  --ph3bg: #2e2840; --ph3ink: #c9b8ec; --ph3line: #554879; --ph4bg: #303236; --ph4ink: #b5b8bd; --ph4line: #4b4e54;
  --e5: #23402a; --e5ink: #a9dcae; --e4: #2b3a24; --e4ink: #c2dba6; --e3: #36342c; --e3ink: #d6cfb7; --e2: #3d2a20; --e2ink: #eab894; --e1: #42211e; --e1ink: #f2aaa2;
  --f-in: #5fae69; --f-zu: #5fae69; --f-eig: #8592a1; --f-be: #d0a432; --f-ge: #4a4d53; --track: #303236; --off-st: #3a3d42;
  --focus: #5aa9e6; --shadow: 0 8px 24px rgba(0,0,0,.5); --backdrop: rgba(0,0,0,.55);
  color-scheme: dark;
}
:root[data-theme="dark"]:not([data-bl-theme="light"]) .logo.light, :root[data-bl-theme="dark"] .logo.light { display: none; }
:root[data-theme="dark"]:not([data-bl-theme="light"]) .logo.dark, :root[data-bl-theme="dark"] .logo.dark { display: block; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }                        /* auch bei Knöpfen mit eigener Anzeige (z. B. „Filter löschen“) */
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.25;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink); }
button:hover:not(:disabled), .btn:hover { border-color: var(--faint); }
button:disabled, .btn.disabled { opacity: .45; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: var(--onred); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; white-space: normal; display: inline; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.danger, .danger { color: var(--red-d); }
button.dangerfill { background: var(--red-d); border-color: var(--red-d); color: var(--onred); font-weight: 600; }
button.icon { padding: 4px 10px; font-weight: 700; }
.small { font-size: 12.5px; }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 5px 7px; background: var(--input); min-width: 0; }
input[type=text], input[type=search], input:not([type]) { width: 100%; }
input.num { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=date] { width: 140px; }
textarea { width: 100%; resize: vertical; field-sizing: content; min-height: 2.7em; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
button:focus-visible, .btn:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.hint-warn { color: var(--warn); }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.pathbox { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

/* eingebaute Bedienelemente (Kalender- und Uhrsymbole, Auswahllisten) folgen der Darstellung im Programm, nicht der umgebenden Seite */
html:root[data-bl-theme="light"], html:root[data-bl-theme="light"] * { color-scheme: light; }
html:root[data-bl-theme="dark"], html:root[data-bl-theme="dark"] * { color-scheme: dark; }
.le-sug, .menu, .zeit-col, .tablewrap { scrollbar-color: var(--line2) transparent; scrollbar-width: thin; }

/* ---------- Kopfzeile und Hinweise */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: stretch; gap: 6px 22px; flex-wrap: wrap;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; flex: none; }
.brand .logo { height: 36px; width: auto; flex: none; }
.logo.dark { display: none; }
.brand strong { display: block; font-size: 16px; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 12px 10px 9px; color: var(--ink2); font-weight: 500; font-size: 15px; }
.tab:hover:not(:disabled) { color: var(--ink); border-bottom-color: var(--line2); }
.tab.on { border-bottom-color: var(--red); color: var(--ink); font-weight: 600; }
.tab .cnt { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
/* Hinweise gebündelt in der Kopfzeile: rot = jetzt fällig, gelb = bald fällig, grau = nur Infos */
.frist-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 12px; cursor: pointer;
  background: var(--ph1bg); color: var(--ph1ink); border: 1px solid var(--ph1line); }
.frist-chip .tri { width: 15px; height: 15px; color: #e0a800; }
.frist-chip.over { background: var(--errbg); color: var(--red-d); border-color: transparent; }
.frist-chip.over .tri { color: var(--red-d); }
.frist-chip.nur-info { background: var(--line3); color: var(--muted); border-color: var(--line2); }
.frist-chip.nur-info .tri { color: var(--faint); }
.fp-i { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line2); font: italic 600 11px/1 Georgia, serif; color: var(--muted); }
.fp-row.fp-info { grid-template-areas: "d t" "d b"; }
.frist-pop { padding: 6px; min-width: 380px; max-width: 480px; max-height: 70vh; overflow: auto; }
.frist-pop .fp-h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); padding: 8px 10px 4px; }
.frist-pop .fp-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-areas: "d t" "r b"; gap: 1px 12px; width: 100%; text-align: left;
  border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; color: var(--ink); }
.frist-pop .fp-row:hover { background: var(--hover); }
.fp-d { grid-area: d; font-weight: 600; font-size: 13px; } .fp-r { grid-area: r; font-size: 11.5px; color: var(--muted); }
.fp-t { grid-area: t; font-size: 13px; white-space: normal; } .fp-b { grid-area: b; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-row.over .fp-d, .fp-row.over .fp-r { color: var(--red-d); }
/* Sprung aus den Hinweisen: die Stelle leuchtet kurz rot auf, mit kräftig roter Kontur, und springt hervor */
.blitz { animation: bl-blitz 2s ease-out .2s both; border-radius: 4px; }
@keyframes bl-blitz { 0% { background-color: transparent; box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; }
  10% { background-color: var(--blitz); box-shadow: 0 0 0 7px var(--blitz), 0 0 0 10px var(--blitz-rand); }
  22% { box-shadow: 0 0 0 4px var(--blitz), 0 0 0 6.5px var(--blitz-rand); }
  75% { background-color: var(--blitz); box-shadow: 0 0 0 4px var(--blitz), 0 0 0 6.5px var(--blitz-rand); }
  100% { background-color: transparent; box-shadow: 0 0 0 4px transparent, 0 0 0 6.5px transparent; } }
/* Förderplan: steht die Finanzierung, sind geplante Förderer „nicht mehr nötig“ */
tr.r-weg th, tr.r-weg td { opacity: .5; }
table.kuerzel { border-collapse: collapse; font-size: 13.5px; } table.kuerzel th { text-align: left; white-space: nowrap; padding: 5px 16px 5px 0; vertical-align: top; color: var(--ink); }
table.kuerzel td { padding: 5px 0; color: var(--ink2); } table.kuerzel tr + tr > * { border-top: 1px solid var(--line3); }
table.kuerzel tr.kz-g th { padding: 14px 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
table.kuerzel tbody:first-child tr.kz-g th { padding-top: 0; }
.tools .kz-info { width: 20px; height: 20px; font-size: 12px; margin-left: 2px; }
.kchip { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: var(--chipbg); color: var(--ink2); border: 1px solid transparent; }
.kchip.ok { background: var(--okbg); color: var(--okink); border-color: var(--okline); }
.kchip.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.save { min-width: 132px; justify-content: center; }
.save.ok { color: var(--okink); }
.banners .banner { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--warnbg); border-bottom: 1px solid var(--warnline); font-size: 13px; color: var(--ink); }
.banner > span { flex: 1 1 320px; }
.banner.err { background: var(--errbg); border-bottom-color: var(--errline); }
.banner.upd { background: var(--runbg); border-bottom-color: var(--runline); }
.menu { position: fixed; z-index: 85; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 180px; }
.menu > button { display: flex; width: 100%; text-align: left; border: 0; padding: 8px 12px; border-radius: 5px; background: transparent; gap: 8px; }
.menu > button:hover, .menu > button.on { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; }
.menu-row > span { margin-right: auto; color: var(--muted); }
.mini-btn { padding: 2px 8px; font-size: 12px; }
.mini-btn.on { background: var(--ink2); color: var(--card); border-color: var(--ink2); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--card); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.toast.err { background: var(--red-d); color: var(--onred); }
.toast button.link { color: inherit; font-weight: 600; }
.toast.out { opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .3s; } }
.backdrop { position: fixed; inset: 0; z-index: 82; background: var(--backdrop); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); width: 100%; max-width: 540px; max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { max-width: 820px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.modal > header h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 6px 18px 12px; overflow: auto; }
.modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.help p { margin: 0 0 10px; overflow-wrap: anywhere; }
.radios { display: grid; gap: 6px; margin-top: 8px; }
table.imp { border-collapse: collapse; width: 100%; font-size: 13px; }
table.imp th { text-align: left; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 6px; }
table.imp td { padding: 5px 6px; border-bottom: 1px solid var(--line3); vertical-align: top; }
table.imp .badge { margin-left: 6px; }
.imp-why { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.imp-nq { color: var(--red-d); font-size: 11.5px; font-weight: 600; margin-left: 6px; white-space: nowrap; }
.imp-sum { margin: 10px 0 4px; font-size: 13px; }
table.imp td.nowrap { white-space: nowrap; }
/* Förderrecherche mit Copilot: drei Schritte */
.sec-tools .rech-btn { height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600; background: var(--head); color: var(--ink2); border-radius: 7px; }
ol.rech-steps { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 16px; }
ol.rech-steps > li::marker { font-weight: 700; color: var(--muted); }
.rech-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 4px; }
.rech-pfad { margin-top: 3px; font-size: 12px; color: var(--ink2); word-break: break-all; user-select: all; }
.rech-hinweis { margin-top: 6px; }
textarea.rech-prompt { width: 100%; margin-top: 6px; font-size: 12.5px; line-height: 1.45; height: 170px; min-height: 100px; resize: vertical; }

main { padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }

/* ---------- Phase, Priorität, kleine Anzeigen */
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chipbg); color: var(--ink2); white-space: nowrap; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--chipbg); color: var(--ink2); }
.badge.k { background: var(--okbg); color: var(--okink); }
.phase { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 11px; border: 1px solid transparent; white-space: nowrap; }
.ph-frei { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1line); }
.ph-foer { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2line); }
.ph-nach { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3line); }
.ph-fertig { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4line); }
.ph-pause { background: transparent; color: var(--muted); border: 1px dashed var(--line2); }
.swa.in { background: var(--f-in); } .swa.zu { background: var(--f-zu); } .swa.eig { background: var(--f-eig); } .swa.be { background: var(--f-be); }
.swa.ge { background: var(--f-ge); }
.swa.off { background: repeating-linear-gradient(135deg, var(--off-st) 0 1px, var(--track) 1px 4px); box-shadow: inset 0 0 0 1px var(--line2); }
.swa.none { visibility: hidden; }
.swa.ge { box-shadow: inset 0 0 0 1px var(--line2); }
.swa { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; margin-right: 8px; vertical-align: -1px; }
.u-over { color: var(--red-d); font-weight: 700; }
.u-soon { color: var(--warn); font-weight: 700; }

/* ---------- Liste */
.list-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.tools input[type=search] { width: 190px; }
.tools select { max-width: 190px; }
.tools select.on { border-color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; margin-bottom: 12px; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list th.r { text-align: right; }
table.list td { border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tbody tr[data-act] { cursor: pointer; }
table.list tbody tr[data-act]:hover { background: var(--hover); }
table.list tbody tr.paused { opacity: .6; }
/* Zeile: Kerninfo mittig in der Höhe, dann Freigabe, Finanzierungsplan ⋯ Verwendungsnachweis, Spendenübergabe – je Block ein feiner Strich */
table.list { min-width: 1180px; }
/* Spaltenbreiten selbst gezogen: feste Breiten, rechts davon rücken die Spalten mit (wie in Excel) */
table.list.fixed { table-layout: fixed; min-width: 0; }
table.list th { position: relative; }
.col-rs { position: absolute; top: 0; right: -5px; width: 9px; height: 100%; cursor: col-resize; z-index: 3; touch-action: none; }
table.list th:last-child .col-rs { right: 0; width: 6px; }                          /* sonst ragt er 5 px hinaus: waagrechter Scrollbalken unter Windows */
.col-rs::after { content: ''; position: absolute; top: 15%; bottom: 15%; left: 3px; width: 3px; border-radius: 2px; background: transparent; }
table.list th:hover .col-rs::after, body.col-resizing .col-rs::after { background: var(--line2); }
body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none; }
table.list.fixed td.l-meta > div, table.list.fixed td.l-name { overflow: hidden; text-overflow: ellipsis; }
table.list.fixed td.l-fr .ml > span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
table.list th { vertical-align: bottom; background: none; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; color: var(--faint); padding: 4px 12px 8px; }
table.list td { padding: 14px 12px; font-size: 12.5px; line-height: 20px; }
table.list td.l-name, table.list td.l-sum, table.list td.l-meta { vertical-align: middle; }
/* kompakte Ansicht: eine Zeile je Bedarf */
table.list.kompakt td { vertical-align: middle; white-space: nowrap; padding-top: 9px; padding-bottom: 9px; }
table.list.kompakt td.l-name { max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
table.list.kompakt td.l-ort { font-size: 13px; color: var(--ink2); }
/* aufgeklappter Bedarf in der kompakten Liste: ausführlich wie in der anderen Ansicht, hervorgehoben */
/* Zeilen malen Hintergrund und Linie selbst (nicht die Tabelle) – sonst blieben beim Aufgleiten Linien und Hintergründe stehen, während die Zeilen rutschen */
table.list.kompakt { border-collapse: separate; border-spacing: 0; }
table.list.kompakt tbody td { background-color: var(--card); }
table.list.kompakt tbody tr[data-act]:not(.auf):hover td { background-color: var(--hover); }
/* aufgeklappt: oben ausgerichtet – die erste Zeile bleibt, wo sie war, darunter zieht sich der Rest auf */
table.list.kompakt tr.auf td { white-space: normal; vertical-align: top; padding-top: 10px; padding-bottom: 14px; background: var(--soft); }
table.list.kompakt tr.auf td:first-child { box-shadow: inset 3px 0 0 var(--focus); }
table.list.kompakt th:nth-child(5) { min-width: 155px; } table.list.kompakt th:nth-child(6) { min-width: 300px; }   /* Platz für die Förderer, wenn ein Bedarf aufklappt – die Spalten bleiben dabei stehen */
table.list.kompakt tr.auf .fg { grid-template-columns: 15px minmax(0, 1fr) auto 36px 15px var(--vtw, 112px); }   /* Nachweis unter seiner Überschrift */
table.list.kompakt tr.auf td.l-meta { min-width: 130px; }
table.list.kompakt tr.auf td.l-name { max-width: none; overflow: visible; }
.kz { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.kz.k-ok { color: var(--e5ink); } .kz.k-run { color: var(--ph1ink); } .kz.k-no { color: var(--red-d); } .kz.k-off { color: var(--muted); } .kz.nn { color: var(--faint); }
.kz.warnl { color: var(--warn); } .kz .tri { width: 14px; height: 14px; }
/* Priorität als Stern ganz vorn: leer umrandet = keine Prio, gelb = Prio */
table.list td.l-star, table.list th.l-star, table.list.kompakt th:first-child { width: 30px; padding-left: 10px; padding-right: 0; }
table.list td.l-star { vertical-align: middle; }
.star-p { border: 0; background: none; padding: 2px; display: grid; place-items: center; color: var(--ghost); cursor: pointer; }   /* ohne Prio: ganz dezent */
#list-body tr:hover .star-p:not(.on), .d-head:hover .d-star:not(.on) { color: var(--faint); }
.star-p svg path { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
#list-body .star-p:hover, .star-p:hover { color: #d29a17; }
.star-p.on { color: #e8a800; }
.star-p.on svg path { fill: #f5c000; stroke: #d29a17; }
.th-sort svg path { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.kopf-stern { border: 0; background: none; padding: 2px; display: grid; place-items: center; color: var(--faint); cursor: pointer; }
.kopf-stern svg path { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.kopf-stern:hover { color: #d29a17; }
.kopf-stern.s1 svg path { stroke: #d29a17; stroke-width: 1.8; }                 /* Prio oben */
.kopf-stern.s2 svg path { fill: #f5c000; stroke: #d29a17; }                     /* nur Prio */
.d-head > .d-star { margin-top: 13px; padding: 0; }
.d-head > .d-star svg { width: 22px; height: 22px; }
/* solange die Freigabe fehlt: Finanzierung, Nachweis und Übergabe grau und blass – keine Farben */
tr.ohne-fg td.l-fin > *, tr.ohne-fg td.l-ueb > *, tr.ohne-fg td.k-nach > * { filter: grayscale(1); opacity: .5; }
tr.ohne-fg td > :is(.blitz, :has(.blitz)) { filter: none; opacity: 1; }        /* Sprung aus den Hinweisen: das Rot auch hier zeigen */
/* Sortieren: Spaltenköpfe als Knöpfe, Stufe und Richtung als kleine Marke; Menü mit drei Stufen */
.th-sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.th-sort:hover { color: var(--ink2); }
.th-sort.on { color: var(--ink); }
.th-sort .so { font-size: 10px; font-weight: 700; color: var(--card); background: var(--ink2); border-radius: 8px; padding: 0 5px; line-height: 15px; letter-spacing: 0; }
.seg.ansicht button { padding: 4px 11px; }
table.list td.l-name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.35; min-width: 180px; }
table.list td.l-sum { font-size: 14.5px; font-weight: 700; text-align: left; white-space: nowrap; line-height: 1.35; }
td.l-sum .le-edit.num { text-align: left; }
table.list td.l-meta { color: var(--muted); white-space: nowrap; width: 1%; }
td.l-meta .ort { color: var(--ink); font-weight: 700; }
.pause-t { color: var(--muted); font-weight: 600; white-space: nowrap; }
.l-fr, .l-fin, .l-ueb { border-left: 1px solid var(--line3); }
table.list td.l-fr { white-space: nowrap; width: 1%; color: var(--ink2); }
.l-fin { width: 480px; }
.l-ueb { width: 250px; }
.nn { color: var(--ghost); }
.ml { display: flex; align-items: center; gap: 7px; min-height: 20px; }
.ml-sub { color: var(--muted); padding-left: 22px; }
.l-ueb .ml-sub:first-child { padding-left: 0; }
.mi { width: 15px; height: 15px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 800; line-height: 1; border: 1.5px solid var(--line2); color: var(--faint); background: var(--card); }
.mi svg { width: 11px; height: 11px; fill: currentColor; display: block; }
.mi.m-run svg { width: 13px; height: 13px; }
.circ svg { width: 15px; height: 15px; fill: currentColor; display: block; }
.mi.m-ok { background: var(--e5); border-color: var(--f-in); color: var(--e5ink); }
.mi.m-run { background: var(--ph1bg); border-color: #d9b740; color: var(--ph1ink); }
.mi.m-no { background: var(--e1); border-color: #d9827a; color: var(--e1ink); font-size: 9px; }
.mi.m-none { border-color: transparent; background: none; }
.mi.m-dot { width: 10px; height: 10px; margin: 2.5px 2.5px 0; border: 0; background: var(--faint); }
/* Freigabe vollständig: nur ein Haken „freigegeben“ (wie in der kompakten Ansicht), die Einzelheiten beim Überfahren */
.ml.fr-voll { color: var(--e5ink); cursor: help; }
/* Finanzierungsplan: Kreis · Förderer · Betrag · gepunktet · Kreis · Verwendungsnachweis */
.fg { display: grid; grid-template-columns: 15px minmax(0, 1fr) auto 36px 15px 112px; column-gap: 8px; align-items: start; }
.fg .fr { display: contents; }
.fg > .fr > :first-child { grid-column: 1; }
.fg > .fr > .mi { margin-top: 2.5px; }
.fg > .fr > .mi.m-dot { margin-top: 5px; }
.fg .fn, .fg .fa, .fg .vt { line-height: 20px; min-height: 20px; }
.fg-h { align-items: end; }
.fg-h > span:first-child { grid-column: 1 / 4; }
.fg-h > span:last-child { grid-column: 4 / 7; white-space: nowrap; }
.fn { overflow-wrap: anywhere; color: var(--ink2); }
.fa { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink2); }
.fr.ab .fn, .fr.ab .fa { color: var(--e1ink); text-decoration: line-through; }
.fr.sum .fn, .fr.sum .fa { color: var(--ink); font-weight: 600; }
.fline { grid-column: 2 / 4; height: 0; position: relative; }
.fline::after { content: ''; position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--line); }
.lead { border-bottom: 2px dotted var(--line2); height: 0; margin-top: 10px; }
/* Punktlinie zur Frist des Verwendungsnachweises: Farbe nach der Zeit bis zur Frist */
/* Punktlinie zur Frist: grau, darüber je nach Restzeit ein Teil in Farbe (grün ein Drittel, gelb die Hälfte, rot ganz) */
.lead.tl { position: relative; border-color: var(--line2); }
.lead.tl > i { position: absolute; left: 0; top: 0; border-bottom: 2px dotted transparent; }
.lead.tl-g > i { width: 30%; border-color: var(--f-zu); } .lead.tl-y > i { width: 55%; border-color: #e0a400; } .lead.tl-r > i { width: 100%; border-color: var(--red); }
#list-body .ph { color: var(--faint); font-weight: 400; }
.vt { white-space: nowrap; color: var(--ink2); }
.vt.nn { color: var(--ghost); }
/* Finanzierung steht: Zusagen mit offenem Nachweis kräftig, erledigte blass grün, alle übrigen blass grau */
.fr.strong .mi.m-dot { background: var(--strong); }
.fr.strong .fn, .fr.strong .fa { color: var(--ink); }
.fr.z .mi.m-dot { background: var(--done); }
.fr.z .fn, .fr.z .fa, .fr.z .vt:not(.nn) { color: var(--done); }
.fr.z .lead { border-color: var(--done); }
.fr.x .mi.m-dot { background: var(--ghost); }
.fr.x .fn, .fr.x .fa { color: var(--ghost); }
.warnl { color: var(--warn); font-weight: 600; }
.tri { width: 15px; height: 15px; color: #e8892b; flex: none; }
.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 4px; white-space: normal; }
.note.fmt ul, .note.fmt ol { margin: 1px 0; padding-left: 16px; }
.ue-form .ue-info { min-height: 1.6em; max-height: 9em; padding: 2px 4px; font-size: 12.5px; border: 0; border-bottom: 1px solid var(--focus); border-radius: 0; background: var(--input); }
.ue-form .ue-info:focus { outline: none; }
/* Andeutung bei gedrückter Strg-Taste: Streifen am rechten Rand, Griff auf Höhe des Bedarfs */
#peek .peek-s { position: fixed; top: 0; bottom: 0; right: 0; width: 12px; z-index: 60; background: var(--card); border-left: 1px solid var(--line); box-shadow: -4px 0 14px rgba(0,0,0,.12); transform: translateX(110%); transition: transform .16s ease-out; }
#peek .peek-g { position: fixed; right: 12px; z-index: 61; width: 30px; height: 58px; padding: 0; border-radius: 12px 0 0 12px; border: 1px solid var(--line); border-right: 0; background: var(--card); box-shadow: -4px 2px 12px rgba(0,0,0,.14);
  color: var(--focus); font-size: 22px; font-weight: 700; display: grid; place-items: center; cursor: pointer; transform: translateX(calc(100% + 14px)); transition: transform .16s ease-out, top .12s ease-out; }
#peek .peek-g:hover { background: var(--focus); color: var(--card); }
#peek.an .peek-s, #peek.an .peek-g { transform: none; }
/* Bedarf öffnen: er gleitet von rechts über die Liste; zurück gleitet er wieder hinaus */
html[data-vt] #app > main { view-transition-name: bl-inhalt; background: var(--bg); }        /* deckend, sonst schiene die andere Seite durch */
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-group(bl-inhalt) { animation: none; }
::view-transition-old(bl-inhalt), ::view-transition-new(bl-inhalt) { mix-blend-mode: normal; }
html[data-vt="vor"]::view-transition-old(bl-inhalt) { animation: none; }
html[data-vt="vor"]::view-transition-new(bl-inhalt) { animation: bl-rein .32s cubic-bezier(.2, .8, .2, 1) both; box-shadow: -12px 0 30px rgba(0,0,0,.18); }
html[data-vt="zurueck"]::view-transition-new(bl-inhalt) { animation: none; }
html[data-vt="zurueck"]::view-transition-old(bl-inhalt) { animation: bl-raus .26s cubic-bezier(.5, 0, .9, .4) both; z-index: 1; box-shadow: -12px 0 30px rgba(0,0,0,.18); }
/* die Leiste unter der Kopfzeile gleitet mit (Liste: Suche & Co., Bedarf: Phasen) */
html[data-vt] header.top .subbar { view-transition-name: bl-leiste; background: var(--card); }
::view-transition-group(bl-leiste) { animation: none; }
::view-transition-old(bl-leiste), ::view-transition-new(bl-leiste) { mix-blend-mode: normal; }
html[data-vt="vor"]::view-transition-old(bl-leiste) { animation: none; }
html[data-vt="vor"]::view-transition-new(bl-leiste) { animation: bl-rein .32s cubic-bezier(.2, .8, .2, 1) both; }
html[data-vt="zurueck"]::view-transition-new(bl-leiste) { animation: none; }
html[data-vt="zurueck"]::view-transition-old(bl-leiste) { animation: bl-raus .26s cubic-bezier(.5, 0, .9, .4) both; z-index: 1; }
/* ↓ / ↑ auf der Seite eines Bedarfs: der nächste kommt von unten, der vorige von oben */
html[data-vt="runter"]::view-transition-old(bl-inhalt) { animation: bl-weg-hoch .2s ease-in both; }
html[data-vt="runter"]::view-transition-new(bl-inhalt) { animation: bl-von-unten .28s cubic-bezier(.2, .8, .2, 1) both; }
html[data-vt="hoch"]::view-transition-old(bl-inhalt) { animation: bl-weg-runter .2s ease-in both; }
html[data-vt="hoch"]::view-transition-new(bl-inhalt) { animation: bl-von-oben .28s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes bl-weg-hoch { to { transform: translateY(-36px); opacity: 0; } }
@keyframes bl-weg-runter { to { transform: translateY(36px); opacity: 0; } }
@keyframes bl-von-unten { from { transform: translateY(36px); opacity: 0; } }
@keyframes bl-von-oben { from { transform: translateY(-36px); opacity: 0; } }
@keyframes bl-rein { from { transform: translateX(100vw); } }
@keyframes bl-raus { to { transform: translateX(100vw); } }
@media (prefers-reduced-motion: reduce) { #peek .peek-s, #peek .peek-g { transition: none; } }
/* Bearbeiten (ohne Strg): was sich ändern lässt, hebt sich beim Überfahren ab; unten links im Finanzierungsplan ein + */
body.strg #list-body tr[data-id] { cursor: default; }
body.strg #list-body [data-le] { cursor: pointer; }
body.strg #list-body [data-le]:not(.mi) { border-radius: 4px; }
body.strg #list-body [data-le]:not(.mi):hover { background: var(--runbg); box-shadow: 0 0 0 2px var(--runbg); }
body.strg #list-body .mi[data-le]:hover { box-shadow: 0 0 0 3px var(--runbg); }
body.strg #list-body [data-le="titel"]:hover, body.strg #list-body [data-le="summe"]:hover { box-shadow: inset 0 0 0 1px var(--runline); }
/* nur das Wort ist zum Ändern da (Textcursor); daneben klappt ein Klick auf (kompakt) bzw. öffnet den Bedarf */
body.strg #list-body .le-w:is([data-le="titel"], [data-le="summe"], [data-le="ort"], [data-le="zust"]) { cursor: text; }
body.strg #list-body tr[data-id] :is(td.l-star, td.l-name, td.l-sum, td.l-meta), body.strg table.list.kompakt #list-body tr[data-id]:not(.auf) td { cursor: pointer; }
/* aufgeklappt: Spalten bleiben, wie sie sind; die anderen Bedarfe treten zurück – ein Klick holt einen davon nach vorn */
table.list.auf-fest { table-layout: fixed; }
table.list.hat-auf #list-body tr[data-id]:not(.auf) > td > * { opacity: .42; }          /* nur der Inhalt wird blass – die Zeile bleibt deckend */
table.list.hat-auf #list-body tr[data-id]:not(.auf):hover > td > * { opacity: .75; }
body.strg table.list.hat-auf #list-body tr[data-id]:not(.auf) :is([data-le], td) { cursor: pointer; }
body.strg table.list.hat-auf #list-body tr[data-id]:not(.auf) [data-le]:hover { background: none; box-shadow: none; }
@media (prefers-reduced-motion: no-preference) { table.list.kompakt #list-body tr[data-id] > td > * { transition: opacity .25s; } }
td.l-fin { position: relative; }
.le-plus { display: none; position: absolute; left: 8px; bottom: 6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1.5px solid var(--runline); background: var(--card); color: var(--runink);
  font-size: 14px; font-weight: 700; line-height: 1; place-items: center; }
body.strg #list-body td.l-fin:hover .le-plus { display: grid; }
body.strg #list-body .le-plus:hover { background: var(--runbg); }
/* Feld an Ort und Stelle: kein Rahmen, nur eine Linie darunter; liegt über dem Wert, damit sich keine Spalte verschiebt */
td.le-cell { position: relative; }
.le-hide, .le-hide * { visibility: hidden; }
.le-edit { visibility: visible; position: absolute; z-index: 2; font: inherit; line-height: inherit; color: var(--ink); padding: 0 1px; margin: 0; border: 0; border-bottom: 1px solid var(--faint);
  border-radius: 0; background: transparent; box-shadow: none; outline: none; min-width: 0; }
.le-edit:focus { outline: none; border-bottom-color: var(--ink2); }
.le-edit::placeholder { color: var(--faint); font-weight: 400; opacity: .75; }
.le-edit.num { text-align: right; }
textarea.le-edit { resize: none; field-sizing: content; min-height: 0; overflow: hidden; }
/* langer Name im Feld: wächst nach unten und deckt die Zeile darunter ab – nicht abgeschnitten (kompakt) und nicht durchscheinend (ausführlich) */
table.list td.le-cell { overflow: visible !important; }
textarea.le-edit { background: var(--card); box-shadow: 0 8px 14px -8px rgba(0,0,0,.28); z-index: 6; padding-bottom: 3px; }
table.list.kompakt tr.auf textarea.le-edit { background: var(--soft); }
input.le-edit[type=date] { color: var(--ink2); }
input.le-edit[type=date]::-webkit-calendar-picker-indicator { opacity: .45; cursor: pointer; }
/* neuer Förderer: eigene Zeile unter den anderen, Name bis vor die Beträge, Betrag in der Spalte der Beträge */
/* Stift am Ende des Förderernamens und Kalender beim Nachweis – nur mit Strg */
.fn { display: flex; align-items: flex-start; gap: 4px; }
.fn-t { flex: 1 1 auto; min-width: 0; }
.le-pen, .le-cal, .le-ue { border: 0; background: none; padding: 0; color: var(--muted); place-items: center; }
.le-pen { visibility: hidden; display: grid; flex: none; width: 14px; height: 20px; }
body.strg #list-body .fr:hover .le-pen { visibility: visible; }
.le-pen:hover, .le-cal:hover, .le-ue:hover { color: var(--ink); }
.le-cal { display: none; width: 14px; height: 14px; margin-left: 5px; vertical-align: -2px; }
.le-cal svg { width: 13px; height: 13px; }
body.strg #list-body tr:hover .le-cal { display: inline-grid; }   /* nur in der Zeile unter der Maus – sonst stünden überall Symbole */
/* Spendenübergabe: mit Strg ein großer Kreis mit Stift oben rechts; Klick öffnet die Felder, die offen bleiben */
td.l-ueb { position: relative; }
.le-ue { display: none; position: absolute; top: 9px; right: 8px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--runline); background: var(--card); color: var(--runink); }
.le-ue svg { width: 15px; height: 15px; }
body.strg #list-body tr:hover .le-ue[data-le] { display: grid; border-radius: 50%; }
body.strg #list-body .le-ue:hover { background: var(--runbg); }
.ue-form { display: grid; gap: 6px; }
table.list td.l-ueb { vertical-align: middle; }
.ue-sep { border-top: 1px solid var(--line2); margin: 7px 0 5px; }
.ue-sep + .note { margin-top: 0; }
/* eigener Kalender */
.cal-pop { min-width: 0; width: 236px; padding: 8px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: var(--ink); }
.cal-nav { border: 0; background: none; width: 28px; height: 26px; padding: 0; justify-content: center; font-size: 18px; color: var(--ink2); border-radius: 5px; }
.cal-nav:hover { background: var(--hover); }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-wd { font-size: 11px; color: var(--faint); text-align: center; padding: 2px 0 4px; }
.cal-d { border: 0; background: none; height: 28px; padding: 0; justify-content: center; font-size: 12.5px; color: var(--ink2); border-radius: 5px; }
.cal-d:hover { background: var(--hover); color: var(--ink); }
.cal-d.heute { box-shadow: inset 0 0 0 1px var(--line2); font-weight: 600; }
.cal-d.on { background: var(--ink2); color: var(--card); font-weight: 700; }
.cal-f { margin-top: 6px; text-align: right; font-size: 12px; }
/* Uhrzeit: zwei Räder, Stunden und Minuten (5er-Schritte) */
.zeit-pop { min-width: 0; padding: 6px; display: flex; align-items: center; gap: 2px; }
.zeit-col { height: 196px; overflow-y: auto; display: grid; align-content: start; gap: 1px; padding: 0 2px; overscroll-behavior: contain; }
.zeit-v { border: 0; background: none; width: 44px; height: 28px; padding: 0; justify-content: center; font-size: 13px; color: var(--ink2); border-radius: 5px; font-variant-numeric: tabular-nums; }
.zeit-v:hover { background: var(--hover); color: var(--ink); }
.zeit-v.on { background: var(--ink2); color: var(--card); font-weight: 700; }
.zeit-dp { color: var(--faint); font-weight: 700; }
.ue-form .le-edit { position: static; width: 100%; }
.ue-wann { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; }
.ue-ok { justify-self: end; font-size: 12px; }
.le-new .le-edit.le-in { position: static; width: 100%; }
.le-new .fa { position: relative; align-self: stretch; }
.le-new .fa .le-edit.le-in { position: absolute; right: 0; top: 0; width: 92px; }
/* Vorschläge beim Tippen */
.le-sug.lang { max-height: 232px; overflow-y: auto; }
.le-sug { position: fixed; z-index: 90; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 3px 0; max-width: 340px; font-size: 13px; }
.le-opt { padding: 4px 10px; cursor: pointer; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.le-opt:hover, .le-opt.on { background: var(--hover); color: var(--ink); }

/* ---------- Seite eines Bedarfs */
ol.steps { display: flex; flex-wrap: wrap; gap: 6px 0; list-style: none; margin: 0; padding: 0; cursor: default; }
ol.steps li { font-size: 13px; color: var(--faint); padding: 0 12px; display: flex; align-items: center; gap: 6px; }
ol.steps li:first-child { padding-left: 0; }
ol.steps li + li { border-left: 1px solid var(--line); }
ol.steps li .st-k { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
ol.steps li .st-k svg { width: 13px; height: 13px; }
ol.steps li.done { color: var(--okmuted); }                                              /* erledigt: dezent grün, Kreis nur umrandet */
ol.steps li.done .st-k { background: transparent; border-color: var(--okline); color: var(--okmuted); }
ol.steps li.cur { color: var(--ink); font-weight: 700; background: none; }                /* aktueller Schritt: nur fett, nicht hinterlegt */
ol.steps li.cur .st-k { border-color: currentColor; }
ol.steps li.cur.ph-frei .st-k { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1ink); }
ol.steps li.cur.ph-foer .st-k { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2ink); }
ol.steps li.cur.ph-nach .st-k { background: var(--ph3bg); color: var(--ph3ink); border-color: var(--ph3ink); }
ol.steps li.cur.ph-fertig .st-k { background: var(--ph4bg); color: var(--ph4ink); border-color: var(--ph4ink); }
section.card { scroll-margin-top: 76px; }
.sec-head { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 17px; margin: 0; }
/* Abschnitt ein- und ausklappen: Pfeil vor der Überschrift */
.sec-zu { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.sec-zu .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.sec-zu.zu .chev { transform: rotate(-90deg); }
.sec-zu:hover .chev { color: var(--ink); }
.card.zu .sec-head { margin-bottom: 0; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 300px; }
.grid { display: grid; gap: 12px 16px; }
.g12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: 1 / -1; }
/* Schreiblinien oben auf der Bedarfsseite: nur ein Strich, solange leer steht der Name des Feldes darin */
.grid.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid.frei { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px 30px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > .lab { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
/* Beschreibung und Ordner nebeneinander, beide so hoch wie das höhere von beiden */
.o-row { display: grid; gap: 3px; }
.o-lab { font-size: 12px; color: var(--muted); }
button.info { width: 17px; height: 17px; padding: 0; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); color: var(--muted);
  font: italic 700 11px/1 Georgia, "Times New Roman", serif; justify-content: center; flex: none; text-transform: none; letter-spacing: 0; }
button.info:hover:not(:disabled) { color: var(--ink); border-color: var(--faint); }
.info-pop { max-width: 380px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: var(--ink2); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; width: auto !important; }
.unit { color: var(--muted); }
#zust-chips { display: contents; }
button.x { border: 0; background: none; color: var(--faint); padding: 1px 6px; font-size: 17px; line-height: 1; }
button.x:hover:not(:disabled) { color: var(--red-d); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--card); align-self: flex-start; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line2); padding: 4px 9px; background: transparent; color: var(--ink2); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(.on) { background: var(--hover); }
.seg button.on { background: var(--ink2); color: var(--card); font-weight: 600; }
.seg button.on.t-ok { background: var(--okbg); color: var(--okink); box-shadow: inset 0 0 0 1px var(--okline); }
.seg button.on.t-run { background: var(--runbg); color: var(--runink); box-shadow: inset 0 0 0 1px var(--runline); }
.seg button.on.t-warn { background: var(--warnbg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warnline); }
.seg button.on.t-err { background: var(--errbg); color: var(--errink); box-shadow: inset 0 0 0 1px var(--errline); }
.seg.small button { padding: 3px 8px; font-size: 12.5px; }
.seg button.on.t-e5 { background: var(--e5); color: var(--e5ink); } .seg button.on.t-e4 { background: var(--e4); color: var(--e4ink); }
.seg button.on.t-e3 { background: var(--e3); color: var(--e3ink); } .seg button.on.t-e2 { background: var(--e2); color: var(--e2ink); }
.seg button.on.t-e1 { background: var(--e1); color: var(--e1ink); }
.seg.einsch button.on { box-shadow: inset 0 0 0 1px currentColor; }


.kv { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
.kv > .k { font-size: 12px; font-weight: 600; color: var(--ink2); min-width: 92px; }
.det { border-top: 1px solid var(--line3); padding-top: 4px; }
.det-k h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.det-k { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
dl.dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 12px; margin: 0 0 10px; }
dl.dl dt { color: var(--muted); font-size: 12.5px; }
dl.dl dd { margin: 0; color: var(--ink2); }
table.kt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.kt th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0; }
table.kt td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line3); vertical-align: top; color: var(--ink2); }
table.kt td.sel { user-select: all; word-break: break-all; }
.own-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.own-grid .wide { grid-column: 1 / -1; }
.geld { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.geld.ok { color: var(--okink); font-weight: 600; font-size: 13px; }
.geld.form { padding: 8px 10px; border: 1px solid var(--line2); border-radius: 6px; background: var(--soft); align-items: flex-end; }
.geld.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; }
.gap { color: var(--red-d); } .over { color: var(--warn); } .okc { color: var(--okink); }

.na-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; margin-bottom: 10px; background: var(--soft); }
.na-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-weight: 600; }
.na-title { font-weight: 600; }
.nl { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; min-height: 32px; }
.nl > label.check:first-child { min-width: 190px; }
.nl.open > label.check:first-child { font-weight: 600; }
.mit { display: grid; gap: 4px; }
label.inl { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink2); }

/* ---------- Bedarfsseite: Phase und Stand hängen unter der Kopfzeile; darunter Name und Gliederung zum Anklicken, rechts die Summe; ganz rechts „⋯“ (auch Löschen) */
.subbar { flex-basis: 100%; display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; min-height: 49px; border-top: 1px solid var(--line3);
  padding: 7px max(0px, (100% - 1648px) / 2) 8px; }   /* bündig mit dem Kasten darunter (main: höchstens 1680 px, 16 px Rand) */   /* Liste und Bedarf gleich hoch: beim Hineinschieben springt nichts */
.subbar .back { padding: 3px 9px; font-size: 13px; }
.d-head { grid-area: head; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: start; }
/* Kopf: Deadline unter dem Namen (Klick: Kalender), Stichworte rechts neben dem Namen mit kleinem + */
.d-dl { border: 0; background: none; padding: 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
.d-dl b { color: var(--ink2); font-weight: 600; }
.d-dl.leer b { color: var(--faint); font-weight: 400; }
.d-dl:hover b { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
/* Stichworte unten bündig mit dem Ende des senkrechten Strichs vor der Summe; das + grau */
.d-sw { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; align-content: flex-end; gap: 5px; max-width: 320px; align-self: center; min-height: var(--sum-h, 54px); }
.sw-plus { width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1.5px solid var(--line2); color: var(--faint); background: transparent; font-size: 16px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.sw-plus:hover { border-color: var(--muted); color: var(--ink2); background: var(--hover); }
.sw-pop { padding: 8px 10px; min-width: 260px; display: grid; gap: 6px; }
.sw-pop .sw-in { border-bottom: 1px solid var(--focus); width: 100%; }
.d-name { min-width: 0; display: grid; gap: 2px; }
.inline { border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; padding: 2px 2px; color: inherit; }
.inline:hover { border-bottom-color: var(--line2); }
.inline:focus { outline: none; border-bottom: 1px solid var(--focus); background: var(--input); }
.inline::placeholder { color: var(--faint); font-weight: 400; }
textarea.inline { resize: none; min-height: 0; field-sizing: content; overflow: hidden; }
textarea.title { font-size: 30px; font-weight: 700; line-height: 1.2; width: 100%; padding: 2px 2px 4px; text-wrap: balance; }
.d-sub { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; color: var(--muted); }
input.inline.gl { width: auto; min-width: 4ch; max-width: 100%; field-sizing: content; font-size: 14px; color: var(--ink2); }
.d-right-head { border-left: 1px solid var(--line2); padding-left: 18px; display: flex; gap: 14px; align-items: center; align-self: center; }
.sum-line { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; }
input.inline.sum { width: 210px; font-size: 34px; font-weight: 700; text-align: right; padding: 0 2px 2px; }
.sum-line .unit { font-size: 24px; font-weight: 600; }
.d-actions { grid-area: act; display: flex; gap: 6px; align-items: center; justify-self: end; align-self: center; }
.icon-btn { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 7px; font-weight: 700; color: var(--ink2); background: var(--head); border-color: var(--line2); }
.menu > button.gefahr { color: var(--red-d); align-items: center; }
.menu > button.gefahr svg { flex: none; }
.d-flag { padding: 8px 12px; border-radius: 8px; background: var(--ph4bg); color: var(--ph4ink); font-size: 13px; margin-bottom: 12px; }
/* Bedarf oben: links die Zuständigen (wie die Kontakte im Förderer-Fenster), darunter Deadline und Stichwort; rechts, durch eine Linie getrennt, die Beschreibung */
.eck { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.eck-r { border-left: 1px solid var(--line3); padding-left: 28px; }
.eck .sub { margin-bottom: 6px; }
/* Zuständige: je Zeile zwei, E-Mail und Telefon stehen nur als Hinweis an den Knöpfen */
#zust-liste { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; align-items: stretch; }
#zust-liste > .kadd { grid-column: 1 / -1; }
#zust-liste .k1 { margin: 0; background: var(--hover); }                         /* jede Person als graue Karte */
#zust-liste .k1:hover { background: var(--line3); }
.k-cop { margin-left: auto; border: 1px solid var(--line2); background: var(--card); padding: 2px 9px; font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink2); border-radius: 6px; }
.k-cop:hover { color: var(--ink); border-color: var(--faint); }
.k-cop + .k-pen { margin-left: 4px; }
/* Stichworte als Marken, dahinter das Feld für das nächste */
.sw-box { padding: 5px 0; }
.sw-l { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding-left: 12px; }
.pchip { display: inline-flex; align-items: center; gap: 2px; background: var(--chipbg); border-radius: 12px; padding: 1px 2px 1px 9px; font-size: 13px; }
.pchip .x { width: 20px; height: 20px; font-size: 14px; }
.sw-in { flex: 1 1 140px; min-width: 120px; border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; padding: 2px 0; font-size: 13.5px; }
.sw-in::placeholder { color: var(--faint); font-style: italic; }
.sw-in:hover { border-bottom-color: var(--line2); }
.sw-in:focus { outline: none; border-bottom-color: var(--focus); }
/* Beschreibung: die ganze rechte Fläche ist anklickbar, das Feld nimmt sie beim Schreiben ein */
.eck-r { display: flex; flex-direction: column; }
.eck-r > .pe { flex: 1 1 auto; margin-bottom: 0; }
.eck-r textarea.pe-in, .eck-r .pe-rich { max-height: none; }
/* Schreibfeld mit sichtbarer Formatierung */
.pe-rich { min-height: 2.3em; max-height: 18em; overflow-y: auto; padding: 5px 8px; border: 1px solid var(--focus); border-radius: 6px; background: var(--input); color: var(--ink); line-height: 1.45; white-space: normal; overflow-wrap: anywhere; cursor: text; }
.pe-rich:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.pe-rich ul, .pe-rich ol { margin: 2px 0; padding-left: 22px; }
.pe-rich u { text-underline-offset: 2px; }
.fmt-bar button.on { background: var(--chipbg); }
.rech-btns { display: inline-flex; gap: 6px; flex-wrap: wrap; }
textarea.rech-prompt.kurz { height: 150px; }
.warn-t { color: var(--red-d); margin-top: 3px; }
.pe .lab .info, .sw-box .lab .info, .sub .info { margin-left: 4px; text-transform: none; letter-spacing: 0; vertical-align: 1px; }
/* oben Kopf (Name, Summe) und rechts daneben ⋯ und Löschen; darunter links die Abschnitte, rechts Freigaben und Unterlagen – oben bündig mit dem ersten Abschnitt */
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 26%, 400px); grid-template-areas: "head act" "main side"; gap: 16px; align-items: start; }
.d-left { grid-area: main; min-width: 0; }
.d-right { grid-area: side; min-width: 0; }

/* ---------- Rechts: Freigaben, Unterlagen, Ordner mit Kreisen */
.side h3 { display: flex; align-items: center; gap: 6px; margin: 16px 0 8px; }
.side h3:first-child, .fr-blk h3 { margin-top: 0; }
.fr-blk.ok { background: var(--e5); border: 1px solid var(--okline); border-radius: 8px; padding: 10px 10px 6px; margin-bottom: 4px; }
.fr-ok { color: var(--e5ink); font-weight: 600; text-transform: none; letter-spacing: 0; }
.ci-list { display: grid; gap: 2px; }
.ci-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 32px; }
.ci-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.ci-n { font-weight: 600; color: var(--ink); }
.fr-fach { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.fr-fach .fr-name { flex: 1 1 auto; min-width: 0; font-weight: 600; }
/* Formatierungsleiste über markiertem Text */
.fmt-bar { position: fixed; z-index: 92; display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.16); }
.fmt-bar button { width: 30px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--ink); font-size: 14px; font-family: Georgia, 'Times New Roman', serif; display: grid; place-items: center; }
.fmt-bar button:hover { background: var(--hover); }
.pe .pv.fmt u { text-underline-offset: 2px; }
.ci-hint { font-size: 11.5px; color: var(--muted); }
.ci-t input.inline { font-weight: 600; width: 100%; padding: 1px 0; }
.ci-row.add input.inline { font-weight: 400; }
input.inline.date { width: 128px; font-size: 12.5px; color: var(--muted); padding: 1px 2px; }
input.dfeld:not(.inline) { width: 120px; cursor: pointer; } input.zfeld { width: 76px; cursor: pointer; }
.nl input.dfeld { padding: 3px 7px; }
.circ { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; padding: 0; justify-content: center; font-size: 13px; font-weight: 700; line-height: 1; border: 1.5px solid var(--line2); background: var(--card); color: var(--faint); flex: none; }

.circ.c-run { background: var(--ph1bg); border-color: #d9b740; color: var(--ph1ink); }
.circ.c-no { background: var(--e1); border-color: var(--prio-h); color: var(--e1ink); }
.circ.c-off { border-style: dashed; }
.circ.c-na { border-style: dashed; opacity: .6; display: inline-flex; align-items: center; justify-content: center; }
.circ.c-add { border-style: dashed; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 400; }

.circ-pop .circ { pointer-events: none; }
.side .o-row { display: grid; gap: 3px; margin-bottom: 8px; }
.side .o-lab { font-size: 12px; color: var(--muted); }

/* ---------- Förderplan: oben die Übersicht (Balken und Tabelle), darunter je Förderer eine eigene Karte */
.fp-head .sec-head { align-items: center; }
.sec-tools { display: flex; gap: 6px; margin-left: auto; }
.sec-tools .icon-btn { width: 30px; height: 30px; }
.fin-wrap { display: flex; gap: 16px 24px; align-items: center; flex-wrap: wrap; }
.fin-wrap table.fsum { flex: 1 1 380px; width: auto; max-width: 580px; }
.fin-pie { flex: 1 1 380px; min-width: 300px; max-width: 560px; margin-left: auto; }
.fin-pie svg.pie { display: block; width: 100%; height: auto; overflow: visible; }
.fin-pie .pl { pointer-events: none; }
.pl-l { fill: none; stroke: var(--line2); stroke-width: 1; }
.pl-n { fill: var(--muted); font-size: 13px; font-weight: 600; }
.pl-v { fill: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.ps[data-act] { cursor: pointer; }
.ps.ab { fill: var(--errbg); }   /* gerade auf „abgelehnt“ geklickt – verschwindet, wenn die Maus den Kreis verlässt */
.pie { width: 100%; height: 100%; display: block; }
.ps { stroke: var(--card); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.ps.zu { fill: var(--f-zu); } .ps.eig { fill: var(--f-eig); } .ps.be { fill: var(--f-be); } .ps.ge { fill: var(--f-ge); } .ps.off { fill: url(#pie-off); }
.ps:hover { opacity: .85; }
table.fsum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.fsum th { text-align: left; font-weight: 600; padding: 6px 12px 6px 0; }
table.fsum td { padding: 6px 0 6px 18px; white-space: nowrap; width: 1%; }
table.fsum tr { border-bottom: 1px solid var(--line3); }
table.fsum tbody:last-child tr { border-bottom: 0; }
table.fsum tbody + tbody tr { border-top: 1px solid var(--line); }
.r-st { font-weight: 400; font-size: 12px; margin-left: 4px; }
tr.r-sum th, tr.r-sum td { font-weight: 700; color: var(--ink); }
tr.r-zu th, tr.r-zu td { color: var(--e5ink); }
tr.r-be th, tr.r-be td { color: var(--ph1ink); }
tr.r-ge th, tr.r-ge td { color: var(--muted); }
tr.r-ab th, tr.r-ab td { color: var(--e1ink); }
tr.r-ab td { text-decoration: line-through; }
tr.r-eig th, tr.r-delta th, tr.r-delta td { color: var(--ink); }
