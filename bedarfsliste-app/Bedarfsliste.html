tr.r-eig td .row { flex-wrap: nowrap; justify-content: flex-end; gap: 4px; }
input.inline.eig { width: 90px; text-align: right; border-bottom-color: var(--line2); padding: 0 2px; font: inherit; }
.card.fp { display: grid; gap: 12px; }
.fp.st-abgelehnt input.fp-h, .fp.st-abgelehnt input.amt { text-decoration: line-through; color: var(--muted); }
.fp-top { display: flex; gap: 12px 24px; align-items: flex-start; }
.fp-name { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.fp-title { display: flex; align-items: center; gap: 2px; min-width: 0; }
input.inline.fp-h { font-size: 20px; font-weight: 700; width: auto; min-width: 6ch; max-width: 100%; field-sizing: content; padding: 1px 2px; }
button.pen, button.rm { border: 0; background: none; padding: 4px; color: var(--faint); }
button.pen:hover:not(:disabled) { color: var(--ink); }
button.rm:hover:not(:disabled) { color: var(--red-d); }
.foe-warn { font-size: 12.5px; color: var(--warn); display: grid; gap: 2px; margin-top: 2px; }
.fp-fig { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.dots-box { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.dots { display: flex; align-items: center; gap: 3px; }
.dot { width: 9px; height: 9px; border-radius: 50%; padding: 0; border: 1.5px solid var(--line2); background: transparent; }
.dot:hover:not(:disabled) { border-color: var(--faint); }
.dots.lv1 .dot.on { background: #d9534f; border-color: #d9534f; }
.dots.lv2 .dot.on { background: #ee8a3c; border-color: #ee8a3c; }
.dots.lv3 .dot.on { background: #e8c547; border-color: #e8c547; }
.dots.lv4 .dot.on { background: #9ccc65; border-color: #9ccc65; }
.dots.lv5 .dot.on { background: #43a047; border-color: #43a047; }
.dots-t { font-size: 11.5px; color: var(--muted); text-align: right; }
.fp-grid { display: grid; grid-template-columns: auto auto; gap: 2px 16px; align-items: center; }
.amt-lab { font-size: 12px; color: var(--muted); justify-self: end; white-space: nowrap; }
.amt-big { display: flex; align-items: baseline; gap: 5px; justify-self: end; }
input.inline.amt { width: 170px; font-size: 24px; font-weight: 700; text-align: right; padding: 0 2px; }
.amt-big .unit { font-size: 17px; font-weight: 600; }
.share-t { font-size: 12px; color: var(--muted); justify-self: end; align-self: start; white-space: nowrap; }
.fp-dates { display: grid; gap: 6px; align-self: start; font-size: 12px; color: var(--muted); }
.fp-d { display: grid; }
.fp-d input.inline.date { width: 130px; font-size: 13px; color: var(--ink2); padding: 0 2px; }
.st-btn { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--line2); background: var(--chipbg); color: var(--ink2); justify-self: start; }
.st-btn.s-vorb { background: var(--ph2bg); color: var(--ph2ink); border-color: var(--ph2line); }
.st-btn.s-beantragt { background: var(--ph1bg); color: var(--ph1ink); border-color: var(--ph1line); }
.st-btn.s-zugesagt { background: var(--e5); color: var(--e5ink); border-color: var(--okline); }
.st-btn.s-abgelehnt { background: var(--e1); color: var(--e1ink); border-color: var(--errline); }
span.st-btn { display: inline-block; }
.pc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.pro, .contra { display: grid; gap: 3px; align-content: start; }
.pc-lab { font-size: 12.5px; font-weight: 700; }
.pro .pc-lab { color: var(--e5ink); } .contra .pc-lab { color: var(--e1ink); }
.pc textarea { min-height: 2.6em; }
.fp-empty { margin-bottom: 16px; }
.foe-add { display: flex; gap: 12px; align-items: center; margin: 0 0 16px; flex-wrap: wrap; }
/* Förderer als kompakte Kacheln: zwei nebeneinander; aufgeklappte Details nehmen die ganze Breite */
.fk-head { display: flex; align-items: center; gap: 10px; margin: 4px 2px 10px; }
.fk-head h2 { margin: 0; font-size: 17px; }
.fk-head button { margin-left: auto; }
.fk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; align-items: start; }
.card.fp.fk { margin: 0; padding: 12px 14px 8px; gap: 7px; grid-template-columns: minmax(0, 1fr); }
/* nichts in der Kachel darf sie breiter machen (lange Kontaktzeile, lange Texte) – sonst schieben sich die Kacheln übereinander */
.fk > * { min-width: 0; }
.fk .det { overflow: hidden; }
.fk-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.fk-kopf { display: grid; gap: 0; min-width: 0; }
.fk input.inline.fp-h { font-size: 21px; font-weight: 700; line-height: 1.25; padding: 0 1px; }
.fk .fp-title { gap: 4px; }
.fw-tri { border: 0; background: none; padding: 2px; color: var(--red-d); display: inline-grid; place-items: center; cursor: help; }
.fw-tri .tri { width: 14px; height: 14px; color: var(--red-d); }
.fw-tri.grau .tri { color: var(--faint); }   /* nur zur Kenntnis (derselbe Förderer bei anderen Bedarfen) */
.fw-pop { font-size: 12.5px; color: var(--ink2); display: grid; gap: 6px; max-width: 360px; }
.fk-neu { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 120px; align-self: stretch; border: 1.5px dashed var(--line2); border-radius: var(--radius);
  background: var(--soft); color: var(--muted); font-size: 14px; font-weight: 600; }
.fk-neu:hover:not(:disabled) { background: var(--head); color: var(--ink); border-color: var(--faint); }
.fk-plus { font-size: 34px; font-weight: 300; line-height: 1; }
.fk .dots-box { padding-top: 3px; }
.fk-amt { display: flex; align-items: baseline; gap: 5px; }
.fk input.inline.amt { width: auto; min-width: 3ch; field-sizing: content; text-align: left; font-size: 21px; line-height: 1.25; padding: 0 1px; }
.fk-amt .unit { font-size: 16px; font-weight: 600; }

.fk-st { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.fk .st-btn { justify-self: auto; }
.fk .fp-dates { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--muted); }
.fk .fp-d { display: inline-flex; align-items: center; gap: 5px; }
.fk .fp-d input.inline.dfeld { width: 84px; color: var(--ink2); cursor: pointer; }
.fk .pc { grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 6px; }
.fk .pro, .fk .contra { display: flex; align-items: flex-start; gap: 8px; }
.fk .pc i { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 8px; }
.fk .pro i { background: #43a047; } .fk .contra i { background: #d9534f; }
/* Pro und Contra: formatierter Text, drei Zeilen Vorschau; Klick öffnet das Schreibfeld */
.fk .pc .pe-pc { flex: 1 1 auto; min-width: 0; margin: 0; padding: 1px 22px 1px 0; }
.fk .pc .pe-pc .val { max-height: 4.35em; overflow: hidden; font-size: 13px; line-height: 1.45; color: var(--ink2); }
.fk .pc .pe-pc.edit .val { max-height: none; }
.fk .pc .pe-pc .val.leer { color: var(--faint); font-style: normal; }
.fk .pc .pe-pc > svg { top: 4px; right: 2px; }
.pe-ue { margin-top: 8px; }
.fk .pc textarea { border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; padding: 1px 0; min-height: 0; resize: none; field-sizing: content;
  font-size: 13px; line-height: 1.45; color: var(--ink2); max-height: 4.35em; overflow: hidden; }   /* Vorschau: drei Zeilen */
.fk .pc textarea:hover { border-bottom-color: var(--line2); }
.fk .pc textarea:focus { outline: none; border-bottom-color: var(--focus); max-height: none; background: var(--input); }
.fk .det { border-top: 1px solid var(--line3); padding-top: 2px; margin-top: 2px; }
/* Kontakt und Details als Fenster (Steckbrief): oben Kontakte | Bedingungen, unten Quellen | Notizen. So hoch wie nötig, höchstens so hoch,
   dass drei Kontakte passen; was darüber hinausgeht, scrollt im jeweiligen Bereich */
.pop-back { position: fixed; inset: 0; z-index: 80; background: var(--backdrop); }
.foe-pop { position: fixed; z-index: 81; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(920px, calc(100vw - 32px)); max-height: min(780px, calc(100vh - 32px));
  display: flex; flex-direction: column; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.foe-pop > header { flex: none; display: flex; align-items: center; gap: 14px; padding: 14px 22px 12px; border-bottom: 1px solid var(--line3); }
.foe-pop > header h3 { margin: 0; font-size: 19px; flex: 0 1 auto; min-width: 0; text-transform: none; letter-spacing: 0; color: var(--ink); }
.foe-pop .pe-amt { margin: 0; padding: 2px 24px 2px 8px; font-size: 19px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.foe-pop .pe-amt > svg { top: 9px; }
.foe-pop .pe-amt .val.leer { font-size: 15px; font-weight: 400; }
.foe-pop .pe-amt .pe-in { width: 130px; font-size: 17px; }
.foe-pop .pop-einsch { margin-left: auto; }
.foe-pop > header .x { font-size: 22px; }
.pop-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: fit-content(430px) fit-content(240px); gap: 16px 28px; font-size: 13.5px; line-height: 1.45; color: var(--ink2); }
.pop-body > div { min-height: 0; max-height: 100%; align-self: start; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; }
.pA-bed, .pA-q, .pA-n { padding: 0 8px; margin: 0 -8px; }      /* Platz für die Hervorhebung beim Überfahren – ohne waagrechten Scrollbalken */
.pA-box { background: var(--soft); border: 1px solid var(--line3); border-radius: 8px; padding: 12px 16px 8px; }
.pA-bed { padding-right: 6px; }
.pop-body .sub, .eck .sub { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; }
.k-pen { margin-left: auto; border: 0; background: none; padding: 2px 4px; color: var(--muted); }
.k-pen:hover { color: var(--ink); }
.pA-bed .det-k { margin-bottom: 10px; }
.k1 { position: relative; padding: 6px 70px 6px 24px; margin: 0 -8px 4px; border-radius: 7px; }
.k1:hover { background: var(--hover); }
.k1 .star { position: absolute; left: 6px; top: 6px; font-size: 14px; line-height: 1.45; color: #d29a17; border: 0; background: none; padding: 0; }
.k1 .star.off { color: var(--line2); cursor: pointer; }
.k1 .star.off:hover { color: #d29a17; }
.k1 .kn { font-weight: 600; color: var(--ink); }
.k1 .kr { color: var(--muted); font-size: 12.5px; }
.k1 .kl { font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; display: grid; gap: 1px; }
.k1 .kl a { color: var(--focus); text-decoration: none; }
.k1 .kl a:hover { text-decoration: underline; }
.k1 .acts { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; }
.kb { display: grid; place-items: center; width: 28px; height: 26px; border: 1px solid var(--line2); border-radius: 6px; background: var(--card); font-size: 13px; color: var(--ink2); text-decoration: none; }
.kb:hover { border-color: var(--faint); }
.kadd { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0 2px; color: var(--muted); font-size: 13px; }
.kadd i { display: grid; place-items: center; width: 20px; height: 20px; border: 1.5px dashed var(--line2); border-radius: 50%; font-style: normal; }
.kadd:hover { color: var(--ink); }
.ksep { border-top: 1px solid var(--line3); margin: 10px 0 8px; }
.k-ed { position: relative; display: grid; gap: 2px; padding-right: 26px; margin-bottom: 14px; }
.k-ed .x { position: absolute; right: 0; top: 2px; }
/* Kontakt bearbeiten: schlichte Linien, der Hinweis blass grau */
.k-li { border: 0; border-bottom: 1px solid var(--line2); border-radius: 0; background: transparent; padding: 3px 0; width: 100%; font-size: 13.5px; color: var(--ink2); }
.k-li::placeholder { color: var(--faint); }
.k-li:focus { outline: none; border-bottom-color: var(--focus); }
.k-li-n { font-weight: 600; color: var(--ink); }
.k-fertig { margin-left: auto; border: 1px solid var(--line2); background: var(--card); padding: 2px 10px; font-size: 12.5px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); border-radius: 6px; }
.pe .pv.fmt { white-space: normal; }
.pe .pv.fmt ul, .pe .pv.fmt ol { margin: 2px 0; padding-left: 20px; }
.pe .pv.fmt a { color: var(--focus); }
.fmt-tab code { background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.fmt-tab ul, .fmt-tab ol { margin: 0; padding-left: 18px; }
.fmt-tab td .small { display: block; margin-top: 2px; }
/* Fuß der Förderer-Kachel: Ansprechperson mit Symbolen, rechts „Weitere Infos →“ */
.fk-fuss { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 13px; }
.fk-fuss .ff-n { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fk-fuss a.ff-n { color: var(--focus); text-decoration: none; }
.fk-fuss .ff-n.leer { color: var(--faint); }
.fk-fuss .fi { flex: none; display: grid; place-items: center; width: 26px; height: 24px; border: 1px solid var(--line2); border-radius: 6px; color: var(--ink2); text-decoration: none; font-size: 12.5px; background: var(--card); }
.fk-fuss .fi:hover { border-color: var(--faint); color: var(--ink); }
.ff-mehr { margin-left: auto; flex: none; border: 0; background: none; padding: 4px 0; font-weight: 700; font-size: 13px; color: var(--ink); }
.ff-mehr:hover { color: var(--focus); }
.tip-pop { position: fixed; z-index: 95; pointer-events: none; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 6px 18px rgba(0,0,0,.14); padding: 5px 9px; font-size: 12.5px; white-space: nowrap; }
/* Rückgängig in der Kopfzeile */
.undo-btn { font-size: 13px; color: var(--ink2); }
.pe { position: relative; padding: 5px 26px 5px 8px; margin: 0 -8px 4px; border-radius: 6px; cursor: text; }
.pe:hover { background: var(--hover); }
.pe > svg { position: absolute; right: 7px; top: 8px; color: var(--faint); visibility: hidden; }
.pe:hover > svg { visibility: visible; }
.pe.edit { background: none; }
.pe.edit > svg { visibility: hidden; }
.pe .lab, .sw-box .lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.pe .lab + .val { padding-left: 12px; }                  /* Text unter der Überschrift etwas eingerückt */
.pe .val { white-space: pre-wrap; overflow-wrap: anywhere; display: flex; align-items: flex-start; gap: 8px; }
.pe .val .pv { flex: 1 1 auto; min-width: 0; }
.pe .val.leer { color: var(--faint); font-style: italic; }
.pe .fx { flex: none; width: 28px; height: 26px; padding: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink2); margin-top: -3px; }
.pe-in { width: 100%; font: inherit; line-height: 1.45; }
textarea.pe-in { field-sizing: content; min-height: 2.3em; max-height: 18em; resize: vertical; }
.pe-q .ql { display: grid; gap: 4px; white-space: normal; }
.pe-q .ql a { color: var(--focus); word-break: break-all; }
table.kt td a { color: var(--focus); word-break: break-all; }
.fk .geld-link { font-size: 12.5px; color: var(--ink); margin-left: auto; }
.fk .geld.ok { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--okink); }
.fk .geld.ok svg { width: 14px; height: 14px; }
.fk .geld.ok .pen { padding: 2px; }
.det-more { display: grid; gap: 8px; margin-top: 10px; }

@media (max-width: 1100px) {
  .g12 .s6, .g12 .s8 { grid-column: span 12; }
  .g12 .s3, .g12 .s4, .g12 .s5 { grid-column: span 6; }
  .g12 .s2 { grid-column: span 6; }
  .grid.two { grid-template-columns: minmax(0, 1fr); }
  .pop-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; overflow: auto; }
  .pop-body > div { overflow: visible; }
  .d-grid { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head act" "main main" "side side"; }
}
@media (max-width: 760px) {
  .eck { grid-template-columns: minmax(0, 1fr); }
  .eck-r { border-left: 0; padding-left: 0; border-top: 1px solid var(--line3); margin-top: 10px; padding-top: 10px; }
}
@media (max-width: 520px) { #zust-liste { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .g12 .s2, .g12 .s3, .g12 .s4, .g12 .s5 { grid-column: span 12; }
  .grid2, .own-grid, .pc, .fk-grid { grid-template-columns: minmax(0, 1fr); }
  .fin-wrap table.fsum { flex-basis: 100%; }
  .fin-wrap { justify-content: center; }
  .d-head { grid-template-columns: auto minmax(0, 1fr) auto; }
  .d-right-head { grid-column: 1 / -1; border-left: 0; padding-left: 0; justify-content: start; }
  .d-actions { align-self: start; margin-top: 8px; }
  .fp-top { flex-direction: column; }
  .fp-fig { align-items: stretch; width: 100%; }
  .fp-grid { grid-template-columns: minmax(0, 1fr) auto; }
  dl.dl { grid-template-columns: minmax(0, 1fr); }
  table.fsum { font-size: 13px; }
  table.fsum td { padding-left: 8px; }
  .r-st { display: block; margin-left: 0; }
  .fp-grid { justify-content: end; }
  input.inline.fp-h { font-size: 17px; }
  textarea.title { font-size: 22px; }
  header.top { position: static; }
  .tools { margin-left: 0; }
  .tools input[type=search], .tools select { width: 100%; max-width: none; }
  .actions { margin-left: 0; }
  .save { min-width: 0; }
}

/* ---------- Copilot und Cowork: Zeichen neben „⋯“ (Punkt = Ergebnis liegt vor), Kacheln mit den Aufgaben, Übernahme knapp */
.icon-btn.ki-btn { position: relative; }
.icon-btn.ki-btn svg { display: block; }
.icon-btn.ki-btn.neu::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--card); }
.modal footer:empty { display: none; }
.modal.wide:has(.ki) { max-width: 720px; }
.ki { display: grid; gap: 12px; }
.ki-kacheln { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
/* nicht gewählt: dezent grau; gewählt: kräftig schwarz (kein Rot – das wirkt wie ein Fehler) */
.ki-k { display: grid; gap: 6px; text-align: left; padding: 12px 14px; min-height: 84px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); font: inherit; cursor: pointer; }
.ki-k:hover:not(:disabled) { border-color: var(--line2); background: var(--hover); color: var(--ink2); }
.ki-k.on { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ki-k.aus { opacity: .55; cursor: default; }
.ki-k-top { display: flex; align-items: center; gap: 8px; }
.ki-k-top b { font-size: 14.5px; }
.ki-ico { display: grid; color: var(--faint); } .ki-k.on .ki-ico { color: var(--ink); }
.ki-k b, .ki-k small { white-space: normal; overflow-wrap: anywhere; }
.ki-k small { color: var(--faint); font-size: 12.5px; line-height: 1.3; } .ki-k.on small { color: var(--ink2); }
.ki-wer { margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
.ki-wer.cowork { background: var(--ph3bg); color: var(--ph3ink); }
.ki-wer.copilot { background: var(--runbg); color: var(--runink); }
.ki-foe { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.ki-foe-h { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; }
.ki-foe-alle { margin-left: auto; color: var(--faint); }
.ki-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ki-chip { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid var(--line2); border-radius: 15px; padding: 4px 11px; background: var(--card); color: var(--ink2); font: inherit; font-size: 13px; cursor: pointer; }
.ki-chip small { color: var(--faint); font-size: 11.5px; }
.ki-chip.on { background: var(--ink); border-color: var(--ink); color: var(--card); } .ki-chip.on small { color: var(--line2); }
.ki-chip.neu { border-style: dashed; } .ki-chip.neu.on { border-style: solid; }
.ki-spaeter { background: var(--line3); border: 1px dashed var(--line2); border-radius: 10px; padding: 9px 12px; color: var(--faint); font-size: 13px; }
.ki-sp-lab { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--line); color: var(--muted); border-radius: 6px; padding: 2px 8px; margin-bottom: 5px; }
.ki-spaeter ul { margin: 0; padding-left: 18px; columns: 2; }
.ki-prompt textarea.rech-prompt { margin-top: 4px; height: 190px; }
.ki-fuss { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.ki-fuss .ki-sp { flex: 1; }
.ki-antwort { display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ki-antwort textarea { width: 100%; margin-top: 4px; font-size: 12.5px; resize: vertical; }
.ki-fuss-r { display: flex; justify-content: flex-end; margin-top: 4px; }
.ki-ok { background: var(--okbg); border: 1px solid var(--okline); color: var(--okink); border-radius: 8px; padding: 10px 12px; }
.ki-zweit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.imp-box { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.imp-kopf { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.imp-kopf > b { flex: 1; }
.imp-neu, .imp-alt { padding: 0 12px 12px; font-size: 13.5px; line-height: 1.5; }
.imp-alt { color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.imp-lab { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 3px; }
.imp-grund { padding: 0 12px 10px; }
label.imp-f { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
.imp-n { flex: 1; font-weight: 600; }
.imp-pill { font-size: 11px; padding: 1px 8px; border-radius: 9px; background: var(--runbg); color: var(--runink); white-space: nowrap; }
.imp-pill.neu { background: var(--okbg); color: var(--okink); }
.imp-s { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.imp-teil { margin-bottom: 16px; }
.imp-teil > h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
.imp-ul { display: grid; gap: 4px; font-size: 13.5px; }
.imp-nur { padding-left: 26px; color: var(--ink2); }
@media (max-width: 640px) { .ki-kacheln { grid-template-columns: 1fr; } }
</style>
</head>

const CHANGELOG = [{"version": "0.43.2", "date": "2026-10-27T13:30", "items": ["Ordnersuche: Projekte der Diözese liegen unter „1601_Diözese_Pojekte“ – bei Bedarfen der Diözese wird dort zuerst gesucht, sonst dort, wenn bei den Ortsgliederungen nichts passt"]}, {"version": "0.43.1", "date": "2026-10-27T13:00", "items": ["Copilot und Cowork wissen, wo die Bedarfsordner in der Regel liegen (…\\Ortsgliederungen\\<Gliederung>\\<Bedarf>) und suchen zuerst im Ordner der Gliederung", "Ist kein Pfad eingetragen, sucht Cowork den Ordner selbst; der gefundene Pfad wird mit Vorschau übernommen"]}, {"version": "0.43.0", "date": "2026-10-27T12:00", "items": ["Neue Kachel „Ordner finden“: Copilot sucht den SharePoint-Ordner des Bedarfs, der Link wird mit Vorschau übernommen", "Beschreibung höchstens zwei Absätze, ohne zu wiederholen, was die Liste ohnehin zeigt (Name, Gliederung, Summe, Deadline, Ansprechpersonen)", "Ausführliche Recherche-Dateien ohne eigenen Ordner des Bedarfs: in einem Unterordner je Bedarf unter „Förderrecherche“", "Neue Förderer: nach der eigenen Gliederung das ganze Gebiet des Erzbistums Paderborn (z. B. Dortmund, Hagen, Siegen, Höxter), dann NRW"]}, {"version": "0.42.0", "date": "2026-10-27T10:00", "items": ["Copilot-Auftrag: Copilot ist der Standard (Beschreibung, neue Förderer, Kontaktdaten) – seine Antwort endet mit einem Textblock, der hier eingefügt und mit Vorschau übernommen wird; Cowork nur, wenn eine Förderrecherche dabei ist", "Förderrecherche mit Cowork: je Förderer eine ausführliche Recherche als Word-Datei im Ordner des Bedarfs; in der Liste nur die Essenz (Pro und Contra je höchstens drei kurze Punkte) und der Dateiname; vorhandenes Pro und Contra wird geprüft und gekürzt statt neu geschrieben", "Kontaktdaten der Zuständigen direkt aus der Copilot-Antwort (nur leere Angaben werden ergänzt)", "Gewählte Kacheln und Förderer kräftig schwarz statt rot"]}, {"version": "0.41.0", "date": "2026-10-26T21:00", "items": ["Copilot-Auftrag übersichtlicher: vier Kacheln (Beschreibung, Neue Förderer, Förderrecherche, Kontaktdaten), unten nur Cowork/Copilot, „Prompt ansehen“ und „Auftrag kopieren“", "Förderrecherche: darunter die Förderer zum Anklicken (alle / keine), dazu „die neu gefundenen“", "Texte (Antrag, Freigabe, Nachfassen, Dank, Pressemitteilung, Sachbericht) grau als späteres Update; Unterlagen-Check entfällt", "Prompts überarbeitet: je Aufgabe Ziel, Vorgehen und Ergebnis, Beispiel für konkrete Pro-Punkte, Prüfung vor dem Speichern; die Beschreibung macht die Eckdaten des Projekts erkennbar (etwa 120 bis 220 Wörter)", "Ergebnis übernehmen knapper: neue Beschreibung mit „bisher zeigen“, je Förderer eine Zeile mit „neu“ bzw. was ergänzt wurde"]}, {"version": "0.40.0", "date": "2026-10-26T18:00", "items": ["Copilot-Zeichen oben rechts auf der Seite eines Bedarfs: Aufgaben anhaken, auch mehrere auf einmal – Zuständige aus dem Intranet, Beschreibung aus dem Ordner, Unterlagen-Check, neue Förderer suchen, Förderrecherche je Förderer, Entwürfe (Antrag, Freigabe, Nachfassen, Dank, Pressemitteilung, Sachbericht)", "Eine Arbeits-Excel für alle Aufgaben (mit Blättern „Beschreibung“ und „Unterlagen“, wenn gewählt) und ein Prompt dazu – für Cowork (arbeitet direkt im OneDrive) oder für Copilot; Kontaktdaten der Zuständigen über Copilot und die Personen-Excel", "Ergebnis übernehmen mit Vorschau: Beschreibung bisher und neu nebeneinander, Unterlagen, Förderer; bei bestellter Förderrecherche wird in der Excel Geändertes übernommen", "Roter Punkt am Copilot-Zeichen, sobald die Excel nach dem Auftrag geändert wurde; „Recherche mit Copilot“ im Förderplan öffnet dieselbe Auswahl"]}, {"version": "0.39.1", "date": "2026-10-26T15:00", "items": ["Tastatur: → öffnet den gewählten Bedarf, ← führt von seiner Seite zurück zur Liste", "Sprung aus dem Feld oben: die Stelle leuchtet zusätzlich mit kräftig roter Kontur auf", "Feld oben zeigt nur noch die dringendste Stufe (ohne „+3“); die anderen stehen im Hinweis beim Überfahren"]}, {"version": "0.39.0", "date": "2026-10-26T12:00", "items": ["Seite eines Bedarfs: ↓/↑ öffnen den nächsten bzw. vorigen Bedarf in der Reihenfolge der Liste (er gleitet von unten bzw. oben herein); kompakte Liste: ist ein Bedarf aufgeklappt, klappen ↑/↓ gleich den nächsten auf", "Namen ändern mit E (F2 geht weiter, belegt in Vivaldi aber die Schnellbefehle); Strg+F springt in die Suche statt „/“", "„i“ oben rechts in der Liste: beim Überfahren „Tastaturbefehle“, Klick zeigt sie nach Bereichen geordnet", "Feld oben gestaffelt: rot „jetzt fällig“, gelb „bald fällig“ (14 Tage), grau „Infos“ (Zusage ohne Betrag, Förderer laut Kartei nicht für die Gliederung, Antrag ohne vollständige Freigabe); ein Eintrag springt zur auslösenden Stelle – in der Liste oder auf der Seite des Bedarfs – und lässt sie kurz rot aufleuchten", "Liste: Leiste ohne „Bedarfe“ und ohne Hinweistext; volle Freigabe nur noch als ein Haken „freigegeben“ (Einzelheiten beim Überfahren); Sterne ohne Prio dezenter", "Seite eines Bedarfs: Löschen steckt im „⋯“-Menü; das + der Stichworte ist grau und sitzt unten am Strich vor der Summe; überall der eigene Kalender statt der Datumsfelder des Browsers, die Uhrzeit mit Rädern", "Förderplan und Nacharbeit klappen je nach Phase: vor der Nacharbeit ist der Förderplan offen und die Nacharbeit zu, danach umgekehrt; Dreieck am Förderer grau, wenn er nur auch bei anderen Bedarfen steht", "Datum getippt und mit Tab weiter: der Fokus bleibt im nächsten Feld (auch in den Förderer-Kacheln)"]}, {"version": "0.38.0", "date": "2026-10-25T19:00", "items": ["Schneller bei vielen Bedarfen: je Neuzeichnen nur einmal filtern und sortieren, Sortierwerte je Bedarf nur einmal berechnet; Suche ab 150 Bedarfen nach kurzer Tipp-Pause (bei 300 Bedarfen: Liste ca. 3× schneller)", "Rückgängig merkt sich je Schritt nur die geänderten Bedarfe statt des ganzen Bestands; der Entwurf im Browser wird höchstens alle 1,5 Sekunden geschrieben (sofort beim Schließen und beim Fensterwechsel)", "Tastatur: ↑/↓, Pos1/Ende von Bedarf zu Bedarf; Enter klappt auf bzw. öffnet; F2 ändert den Namen; Leertaste schaltet den Prio-Stern; „/“ springt in die Suche; nach Esc, Enter, Tab und Zurück bleibt der Fokus auf dem Bedarf", "Kalender mit der Tastatur: Pfeiltasten wählen den Tag, Bild auf/ab den Monat, Enter übernimmt, Esc schließt", "Zahnrad → „Tastenkürzel …“ zeigt alle Kürzel", "Kein kleiner waagrechter Scrollbalken mehr unter der Tabelle; beim Neuzeichnen bleibt die Tabelle waagrecht, wo sie war; nach Verkleinern des Fensters keine alte Mindestbreite mehr"]}, {"version": "0.37.0", "date": "2026-10-25T16:00", "items": ["Förderplan aus Copilot: die Spalte „Förderer“ wird auch mit anderer Überschrift oder an anderer Stelle gefunden, ein neues Blatt mit Ergebnissen kommt dazu; das Blatt „Anleitung“ wird nie als Förderplan gelesen", "Summen-, Hinweis- und Standzeilen („Summe“, „Hinweis: …“, „Stand: …“) werden in Förderplan, Kartei und Personen-Excel nicht mehr als Einträge übernommen", "Telefonnummern: die Vorlagen formatieren die Telefonspalten als Text; als Zahl gespeicherte Nummern bekommen ihre führende 0 zurück", "Überschriften-Varianten („Gliederungen“, „Vorname“ + „Name“, „Name, Vorname“) werden erkannt; ohne passende Spalten gibt es eine Meldung statt 0 Einträgen", "Platzhalter von Copilot („nicht gefunden“, „k. A.“, „–“) gelten als leer; E-Mail braucht ein @, Telefon Ziffern", "Personen-Excel ergänzt jeden Zuständigen nur einmal je Fassung der Datei – in der Liste Gelöschtes kommt nicht zurück, erst eine geänderte Excel füllt wieder auf", "Namensabgleich toleranter: „e.V.“ = „e. V.“, Bindestriche, „Dr.“, weiche Trennzeichen und Anführungszeichen machen keine Dubletten mehr", "Förderplan-Übernahme „überschreiben“ übernimmt nur, was in der Excel geändert wurde (ausgeblendetes Blatt „_Stand“); zugesagte und abgelehnte Förderer bleiben unangetastet", "Seltene Excel-Eigenheiten: Zeilenumbruch-Codes (_x000D_), ausgeblendete Blätter, Hyperlinks und HYPERLINK-Formeln, ISO- und 1904-Datum, Dateien aus .NET; beim Schreiben ungültige Zeichen und überlange Zellen; Kartei: Original vor OneDrive-Konfliktkopie"]}, {"version": "0.36.0", "date": "2026-10-25T13:00", "items": ["Fristen gebündelt oben in der Kopfzeile: ein Dreieck mit der Anzahl (gelb: in den nächsten 14 Tagen, rot: überfällig); Klick zeigt die Liste, ein Eintrag öffnet den Bedarf. Verwendungsnachweise zählen auch im Archiv", "Ins Archiv mit offenen Antworten, Geldeingängen, Nachweisen oder Übergabe nur nach Rückfrage", "Kompakt: ist schon eine Zusage da, stehen Finanzierung, Nachweis und Übergabe auch ohne vollständige Freigabe", "Nur Eigenmittel gelten nicht als finanziert („Förderer suchen“, kompakt „nur Eigenmittel“); alle Förderer abgelehnt: kompakt rot „Lücke“", "Zusage ohne Betrag wird gemeldet – sofort, am Förderer und im Stand", "Ohne Summe gilt nichts als fertig, der Stand zeigt „Summe fehlt“", "Steht die Finanzierung, sagen Stand, Kopf und Liste dasselbe („Finanzierung steht – Antrag bei … noch offen“); geplante Förderer sind dann „nicht mehr nötig“ und ohne Prozent", "„Diözese Paderborn“ u. Ä. gilt als Diözese; Angebot kennt „nicht nötig“; Priorität nur noch Prio oder keine; leere „Zugesagte Summe“ zeigt „wie beantragt“", "„Filter löschen“ ist ohne Filter wirklich ausgeblendet"]}, {"version": "0.35.0", "date": "2026-10-25T10:00", "items": ["Cent-Beträge: 1.200,10 + 300,30 deckt 1.500,40 € genau – „Finanzierung steht“ statt „Lücke 0 €“; Beträge mit Cent werden mit Cent angezeigt", "Ein Klick direkt nach dem Bearbeiten wirkt sofort (Liste: Name, dann Ort; Bedarfsseite: Pro, dann ein Knopf) – vorher brauchte es zwei Klicks", "Reihenfolge der Liste passt nach Suche, Stichwort-Filter, „+ Bedarf“ und geladenen Ständen wieder zur Sortierung", "Liste: Links in den Übergabe-Notizen öffnen den Link; markierter Text öffnet nichts mehr; ein bloßer Klick auf einen Spaltenrand legt keine Breiten fest", "Fensterwechsel (Alt+Tab, z. B. um einen Namen aus Outlook zu kopieren) schließt kein offenes Feld und löscht keine neue Zeile", "Lange Namen stehen beim Bearbeiten vollständig und deckend da", "Kreisdiagramm: ab 7 Teilen stehen die Beschriftungen als Liste neben dem Kreis", "„Filter löschen“ erscheint schon beim Tippen in die Suche; beim Wechsel ins Archiv wird der Stichwort-Filter zurückgesetzt; ein weggefilterter aufgeklappter Bedarf klappt zu", "Unvollständige oder seltsame Daten führen nicht mehr zu einer leeren Seite (fehlende Teile werden ergänzt, Zahlen als Text gelesen, unbekannte Stände bereinigt); Uhrzeit der Übergabe nur als HH:MM", "Hinweis am Kreis des Verwendungsnachweises wieder sichtbar"]}, {"version": "0.34.0", "date": "2026-10-24T17:00", "items": ["Speichern: was während des Speicherns getippt wird, gilt nicht mehr fälschlich als gespeichert – es bleibt im Entwurf und wird gleich nachgespeichert. Ist die Datei direkt danach kurz gesperrt (OneDrive), gibt es keinen falschen Konflikt mehr", "Beträge: „1500.00“, „99.9“, „1,500.00“ und „15,000“ werden richtig gelesen (vorher u. a. 150.000 €); „10.000 Euro“ ebenso", "Texte: „31. März: Antragsschluss“ oder „2. Halbjahr“ am Zeilenanfang bleiben Text – eine Nummerierung beginnt nur mit „1.“ und zählt lückenlos", "Stand von außen: leer, älter oder ohne Speicherdatum wird nicht mehr still übernommen, sondern mit Begründung angeboten; bei zwei Ständen wird der nicht gewählte als Sicherung heruntergeladen", "Entwurf aus einer früheren Sitzung bleibt angeboten, bis entschieden ist; ist die Datei inzwischen neuer, fragt „Wiederherstellen“ erst nach", "Update und „Meinen Stand behalten“ überschreiben weder einen Stand vom anderen Rechner noch eine neuere Programmversion im Ordner", "Doppelklick: der zweite Klick löst nach dem Aufklappen oder Öffnen nichts mehr aus", "Förderer-Stand: beim Weiterschalten bleiben keine alten Zusagen, Geldeingänge oder Daten hängen; ist das Geld schon da, schaltet ein Klick in der Liste nicht mehr um", "Kein Neuzeichnen mehr mitten im Tippen (auch in Schreibfeldern mit Formatierung und im Übergabe-Fenster)", "„Rückgängig“ nach Archivieren, Löschen oder Förderer-Entfernen nimmt nur diese Aktion zurück, nicht spätere Änderungen; Warnung, wenn dieselbe Datei in zwei Tabs offen ist"]}, {"version": "0.33.0", "date": "2026-10-24T15:00", "items": ["Aufklappen in der kompakten Ansicht gleitet jetzt sauber: Zeilen nehmen Hintergrund und Trennlinie mit, nichts überlappt mehr; blass wird nur der Inhalt der anderen Zeilen, nicht durchsichtig", "Ausführliche Ansicht und aufgeklappter Bedarf: ein Klick daneben öffnet den Bedarf in jeder Spalte, auch neben Freigabe, Finanzierung, Nachweis und Übergabe", "Spaltenbreiten auch in der kompakten Ansicht ziehen – mit Mindestbreiten, getrennt von „Ausführlich“ gemerkt", "Die Leiste unter der Kopfzeile gleitet beim Öffnen und Zurück mit und steht links und rechts bündig mit dem Kasten darunter, auch auf breiten Bildschirmen"]}, {"version": "0.32.0", "date": "2026-10-24T14:00", "items": ["Ohne Strg: ein Klick genau auf das Wort (Name, Summe, Ort, Ansprechperson, Deadline) ändert es – nur das Wort leuchtet beim Überfahren. Ein Klick daneben klappt in der kompakten Ansicht den Bedarf auf, noch ein Klick neben Name, Summe oder Ort öffnet ihn; in der ausführlichen Ansicht öffnet er ihn gleich", "Aufklappen gleitet: die Zeile zieht sich auf, die Bedarfe darunter rutschen mit, alle anderen werden blass. Ein Klick auf eine blasse Zeile holt diese nach vorn, Esc oder ein Klick außerhalb der Liste klappt zu", "Die Spaltenbreiten bleiben beim Aufklappen stehen; dafür hat die Finanzierung in der kompakten Ansicht von vornherein Platz für die Förderer"]}, {"version": "0.31.0", "date": "2026-10-24T13:00", "items": ["Überschrift, Anzahl, Hinweis, Ausführlich/Kompakt, Suche und Stichwort stehen als Leiste direkt unter der Kopfzeile – genauso hoch wie die Leiste auf der Seite eines Bedarfs. Beim Hineinschieben springt die Seite nicht mehr nach unten; die Tabelle steht als Kasten darunter. Die Leiste bleibt beim Scrollen oben", "Knopf „Sortieren“ entfällt – sortiert wird über die Spaltenköpfe. Eine früher übers Menü gewählte Sortierung nach Deadline, Ansprechperson oder Angelegt fällt dabei weg", "Kompakte Ansicht: solange die Freigabe fehlt, steht bei Finanzierung nur „Freigabe ausstehend“ (abgelehnt: „Freigabe abgelehnt“), Verwendungsnachweis und Spendenübergabe bleiben leer"]}, {"version": "0.30.0", "date": "2026-10-24T12:00", "items": ["Stern im Spaltenkopf schaltet in drei Stufen: 1. Klick – Rand golden, alle Bedarfe bleiben sichtbar, die mit Prio stehen oben; 2. Klick – Stern ausgefüllt, nur noch Bedarfe mit Prio; 3. Klick – wieder normal", "Knopf „nur Prio“ neben der Suche entfällt", "Seite des Bedarfs: statt der drei Balken nur noch der Stern – Klick schaltet Prio an oder aus"]}, {"version": "0.29.0", "date": "2026-10-24T11:20", "items": ["Liste: ganz vorn ein Stern für die Priorität – umrandet heißt keine Prio, ein Klick macht ihn gelb (Prio), noch ein Klick nimmt sie wieder weg. Ersetzt den Zusatz „(Prio)“ hinter dem Namen", "Knopf „nur Prio“ neben der Suche zeigt nur Bedarfe mit gelbem Stern; „Filter löschen“ zeigt wieder alle. Der Stern im Spaltenkopf sortiert nach Priorität", "Prio entspricht der Priorität „hoch“ auf der Seite des Bedarfs; nimmt man den Stern weg, wird sie „mittel“"]}, {"version": "0.28.0", "date": "2026-10-24T10:30", "items": ["Liste sortieren in bis zu drei Stufen: Klick auf einen Spaltenkopf nimmt die Spalte als nächste Stufe dazu (noch ein Klick: andere Richtung, dritter Klick: heraus); der Knopf „Sortieren“ bietet dazu Priorität, Ansprechperson, Deadline und Angelegt. „Zurücksetzen“ stellt die übliche Reihenfolge wieder her; die Wahl bleibt gemerkt", "Strg halten und mit der Maus über einem Bedarf: rechts schiebt sich ein Streifen herein, auf Höhe der Zeile ein Griff „‹“. Klick auf den Griff oder Strg+Klick: der Bedarf gleitet von rechts herein und füllt die Seite; Esc oder „‹ Alle Bedarfe“ schiebt ihn wieder hinaus, die Liste steht an derselben Stelle", "Liste: solange die Freigabe nicht vollständig ist, sind Finanzierung, Verwendungsnachweis und Spendenübergabe grau – ohne Farben", "Verwendungsnachweis: der Kreis steht immer da, auch bei „nicht nötig“ (dann leer). Die Punktlinie zur Frist: ab drei Monaten grau, darunter das erste Drittel grün, unter einem Monat die Hälfte gelb, unter einer Woche ganz rot", "Bedarfsseite: unter dem Namen steht „Deadline: …“ (Klick öffnet den Kalender) statt „angelegt“; Stichworte stehen als Marken neben dem Namen, das kleine + fügt weitere hinzu. Im Kasten „Zuständig“ stehen nur noch die Zuständigen", "Formatierung in allen Freitextfeldern – jetzt auch Pro und Contra auf den Förderer-Kacheln und die Notizen zur Spendenübergabe (auf der Bedarfsseite und in der Liste)", "Kreisdiagramm: lange Namen stehen in zwei Zeilen und werden notfalls gekürzt, statt über den Rand zu laufen"]}, {"version": "0.27.1", "date": "2026-10-23T17:40", "items": ["Fehler behoben: Im aufgeklappten Bedarf der kompakten Liste stand der Verwendungsnachweis nicht unter seiner Überschrift, und zwischen Förderer und Betrag klaffte eine Lücke. Jetzt stehen Förderer und Beträge unter „Finanzierung“, der Nachweis genau unter „Verwendungsnachweis“ – auch nach Änderung der Fenstergröße"]}, {"version": "0.27.0", "date": "2026-10-23T17:05", "items": ["Neue Bedarfe am Stück: im letzten Feld (oder jedem anderen) legt Umschalt+Enter gleich den nächsten Bedarf an, direkt darunter – ohne Maus", "Kompakte Liste: Strg+Klick klappt einen Bedarf ausführlich auf (dort wie gewohnt bearbeiten), die anderen bleiben kompakt; noch einmal Strg+Klick öffnet ihn, ein Klick daneben klappt ihn wieder zu", "Bedarfsseite: die Zuständigen stehen dauerhaft auf grauen Karten", "Beschreibung, Notizen, Fristen, Fördersumme und Eigenanteil: Formatierung ist beim Schreiben sofort zu sehen – fett, kursiv, unterstrichen, durchgestrichen und Aufzählungen. Gespeichert wird weiter derselbe schlichte Text mit Zeichen; Eingefügtes kommt ohne fremde Formatierung"]}, {"version": "0.26.0", "date": "2026-10-23T15:30", "items": ["Liste: Knöpfe „Ausführlich“ und „Kompakt“. Kompakt ist je Bedarf eine Zeile – Name, Summe, Ort und je Bereich nur der Stand: Freigabe (freigegeben · in Bearbeitung · keine Freigabe), Finanzierung (Finanzierung beendet · in Bearbeitung · keine Finanzierung), Verwendungsnachweis (erbracht · in Bearbeitung · offen mit Frist · nicht nötig), Spendenübergabe (Datum und Uhrzeit oder grau „nicht geplant“). „+ Bedarf“ führt dort durch Name, Summe und Ort. Die Wahl bleibt gemerkt", "Zuständige: zusätzlich ein Handy – beim Bearbeiten eine eigene Linie, sonst ein Knopf mit der Nummer beim Überfahren. Auch die Personen-Excel hat eine Spalte „Handy“", "Formatieren per Markierung: ein Wort markieren, darüber erscheinen Knöpfe für fett, kursiv, unterstrichen, durchgestrichen und Aufzählung (auch Strg+B, Strg+I, Strg+U); noch einmal geklickt nimmt die Formatierung weg. Neu: +unterstrichen+", "Freigaben: vor dem Namen des Fachreferats steht „Fachreferat“", "Fortschritt oben auf der Bedarfsseite: erledigte Schritte dezent grün mit umrandetem Haken, der aktuelle Schritt ohne farbige Hinterlegung"]}, {"version": "0.25.0", "date": "2026-10-23T14:10", "items": ["Zuständige nebeneinander, je Zeile zwei – auch mehr als drei. Zu sehen sind Name und Position; E-Mail und Telefon stehen beim Überfahren der Knöpfe ✉ und ☎ (Klick schreibt bzw. ruft an), beim Bearbeiten in den Linien", "Mehrere Stichworte oder Fördertöpfe je Bedarf: eintippen, Enter – es erscheint als Marke, das nächste lässt sich gleich eintippen; × nimmt eines weg. Der Filter in der Liste findet den Bedarf unter jedem seiner Stichworte", "Beschreibung: ein Klick irgendwo in die rechte Fläche öffnet sie zum Schreiben", "Aufzählung: Umschalt+Enter setzt den nächsten Punkt (bzw. die nächste Nummer), Enter geht in eine neue Zeile ohne Punkt", "Kontaktdaten mit Copilot: Knopf bei „Zuständig“ – legt die Personen-Excel an („Personen.xlsx“ neben der Bedarfsliste, mit allen bekannten Personen), gibt einen kurzen Auftrag zum Kopieren und liest das Ergebnis ein", "Die Liste liest die Personen-Excel (und Kopien wie „Personen (1).xlsx“, die neueste gilt) beim Start und etwa jede Minute. Fehlende Position, E-Mail und Telefon der Zuständigen werden in allen Bedarfen daraus ergänzt, Eingetragenes bleibt; die Namen erscheinen als Vorschläge. Die Excel lässt sich auch von Hand erweitern"]}, {"version": "0.24.0", "date": "2026-10-23T12:40", "items": ["Aufzählung sofort beim Tippen: „* “ oder „- “ am Zeilenanfang wird gleich zum Punkt •; Enter setzt den nächsten Punkt (bei „1. “ die nächste Nummer), Enter auf einem leeren Punkt beendet die Aufzählung, Umschalt+Enter macht eine Zeile ohne Punkt", "Bedarfsseite oben neu: links die Zuständigen wie die Kontakte im Förderer-Fenster (Name, Position, E-Mail, Telefon mit Knöpfen zum Schreiben und Anrufen; Stift zum Bearbeiten, „Fertig“ oben rechts, höchstens drei; ★ = Ansprechperson in der Liste), darunter Deadline und Stichwort; rechts, durch eine Linie getrennt, die Beschreibung", "Keine Eingabefelder mehr oben: Deadline (Kalender), Stichwort (Vorschläge beim Tippen) und Beschreibung (mit Formatierung) anklicken und ändern", "Eine Person, die schon in einem anderen Bedarf mit Angaben steht, bringt Position, E-Mail und Telefon mit, sobald ihr Name eingetragen ist. Bisher gespeicherte Namen werden zu Zuständigen ohne weitere Angaben"]}, {"version": "0.23.0", "date": "2026-10-23T11:45", "items": ["Rückgängig: Knopf „↶ Rückgängig“ oben in der Kopfzeile und Strg+Z (außerhalb von Eingabefeldern) – holt z. B. einen versehentlich gelöschten Förderer oder Kontakt zurück. Bis zu 50 Schritte; Tippen in einem Feld zählt als ein Schritt", "Kontakte bearbeiten ohne Kästen: je Kontakt vier Linien untereinander mit blassem Hinweis (Vorname Nachname, Position, E-Mail-Adresse, Telefonnummer); „Fertig“ steht oben rechts statt des Stifts", "In der Kontaktliste stehen E-Mail und Telefon jeweils in einer eigenen Zeile", "Förderer-Fenster ohne waagrechte Scrollbalken", "Einfache Formatierung in Notizen, Fristen, Fördersumme und Eigenanteil: „* “ oder „- “ am Zeilenanfang = Aufzählung, „1. “ = Nummerierung, *fett*, _kursiv_, ~durchgestrichen~, Links werden anklickbar. Erklärung hinter dem „i“ bei den Notizen und im Zahnrad", "Förderer-Kachel unten: links die Hauptansprechperson (ohne Person, z. B. bei einem Portal, die Website), daneben Symbole für Telefon und E-Mail – beim Überfahren steht die Nummer bzw. Adresse da, ein Klick ruft an bzw. schreibt; rechts „Weitere Infos →“ öffnet das Fenster"]}, {"version": "0.22.0", "date": "2026-10-23T20:15", "items": ["Förderer-Fenster so groß wie nötig: bei wenig Inhalt kleiner und ohne Leerraum (unter Antragsweg, Eigenanteil, Notizen); die bisherige Größe ist jetzt die Höchstgröße – darüber scrollen Kontakte, Bedingungen, Quellen und Notizen jeweils in ihrem Bereich"]}, {"version": "0.21.0", "date": "2026-10-23T19:40", "items": ["Förderer-Fenster, Kopf: neben dem Namen die Summe, die im Raum steht, ganz rechts die Wahrscheinlichkeit – beides direkt änderbar; Stand und „Antrag stellt“ stehen dort nicht mehr", "Bis zu drei Kontakte je Förderer: Name, Funktion, E-Mail und Telefon als Links mit Knöpfen zum Schreiben und Anrufen; der Stern markiert den Hauptkontakt (er steht in der Kachel), ☆ macht einen anderen dazu; Stift oben rechts bearbeitet die Kontakte", "Kontakte aus der Förder-Kartei stehen in derselben Liste, mit Vermerk „Kartei“ und nicht bearbeitbar", "Rechte Seite ohne Überschrift „Bedingungen“, Fristen, Fördersumme und Eigenanteil rücken nach oben", "Das Fenster ist so hoch, dass drei Kontakte passen; längere Texte scrollen jeweils in ihrem Bereich", "Bisherige Ansprechperson, E-Mail und Telefon werden zum ersten Kontakt. Recherche-Excel: Spalte „Kontakte“ mit je Person einer Zeile „Name; Funktion; E-Mail; Telefon“"]}, {"version": "0.20.0", "date": "2026-10-23T18:20", "items": ["Kontakt und Details eines Förderers als Steckbrief: links der Kontakt (mit Kartei-Angaben), rechts die Bedingungen (Fristen, übliche Fördersumme, Eigenanteil), darunter Quellen und Notizen", "Keine Eingabefelder mehr im Fenster: die Angaben stehen als Text da, der Text unter jeder Überschrift etwas eingerückt; ein Klick macht eine Angabe bearbeitbar (Enter bzw. Klick daneben übernimmt, Esc verwirft)", "Knöpfe zum Schreiben, Anrufen und Öffnen erscheinen nur, wenn E-Mail, Telefon bzw. Website eingetragen sind", "Quellen lassen sich bearbeiten (Klick auf den Bereich neben den Links, je Link eine Zeile)", "Das Fenster hat immer dieselbe Höhe; was nicht passt, scrollt innen mit eigenem Scrollbalken"]}, {"version": "0.19.0", "date": "2026-10-23T17:10", "items": ["Bedarfsseite: das Angebot steht wieder bei den Freigaben (Kreis wie die anderen: fehlt → angefragt → liegt vor) statt bei den Unterlagen; „alle vorhanden“ und das grüne Kästchen erst, wenn auch das Angebot vorliegt", "Förderplan (Tabelle, Kreisdiagramm und alle Förderer) und Nacharbeit lassen sich über den Pfeil vor der Überschrift einklappen; eingeklappt steht eine Zeile Zusammenfassung da. Der Browser merkt sich das für alle Bedarfe"]}, {"version": "0.18.0", "date": "2026-10-23T16:00", "items": ["Fehler behoben: Förderer-Kacheln mit langer Kontaktzeile wurden in manchen Browsern breiter als ihre Spalte und schoben sich übereinander – jetzt bleibt jede Kachel in ihrer Spalte, die Kontaktzeile wird gekürzt", "Punktlinie zur Frist des Verwendungsnachweises: gerechnet von heute bis zur Frist, die ganze Linie eingefärbt – grün, unter einem Monat gelb, unter einer Woche rot", "Kreisdiagramm: Beschriftungen immer sichtbar, in Grau", "Klick auf das Stück eines Förderers im Kreisdiagramm schaltet seinen Stand weiter (geplant → beantragt → zugesagt → abgelehnt); die Farbe wechselt sofort, neu aufgeteilt wird der Kreis erst, wenn die Maus ihn verlässt", "Liste: Tab springt beim Bearbeiten zum nächsten Feld der Zeile (Name → Summe → Ort → Ansprechperson → Deadline), Shift+Tab zurück – beim neuen Bedarf und in jeder vorhandenen Zeile"]}, {"version": "0.17.0", "date": "2026-10-23T14:30", "items": ["Liste: Bearbeiten ist jetzt der Normalzustand – Name, Summe, Ort, Ansprechperson und Deadline anklicken und ändern, Stände per Klick weiterdrehen; Strg + Klick öffnet den Bedarf", "Beim Überfahren ist immer die ganze Zeile grau hinterlegt, das Feld unter der Maus zusätzlich hervorgehoben; Kalender und Kreis mit Stift erscheinen nur in der Zeile unter der Maus", "„+ Bedarf“ legt eine neue Zeile oben in der Liste an: Name → Summe → Ort → Ansprechperson → Deadline, jeweils mit Enter weiter; leere Felder zeigen einen blassen Platzhalter; ohne Namen verschwindet die Zeile wieder", "Beim Arbeiten in der Liste bleibt die Reihenfolge stehen; neu sortiert wird beim Zurückkommen in die Liste", "Verwendungsnachweis ist standardmäßig nötig; in schon gespeicherten Daten einmalig auch dort, wo er unberührt auf „nicht nötig“ stand (ohne Archiv und ohne Fälle mit Frist)", "Zeitstrahl: die Punktlinie zur Frist des Verwendungsnachweises füllt sich von links – grau, ab einem Monat vor der Frist gelb, ab einer Woche rot", "Förderer haben nur noch die Stände geplant, beantragt, zugesagt und abgelehnt („in Vorbereitung“ wird zu „geplant“)", "Kreisdiagramm: beim Überfahren erscheinen alle Beschriftungen mit Name, Betrag und Anteil; das Diagramm steht weiter rechts", "Summe oben auf der Seite größer", "Kontakt und Details eines Förderers als Fenster statt Aufklappen über die ganze Breite: E-Mail, Telefon und Website mit Knopf zum Schreiben, Anrufen und Öffnen; Mail-Adressen und Telefonnummern aus der Kartei anklickbar; lange Texte mehrzeilig; Quellen untereinander als Links", "Pro und Contra mit drei Zeilen Vorschau und mehr Abstand", "Recherche mit Copilot: Quellen je Link eine Zeile, „Ansprechperson“, „Übliche Fördersumme“ und „Eigenanteil“ kurz (Erläuterungen in „Notizen“); beim Übernehmen werden hintereinander geschriebene Quellen getrennt"]}, {"version": "0.16.0", "date": "2026-10-23T09:10", "items": ["Recherche-Excel mit eindeutigem Namen: Titel, Gliederung und ein Kürzel des Bedarfs – gleiche Titel in verschiedenen Gliederungen kommen sich nicht mehr in die Quere; die Liste findet die Datei auch nach dem Umbenennen und nimmt die neueste passende, auch eine Kopie wie „… (1).xlsx“", "„Excel übernehmen“ bei einer noch unveränderten Datei: Hinweis auf die möglichen Gründe (Copilot nicht fertig, OneDrive noch nicht synchronisiert, Ergebnis als eigene Datei) und „Andere Datei wählen …“", "Prompt: die Excel wird in Copilot angehängt statt über den Ort beschrieben; Copilot muss im Web recherchieren (sonst Abbruch) und darf nur tatsächlich geöffnete Links als Quelle angeben", "Umfang nach offenem Betrag gestaffelt (bis 2.000 €: 3–5, bis 20.000 €: 5–8, darüber 8–12 Förderer) und ohne Zielsumme – die Summen je Förderer sollen realistisch begründet sein", "Kartei-Blatt ohne Notizen; im Dialog steht, was an Copilot geht", "Pfad im Explorer: Anführungszeichen aus „Als Pfad kopieren“ werden entfernt"]}, {"version": "0.15.0", "date": "2026-10-22T16:40", "items": ["Förderrecherche mit Copilot: der Knopf „Recherche mit Copilot“ im Förderplan führt in drei Schritten durch Excel anlegen, Auftrag an Copilot und Ergebnis übernehmen", "Die Excel liegt mit verbundenem Ordner im Unterordner „Förderrecherche“ neben der Bedarfsliste (dort findet Copilot Cowork sie im OneDrive); der Pfad wird angezeigt", "Die Excel beschreibt den Bedarf vollständig: Summe, Eigenmittel, schon zugesagt, noch offen, Deadline, Stichwort, Beschreibung; die Förderer im Plan mit ihrem Stand; dazu ein Blatt mit den für die Gliederung zuständigen Förderern aus der Kartei samt Förderhistorie (ohne Kontaktdaten)", "Fertiger Prompt zum Kopieren (vorher anpassbar): Auftrag, Region, Umfang (8 bis 12 Förderer, zusammen etwa das Doppelte der offenen Summe), Format und eine kurze Zusammenfassung im Chat", "Vorschläge aus der Recherche: je Förderer Summe, Frist, Einschätzung und Begründung, Hinweis „ohne Quelle“, darunter die Summe der neu ausgewählten Förderer neben dem noch offenen Betrag"]}, {"version": "0.14.0", "date": "2026-10-22T15:30", "items": ["Bedarfsseite: der Block mit Freigaben und Unterlagen schließt oben bündig mit dem ersten Abschnitt links ab; ⋯ und Papierkorb stehen ganz rechts darüber, die Summe bleibt, wo sie war", "Förderer-Kachel nach dem Geldeingang: Stand und Datum verschwinden, „✓ eingegangen am …“ steht ganz links; über den Stift lässt sich das Datum ändern oder der Eingang zurücknehmen (dann sind Stand und Datum wieder da)", "„→ Geldeingang bestätigen“ rechtsbündig und in normaler Schriftfarbe, nur mit Pfeil und Unterstreichung"]}, {"version": "0.13.0", "date": "2026-10-22T14:40", "items": ["Kreisdiagramm im Förderplan: jeder zugesagte Förderer ist ein eigenes grünes Stück, getrennt durch feine weiße Linien; ein noch fehlender Betrag (Delta) erscheint dezent schraffiert", "Beim Überfahren eines Stücks erscheint sofort ein kleines weißes Feld mit Name und Betrag – nicht mehr der schwarze Hinweis des Browsers", "Geldeingang: statt des roten Knopfs steht hinter „am Datum“ der blaue Link „→ Geldeingang bestätigen“ (öffnet den Kalender für das Eingangsdatum); danach „✓ eingegangen am …“ mit Stift zum Ändern oder Zurücknehmen", "Kopf der Bedarfsseite ruhiger: keine Angabe zur Finanzierungslücke mehr hinter den Schritten (steht beim Überfahren der Schritte), alle Häkchen sehen gleich aus", "Summe, ⋯ und Papierkorb rechtsbündig mit dem Hauptblock; lange Namen brechen auf zwei Zeilen um; der Umschalter „Schätzung / laut Angebot“ ist entfernt", "Freigaben: sind alle vorhanden, wird der Block hellgrün und die Überschrift zeigt „alle vorhanden“"]}, {"version": "0.12.0", "date": "2026-10-22T13:38", "items": ["Förderer-Kacheln: keine Überschrift „Förderer · Anzahl“ und kein Knopf mehr – stattdessen eine hellgraue Kachel „+ Förderer hinzufügen“ dort, wo der nächste Förderer erscheinen würde", "Name des Förderers so groß wie die Summe und direkt darüber; der Stift ist weg (Name einfach anklicken), die Prozentangabe auch (steht oben im Förderplan)", "Hinweise (z. B. „Laut Kartei zuständig für …“, „Auch im Förderplan von …“) als kleines rotes Dreieck hinter dem Namen – beim Überfahren erscheint der Text", "Daten in den Kacheln ohne Kalendersymbol und ohne Lücke: Klick aufs Datum öffnet den eigenen Kalender, tippen geht auch", "Mehr Abstand zwischen Pro und Contra"]}, {"version": "0.11.0", "date": "2026-10-22T12:58", "items": ["Förderer auf der Seite des Bedarfs als kompakte Kacheln, zwei nebeneinander: Name mit Stift und Löschen, Einschätzung, groß die Summe mit Anteil, Stand mit Datum, Pro und Contra je mit grünem bzw. rotem Punkt, unten der Kontakt (Klick klappt die Details über die ganze Breite auf); „+ Förderer“ steht oben rechts über den Kacheln", "Einschätzung füllt sich von rechts: der rechte Punkt allein ist „sehr unwahrscheinlich“, alle fünf „sehr wahrscheinlich“", "Kreise bei Freigaben und Unterlagen schalten per Klick einen Stand weiter – kein Menü mehr", "Namensfeld des Förderers ohne Auswahlpfeil des Browsers, mit eigenen Vorschlägen beim Tippen", "Beträge bekommen schon beim Tippen den Tausenderpunkt (15000 → 15.000)", "Kreisdiagramm mit mehr Abstand zur Tabelle und nur noch: zugesagt, Eigenmittel, beantragt, nicht beantragt, Delta", "Liste: Freigabe und Förderer stehen Zeile für Zeile auf einer Höhe, die Punkte mittig zur Schrift"]}, {"version": "0.10.0", "date": "2026-10-22T12:27", "items": ["Haken, Kreuz und drei Punkte in den Kreisen als klare Grafik statt Schriftzeichen – nicht mehr „handgemalt“ und sauber mittig, auch bei weiteren Unterlagen und im Auswahlfenster", "Freigaben: der grüne Kasten „Freigabe vollständig“ ist weg", "Förderplan: Kreisdiagramm statt Balken, rechts neben der schmaleren Tabelle; jede Tabellenzeile trägt das Farbfeld ihres Kreisstücks (eingegangen, zugesagt, Eigenmittel, beantragt, geplant schraffiert, Delta grau); beim Überfahren zeigt jedes Stück Betrag und Anteil", "Farben für Finanzierung kräftiger und besser unterscheidbar, in hell und dunkel"]}, {"version": "0.9.2", "date": "2026-10-22T11:50", "items": ["Förderer nur mit der Tastatur anlegen: Name, Enter, Betrag – Shift+Enter speichert und öffnet gleich die nächste leere Zeile; Enter schließt ab"]}, {"version": "0.9.1", "date": "2026-10-22T11:36", "items": ["Uhrzeit der Spendenübergabe mit zwei Rädern: links die Stunden, rechts die Minuten in 5er-Schritten; Stunde wählen, dann Minute – fertig", "Scrollbalken in Listen und Auswahlfenstern in den Farben der gewählten Darstellung (hell oder dunkel)", "Spendenübergabe: der Strich über den Notizen geht über die ganze Breite; ein Ort ohne Termin steht nicht mehr eingerückt", "Spalte Summe linksbündig"]}, {"version": "0.9.0", "date": "2026-10-22T11:10", "items": ["Kalender- und Uhrsymbole passen zur gewählten Darstellung (hell: dunkle Symbole), auch wenn die Umgebung dunkel ist", "Eigener Kalender in der Farbe der Darstellung: öffnet beim Klick sofort die Monatsansicht – für die Frist des Verwendungsnachweises, die Deadline in der Liste und das Datum der Spendenübergabe; „Frist entfernen“ bzw. „Deadline entfernen“", "Uhrzeit der Spendenübergabe in 5-Minuten-Schritten: Liste von 06:00 bis 22:00, Getipptes filtert (15 → 15:00 bis 15:55) und wird auf 5 Minuten gerundet", "Spendenübergabe in der Liste mittig in der Höhe; unter Termin und Ort ein kleiner Strich, darunter die Notizen", "Spaltenbreiten der Liste wie in Excel: am rechten Rand eines Spaltenkopfs ziehen, die Spalten rechts davon rücken mit; Doppelklick auf einen Rand oder das Zahnrad setzt zurück"]}, {"version": "0.8.1", "date": "2026-10-22T11:00", "items": ["Stift zum Umbenennen steht jetzt direkt am Ende des Förderernamens (in seiner Zeile, vor dem Betrag) statt ganz rechts hinter dem Verwendungsnachweis", "Spendenübergabe: mit Strg ein großer Kreis mit Stift; ein Klick öffnet Ort, Datum, Uhrzeit und Notizen zum Eintragen – das bleibt offen, auch ohne Strg. Enter, „fertig“ oder Klick daneben übernimmt, Esc verwirft; Datum und Uhrzeit getrennt (Uhrzeit darf leer bleiben), geleerte Felder werden gelöscht"]}, {"version": "0.8.0", "date": "2026-10-22T10:50", "items": ["Mit Strg über einem Förderer: ganz rechts ein kleiner Stift – Klick, und der Name lässt sich ändern (mit Vorschlägen)", "Mit Strg beim Verwendungsnachweis: neben „Frist fehlt“ bzw. der Frist ein Kalender – Klick öffnet das Datum; ein gewähltes Datum gilt sofort", "Mit Strg bei der Spendenübergabe: Ort, Datum und Uhrzeit (mit Kalender) und Notizen zum Eintragen, leer blass beschriftet; die Liste zeigt danach z. B. „05.12.2026, 15:00 Uhr“ mit Ort", "Spendenübergabe hat eine Uhrzeit, auch auf der Seite des Bedarfs; „Info“ heißt dort jetzt „Notizen“"]}, {"version": "0.7.1", "date": "2026-10-22T09:45", "items": ["Felder beim Bearbeiten mit Strg schlicht: kein Rahmen, nur eine Linie darunter; Ort, Ansprechperson, Summe und Beträge beginnen leer mit blassem Feldnamen – wer nichts eingibt, ändert nichts", "Beim Tippen ein schlichtes Fenster mit passenden Vorschlägen (Orte und Gliederungen, Personen, Förderer aus Kartei und Förderplänen); Pfeiltasten und Enter oder Klick übernehmen – kein Auswahlpfeil mehr", "Das Feld liegt genau über dem Wert: links daneben verschiebt sich nichts", "+ im Finanzierungsplan: der neue Förderer entsteht als eigene Zeile unter den anderen, über Delta und Eigenmittel – Name blass „Förderer“ bis vor die Beträge, „Betrag in Euro“ in der Spalte der Beträge"]}, {"version": "0.7.0", "date": "2026-10-22T09:05", "items": ["Mit gedrückter Strg-Taste direkt in der Liste bearbeiten: Name, Summe, Ort, Ansprechperson, Deadline, Beträge der Förderer und Eigenmittel anklicken und ändern (Enter oder Klick daneben übernimmt, Esc verwirft)", "Mit Strg und einem Klick einen Stand weiter: Freigaben (offen, angefragt, zugestimmt, abgelehnt), Angebot, Förderer (geplant, beantragt, Zusage, Absage) und Verwendungsnachweis (steht aus, in Arbei /* ---------- Freigabe: Ortsführungskreis immer, Fachreferat und Verwaltung ab 1.000 € (darunter nur, wenn angefragt); dazu muss das Angebot vorliegen */
const FR_DEF = {
  ofk: { label: 'Ortsführungskreis', short: 'OFK', ok: 'zugestimmt', nein: 'abgelehnt', offen: 'noch nicht angefragt' },
  fach: { label: 'Fachreferat', short: 'Fachreferat', ok: 'freigegeben', nein: 'abgelehnt', offen: 'noch nicht angefragt' },
  verw: { label: 'Verwaltung (Budgetierung)', short: 'Verwaltung', ok: 'budgetiert', nein: 'nicht budgetiert', offen: 'noch nicht angefragt' },

const ab1000 = b => (+b.summe || 0) >= 1000;
function frItems(b) {

    na: k === 'ofk' && istDio(b.gliederung) ? 'entfällt, Bedarf der Diözese' : null, opt: (k === 'fach' || k === 'verw') && !ab1000(b) }, FR_DEF[k]));
}
const frNeeded = i => !i.na && !(i.opt && i.st === 'offen');
const frText = i => i.na ? i.na.split(',')[0] : i.opt && i.st === 'offen' ? 'unter 1.000 € nicht nötig' : i.st === 'angefragt' ? 'angefragt' : i[i.st];

function frOffen(b) {
  const open = frItems(b).filter(i => frNeeded(i) && i.st !== 'ok'), ang = angebotUL(b);
  return { names: [...open.map(frName), ...(!ang || !['da', 'nn'].includes(ang.st) ? ['Angebot'] : [])], rej: open.filter(i => i.st === 'nein') };

const ulOpts = u => u.fest && u.name === 'Angebot' ? [['fehlt', 'fehlt'], ['arbeit', 'angefragt', 't-warn'], ['da', 'liegt vor', 't-ok'], ['nn', 'nicht nötig']] : [['fehlt', 'fehlt'], ['arbeit', 'in Arbeit', 't-warn'], ['da', 'vorhanden', 't-ok']];

/* ---------- Finanzierung */
function fin(b) {

// Finanzierung steht, wenn Zusagen und Eigenmittel den Bedarf decken und kein Antrag mehr läuft; nie angegangene Förderer zählen dann nicht mehr.
// d: was noch fehlt (> 0) oder zu viel ist (< 0) – solange die Finanzierung nicht steht, zählen auch geplante und beantragte Förderer mit
// Beträge in Cent vergleichen: 1.200,10 + 300,30 ist genau 1.500,40 (mit Kommazahlen käme 1.500,3999… heraus – nie „Finanzierung steht“)

  // gedeckt: Zusagen und Eigenmittel decken die Summe – mit mindestens einer Zusage (nur Eigenmittel gelten nicht als finanziert, Ziel sind Förderer);
  // ohne Summe ist nichts gedeckt. done: gedeckt und kein Antrag mehr offen
  const gedeckt = S > 0 && zu > 0 && ct(zu) + ct(eig) >= ct(S), offen = fs.filter(f => f.status === 'beantragt');
  const done = gedeckt && !offen.length;

// Wer deckt was: zugesagt (eingegangen zuerst), Eigenmittel, beantragt, geplant – in dieser Reihenfolge im Balken; abgelehnte fehlen
const KIND_L = { in: 'eingegangen', zu: 'zugesagt', eig: 'Eigenmittel', be: 'beantragt', ge: 'geplant' };

function finSegs(b) {
  const ord = { in: 0, zu: 1, eig: 2, be: 3, ge: 4 };
  const segs = b.foerderer.filter(f => f.status !== 'abgelehnt' && foeAmt(f) > 0).map(f => ({ id: f.id, v: foeAmt(f), name: f.name.trim() || '(ohne Namen)',
    k: f.status === 'zugesagt' ? (f.eingegangen > 0 ? 'in' : 'zu') : f.status === 'beantragt' ? 'be' : 'ge' }));
  if (+b.eigenanteil > 0) segs.push({ id: null, v: +b.eigenanteil, k: 'eig', name: 'Eigenmittel' });

}
function finText(b) {
  const F = fin(b);
  if (!F.S) return 'Summe fehlt';
  const gap = (ct(F.S) - ct(F.gedeckt)) / 100;
  return gap > 0 ? `${Math.round(F.gedeckt / F.S * 100)} % gedeckt · Lücke ${eur(gap)}` : gap < 0 ? `überdeckt um ${eur(-gap)}` : 'voll gedeckt';

/* ---------- Phase und Stand: ergeben sich aus den Häkchen, nichts davon wird von Hand gepflegt */
const PHASES = [
  { k: 'frei', t: 'Freigabe' }, { k: 'foer', t: 'Förderung' }, { k: 'nach', t: 'Nacharbeit' }, { k: 'fertig', t: 'Abgeschlossen' },
];
const names = l => l.map(f => short(f.name)).join(', ');
function nachOffen(b) {
  const L = [];
  for (const f of b.foerderer) if (f.status === 'zugesagt') {
    if (f.vn.noetig && f.vn.st !== 'erledigt') L.push('Verwendungsnachweis ' + short(f.name));
  }
  if (b.nach.ueb.noetig && b.nach.ueb.st !== 'erledigt' && b.foerderer.some(f => f.status === 'zugesagt')) L.push('Spendenübergabe');
  if (b.nach.pm.noetig && b.nach.pm.st !== 'veroeff') L.push('Pressemitteilung');

}
// step: 0 Freigabe · 1 Förderung · 2 Nacharbeit · 3 Abgeschlossen · -1 zurückgestellt/verworfen; bad: braucht Aufmerksamkeit
function phase(b) {
  const warn = [];

  const laufend = fs.filter(f => f.status === 'beantragt' || f.status === 'zugesagt');
  if (fo.names.length && laufend.length) warn.push((laufend.some(f => f.durch === 'gl') ? 'Gliederung hat schon beantragt' : 'Antrag läuft schon') + ', Freigabe ist aber nicht vollständig');

  if (fo.names.length) return { k: 'frei', step: 0, t: 'Es fehlt', sub: fo.names.join(', '), bad: false, warn };
  if (!b.summe) return { k: 'summe', step: 1, t: 'Summe fehlt', sub: 'erst mit der Summe lässt sich die Finanzierung prüfen', bad: true, warn: warn.filter(w => w !== 'Summe fehlt') };
  if (!fs.length) return { k: 'plan', step: 1, t: 'Förderplan aufstellen', sub: 'noch kein Förderer eingetragen', bad: false, warn };
  const vor = fs.filter(f => f.status === 'geplant'), wart = fs.filter(f => f.status === 'beantragt');

    if (!FS.zu && FS.eig && ct(FS.eig) >= ct(FS.S) && !vor.length && !wart.length) return { k: 'luecke', step: 1, t: 'Förderer suchen', sub: 'bisher nur Eigenmittel – Ziel ist, sie durch Förderer zu ersetzen', bad: true, warn };
    if (vor.length) return { k: 'antrag', step: 1, t: 'Anträge stellen', sub: names(vor) + (wart.length ? ' · wartet auf ' + names(wart) : ''), bad: false, warn };
    if (wart.length) return { k: 'warten', step: 1, t: 'Warten auf Antwort', sub: names(wart), bad: false, warn };
    return { k: 'luecke', step: 1, t: 'Finanzierungslücke', sub: (FS.S ? eur((ct(FS.S) - ct(FS.zu) - ct(FS.eig)) / 100) + ' offen' : 'keine Zusage') + ', weiteren Förderer suchen', bad: true, warn };

const PH_CLS = ['ph-frei', 'ph-foer', 'ph-nach', 'ph-fertig'];
const phCls = p => p.step < 0 ? 'ph-pause' : PH_CLS[p.step];

// Was vor dem Archivieren noch offen ist: Antworten, Geldeingänge, Verwendungsnachweise, Übergabe, Pressemitteilung
function archivOffen(b) {
  const L = [];
  for (const f of b.foerderer) {
    if (f.status === 'beantragt') L.push('Antwort von ' + short(f.name));
    if (f.status === 'zugesagt' && !(f.eingegangen > 0)) L.push('Geldeingang ' + short(f.name));
    if (f.status === 'zugesagt' && f.vn.noetig && f.vn.st !== 'erledigt') L.push('Verwendungsnachweis ' + short(f.name) + (f.vn.frist ? ' (bis ' + fmtDate(f.vn.frist) + ')' : ''));
  }

}
/* ---------- Fristen: was steht als Nächstes an? */
// z: wo die Frist herkommt (für den Sprung dorthin) – deadline, frist (Antragsfrist), erwartet (Antwort), vn (Verwendungsnachweis), ueb; fid: der Förderer
const vnFrist = f => ({ d: f.vn.frist, t: 'Verwendungsnachweis ' + short(f.name), z: 'vn', fid: f.id });
function fristen(b) {
  const p = phase(b), L = [];

  for (const f of b.foerderer) {

    if (f.status === 'beantragt' && f.erwartet) L.push({ d: f.erwartet, t: 'Antwort ' + short(f.name), z: 'erwartet', fid: f.id });

  if (u.noetig && u.st !== 'erledigt' && u.termin) L.push({ d: u.termin, t: 'Spendenübergabe', z: 'ueb' });

// Fristen aller Bedarfe, die überfällig sind oder in den nächsten 14 Tagen ablaufen – gebündelt oben im Feld der Hinweise.
// Verwendungsnachweise zählen auch bei zurückgestellten und archivierten Bedarfen (die Pflicht bleibt)
const FRIST_TAGE = 14;
function fristenBald() {
  const L = [];
  for (const b of D.bedarfe) {
    const alle = b.archiv || b.manuell ? b.foerderer.filter(f => f.status === 'zugesagt' && f.vn.noetig && f.vn.st !== 'erledigt' && validIso(f.vn.frist)).map(vnFrist) : fristen(b);

/* ===================================================================== Speichern: die Datei speichert sich selbst (Programm + Daten in einer HTML-Datei)

// Nach einem Neustart fragt der Browser beim ersten Klick, ob die App den Ordner wieder bearbeiten darf

/* ---------- Rückgängig: die letzten 50 Stände (ohne Speicherangaben); schnelle Änderungen hintereinander (Tippen) zählen als ein Schritt */
// Rückgängig: vor jeder Änderung den Stand merken (höchstens 50 Schritte). Tippen im selben Feld zählt als ein Schritt;

/* ---------- Änderungen von außen (z. B. am zweiten Rechner gespeichert und per OneDrive abgeglichen) */

/* ---------- Programm-Update: aus dem ZIP-Paket (ohne Entpacken) oder aus der Programmdatei; die Daten bleiben */
async function programFromFile(file) {

    let z; try { z = zipIndex(await file.arrayBuffer()); } catch (e) { return { err: '„' + file.name + '“ ist kein lesbares ZIP-Paket.' }; }
    const nm = [...z.out.keys()].filter(n => /(^|\/)Bedarfsliste[^/]*\.html?$/i.test(n) && !/(^|\/)__MACOSX\//.test(n));
    const inner = nm.find(n => n.split('/').pop() === DEFAULT_FILE) || nm[0];
    if (!inner) return { err: 'Im Paket „' + file.name + '“ steckt keine Programmdatei (' + DEFAULT_FILE + ').' };
    try { return { text: await zipText(z, inner), name: file.name }; } catch (e) { return { err: '„' + file.name + '“ lässt sich nicht entpacken (' + e.message + ').' }; }
  }

  if (!st || !app) return null;

}

      if (e.kind !== 'file' || !UPD_ZIP_RE.test(n)) continue;
      const f = await e.getFile(), key = n + '@' + f.lastModified + '@' + f.size;
      if (!_zipSeen.has(key)) { let info = null; try { const g = await programFromFile(f), pr = g.text ? parseProgram(g.text) : null; info = pr && pr.info; } catch (x) { /* halb synchronisiert */ } _zipSeen.set(key, info); }
      const info = _zipSeen.get(key);

  if (!got) {

    const f = await pickFile('.zip,.html,.htm'); if (!f) return;

  const prog = parseProgram(got.text || '');

  const files = [
    { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
