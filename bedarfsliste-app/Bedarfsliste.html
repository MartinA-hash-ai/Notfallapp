/* ===================================================================== Förder-Kartei: die Excel „Banken- und Stiftungsübersicht“ aus dem Ordner (nur lesen)
   Die Kartei wird weiter in Excel gepflegt. Die Liste liest sie beim Öffnen, beim Zurückkehren ins Fenster und etwa jede Minute neu ein,
   sobald sich die Datei geändert hat. Erkannt wird je Blatt die Kopfzeile mit „Gliederung“; die Namensspalte ist die Spalte links davon
   mit den meisten verschiedenen Einträgen. Verbundene Zellen (eine Bank für mehrere Gliederungen) gelten für alle ihre Zeilen. */

const KR = { list: [], byKey: new Map(), name: '', stamp: null, at: null, err: null, cut: false, busy: false, cands: [] };
const KARTEI_RE = /(bank|banken|stiftung|kartei|f(ö|oe)rderer)/i;
// Schlüssel für Namen: „e.V.“ = „e. V.“, Striche und Leerzeichen um sie gleich, weiche Trennzeichen und Anführungszeichen weg, Titel (Dr., Prof.) weg
const kkey = s => norm(String(s ?? '').normalize('NFC').replace(/\u00ad/g, '').replace(/[‐‑‒–—]/g, '-'))
  .replace(/[„“"'’‚‘]/g, '').replace(/\b(dr|prof)\.\s*/g, '').replace(/\be\.\s*v\.?(?=\s|$)/g, 'ev').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
// Summen-, Hinweis- und Standzeilen unter einer Tabelle sind keine Einträge
const KEINE_ZEILE = /^(summe|zwischensumme|gesamt|gesamtsumme|insgesamt|total|hinweis|hinweise|anmerkung|anmerkungen|stand\b|quelle|quellen|fazit|ergebnis|legende)\b/i;
const istEintrag = name => !!name && name.length <= 150 && !KEINE_ZEILE.test(name);
const kartei = name => KR.byKey.get(kkey(name)) || null;
const truthy = v => v === true || v === 1 || /^(x|ja|wahr|true|1|✓)$/i.test(String(v ?? '').trim());
const cellStr = v => v === true ? 'ja' : v === false ? '' : String(v ?? '').trim();

function karteiSet(list) {
  KR.list = list.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  KR.byKey = new Map(list.map(k => [kkey(k.name), k]));
}
async function karteiScan(force) {
  if (DEMO || KR.busy || ST.conn !== 'ok' || !ST.htmlDir) return;
  KR.busy = true;
  try {
    const cands = [];
    for await (const [n, e] of ST.htmlDir.entries()) if (e.kind === 'file' && /\.xlsx$/i.test(n) && !/^~\$/.test(n)) cands.push([n, e]);
    KR.cands = cands.map(c => c[0]).sort((a, b) => a.localeCompare(b, 'de'));
    const want = D.settings.kartei;
    // Konfliktkopien von OneDrive („…-LAPTOP.xlsx“, „… (1).xlsx“) nicht dem Original vorziehen
    const stem = n => n.replace(/\.xlsx$/i, ''), kopie = n => cands.some(([m]) => m !== n && (stem(n).startsWith(stem(m) + '-') || stem(n).startsWith(stem(m) + ' (')));
    let hit = want ? cands.find(([n]) => n === want) : cands.filter(([n]) => KARTEI_RE.test(n) && !/vorlage|f(ö|oe)rderplan|recherche/i.test(n)).sort(([a], [c]) => kopie(a) - kopie(c))[0];
    if (!hit) {
      const err = want ? '„' + want + '“ liegt nicht mehr im Ordner' : null;
      if (KR.list.length || KR.err !== err) { karteiSet([]); KR.name = ''; KR.stamp = null; KR.err = err; safeRender(); }
      return;
    }
    const f = await hit[1].getFile();
    if (!force && KR.name === hit[0] && KR.stamp === f.lastModified && !KR.err) return;
    const book = await xlsxBook(await f.arrayBuffer(), { max: 4e6 });
    const L = parseKartei(book);
    karteiSet(L);
    KR.name = hit[0]; KR.stamp = f.lastModified; KR.at = new Date(); KR.cut = book.sheets.some(s => s.cut);
    KR.err = L.length ? null : 'in „' + hit[0] + '“ keine Tabelle mit einer Spalte „Gliederung“ gefunden';   // statt still 0 Förderer
    safeRender();
  } catch (e) {
    console.warn(e);
    const msg = e && e.name === 'NotReadableError' ? 'gerade nicht lesbar (in Excel geöffnet oder wird synchronisiert?) – neuer Versuch in einer Minute' : (e && e.message) || String(e);
    if (KR.err !== msg) { KR.err = msg; safeRender(); }
  } finally { KR.busy = false; }
}
function parseKartei(book) {
  const out = new Map();
  for (const sh of book.sheets) {
    if (sh.hidden) continue;                                                       // ausgeblendete Blätter (z. B. ein altes Archiv) nicht mitlesen
    const istGl = v => /^gliederung/.test(norm(v));                                // auch „Gliederungen“, „Gliederung(en)“
    const rows = sh.rows, hi = rows.findIndex(r => r.some(istGl));
    if (hi < 0) continue;
    const head = rows[hi].map(norm), gi = head.findIndex(istGl);
    let ni = -1, best = 0;
    for (let c = 0; c < gi; c++) {
      const s = new Set(); for (let r = hi + 1; r < rows.length; r++) { const v = rows[r][c]; if (typeof v === 'string' && v.trim()) s.add(v.trim()); }
      if (s.size > best) { best = s.size; ni = c; }
    }
    if (ni < 0) continue;
    // Spalten rechts von „Gliederung“ zuordnen; „Mail“/„Telefon“ gehören zum Kontakt links davon
    const col = { years: [] }, kontakte = []; let curK = null;
    const above = c => { for (let r = hi - 1; r >= 0; r--) for (let k = c; k >= 0; k--) { const v = String(rows[r][k] ?? ''); if (/anschreiben/i.test(v)) return v; } return ''; };
    head.forEach((t, c) => {
      if (c <= gi) return;
      if (/^(kontakt|ansprech)/.test(t)) { curK = { n: c, hint: above(c) }; kontakte.push(curK); }
      else if (/^(e-?)?mail$/.test(t)) { if (curK) { if (curK.m == null) curK.m = c; } else if (col.perMail == null) col.perMail = c; }
      else if (/^tel/.test(t)) { if (curK && curK.t == null) curK.t = c; }
      else if (t === 'direkt') col.direkt = c;
      else if (t === 'portal') col.portal = c;
      else if (/notiz/.test(t)) col.notiz = c;
      else if (/schwerpunkt|zweck/.test(t)) col.schwer = c;
      else if (/homepage|website|internet/.test(t)) col.web = c;
      else if (/^(19|20)\d\d$/.test(t)) col.years.push([t, c]);
    });
    let cur = null;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], name = ohnePlatzhalter(cellStr(row[ni])), gl = ohnePlatzhalter(cellStr(row[gi]));
      if (name && !istEintrag(name)) { cur = null; continue; }                    // Summen-, Hinweis- oder Standzeile
      if (name) {
        const k = kkey(name);
        cur = out.get(k) || { name, blatt: sh.name, gl: [], kontakte: [], hist: {}, weg: [], notiz: '', schwer: '', web: '' };
        out.set(k, cur);
      } else if (!gl) continue;                   // Leerzeile
      if (!cur) continue;
      if (gl && !cur.gl.includes(gl)) cur.gl.push(gl);
      if (col.direkt != null && truthy(row[col.direkt]) && !cur.weg.includes('direkt')) cur.weg.push('direkt');
      if (col.perMail != null && truthy(row[col.perMail]) && !cur.weg.includes('per Mail')) cur.weg.push('per Mail');
      if (col.portal != null && truthy(row[col.portal]) && !cur.weg.includes('Portal')) cur.weg.push('Portal');
      for (const [f, c] of [['notiz', col.notiz], ['schwer', col.schwer]]) if (c != null && !cur[f]) cur[f] = ohnePlatzhalter(cellStr(row[c]));
      if (col.web != null && !cur.web) cur.web = ohnePlatzhalter(zelleMitLink(sh, r, col.web));
      for (const kc of kontakte) {
        const n = ohnePlatzhalter(cellStr(row[kc.n])); if (!n) continue;
        if (cur.kontakte.some(x => x.n === n)) continue;
        cur.kontakte.push({ n, m: kc.m != null ? mailText(row[kc.m]) : '', t: kc.t != null ? telText(row[kc.t]) : '', nicht: /nicht/i.test(kc.hint) });
      }
      for (const [y, c] of col.years) {
        const v = cellStr(row[c]); if (!v) continue;
        if (!cur.hist[y]) cur.hist[y] = v; else if (!cur.hist[y].includes(v)) cur.hist[y] += '\n' + v;
      }
    }
  }
  return [...out.values()];
}
async function karteiChoose() {
  if (ST.conn !== 'ok') { if (!await connectFolder()) return; }
  await karteiScan(true);
  const cands = KR.cands;
  let pick = D.settings.kartei || KR.name || '';
  const body = h('div', { class: 'help' },
    h('p', null, 'Welche Excel im Ordner ist deine Förder-Kartei? Die Liste liest sie nur – gepflegt wird weiter in Excel.'),
    cands.length ? h('div', { class: 'radios' }, ...cands.map(n => h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: n, checked: n === pick, onchange: () => { pick = n; } }), n)))
      : h('p', { class: 'muted' }, 'Im Ordner liegt noch keine Excel-Datei. Lege die Kartei in den Ordner der Bedarfsliste und öffne dieses Fenster erneut.'),
    h('label', { class: 'check' }, h('input', { type: 'radio', name: 'kartei', value: '', checked: !D.settings.kartei, onchange: () => { pick = ''; } }), 'automatisch erkennen (Dateiname mit „Bank“, „Stiftung“ oder „Kartei“)'));
  const ok = await modal('Förder-Kartei wählen', body, [['Abbrechen', false], ['Übernehmen', true, 'primary']]);
  if (!ok) return;
  if (pick === '' && !D.settings.kartei) { await karteiScan(true); renderNow(); return; }
  D.settings.kartei = pick; changed(); KR.stamp = null; await karteiScan(true); renderNow();
}

/* ===================================================================== Personen: die Excel „Personen.xlsx“ im Ordner der Bedarfsliste (nur lesen)
   Darin stehen die Zuständigen der Bedarfe mit Position, Gliederung, E-Mail und Telefon – ausgefüllt von Copilot oder von Hand und mit
   jedem Bedarf erweitert. Gelesen werden alle Excel-Dateien, deren Name mit „Personen“ beginnt (auch Kopien wie „Personen (1).xlsx“);
   bei unterschiedlichen Angaben gilt die neueste Datei. Fehlende Angaben der Zuständigen werden daraus ergänzt – Eingetragenes bleibt. */

const PR = { list: [], byKey: new Map(), files: [], stamp: '', err: null, busy: false };
const PERS_DATEI = 'Personen.xlsx', PERS_RE = /^personen\b[^/\\]*\.xlsx$/i;
const PERS_COLS = [
  { k: 'n', t: 'Name', w: 26, re: /^((vor- und (zu|nach))?name|name, vorname|vollständiger name|ansprechperson|person)$/ },
  { k: 'rolle', t: 'Position', w: 32, re: /position|funktion|rolle|aufgabe/ },
  { k: 'gl', t: 'Gliederung / Dienststelle', w: 26, re: /gliederung|dienststelle|einheit/ },
  { k: 'mail', t: 'E-Mail', w: 32, re: /mail/ },
  { k: 'tel', t: 'Telefon', w: 20, re: /^(telefon|tel\b|festnetz)(?!.*(\b2\b|mobil|handy))/ },
  { k: 'mobil', t: 'Handy', w: 18, re: /handy|mobil|telefon 2|tel\.? 2/ },
  { k: 'quelle', t: 'Quelle', w: 40, re: /quelle/ },
  { k: 'stand', t: 'Stand', w: 12, re: /^stand|datum/ },
];
const person = name => PR.byKey.get(kkey(name)) || null;

// je Blatt die Kopfzeile mit „Name“ und „E-Mail“, „Telefon“ oder „Handy“. Namen auch als „Vorname“ + „Name“/„Nachname“ in zwei Spalten
// oder als „Mustermann, Max“. Platzhalter („nicht gefunden“, „k. A.“) gelten als leer, E-Mail braucht ein @, Telefon Ziffern (führende 0 bleibt)
function parsePersonen(book) {
  const out = [];
  for (const sh of book.sheets) {
    if (sh.hidden) continue;
    const rows = sh.rows, hi = rows.slice(0, 15).findIndex(r => r.some(v => /name|person/.test(norm(v))) && r.some(v => /mail|telefon|handy|mobil/.test(norm(v))));
    if (hi < 0) continue;
    const head = rows[hi].map(v => norm(v)), ci = {}, vi = head.indexOf('vorname');
    for (const c of PERS_COLS) { const i = head.findIndex((t, j) => t && j !== vi && c.re.test(t) && !Object.values(ci).includes(j)); if (i >= 0) ci[c.k] = i; }
    const nach = head.indexOf('nachname') >= 0 ? head.indexOf('nachname') : vi >= 0 ? ci.n : -1, umgedreht = head[ci.n] === 'name, vorname';
    for (const r of rows.slice(hi + 1)) {
      const p = Object.fromEntries(PERS_COLS.map(c => [c.k, ci[c.k] == null ? '' : c.k === 'mail' ? mailText(r[ci[c.k]]) : c.k === 'tel' || c.k === 'mobil' ? telText(r[ci[c.k]]) : ohnePlatzhalter(cellStr(r[ci[c.k]]))]));
      if (vi >= 0 && nach != null && nach >= 0) p.n = (ohnePlatzhalter(cellStr(r[vi])) + ' ' + ohnePlatzhalter(cellStr(r[nach]))).trim();
      const q = /^([^,]+),\s*([^,]+)$/.exec(p.n); if (q && (umgedreht || /^[^\s]+$/.test(q[1].trim()))) p.n = q[2].trim() + ' ' + q[1].trim();   // „Mustermann, Max“
      if (istEintrag(p.n)) out.push(p);
    }
  }
  return out;
}
function personenSetzen(L) {
  const m = new Map();
  for (const p of L) { const k = kkey(p.n), a = m.get(k) || {}; for (const [x, v] of Object.entries(p)) if (v) a[x] = v; m.set(k, a); }
  PR.byKey = m; PR.list = [...m.values()].sort((a, b) => a.n.localeCompare(b.n, 'de'));
}
async function personenScan(force) {
  if (DEMO || PR.busy || ST.conn !== 'ok' || !ST.htmlDir) return false;
  PR.busy = true;
  try {
    const fs = [];
    for await (const [n, e] of ST.htmlDir.entries()) if (e.kind === 'file' && PERS_RE.test(n) && !n.startsWith('~$')) fs.push(await e.getFile());
    fs.sort((a, b) => a.lastModified - b.lastModified);                  // die neueste zuletzt: ihre Angaben gelten
    const stamp = fs.map(f => f.name + '@' + f.lastModified).join('|');
    if (!force && stamp === PR.stamp && !PR.err) return false;
    const L = []; let err = null;
    for (const f of fs) {
      try { const P = parsePersonen(await xlsxBook(await f.arrayBuffer(), { max: 4e6 })); if (!P.length) err = 'in „' + f.name + '“ keine Spalten „Name“ und „E-Mail“, „Telefon“ oder „Handy“ erkannt'; L.push(...P); }
      catch (e) { console.warn(e); err = '„' + f.name + '“ gerade nicht lesbar'; }
    }
    personenSetzen(L); PR.files = fs; PR.stamp = stamp; PR.err = err;
    const n = personenErgaenzen();
    if (n) toast('Aus der Personen-Excel ergänzt: Angaben bei ' + n + ' Zuständigen.', 'ok');
    safeRender();
    return true;
  } catch (e) { console.warn(e); PR.err = (e && e.message) || String(e); return false; } finally { PR.busy = false; }
}
// leere Position, E-Mail und Telefon der Zuständigen aus der Personen-Excel füllen (in allen Bedarfen); Anzahl der ergänzten Personen.
// Je Person nur einmal je Fassung der Excel (z.pxl): was du danach in der Liste löschst, bleibt gelöscht – erst eine geänderte Excel füllt wieder auf
function personenErgaenzen() {
  let n = 0, mark = false;
  for (const b of D.bedarfe) for (const z of b.zust) {
    const p = person(z.n); if (!p || z.pxl === PR.stamp) continue;
    let neu = false;
    for (const k of ZUST_F) if (!(z[k] || '').trim() && p[k]) { z[k] = p[k]; neu = true; }
    z.pxl = PR.stamp; mark = true;
    if (neu) n++;
  }
  if (mark) changed();
  return n;
}
// eine Excel von Copilot, die nicht als „Personen.xlsx“ im Ordner liegt: als Kopie in den Ordner legen (dann gilt sie auch künftig) und einlesen
async function personenDatei(file) {
  if (DEMO) { toast('In der Vorschau lassen sich keine Dateien einlesen. In der Programmdatei geht das.', 'warn'); return 0; }
  let L = [];
  try { L = parsePersonen(await xlsxBook(await file.arrayBuffer(), { max: 4e6 })); } catch (e) { console.warn(e); }
  if (!L.length) { modal('Keine Personen gefunden', h('p', null, 'In „' + file.name + '“ steht keine Tabelle mit den Spalten „Name“ und „E-Mail“ oder „Telefon“.')); return 0; }
  if (rechOrdnerOk()) {
    const name = PERS_RE.test(file.name) && !PR.files.some(f => f.name === file.name) ? file.name : 'Personen (Copilot ' + today() + ').xlsx';
    try { const fh = await ST.htmlDir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(file); await w.close(); await personenScan(true); toast('„' + name + '“ im Ordner abgelegt und eingelesen – ' + L.length + ' Personen.', 'ok'); return L.length; }
    catch (e) { console.warn(e); }
  }
  personenSetzen([...PR.list, ...L]); PR.stamp = (PR.stamp || '') + '|' + file.name + '@' + file.lastModified;   // ohne Ordner: nur für diese Sitzung
  const n = personenErgaenzen(); safeRender();
  toast(L.length + ' Personen eingelesen' + (n ? ', Angaben bei ' + n + ' Zuständigen ergänzt' : '') + '.', 'ok');
  return L.length;
}

/* ---------- Excel anlegen: alle Personen, die die Liste schon kennt, mit Anleitung */
const PERS_ANL = ['Personen für die Bedarfsliste',
  'Hier stehen die Zuständigen der Bedarfe (Fundraising, Malteser Hilfsdienst e. V., Diözese Paderborn) mit ihren dienstlichen Kontaktdaten. Die Bedarfsliste liest diese Datei und ergänzt damit fehlende Angaben bei den Zuständigen. Ausgefüllt von Copilot oder von Hand; die Datei wächst mit jedem Bedarf.',
  'Regeln: Je Person genau eine Zeile im Blatt „Personen“. Spaltenüberschriften und Blattnamen nicht ändern. Vorhandene Zeilen nicht löschen und Angaben nicht überschreiben – nur leere Zellen ergänzen und neue Personen unten anfügen. Nur dienstliche Angaben, die tatsächlich gefunden wurden; sonst leer lassen.',
  'Name: Vor- und Nachname. Position: Funktion bei den Maltesern (z. B. Ortsbeauftragter, Referent Fundraising). Gliederung / Dienststelle: z. B. Paderborn oder Diözesangeschäftsstelle. E-Mail, Telefon und Handy: dienstlich, Nummern als Text mit Vorwahl (z. B. 05251 1234-56). Quelle: woher die Angabe stammt (z. B. Outlook-Adressbuch oder Link). Stand: Datum der Angabe.'];
function personenBlob() {
  const head = { b: true, color: '#FFFFFF', fill: '#404040', v: 'center', wrap: true, border: 'thin' }, zelle = { border: 'thin', v: 'top', wrap: true };
  const bek = new Map(PR.list.map(p => [kkey(p.n), Object.assign({}, p)]));
  for (const b of D.bedarfe) for (const z of b.zust) {
    if (!z.n.trim()) continue;
    const k = kkey(z.n), a = bek.get(k) || { n: z.n.trim() };
    for (const x of ZUST_F) if (!a[x] && (z[x] || '').trim()) a[x] = z[x].trim();
    if (!a.gl && b.gliederung) a.gl = istDio(b.gliederung) ? 'Diözese' : b.gliederung;
    bek.set(k, a);
  }
  const tx = c => c.k === 'tel' || c.k === 'mobil' ? 'txt' : undefined;          // Telefon als Text: Excel behält die führende 0
  const rows = [PERS_COLS.map(c => ({ v: c.t, st: head })), ...[...bek.values()].sort((a, b) => a.n.localeCompare(b.n, 'de')).map(p => PERS_COLS.map(c => ({ v: p[c.k] || '', st: zelle, t: tx(c) })))];
  for (let i = 0; i < 40; i++) rows.push(PERS_COLS.map(c => ({ v: '', st: zelle, t: tx(c) })));

/* ---------- Auftrag an die Recherche: dieselben Sätze stehen im Blatt „Anleitung“ und im Prompt für Copilot */

function vorlageBlob(b, ka) {

  rows[1] = [{ v: 'Je möglichem Förderer eine Zeile ausfüllen. Spaltenüberschriften und Blattnamen nicht ändern. Auftrag, Umfang und was in jede Spalte gehört, stehen im Blatt „Anleitung“. Danach in der Bedarfsliste „Excel übernehmen“ wählen.', st: note }];
  const F = b ? finState(b) : null, num = v => v ? { v, t: 'n' } : '';

  info.forEach(([k, v], i) => {

  const block = (t, L) => { A.push([]); A.push([{ v: t, st: { b: true, sz: 12 } }]); for (const x of L) A.push([{ v: x, st: { wrap: true, v: 'top' } }]); };
  block('Auftrag', ka ? ka.zeilen : rechAuftrag(b).map((t, i) => (i + 1) + '. ' + t));
  if (!ka || ka.auf.has('suchen')) block('Umfang', [rechUmfang(b)]);
  block('Regeln', RECH_REGELN.map(t => '• ' + t));
  A.push([]);
  A.push([{ v: 'Spalte', st: head }, { v: 'Was gehört hinein', st: head }]);
  for (const c of FP_COLS) A.push([{ v: c.t, st: { b: true, border: 'thin', v: 'top' } }, { v: c.help + (c.items ? ' Auswahl: ' + c.items.join(' · ') : ''), st: { wrap: true, border: 'thin', v: 'top' } }]);

/* ---------- Filtern und Sortieren: hohe Priorität zuerst, dann nach der nächsten Frist */
const CMP = {
  prio: b => PRIO_ORD[b.prio], titel: b => (b.titel || '').toLowerCase(), frist: b => (nextFrist(b) || {}).d || '9999',
};

let SORT_MEMO = null;

/* Sortieren in bis zu drei Stufen: erst nach der ersten Angabe, innerhalb davon nach der zweiten, dann nach der dritten (UI.sort = [{ k, d }]).
   Leere Angaben stehen immer unten. Danach gilt die übliche Reihenfolge (Priorität, nächste Frist, Name). */
const SORT = {
  prio: { t: 'Priorität', w: ['hoch zuerst', 'niedrig zuerst'], v: b => PRIO_ORD[b.prio] },
  titel: { t: 'Name', w: ['A → Z', 'Z → A'], v: b => norm(b.titel) || null },
  summe: { t: 'Summe', w: ['klein → groß', 'groß → klein'], v: b => +b.summe || null },
  ort: { t: 'Ort', w: ['A → Z', 'Z → A'], v: b => norm(b.gliederung === DIO ? 'Diözese' : b.gliederung) || null },
  zust: { t: 'Ansprechperson', w: ['A → Z', 'Z → A'], v: b => norm((b.zust[0] || {}).n) || null },
  deadline: { t: 'Deadline', w: ['früh → spät', 'spät → früh'], v: b => b.deadline || null },
  fr: { t: 'Freigabe', w: ['freigegeben zuerst', 'ohne Freigabe zuerst'], v: b => ({ ok: 0, run: 1, off: 2, no: 3 })[frStand(b)] },
  fin: { t: 'Finanzierung', w: ['beendet zuerst', 'ohne Finanzierung zuerst'], v: b => ({ ok: 0, run: 1, no: 2, off: 3 })[finStand(b)] },
  vn: { t: 'Verwendungsnachweis', w: ['nächste Frist zuerst', 'späteste Frist zuerst'], v: b => {
    const Z = b.foerderer.filter(f => f.status === 'zugesagt'), L = Z.filter(f => f.vn.noetig), auf = L.filter(f => f.vn.st !== 'erledigt');
    return !Z.length ? null : auf.length ? '0' + (auf.map(f => f.vn.frist).filter(Boolean).sort()[0] || '9999') : L.length ? '1' : '2'; } },
  ueb: { t: 'Spendenübergabe', w: ['früh → spät', 'spät → früh'], v: b => b.nach.ueb.noetig && b.nach.ueb.termin || null },

/* ---------- Förderplan: je Förderer eine Überschrift (Name), rechts groß die Summe mit Anteil, daneben der Stand mit Fristen, oben rechts die Einschätzung;
   darunter Pro und Contra, Kontakt und Details zum Aufklappen */
const F_ST = [['geplant', 'geplant'], ['beantragt', 'beantragt', 't-run'], ['zugesagt', 'zugesagt', 't-ok'], ['abgelehnt', 'abgelehnt', 't-err']];
const F_ST_L = Object.fromEntries(F_ST.map(([v, l]) => [v, l]));
const LVL = ['suw', 'uw', 'u', 'w', 'sw'];                 // Einschätzung als Punkte 1 (rot) … 5 (grün)
const artFromKartei = (k, name) => /stiftung/i.test(name) || /stift/i.test(k.blatt) ? 'Stiftung' : /sparkasse/i.test(name) ? 'Sparkasse' : /bank/i.test(name) ? 'Volksbank / Bank' : '';
// Hinweise am Förderer: k 'amt' (Zusage ohne Betrag) und 'kartei' (andere Gliederung laut Kartei) brauchen Aufmerksamkeit – rotes Dreieck,
// sie stehen auch oben im Feld der Hinweise; 'auch' (derselbe Förderer bei anderen Bedarfen) ist nur zur Kenntnis – graues Dreieck
function foeHinweise(b, f) {
  if (!f.name.trim()) return [];
  const k = kartei(f.name), L = [];
  if (f.status === 'zugesagt' && !foeAmt(f)) L.push({ k: 'amt', t: 'Zusage ohne Betrag – bitte die zugesagte Summe eintragen (bei einer Sachspende ihren Wert).' });
  if (k && b.gliederung && !istDio(b.gliederung) && k.gl.length && !k.gl.some(g => /^alle$/i.test(g)) && !k.gl.includes(b.gliederung)) L.push({ k: 'kartei', t: 'Laut Kartei zuständig für ' + esc(k.gl.join(', ')) });
  return L;
}
function foeWarnList(b, f) {
  if (!f.name.trim()) return [];
  const key = kkey(f.name), other = D.bedarfe.filter(x => x !== b && !x.archiv && x.foerderer.some(g => kkey(g.name) === key && g.status !== 'abgelehnt'));
  const L = foeHinweise(b, f).map(x => x.t);
  if (other.length) L.push('Auch im Förderplan von: ' + other.map(x => `<button class="link" data-act="open" data-id="${x.id}">${esc(x.titel || '(ohne Namen)')}</button> (${F_ST_L[x.foerderer.find(g => kkey(g.name) === key).status]})`).join(', '));
  return L;
}
const foeWarn = (b, f) => !foeWarnList(b, f).length ? '' : `<button class="fw-tri${foeHinweise(b, f).length ? '' : ' grau'}" data-act="fw" data-fid="${f.id}" aria-label="Hinweise anzeigen">${ICON_TRI}</button>`;
function fwPop(btn) {
  closeMenus();
  const b = cur(), f = b && b.foerderer.find(x => x.id === btn.dataset.fid); if (!f) return;
  const m = h('div', { class: 'menu info-pop fw-pop', role: 'tooltip', 'data-fid': f.id, html: foeWarnList(b, f).map(t => `<div>${t}</div>`).join('') });
  placePop(m, btn);
}
// Fuß der Kachel: links die Hauptansprechperson (ohne Person, z. B. bei einem Portal: die Website), daneben Telefon und E-Mail als Symbole
// (beim Überfahren steht dran, was dahinter ist; Klick ruft an bzw. schreibt); rechts „Weitere Infos →“ öffnet das Fenster
function fussKontakt(f) {
  const k = kartei(f.name), kk = k && k.kontakte[0], hk = f.kontakte[0] || (kk ? { n: kk.n, rolle: '', mail: kk.m, tel: kk.t } : null);
  const web = webUrl(f.web || (k && k.web) || ''), tel = hk && telNr(hk.tel);
  const name = hk && (hk.n || hk.rolle) ? `<span class="ff-n">${esc(hk.n || hk.rolle)}</span>`
    : web ? `<a class="ff-n" href="${esc(web)}" target="_blank" rel="noopener" data-act="link">${esc(/portal/i.test(f.weg) ? 'Portal: ' : '')}${esc(kurzUrl(web).split('/')[0])}</a>` : '<span class="ff-n leer">kein Kontakt</span>';
  const sym = [tel && `<a class="fi" href="tel:${tel}" data-act="link" data-tip="${esc(hk.tel)}" aria-label="Anrufen: ${esc(hk.tel)}">☎</a>`,
    hk && hk.mail && `<a class="fi" href="mailto:${esc(hk.mail)}" data-act="link" data-tip="${esc(hk.mail)}" aria-label="E-Mail an ${esc(hk.mail)}">✉</a>`].filter(Boolean).join('');
  return `${name}${sym}<button class="ff-mehr" data-act="det" data-v="${f.id}" aria-haspopup="dialog">Weitere Infos <span aria-hidden="true">→</span></button>`;
}
function detKartei(f) {
  const k = kartei(f.name);
  if (!k) return KR.list.length && f.name.trim() ? '<p class="muted small">Nicht in der Förder-Kartei.</p>' : '';
  const hist = Object.entries(k.hist).sort((a, c) => c[0] - a[0]);
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${v}</dd>` : '';
  return `<div class="det-k"><h4>Aus der Förder-Kartei <span class="badge k">${esc(k.blatt)}</span></h4>
    <dl class="dl">${row('Antragsweg', esc(k.weg.join(' oder ')))}${row('Website', k.web ? `<a href="${esc(/^https?:/i.test(k.web) ? k.web : 'https://' + k.web)}" target="_blank" rel="noopener" data-act="link">${esc(k.web.replace(/^https?:\/\//, '').slice(0, 60))}</a>` : '')}
      ${row('Gliederungen', esc(k.gl.join(', ')))}${row('Schwerpunkte', esc(k.schwer))}${row('Notiz', esc(k.notiz))}
      ${row('Bisher gefördert', hist.length ? hist.map(([y, v]) => `<div>${y}: ${esc(v.replace(/\n/g, ', '))}</div>`).join('') : '<span class="muted">nichts eingetragen</span>')}</dl></div>`;
}
// Kontakt und Details eines Förderers als Fenster (Entwurf A „Steckbrief“): links der Kontakt, rechts die Bedingungen, darunter Quellen und Notizen.
// Keine Eingabefelder: die Angaben stehen als Text da, ein Klick macht sie bearbeitbar (Enter bzw. Klick daneben übernimmt, Esc verwirft).
// Feste Höhe; was nicht passt, scrollt im Fenster.
const telNr = t => String(t || '').replace(/[^\d+]/g, '');
const webUrl = u => { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : /^www\.|^[\w-]+\.[a-z]{2,}(\/|$)/i.test(u) ? 'https://' + u : ''; };
const kurzUrl = u => String(u).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
function quellenListe(t) {
  const L = quellenZeilen(t); if (!L.length) return '';
  return L.map(z => { const u = (z.match(/https?:\/\/\S+/) || [])[0];
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener" data-act="link" title="${esc(u)}">${esc(z === u ? kurzUrl(u).slice(0, 90) : z)}</a>` : `<span>${esc(z)}</span>`; }).join('');
}

  const slices = P.map(p => {

    return p.da > 2 * Math.PI - 1e-6 ? `<circle class="ps ${p.k}" cx="${cx}" cy="${cy}" r="${R}"${act}/>`

  });

    const kurz = (t, max) => { if (textBreite(t, font) <= max) return t; let s = t; while (s.length > 1 && textBreite(s + '…', font) > max) s = s.slice(0, -1).trimEnd(); return s + '…'; };
    const zeilen = zeig.map((p, i) => { const y = 16 + i * 19, wert = esc(eur(p.v)) + ' · ' + Math.round(p.v / max * 100) + ' %';
      return `<g class="pl"><rect class="ps ${p.k}" x="${lx}" y="${y - 10}" width="11" height="11" rx="2"/><text class="pl-n" x="${lx + 18}" y="${y}">${esc(kurz(p.k === 'off' ? 'Delta' : p.name, rx - lx - 18 - 128))}</text>`
        + `<text class="pl-v" x="${rx}" y="${y}" text-anchor="end">${wert}</text></g>`; });
    if (mehr) zeilen.push(`<text class="pl-v" x="${lx + 18}" y="${16 + zeig.length * 19}">… und ${mehr} weitere</text>`);

  // Beschriftungen: rechte und linke Seite getrennt von oben nach unten, mit Mindestabstand, damit sich nichts überlappt

  const GAP = 32, TOP = 18, BOT = H - 22, PLATZ = W / 2 - R - 44 - 4;
  P.forEach(p => { p.re = Math.cos(p.mid) >= 0; p.y = xy(p.mid, R + 16)[1]; p.zeilen = pieZeilen(p.k === 'off' ? 'Delta' : p.name, PLATZ); });
  for (const re of [true, false]) {
    const L = P.filter(p => p.re === re).sort((a, c) => a.y - c.y);
    L.forEach((p, i) => { const top = TOP + (p.zeilen.length - 1) * 15; p.y = Math.max(p.y, top, i ? L[i - 1].y + GAP + (p.zeilen.length - 1) * 15 : top); });
    const over = L.length ? L[L.length - 1].y - BOT : 0;
    if (over > 0) for (let i = L.length - 1; i >= 0; i--) L[i].y = Math.min(L[i].y - over, i < L.length - 1 ? L[i + 1].y - GAP : BOT);
  }

    const [x0, y0] = xy(p.mid, R), [x1, y1] = xy(p.mid, R + 12), tx = p.re ? cx + R + 44 : cx - R - 44, anc = p.re ? 'start' : 'end';
    const Z = p.zeilen, y = p.y - 2 - (Z.length - 1) * 15;
    return `<g class="pl"><polyline class="pl-l" points="${x0.toFixed(1)},${y0.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)} ${(tx + (p.re ? -6 : 6)).toFixed(1)},${p.y.toFixed(1)}"/>`
      + `<text class="pl-n" x="${tx}" y="${y.toFixed(1)}" text-anchor="${anc}">${Z.map((z, i) => `<tspan x="${tx}" dy="${i ? 15 : 0}">${esc(z)}</tspan>`).join('')}</text>`
      + `<text class="pl-v" x="${tx}" y="${(p.y + 13).toFixed(1)}" text-anchor="${anc}">${esc(eur(p.v))} · ${Math.round(p.v / max * 100)} %</text></g>`;
  });
  return svg(slices.join('') + labels.join(''));
}

  if (DEMO) return;
  restoreFolder().then(() => { renderNow(); askPermissionOnFirstClick(); }, e => { console.warn(e); ST.conn = 'none'; renderNow(); });
  // dieselbe Datei in einem zweiten Fenster oder Tab? Dann warnen – sonst überschreiben sich die Stände gegenseitig
  try {
    const kanal = new BroadcastChannel('bl:' + location.pathname), ich = uid('tab');
    kanal.onmessage = e => {
      const m = e.data || {}; if (m.von === ich) return;
      if (m.t === 'hallo') kanal.postMessage({ t: 'da', von: ich });
      const zwei = m.t !== 'weg'; if (ST.zweiTab !== zwei) { ST.zweiTab = zwei; safeRender(); }

}

  B.push('```');
  L.push('## Ausgabe', 'Schreib zuerst kurz, was du gefunden hast und was offen blieb. Gib danach das Ergebnis in genau einem Codeblock aus, genau in diesem Aufbau – '
    + 'ich übernehme ihn automatisch, deshalb keine Tabellen und keine anderen Überschriften. Was du nicht weißt: Zeile weglassen.', ...B);
  return L.join('\n');
}
// Antwort von Copilot lesen: der Textblock mit #BESCHREIBUNG, #FÖRDERER und #KONTAKTE (auch mit „##“, Fettschrift oder ohne Codeblock)
const KI_FELD = { link: 'link', name: 'name', art: 'art', website: 'web', web: 'web', summe: 'betrag', 'erwartete summe': 'betrag', betrag: 'betrag', antragsfrist: 'frist', frist: 'frist', antragsweg: 'weg',
  'weitere fristen': 'fristInfo', fristen: 'fristInfo', 'übliche fördersumme': 'hoehe', fördersumme: 'hoehe', eigenanteil: 'eigenInfo', pro: 'warum', contra: 'knackpunkte',
  einschätzung: 'einsch', quellen: 'quellen', quelle: 'quellen', notizen: 'notiz', notiz: 'notiz', kontakt: 'kontakt', kontakte: 'kontakt',
  position: 'rolle', funktion: 'rolle', 'e-mail': 'mail', email: 'mail', mail: 'mail', telefon: 'tel', handy: 'mobil', mobil: 'mobil' };
function kiTextLesen(t) {
  const r = { beschr: '', items: [], pers: [], link: '' }, bl = []; let sek = '', cur = null, feld = '';
  for (const z0 of String(t || '').replace(/\r/g, '').split('\n')) {
    const z = z0.replace(/\*\*/g, '');
    if (/^\s*```/.test(z)) continue;
    const hd = z.match(/^\s*#+\s*(beschreibung|förderer|foerderer|kontakte|kontaktdaten|ordner)\b/i);
    if (hd) { sek = /^b/i.test(hd[1]) ? 'b' : /^k/i.test(hd[1]) ? 'k' : /^o/i.test(hd[1]) ? 'o' : 'f'; cur = null; feld = ''; continue; }
    if (sek === 'o') { const u = z.match(/https?:\/\/\S+/); if (u && !r.link) r.link = u[0].replace(/[).,;]+$/, ''); continue; }
    if (sek === 'b') { bl.push(z0.trimEnd()); continue; }
    if (!sek) continue;
    const m = z.match(/^\s*([A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß\- ]{1,24}):\s*(.*)$/), key = m && KI_FELD[norm(m[1])];
    if (key === 'name') { cur = { name: m[2].trim() }; (sek === 'k' ? r.pers : r.items).push(cur); feld = ''; continue; }
    if (key && cur) { feld = key; if (m[2].trim()) cur[key] = m[2].trim(); continue; }
    if (cur && feld && z.trim() && !/^\s*\(.*\)\s*$/.test(z)) cur[feld] = (cur[feld] ? cur[feld] + '\n' : '') + z.trim();
  }
  r.beschr = bl.join('\n').replace(/^\s*\(der Text\)\s*$/m, '').trim();
  r.items = r.items.filter(it => istEintrag(it.name) && it.name !== '…').map(it => Object.assign(it, {
    betrag: it.betrag != null ? (typeof deNum(it.betrag) === 'number' ? deNum(it.betrag) : null) : null, frist: it.frist ? anyDate(it.frist) || '' : '',
    einsch: einschKey(it.einsch), art: ART.find(a => norm(a) === norm(it.art || '')) || '', quellen: quellenZeilen((it.quellen || '').replace(/^\s*-\s*/gm, '')).join('\n') }));
  r.pers = r.pers.filter(p => p.name && p.name !== '…').map(p => ({ n: p.name, rolle: p.rolle || '', mail: mailText(p.mail || ''), tel: telText(p.tel || ''), mobil: telText(p.mobil || '') }));
  return r;
}
// Arbeits-Excel für Cowork: Förderplan (immer), dazu „Beschreibung“, wenn gewählt
const kiVA = (b, A) => ({ auf: A.auf, zeilen: kiAufgaben(b, A), blaetter: A.auf.has('beschr') || !b.pfad.trim() ? [blattBeschreibung(b)] : [] });   // ohne Pfad: Blatt auch für den gefundenen Ordner
const kiExcel = (b, A) => vorlageBlob(b, kiVA(b, A));

/* ---------- Merkzettel je Bedarf (nur dieser Browser): wann der Auftrag angelegt und welcher Stand der Excel zuletzt angesehen wurde */
const KI_KEY = 'bl-ki', KI_NEU = {};
const kiMerk = () => { try { return JSON.parse(localStorage.getItem(KI_KEY) || '{}') || {}; } catch (e) { return {}; } };
const kiMerkSet = (id, o) => { try { const M = kiMerk(); M[id] = Object.assign(M[id] || {}, o); localStorage.setItem(KI_KEY, JSON.stringify(M)); } catch (e) { /* nur in diesem Browser */ } };
function kiGesehen(b, file) { if (file && file.lastModified) kiMerkSet(b.id, { gesehen: file.lastModified }); if (KI_NEU[b.id]) { KI_NEU[b.id] = false; kiKnopf(); } }
const kiKnopf = () => { const b = cur(), x = $('.ki-btn'); if (b && x) { x.classList.toggle('neu', !!KI_NEU[b.id]); x.title = KI_NEU[b.id] ? 'Ergebnis von Copilot oder Cowork liegt vor – ansehen' : 'Mit Copilot oder Cowork weiterarbeiten'; } };
// liegt zum offenen Bedarf eine Excel, die nach dem Auftrag geändert und noch nicht angesehen wurde? (etwa jede Minute und beim Öffnen)
async function kiCheck() {
  const b = UI.view === 'detail' && cur(); if (!b || !rechOrdnerOk()) return;
  const m = kiMerk()[b.id]; if (!m || !m.at) return;
  const f = await rechFile(b), neu = !!(f && f.lastModified > m.at + 2000 && f.lastModified !== m.gesehen);
  if (KI_NEU[b.id] !== neu) { KI_NEU[b.id] = neu; kiKnopf(); }
}
// enthält die Excel etwas zum Übernehmen? (neue oder geänderte Förderer, Vorschlag für die Beschreibung, geprüfte Unterlagen)
async function kiInhalt(b, f) {
  try {
    const buf = await f.arrayBuffer(), g = await readFoerderplan(buf), k = readKiBlaetter(await xlsxBook(buf));
    return !!((k.beschr && norm(k.beschr) !== norm(b.beschreibung)) || k.ul.length || (g && g.items.some(it => { const x = b.foerderer.find(y => kkey(y.name) === kkey(it.name)); return !x || fpGeaendert(it, g.stand.get(kkey(it.name))); })));
  } catch (e) { return false; }
}

/* ---------- Dialog: Aufgaben wählen (mehrere), Excel anlegen und Prompt kopieren, Ergebnis übernehmen */

/* ---------- Dialog „Copilot-Auftrag“: vier Kacheln (mehrere wählbar), bei der Förderrecherche darunter die Förderer zum Anklicken.
   Wer es macht, schlägt die Liste vor: Copilot (kostet nichts) für Beschreibung, neue Förderer und Kontaktdaten; Cowork, sobald eine Förderrecherche
   dabei ist (Skill, ausführliche Datei je Förderer). Umschalten geht. Copilot antwortet im Chat – den Textblock am Ende hier einfügen;
   Cowork schreibt in die Arbeits-Excel – „Ergebnis übernehmen“. Kontaktdaten laufen immer über Copilot. Texte (Antrag, Dank …) folgen später. */
async function kiDialog(b, vorwahl) {
  let close = null, datei = await rechFile(b), wo = 'copilot', woHand = false, promptAuf = false, fertig = false, neuDazu = true, antwort = '', kopiert = true;
  const ordner = rechOrdnerOk();
  const sel = new Set((vorwahl || []).filter(k => kiOk(b, KI_KACHELN.find(a => a.k === k))));
  const foeSel = new Set(kiFoe(b).filter(f => f.status === 'geplant' || f.status === 'beantragt').map(f => f.id));
  const A = () => ({ auf: new Set([...sel].filter(k => !KI_NUR_COPILOT.includes(k))), foe: kiFoe(b).filter(f => foeSel.has(f.id)), neuDazu });
  const root = h('div', { class: 'ki' }), closeKi = () => { if (close) close(null); };
  const setzeInhalt = (...L) => root.replaceChildren(...L.filter(Boolean));          // leere Teile (null) nicht als Text
  const btn = (t, cls, fn, x) => h('button', Object.assign({ type: 'button', class: cls || '', onclick: fn }, x || {}), t);
  const kopiere = text => new Promise(res => { try { navigator.clipboard.writeText(text).then(() => res(true), () => res(false)); } catch (e) { res(false); } });
  // was in welchen Prompt gehört: Cowork bekommt Beschreibung, neue Förderer und Recherche; Copilot alles, was nicht zu Cowork geht, und die Kontaktdaten
  const plan = () => { const a = A(), cw = wo === 'cowork' && kiAufgaben(b, a).length > 0, X = { zust: sel.has('zust'), ordner: sel.has('ordner') };
    const co = cw ? X.zust || X.ordner : kiPromptCopilot(b, a, X).includes('## Aufgaben\n1.');
    return { a, cw, co, pCw: cw ? kiPrompt(b, a) : '', pCo: co ? kiPromptCopilot(b, cw ? { auf: new Set(), foe: [], neuDazu: false } : a, X) : '' }; };

  async function los() {
    const P = plan();
    if (P.cw) {
      if (ordner) {
        if (datei && await kiInhalt(b, datei) && !await confirmBox('Neuen Auftrag anlegen?', 'In „' + datei.name + '“ stehen Ergebnisse, die noch nicht übernommen sind. Sie werden ersetzt.', 'Ersetzen')) return;
        if (!await rechWrite(b, kiVA(b, P.a))) { toast('Die Excel konnte nicht im Ordner abgelegt werden. Sie wird stattdessen heruntergeladen.', 'warn'); download(vorlageName(b), kiExcel(b, P.a)); }
        datei = await rechFile(b);
      } else if (!DEMO) download(vorlageName(b), kiExcel(b, P.a));
      kiMerkSet(b.id, { at: datei ? datei.lastModified : Date.now(), gesehen: datei ? datei.lastModified : 0 }); KI_NEU[b.id] = false; kiKnopf();
    }
    kopiert = await kopiere(P.cw ? P.pCw : P.pCo);
    fertig = true; zeichne();
    if (!kopiert) { const ta = root.querySelector('.ki-prompt textarea'); if (ta) { ta.focus(); ta.select(); } }      // Zwischenablage gesperrt: Prompt markiert zeigen
  }
  const ergebnis = async () => {
    if (DEMO) { toast('In der Vorschau lassen sich keine Dateien einlesen. In der Programmdatei geht das.', 'warn'); return; }
    const f = ordner ? await rechFile(b) : null;
    closeKi();
    if (f && !await kiInhalt(b, f)) {
      const v = await modal('Noch kein Ergebnis', h('div', { class: 'help' },
        h('p', null, 'In „' + f.name + '“ (zuletzt geändert am ' + lmText(f) + ' Uhr) steht noch nichts Neues: keine neuen oder geänderten Förderer, keine neue Beschreibung.'),
        h('p', null, 'Mögliche Gründe: Cowork ist noch nicht fertig; OneDrive hat die geänderte Datei noch nicht auf diesen PC geholt (kurz warten); oder das Ergebnis wurde als eigene Datei gespeichert – dann diese auswählen.')),
        [['Schließen', null], ['Trotzdem ansehen', 'show'], ['Andere Datei wählen …', 'pick', 'primary']]);
      if (v === 'pick') { importFoerderplan(b); return; }
      if (v !== 'show') return;
    }
    importFoerderplan(b, f || undefined);
  };
  // Antwort von Copilot einfügen und übernehmen
  const einfuegen = () => {
    const r = kiTextLesen(antwort);
    if (!r.beschr && !r.items.length && !r.pers.length && !r.link) { toast('Kein Ergebnisblock gefunden – in Copilot beim Textblock am Ende auf „Kopieren“ klicken und hier einfügen.', 'warn'); return; }
    closeKi();
    zeigeErgebnis(b, { got: { items: r.items, stand: new Map(), auftrag: [A().auf.has('recherche') ? 'recherche' : 'copilot'], kennung: '' }, ki: { beschr: r.beschr, grundlage: '', ul: [] }, pers: r.pers, link: r.link, name: 'der Antwort von Copilot' });
  };
  const antwortFeld = () => h('div', { class: 'ki-antwort' }, h('b', null, 'Antwort von Copilot'),
    h('div', { class: 'muted small' }, 'Am Ende seiner Antwort steht ein Textblock – dort auf „Kopieren“ klicken und hier einfügen.'),
    h('textarea', { rows: 5, placeholder: '#BESCHREIBUNG …', 'aria-label': 'Antwort von Copilot', value: antwort, oninput: e => { antwort = e.target.value; } }),
    h('div', { class: 'ki-fuss-r' }, btn('Übernehmen …', 'primary', einfuegen)));

  function zeichne() {
    if (!woHand) wo = sel.has('recherche') ? 'cowork' : 'copilot';
    const P = plan(), a = P.a;
    if (fertig) {
      setzeInhalt(
        kopiert ? h('div', { class: 'ki-ok' }, h('b', null, '✓ Prompt kopiert'), P.cw ? ' – in Cowork einfügen.' : ' – in Copilot einfügen.')
          : h('div', { class: 'ki-prompt' }, h('div', { class: 'small' }, h('b', null, 'Prompt markiert'), ' – mit Strg+C kopieren und in ' + (P.cw ? 'Cowork' : 'Copilot') + ' einfügen.'),
            h('textarea', { class: 'rech-prompt', rows: 8, spellcheck: false, 'aria-label': 'Prompt', value: P.cw ? P.pCw : P.pCo })),
        P.cw ? h('div', { class: 'ki-datei muted small' }, ordner ? 'Excel: ' + RECH_DIR + ' › ' + vorlageName(b) : DEMO ? 'In der Vorschau wird keine Excel angelegt.' : 'Die Excel liegt in „Downloads“ – für Cowork in den OneDrive legen.') : null,
        P.cw && P.co ? h('div', { class: 'ki-zweit' }, h('span', null, (sel.has('ordner') && sel.has('zust') ? 'Ordner und Kontaktdaten laufen' : sel.has('ordner') ? 'Der Ordner läuft' : 'Kontaktdaten laufen') + ' über Copilot:'),
          btn('Zweiten Prompt kopieren', '', async () => { if (await kopiere(P.pCo)) toast('Prompt kopiert – in Copilot einfügen', 'ok'); else { promptAuf = true; fertig = false; zeichne(); } })) : null,
        P.co ? antwortFeld() : null,
        h('div', { class: 'ki-fuss' }, btn('‹ Zurück zur Auswahl', 'link small', () => { fertig = false; kopiert = true; zeichne(); }), h('span', { class: 'ki-sp' }),
          P.cw ? btn(ordner ? 'Ergebnis von Cowork übernehmen' : 'Ergebnis-Excel wählen …', 'ki-erg' + (P.co ? '' : ' primary'), ergebnis) : null));
      return;
    }
    const kachel = x => {
      const ok = x.ok ? x.ok(b) : true, aus = ok !== true, on = sel.has(x.k) && !aus;
      const sub = aus ? ok : x.k === 'recherche' && on ? a.foe.length + ' Förderer' + (sel.has('suchen') && neuDazu ? ' + neu gefundene' : '') + ' ausgewählt' : x.s;
      return h('button', { type: 'button', class: 'ki-k' + (on ? ' on' : '') + (aus ? ' aus' : ''), disabled: aus, 'aria-pressed': String(on), 'data-k': x.k, onclick: () => { on ? sel.delete(x.k) : sel.add(x.k); zeichne(); } },
        h('span', { class: 'ki-k-top' }, h('span', { class: 'ki-ico', html: KI_ICO[x.k] }), h('b', null, x.t)), h('small', null, sub));
    };
    const chip = (t, s, on, fn, cls) => h('button', { type: 'button', class: 'ki-chip' + (on ? ' on' : '') + (cls ? ' ' + cls : ''), 'aria-pressed': String(on), onclick: fn }, on ? '✓ ' : '', t, s ? h('small', null, s) : null);
    const L = kiFoe(b);
    const foePanel = sel.has('recherche') ? h('div', { class: 'ki-foe' },
      h('div', { class: 'ki-foe-h' }, h('b', null, 'Welche Förderer recherchieren?'), L.length > 1 ? h('span', { class: 'ki-foe-alle' },
        btn('alle', 'link small', () => { L.forEach(f => foeSel.add(f.id)); zeichne(); }), ' · ', btn('keine', 'link small', () => { foeSel.clear(); zeichne(); })) : null),
      h('div', { class: 'ki-chips' }, ...L.map(f => chip(f.name.trim(), F_ST_L[f.status], foeSel.has(f.id), () => { foeSel.has(f.id) ? foeSel.delete(f.id) : foeSel.add(f.id); zeichne(); })),
        chip('die neu gefundenen', sel.has('suchen') ? 'aus „Neue Förderer“' : 'sucht auch neue', sel.has('suchen') && neuDazu,
          () => { if (!sel.has('suchen')) { sel.add('suchen'); neuDazu = true; } else neuDazu = !neuDazu; zeichne(); }, 'neu'))) : null;
    const seg = h('div', { class: 'seg small ki-wo', role: 'group', 'aria-label': 'Wer macht es?' }, [['copilot', 'Copilot'], ['cowork', 'Cowork']].map(([v, l]) =>
      btn(l, v === wo ? 'on' : '', () => { wo = v; woHand = true; zeichne(); }, { title: v === 'cowork' ? 'Cowork: arbeitet direkt in der Excel im OneDrive, nutzt deine Skills und legt je Förderer eine ausführliche Recherche als Datei an – kostet Credits'
        : 'Copilot: antwortet im Chat, den Textblock am Ende hier einfügen – kostet nichts' })));
    const empf = sel.size ? h('span', { class: 'muted small' }, wo === (sel.has('recherche') ? 'cowork' : 'copilot') ? 'empfohlen' : '') : null;
    const ta = (v, lab) => h('div', { class: 'ki-prompt' }, lab ? h('div', { class: 'muted small' }, lab) : null, h('textarea', { class: 'rech-prompt', rows: 10, spellcheck: false, 'aria-label': lab || 'Prompt', value: v }));
    const prompts = promptAuf ? [P.cw ? ta(P.pCw, P.co ? 'Für Cowork:' : '') : null, P.co ? ta(P.pCo, P.cw ? 'Für Copilot:' : '') : null] : [];
    setzeInhalt(
      h('div', { class: 'ki-kacheln' }, KI_KACHELN.map(kachel)), foePanel,
      h('div', { class: 'ki-spaeter', 'aria-disabled': 'true' }, h('span', { class: 'ki-sp-lab' }, 'Späteres Update'), h('ul', null, KI_SPAETER.map(t => h('li', null, t)))),
      ...prompts,
      h('div', { class: 'ki-fuss' }, sel.size ? seg : null, empf, P.cw || P.co ? btn(promptAuf ? 'Prompt ausblenden' : 'Prompt ansehen', 'link small', () => { promptAuf = !promptAuf; zeichne(); }) : null, h('span', { class: 'ki-sp' }),
        ordner && datei ? btn('Ergebnis von Cowork', 'ki-erg' + (KI_NEU[b.id] ? ' primary' : ''), ergebnis, { title: 'Ergebnis aus der Arbeits-Excel übernehmen' }) : null,
        btn('Auftrag kopieren', 'ki-los' + (KI_NEU[b.id] && ordner && datei ? '' : ' primary'), los, { disabled: !(P.cw || P.co), title: P.cw ? 'Legt die Excel an und kopiert den Prompt für Cowork' : 'Kopiert den Prompt für Copilot' })));
  }
  zeichne();
  await modal('Copilot-Auftrag', root, [], { wide: true, expose: c => { close = c; } });
  kiCheck();
}
</script>
