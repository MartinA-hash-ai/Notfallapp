<style id="jp-style">:root {

  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fafafa; --head: #f5f5f4; --hover: #f1f1f1; --solid: #404040;
  --we: #efefef; --hol1: #e4e4e4; --hol2: #cfcfcf; --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a; --vorl: #9a3412; --vorlbg: #fff4ee;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12; --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20; --infobg: #f1f3f5;
  --runbg: #e3f2fd; --runink: #0d47a1; --flash: #fff3a8; --chipbg: #e6e6e6; --phbg: #f3f3f1; --phline: #d6d6d3; --head2: #ebebe9;

  --ok: #2e7d32; --focus: #1F77B4; --side: 250px; --radius: 8px;
  --hatch: repeating-linear-gradient(135deg, var(--hol1) 0 3px, var(--hol2) 3px 5px);

}
@media screen {
  html[data-theme=dark] {
    --red: #ff3b3b; --red-d: #ff6b6b; --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d; --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2b2d31; --head: #303236; --hover: #36383c; --solid: #44474c;
    --we: #2e3034; --hol1: #33363a; --hol2: #43464b; --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22; --vorl: #ffb088; --vorlbg: #33231a;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab; --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6; --infobg: #25282c;
    --runbg: #1a2c40; --runink: #9ccaff; --flash: #5a5220; --chipbg: #3a3c40; --phbg: #2d2f33; --phline: #4b4e54; --head2: #393b40;
    --chk-line: #4a4d52; --chk-on: #2c2e31; --chk-mark: #8a8e94;
    --monthbg: #1d1f22; --monthhead: #373a3f; --monthline: #52555b; --monthout: #191a1d;
    --ok: #7fd08a; --focus: #5aa9e6;
    color-scheme: dark;
  }
  html[data-theme=dark] button.primary { color: #fff; }
  html[data-theme=dark] .chip.demo.st-kraeftig { background: #bdbdbd; color: #1e1f21; border-color: #bdbdbd; }
  html[data-theme=dark] .backdrop { background: rgba(0,0,0,.55); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.2; }
button:hover:not(:disabled) { border-color: var(--faint); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.danger { color: var(--red-d); }
button.icon { padding: 4px 8px; min-width: 30px; }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; }
button.mini { padding: 0 3px; font-size: 9px; line-height: 12px; border-color: transparent; background: transparent; color: var(--faint); }
button.mini:hover:not(:disabled) { color: var(--ink); }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 4px 6px; background: var(--input); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
input[type=number] { width: 70px; }
input.bad { border-color: var(--red); background: var(--errbg); }
label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }

/* ---------- Kopfzeile */
header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; }
.brand .logo { height: 36px; width: auto; flex: none; display: block; }
.brand strong { display: block; font-size: 15px; }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.year { display: flex; align-items: center; gap: 4px; }
.year .y { font-size: 20px; font-weight: 700; min-width: 54px; text-align: center; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: none; border-radius: 6px; padding: 7px 11px; color: var(--ink2); font-weight: 500; }
.tab:hover { background: var(--bg); }
.tab.on { background: var(--ink2); color: #fff; }
.actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.warnbtn { font-weight: 600; color: var(--muted); }
.warnbtn.has { color: var(--warn); border-color: var(--warnline); background: var(--warnbg); }
.warnbtn .sub { font-weight: 400; }
.save { min-width: 124px; }
.save { background: var(--card); border-color: var(--line2); }
.save.ok { color: var(--ok); }
.menu { position: fixed; z-index: 85; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; min-width: 200px; }
.menu > button { display: block; width: 100%; text-align: left; border: 0; padding: 8px 12px; border-radius: 5px; }
.menu > button:hover { background: var(--bg); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu.colors { padding: 10px; min-width: 0; }
.sw-grid { display: grid; grid-template-columns: repeat(6, 26px); gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.menu .custom { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; }
.menu .custom input { width: 44px; height: 26px; padding: 0 2px; }
.banners .banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--warnbg); border-bottom: 1px solid var(--warnline); }
.banner span { flex: 1; }
.banners .banner.err { background: var(--errbg); border-bottom-color: var(--errline); color: var(--errink); }
.pathbox { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }

/* ---------- Grundlayout */
.body { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 60px); }
.body.with-side { grid-template-columns: var(--side) 1fr; }
main { padding: 16px 24px 60px; min-width: 0; overflow-x: auto; }
.view-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.view-head > p { margin: 0; flex-basis: 100%; }
.view-head .tools { margin-left: auto; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tools.sub { margin: 4px 0 14px; }
.hint { margin: 2px 0 12px; font-size: 13px; }
.empty { padding: 30px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line2); border-radius: var(--radius); margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.side-open { font-size: 12px; }
.error { padding: 20px; color: var(--red-d); }
.fatal { max-width: 640px; margin: 12vh auto; padding: 24px 28px; background: var(--card); border: 1px solid var(--errline); border-radius: 10px; color: var(--ink); }
.fatal h2 { margin: 0 0 10px; color: var(--red-d); }
input[type=date]:invalid { border-color: var(--red); background: var(--errbg); }
.banners .banner button { flex: none; }
.mergeform .mrow { padding: 8px 0; border-bottom: 1px solid var(--line); }
.mergeform .mrow:last-child { border-bottom: 0; }
.mergeform .mlab { font-weight: 600; margin-bottom: 4px; }
.mergeform .mrow .check { display: flex; gap: 6px; align-items: baseline; margin: 2px 0; }
.mergeform .mdiff { margin: 2px 0 0 26px; }
.mergeform h3 { margin: 14px 0 4px; }
.presence { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: var(--head); border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.presence.busy { background: var(--warnbg); border-color: var(--warnline); }
.logview { max-height: 60vh; overflow: auto; margin-top: 8px; }
.logent { padding: 6px 0; border-bottom: 1px solid var(--line); }
.logent ul { margin: 2px 0 0 18px; padding: 0; font-size: 13px; }
.loghead { font-size: 13px; }
.phgrid { display: grid; grid-template-columns: auto 150px auto 150px; gap: 6px 10px; align-items: center; margin: 4px 0 2px; }
td.date.wt .wtbox { display: inline-flex; align-items: center; gap: 3px; }
td.date.wt input[type=number] { width: 52px; text-align: right; }
td.date.wt .unit { font-size: 11px; color: var(--faint); }
th.h-ph { padding-right: 10px; }
th .wtswap { position: relative; z-index: 2; margin-left: 4px; padding: 0 4px; font-size: 10px; line-height: 16px; border: 1px solid var(--line2); border-radius: 4px; background: var(--card); color: var(--ink2); cursor: pointer; }
.wi.vac { filter: saturate(.8); }
.pl-row .gber { width: 104px; flex: none; font-size: 12px; margin-left: 4px; padding: 1px 2px; }
.pl-row.grp .c-name input { min-width: 50px; flex: 1; }
.pl-row .gber.on { font-weight: 600; }
.chip.demo.ph { background: var(--chipbg); }
.btable td.pcol { width: 30px; }
.inl { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Seitenleiste */
aside.side { position: sticky; top: 51px; align-self: start; max-height: calc(100vh - 51px); overflow: auto; background: var(--card); border-right: 1px solid var(--line); padding: 8px 14px 20px; font-size: 13px; }
aside.side .collapse { float: right; font-size: 12px; padding: 1px 6px; min-width: 0; }
aside.side h3 { display: flex; justify-content: space-between; align-items: baseline; }
aside.side h3 .links { text-transform: none; letter-spacing: 0; font-weight: 400; }
.tchk, .mchk { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
.mchk:hover { background: var(--bg); }
.mchk .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchk .pal { font-size: 11px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.vdot { display: inline-block; width: 14px; height: 5px; border-radius: 3px; flex: none; margin-right: 4px; vertical-align: middle; }
.legend > div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.lg { display: inline-block; width: 18px; height: 14px; border-radius: 3px; border: 1px solid var(--line2); flex: none; }
.lg.we { background: var(--we); }
.lg.hol { background: var(--hatch); }
.lg.today { border: 2px solid var(--red); }
.lg.vac { height: 5px; border: 0; background: linear-gradient(90deg, #E0A100 0 33%, #5E81AC 33% 66%, #B55D9C 66%); }

/* ---------- Markierungen S / I / P */
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 2px; border-radius: 3px; font-size: 10px; font-weight: 700; line-height: 1; border: 1px solid transparent; cursor: pointer; flex: none; }
.chip.demo { cursor: default; background: var(--chipbg); color: var(--ink2); border-color: var(--line2); }
.chip.demo.P { background: #595959; color: #fff; }
main.hl .chip:not(.hl-on):not(.demo):not(.lc), main.hl .mline:not(.hl-on) { opacity: .15; }
main.hl .chip.hl-on { transform: scale(1.25); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink); }

/* ---------- Kalender */
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
.month { background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius); overflow: hidden; }
.month > header { background: var(--ink2); color: #fff; font-weight: 700; padding: 6px 12px; font-size: 15px; }
.mgrid { display: grid; grid-template-columns: 24px repeat(7, 1fr); }
.mgrid .wh { font-size: 11px; font-weight: 600; text-align: center; color: var(--muted); padding: 3px 0; border-bottom: 1px solid var(--line); }
.mgrid .wh.kw, .mgrid .kw { font-size: 9px; color: var(--faint); font-weight: 400; }
.mgrid .kw { padding: 3px 0 0 3px; border-right: 1px solid var(--line); }
.day { position: relative; height: 48px; border-right: 1px solid var(--line3); border-bottom: 1px solid var(--line3); padding: 2px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day:nth-child(8n) { border-right: 0; }
.day.out { background: var(--soft); }
.day.we { background: var(--we); }
.day.we .dnum { color: var(--faint); }
.day.hol { background: var(--hatch); }
.day.hol .dnum { font-weight: 800; color: var(--ink2); }
.day.today { box-shadow: inset 0 0 0 2px var(--red); z-index: 1; }
.dnum { font-size: 13px; line-height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.vbars { position: absolute; left: 2px; right: 2px; bottom: 2px; display: flex; flex-direction: column; gap: 1px; }
.vbars span { height: 3px; border-radius: 2px; }
.vbars.multi span { height: 2px; }
.vcount { position: absolute; right: 1px; top: 1px; font-size: 9px; background: var(--card); border-radius: 6px; padding: 0 3px; line-height: 11px; box-shadow: 0 0 0 1px var(--line2); }
.mlist { padding: 6px 10px 8px; font-size: 11.5px; border-top: 1px solid var(--line); min-height: 28px; }
.mhol { color: var(--faint); margin-bottom: 3px; }
.mline { cursor: pointer; padding: 1px 0; width: fit-content; max-width: 100%; }   /* Hervorheben nur über der Schrift, nicht in der leeren Zeile daneben */
.mline .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.mline .lchips { display: inline-flex; gap: 2px; margin-right: 5px; vertical-align: 0; }
.mline .chip.lc { font-size: 9px; min-width: 14px; height: 14px; line-height: 12px; padding: 0 2px; cursor: pointer; }
.mline b { font-weight: 600; }
.mline.pinned { background: var(--hover); border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
.mline-edit { margin-left: 8px; font-size: 11px; line-height: 1.3; padding: 0 7px; background: var(--head); border: 1px solid var(--line); color: var(--faint); border-radius: 5px; font-weight: 400; vertical-align: 1px; }
.mline-edit:hover:not(:disabled) { color: var(--ink2); border-color: var(--line2); }
.day > .chip-edit { position: absolute; z-index: 6; top: calc(100% - 7px); left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.chip.pinned { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink); }
.mvac { margin-top: 3px; color: var(--muted); }
.vtag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; border: 1px solid; margin: 1px 3px 1px 0; color: var(--ink); }

/* ---------- Tooltip, Meldungen, Dialoge */
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 9px 11px; font-size: 13px; max-width: 360px; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
.tt-title { font-weight: 700; border-left: 4px solid; padding-left: 7px; margin-bottom: 5px; }
.tt-title.plain { border: 0; padding: 0; }
.tt-row { display: flex; align-items: center; gap: 5px; margin: 3px 0; }
.tt-row.cur { font-weight: 600; }
.tt-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
.tt-note { font-size: 12px; margin-top: 4px; font-style: italic; }
.tt-hol { font-weight: 600; margin: 3px 0; }
.tt-vac { margin-top: 4px; }
.tt-foot { color: var(--faint); font-size: 11px; margin-top: 6px; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast { background: var(--solid); color: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.2); max-width: 560px; transition: opacity .4s; }
.toast.ok { background: var(--ok); }
.toast.warn { background: var(--warn); }
.toast.err { background: var(--red-d); }
.toast.out { opacity: 0; }
.backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: 100%; max-width: 520px; max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { max-width: 720px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.modal > header h2 { margin: 0; }
.modal-body { padding: 6px 18px 12px; overflow: auto; }
.modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.modal > footer .left { margin-right: auto; }
.form { display: flex; flex-direction: column; gap: 10px; }
.frow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 4px 10px; }
.frow small { grid-column: 2; color: var(--muted); font-size: 11.5px; }
.frow input:not([type=number]):not([type=date]):not([type=checkbox]):not([type=radio]):not([type=color]), .frow textarea, .frow select { width: 100%; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.calcline { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); }
.swatch.big { width: 30px; height: 30px; }
.help p { margin: 4px 0 10px; }

/* ---------- Warnungen */
.warnpanel { position: fixed; top: var(--toph, 51px); right: 0; bottom: 0; width: min(440px, 100vw); z-index: 40; background: var(--card); border-left: 1px solid var(--line2); box-shadow: -10px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.warnpanel > header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.warnpanel h2 { margin: 0; }
.wbody { overflow: auto; padding: 0 16px 20px; }
.witem { border-left: 3px solid var(--warn); background: var(--warnbg); margin: 5px 0; padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 13px; }

.actions { padding-bottom: 6px; }

main { padding: 14px 24px 60px; }
.ghostbtn { background: transparent; border-color: transparent; color: var(--ink2); }
.ghostbtn:hover:not(:disabled) { background: var(--hover); border-color: transparent; }
label.check.small { font-size: 13px; color: var(--ink2); }

/* Filterleiste */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 12px; font-size: 13px; }
.tpill { display: inline-flex; align-items: center; gap: 6px; border-radius: 16px; padding: 4px 11px 4px 6px; background: var(--card); border-color: var(--line2); }
.tpill:not(.on) { opacity: .45; text-decoration: line-through; }
.tpill .chip { cursor: inherit; }
.filterbar .sep { width: 1px; height: 22px; background: var(--line2); margin: 0 4px; }
.fbtn { border-radius: 16px; padding: 4px 12px; background: var(--card); border-color: var(--line2); color: var(--ink2); }
.legend-inline { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
.legend-inline .lg { margin-left: 8px; width: 14px; height: 11px; }
.legend-inline .lg.vac { height: 4px; }
.menu.pop { padding: 8px; min-width: 260px; max-height: 60vh; overflow: auto; }
.pop-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 4px 6px; }
.mchk { display: flex; align-items: center; gap: 7px; padding: 4px; border-radius: 5px; cursor: pointer; }
.mchk:hover { background: var(--bg); }
.mchk .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchk .pal { font-size: 11px; color: var(--muted); }

/* Bereiche zum Ein-/Ausklappen */
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
.sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px 8px 8px; min-height: 48px; }
.sec-tog { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px; font-size: 16px; font-weight: 700; color: var(--ink); border-radius: 6px; }
.sec-tog:hover { background: var(--hover); }
.chev { width: 14px; color: var(--muted); font-size: 13px; }
.sec-sum { color: var(--muted); font-size: 13px; }
.info { color: var(--faint); cursor: help; font-size: 14px; }
.sec-h .tools { margin-left: auto; gap: 6px; }
.sec-b { padding: 0 12px 12px; }
.sec.closed { background: var(--soft); }
.sec .tablewrap, .sec .tl { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.sec .agenda { max-width: none; }
.sec .cal { margin-top: 0; }

/* hellere Kopfzeilen */
table.grid th { background: var(--head); color: var(--muted); border-bottom: 1px solid var(--line); font-size: 11.5px; }
table.grid th input { margin: 0; }
.mtable th { white-space: normal; line-height: 1.15; vertical-align: bottom; }
td.vis, th.h-vis { width: 28px; text-align: center; }
.mtable tr.hidden-m td:not(.vis) { opacity: .45; }
.month { background: var(--monthbg); border-color: var(--monthline); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.month > header { background: var(--monthhead); color: var(--ink); font-size: 14.5px; font-weight: 700; padding: 7px 12px; border-bottom: 1px solid var(--monthline); }
.month .day.out { background: var(--monthout); }
.mgrid .wh { border-bottom-color: var(--line3); }
.mgrid .kw { border-right-color: var(--line3); }
.day { border-right-color: var(--line3); border-bottom-color: var(--line3); }
.mlist { border-top-color: var(--line3); }
.pl-row.head { background: var(--head); }
.pl-row.head > div { color: var(--muted); }
.g-head { background: var(--head); border-bottom: 1px solid var(--line); }
.g-head > div { color: var(--ink2); border-left-color: var(--line); }
.g-head .gw { color: var(--faint); }
.g-head .gd.we { background: var(--we); }
.pl-split { border-color: var(--line); }
.ptab.on { background: var(--card); color: var(--ink); border-color: var(--c); box-shadow: inset 0 -3px 0 var(--c); }
.ptab.on .muted { color: var(--muted); }
.aweek h3 { background: var(--soft); }

.tl-months > div { overflow: clip; }
.tl-months > div > span { position: sticky; left: calc(var(--lab) + 6px); }
.mtable td.name { min-width: 176px; }
.mtable td.resp { width: 96px; }
.mtable td.resp input { width: 90px; }
.mtable td select { max-width: 78px; }
.mtable td.art { min-width: 66px; }
.mtable td.art select { min-width: 60px; }
.mtable { font-size: 12.5px; }
.mtable td.num { width: 58px; }
.mtable td.num input { width: 52px; }
.mtable td.pal input { width: 128px !important; }
.mtable td.hinweis { min-width: 120px; }
table.grid td { padding: 3px 4px; }
/* ruhigere Häkchen */
input[type=checkbox], input[type=radio] { appearance: none; -webkit-appearance: none; width: 15px; height: 15px; margin: 0; padding: 0; flex: none;
  border: 1px solid var(--chk-line); border-radius: 3px; background: var(--input); display: inline-grid; place-content: center; cursor: pointer; vertical-align: -3px; }
input[type=radio] { border-radius: 50%; }
input[type=checkbox]:checked, input[type=radio]:checked { background: var(--chk-on); }
input[type=checkbox]:checked::after { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid var(--chk-mark); border-bottom: 2px solid var(--chk-mark); transform: rotate(-45deg); }
input[type=radio]:checked::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--chk-mark); }
input[type=checkbox]:hover, input[type=radio]:hover { border-color: var(--faint); }
input[type=checkbox]:focus-visible, input[type=radio]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input[type=checkbox].done { width: 17px; height: 17px; }
.sec-h .tools.lead { margin-left: 6px; gap: 6px; }
.sec-h .sep { width: 1px; height: 22px; background: var(--line2); margin: 0 2px; }
.sec-h .legend-inline { margin-left: 0; }
/* Maßnahmentabelle: feste Spalten, Breite ziehbar */
.mtable { table-layout: fixed; }
.mtable th { position: relative; overflow: hidden; text-overflow: ellipsis; }
.mtable th .chip { margin-left: 5px; vertical-align: -2px; }
.mtable td { overflow: hidden; }
.mtable td.date { white-space: nowrap; }
.mtable td.date input { width: calc(100% - 16px) !important; padding-left: 3px; padding-right: 1px; }
.mtable td.derived-date span:first-child { padding-left: 5px; color: var(--ink2); }
.col-rs { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; }
.col-rs:hover, body.resizing .col-rs { background: rgba(0,0,0,.08); }
body.resizing, body.resizing * { cursor: col-resize !important; }
.pill.ghost { color: var(--faint); border-color: var(--line); }
.pill.ghost:hover { color: var(--ink2); border-color: var(--line2); }
.tpill .lg.vac { width: 16px; height: 5px; border: 0; }
/* Verbindungslinie beim Überfahren einer Maßnahme */
.day > * { position: relative; z-index: 1; }
.day > .vbars { position: absolute; }
.day.span::before { content: ''; position: absolute; left: 0; right: 0; top: 25px; height: 4px; background: var(--hcl) left / 50% 100% no-repeat, var(--hcr) right / 50% 100% no-repeat; opacity: .9; z-index: 0; }
/* Verbund-Darstellung: dauerhafte Linien je Maßnahme, eigene Spur je Überlappung */
.cal.verbund .day { height: 58px; }
.day > .vbl { position: absolute; left: 0; right: 0; top: calc(37px + var(--ln) * 4px); height: 3px; background: var(--hcl) left / 50% 100% no-repeat, var(--hcr) right / 50% 100% no-repeat; opacity: .9; z-index: 0; pointer-events: none; }
.day > .vbl.one { left: 44%; right: 44%; background: var(--hc); }
main.hl .vbl:not(.hl-on) { opacity: .12; }
main.hl .day > .vbl.hl-on { opacity: 1; height: 4px; margin-top: -.5px; }
/* Zeitleiste: Namen anklickbar */
.tl-lab.clickable, .tl-lab.clickable .nm { cursor: pointer; }
.tl-lab.clickable:hover .nm { text-decoration: underline; }
/* Ziehen und Zoomen */
.chip { cursor: grab; touch-action: none; }
.chip.dragsrc { opacity: .25; }
.chip.ghost { position: fixed; z-index: 99; pointer-events: none; transform: scale(1.35); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.day.drop { box-shadow: inset 0 0 0 2px var(--dc); background: var(--card); }
.day.drop::after { content: attr(data-drop); position: absolute; right: 2px; top: 1px; font-size: 9px; font-weight: 800; color: var(--dc); }
.tl { cursor: grab; }
.tl.panning, .tl.panning * { cursor: grabbing !important; }
.tl-months .mz { cursor: zoom-in; }
.tl-months .mz:hover { background: var(--hover); }
.pl-gantt { cursor: grab; }
.pl-gantt.panning { cursor: grabbing; }

@media (max-width: 1480px) {

}

/* ---------- Startbildschirm */
.splash { position: fixed; inset: 0; z-index: 300; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: opacity .4s ease; }
.splash.out { opacity: 0; pointer-events: none; }
.splash-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -4vh; }
.splash-anim { width: min(340px, 46vh); height: min(340px, 46vh); }
.splash-anim svg { width: 100%; height: 100%; display: block; }
.splash-logo { height: 51px; width: auto; margin-top: -58px; }
.splash-ver { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--faint); letter-spacing: .03em; }
html[data-theme=dark] .splash { background: var(--bg); }
html[data-theme=dark] .brand .logo { height: 33px; }

/* ---------- Druck */
@page { size: A4 landscape; margin: 0; }   /* ohne Rand druckt der Browser keine Kopf-/Fußzeile (Dateipfad, Titel) */

  body { background: #fff; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  h1 { font-size: 14px; }

  .vcount { font-size: 6px; line-height: 7px; }
  .tl-lab .wicon { display: none; }
  select { appearance: none; -webkit-appearance: none; }

  .mtable td.hinweis input { font-size: 9px; }

  .dnum { font-size: 8.5px; line-height: 10px; margin-right: 1px; }
  .chips { gap: 1px; }

  .mlist { font-size: 7.5px; padding: 2px 5px; min-height: 0; }
  .tl, .tablewrap, .pl-split, .card { border-color: #ccc; overflow: visible; }
  .tl-row { height: 24px; }
  .pd-page .tl-row { break-inside: avoid; }
  .seg { top: calc(5px + var(--ln, 0) * 14px / var(--lns, 1)); height: calc(14px / var(--lns, 1)); } .handle { top: 3px; height: 18px; } .dia { top: 5px; width: 14px; height: 14px; margin-left: -7px; }
  table.grid { font-size: 9.5px; }

  .pl-row { grid-template-columns: 0 190px 70px 80px 110px 36px 86px 86px 0; height: 24px; font-size: 9.5px; }
  .pl-row.compact { grid-template-columns: 0 220px 0; }
  .pl-row .c-grip, .pl-row .c-acts, .pl-divider { visibility: hidden; }
  .pl-split { grid-template-columns: auto 0 1fr; }
  .addrow { display: none !important; }
  .g-row { height: 24px; } .g-bar { top: 5px; height: 13px; } .g-dia { top: 6px; }
  .pl-row.head, .g-head { height: 40px; }
  .g-head .gd { display: none; }
  .umatrix .um-lab { width: 110px; }
  /* PDF-Jahresübersicht */
  body.printdoc-mode #app, body.printdoc-mode #toasts, body.printdoc-mode .menu, body.printdoc-mode #tip { display: none !important; }
  body.printdoc-mode #printdoc { display: block; }
  .pd-page { break-after: page; padding: 0 10mm; }
  .pd-page.last { break-after: auto; }
  .pd-page .tl { overflow: visible; }
  .pd-frame { width: 100%; border-collapse: collapse; }
  .pd-frame > thead > tr > td, .pd-frame > tbody > tr > td, .pd-frame > tfoot > tr > td { padding: 0; border: 0; vertical-align: top; }
  .pd-sp { height: 9mm; }
  .pd-plan .phead { padding: 4px 10px; margin-bottom: 6px; gap: 4px 16px; }
  .pd-plan .phead h2 { font-size: 13px; }

  .pd-urlaub .cols2 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }

  .pd-plan .pl-row.grp .c-name input, .pd-plan .pl-row input { font-size: 9px; padding: 0 2px; }
  .pd-plan .g-bar { top: 2px; height: 10px; } .pd-plan .g-bar .lbl { font-size: 7.5px; line-height: 8px; } .pd-plan .g-dia { top: 3px; width: 8px; height: 8px; margin-left: -4px; }

.newplan .wtbox { display: inline-flex; align-items: center; gap: 4px; }
.newplan .wtbox input { width: 64px; }
.newplan .wtbox .unit { font-size: 11px; color: var(--faint); }
.newplan input.bad { border-color: var(--red); box-shadow: 0 0 0 2px var(--errbg); }
.newplan .np-msg { color: var(--errink); font-weight: 600; min-height: 1.2em; margin: 2px 0 4px; }

.newplan .np-big { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; min-height: 84px; text-align: left;
  border: 1px solid var(--line2); border-radius: 10px; background: var(--card); cursor: pointer; }
.newplan .np-big b { font-size: 17px; color: var(--ink); }
.newplan .np-big span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.newplan .np-big:hover { border-color: var(--red); box-shadow: 0 0 0 2px rgba(227,7,20,.12); }
.newplan .np-copybtn { width: 100%; padding: 9px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--head); color: var(--ink2); font-weight: 600; cursor: pointer; }
.newplan .np-copybtn:hover { background: var(--hover); }
.newplan .np-copy { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 240px; overflow: auto; }
.newplan .np-copy:empty { display: none; }
.newplan .np-src { display: flex; align-items: center; gap: 8px; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); cursor: pointer; }
.newplan .np-src:hover { border-color: var(--line2); background: var(--hover); }

/* 0.8.2 Detailplan: Kopf mit Name + PAL oben (Legende rechts), Starts darunter */

const CHANGELOG = [{"version": "0.8.6", "date": "2026-09-30T11:28", "items": ["PDF-Export von Detailplänen: die Tabelle links wird nur noch eingeklappt, wenn sie in der Ansicht eingeklappt ist – sonst kommen alle Spalten mit ins PDF. „Wie aktuelle Ansicht“ übernimmt auch eingeklappte Abschnitte", "Neues Häkchen im PDF-Fenster: „Detailpläne: nur Arbeitsschritte (Tabelle eingeklappt, Gantt breiter)“ – vorbelegt wie die aktuelle Ansicht", "PDF mit voller Tabelle: schmalere Spalten, Gantt passt vollständig aufs Blatt, Auswahlfelder ohne Pfeile, PAL ohne Rahmen"]}, {"version": "0.8.5", "date": "2026-09-30T11:20", "items": ["Maßnahmen-Tabelle in der Werktage-Ansicht: Spaltenköpfe „Zeit bis PAL für“ / „Selektion“ (bzw. Inhalt, Produktion)", "Leere Datumsfelder in der Maßnahmen-Tabelle zeigen einen hellgrauen Strich mit dezentem Kalendersymbol statt „tt.mm.jjjj“; Klick auf den Strich öffnet das Feld zum Eintippen, Klick aufs Symbol die Datumsauswahl", "Kalendersymbole in der Maßnahmen-Tabelle dezenter (beim Darüberfahren deutlicher)"]}, {"version": "0.8.4", "date": "2026-09-30T11:05", "items": ["Detailplan: das Zeichen des Bereichs (z. B. S, I, D, X) steht jetzt in der Abschnittszeile statt am ersten Arbeitsschritt; die Auswahl daneben zeigt nur noch den Namen", "Detailplan-Gantt: alle Abschnittsbalken wieder einheitlich grau – auch bei neuen Bereichen oder einer eigenen Linie (die Linien-Einstellung gilt für Kalender und Zeitleiste)", "„+ Aufgabe“ und „+ Abschnitt“ ganz hellgrau, damit sie in den Hintergrund treten (beim Darüberfahren dunkler)"]}, {"version": "0.8.3", "date": "2026-09-30T10:20", "items": ["Einstellungen „Bereiche und Markierungen“: je Bereich zusätzlich die Linie wählbar – abgestuft (wie bisher, von hell nach kräftig), pastell, kräftig, gestreift oder nur Rahmen, mit Vorschau", "Die Linie gilt für die Verbindungslinie im Kalender (auch in der Verbund-Darstellung), die Balken der Bereiche in der Zeitleiste, die Abschnittsbalken im Detailplan-Gantt (Abschnitte ohne Bereich bleiben grau) sowie PDF und Excel-Zeitleiste"]}, {"version": "0.8.2", "date": "2026-09-30T09:54", "items": ["Maßnahmen-Tabelle: Schalter „Datum – Werktage“ dezenter und heller; Werktage-Felder ohne Pfeile – eintippen oder ins Feld klicken und mit dem Mausrad hoch/runter", "Detailplan-Kopf neu geordnet: oben Name und PAL, die Legende oben rechts; darunter die Starts der Bereiche. Die Knöpfe −/+/Zurücksetzen sind weg (Zoomen weiter mit dem Mausrad, ganz herausdrehen zeigt den ganzen Plan)", "Detailplan-Tabelle: „+ Aufgabe“ (statt „+ neuer Arbeitsschritt“) legt ohne Fenster direkt eine neue Zeile an – Name ist markiert, einfach lostippen; im ⋯-Menü „Neue Aufgabe darunter“", "Detailplan-Tabelle ruhiger: Griffe und Auswahlpfeile heller, Kopfzeile etwas dunkler, Kommentare hellgrau kursiv, Bereich am Abschnitt dezenter (der Abschnittsname hat mehr Platz), rechts erst die Anzahl der Schritte, dann der Zeitraum", "Einstellungen „Bereiche und Markierungen“: Zeichen und Begriff je Bereich und für das PAL änderbar, weitere Bereiche mit eigenem Buchstaben; Aussehen je Markierung: pastell, kräftig, gestreift oder nur Rahmen – gilt im Kalender, in der Zeitleiste, in Tabellen, PDF und Excel. Voreinstellung wie bisher"]}, {"version": "0.8.1", "date": "2026-09-30T08:55", "items": ["Maßnahmen-Tabelle: Spaltenköpfe zweizeilig („Start der“ / „Selektion“, „Start des“ / „Inhalts“, „Start der“ / „Produktion“), Köpfe und Werte der Bereiche linksbündig", "Die Spalten der Bereiche sind grau hinterlegt und durch Striche getrennt; darüber sitzt ein Schalter „Datum – Werktage“ (ersetzt den alten Umschalter oben rechts)", "Spaltenbreite ziehen: es ändert sich nur die Nachbarspalte rechts, alle anderen bleiben stehen. Die Breiten bleiben nach Neustart und Programm-Update erhalten (je Rechner)", "Detailplan anlegen: PAL ist Pflicht; die Starts der Bereiche wahlweise als Datum oder als Werktage bis zum PAL (das andere rechnet sich aus). Dann „Einfach“ (nur die Bereiche und PAL), „Komplex“ (Aufbau wie Sommer-/Weihnachtsmailing, ohne Personen) oder „Kopie aus vorherigem Plan“"]}, {"version": "0.8", "date": "2026-09-29T17:06", "items": ["Bereiche: Selektion (S), Inhalt (I) und neu Produktion (D) bis zum PAL – überall im Programm (Tabelle, Kalender, Zeitleiste, Detailpläne, Was steht an?, Outlook, Excel, PDF). Weitere Bereiche mit eigenem Buchstaben lassen sich in den Einstellungen anlegen", "Ein Bereich läuft von seinem Start bis zum nächsten Start (der letzte bis zum PAL); bei Bedarf mit eigenem Ende (Bearbeiten-Fenster) – bei Detailplänen ergibt sich der Zeitraum aus den Schritten des Abschnitts", "Detailpläne: jeder Abschnitt wird einem Bereich zugeordnet; neue Vorlage „Bereiche“ (je Bereich ein Abschnitt, dann PAL). Sommer- und Weihnachtsmailing wurden automatisch umgestellt („Mailing“ geteilt in Inhalt und Produktion)", "Maßnahmen-Tabelle: Umschalter „📅 Datum | ⏱ Werktage“ – die Starts als Datum oder als Werktage bis zum PAL (auch eintippen); 🏖-Hinweis, wenn jemand, der im Detailplan in diesem Bereich eingetragen ist, Urlaub hat", "Kalender: Terminliste mit den Symbolen links und ohne Datum; „Bearbeiten“ steht nach einem Klick hinter den Zeilen der Maßnahme (nicht mehr unter der Markierung); die Verbindungslinie wird je Bereich kräftiger", "Zeitleiste: je Bereich ein Balken mit Griff; überlappende Bereiche liegen übereinander", "Wer arbeitet gerade? Anzeige „👥 Name“ in der Kopfzeile und ein Hinweis, wenn jemand anderes gerade ändert (über OneDrive, kann etwa eine Minute nachhinken)", "Änderungsprotokoll: bei jedem Speichern wird festgehalten, wer was geändert hat (⋯ → Änderungsprotokoll, auch als Blatt „Änderungen“ in der Excel-Ansicht)", "Datenprüfung: Auffälligkeiten (ungültige Daten, Leerzeichen in Namen, lose Verknüpfungen …) werden gemeldet und auf Knopfdruck repariert (⋯ → Daten prüfen)", "Doppelklicks lösen nichts mehr doppelt aus (✕ löscht nur einen Eintrag, „+ Maßnahme“ legt eine an, Fenster bleiben offen)", "Farbwahl im Bearbeiten-Fenster funktioniert; Menüs öffnen am unteren Rand nach oben; die Warnliste verdeckt bei 150 % Skalierung keine Knöpfe mehr", "PDF: die Zeitleiste wird auf mehrere Seiten verteilt, jede Seite mit Monatsleiste"]}, {"version": "0.7", "date": "2026-09-29T14:52", "items": ["Update-Schutz: Ein noch offenes Fenster mit älterer Version erkennt eine neuere Programmversion im Ordner, speichert nicht mehr und bittet um Neustart – das Update wird nicht mehr zurückgedreht", "Speichern: klappt es einmal nicht (Datei kurz gesperrt), versucht die App es automatisch erneut und zeigt ehrlich „Nicht gespeichert“ an; die Excel-Ansicht wird ebenfalls nachgeholt", "Gleichzeitiges Arbeiten: Konflikte lassen sich zusammenführen – Änderungen beider Seiten bleiben erhalten, nur bei echten Überschneidungen fragt die App", "OneDrive-Konfliktkopien im Mailing-Ordner werden erkannt; Vergleichen, Übernehmen und Wegräumen per Knopf. Hinweis, wenn eine Kopie statt der Hauptdatei geöffnet ist", "Startknopf öffnet immer die Hauptdatei (nicht mehr versehentlich eine Kopie)", "Ungespeicherte Änderungen aus dem Browser gehen nicht mehr verloren, wenn inzwischen jemand anderes gespeichert hat – sie werden zusammengeführt", "„Maßnahme bearbeiten“ überschreibt keine Änderungen anderer mehr (nur die im Fenster geänderten Felder werden übernommen)", "Datumsfelder: nur vollständige Daten im Bereich Planungsjahr ± 5 Jahre; Tippfehler wie „20277“ oder „27“ werden abgewiesen, halb gelöschte Daten nicht mehr als „leer“ gespeichert", "Warnungen bei unplausiblen Terminen (Start nach dem PAL, Termine Jahre vom PAL entfernt, extrem lange Urlaube); solche Werte bremsen die Ansichten nicht mehr aus", "„Alle vorziehen“: erst PAL, dann Start Selektion/Inhalt – nichts landet mehr neu auf einem Wochenende; auch beim einzelnen PAL-Vorziehen", "Ziehen im Kalender, in der Zeitleiste und im Detailplan: Rechtsklick, Esc oder Fensterwechsel brechen sauber ab (nichts bleibt „hängen“, nichts wird versehentlich verschoben)", "Beschädigte Datei: die App startet nicht mehr leer, sondern sperrt das Speichern und bietet Wege zur Wiederherstellung an", "Excel-Ansicht in Teams zeigt immer das Planungsjahr aus den Einstellungen – nicht das Jahr, das jemand gerade ansieht", "Programm-Update warnt, wenn die gewählte Datei älter ist als die installierte Version", "Strg+S in einem offenen Fenster öffnet keinen zweiten Dialog mehr; ein Fehler mitten in einer Änderung nimmt die Änderung vollständig zurück", "Interne Tests liegen jetzt im Projekt (Ordner tests)"]}, {"version": "0.6.4", "date": "2026-09-29T10:15", "items": ["Kalender: auch Klick auf P hält die Maßnahme hervorgehoben, „Bearbeiten“ erscheint darunter"]}, {"version": "0.6.3", "date": "2026-09-28T17:10", "items": ["Kalender: Klick auf S oder I hält die Maßnahme hervorgehoben, „Bearbeiten“ erscheint direkt darunter (P öffnet weiterhin direkt)", "Kalender: Verbindungslinie zweifarbig – vom ersten zum zweiten Termin heller, vom zweiten zum dritten kräftig (auch in der Verbund-Darstellung)", "Startbildschirm: Malteser-Logo 50 % größer"]}, {"version": "0.6.2", "date": "2026-09-28T17:00", "items": ["Kalender: Klick auf eine Zeile der Terminliste hält die Maßnahme hervorgehoben – daneben erscheint „Bearbeiten“; andere Maßnahmen lassen sich währenddessen per Maus hervorheben; Klick woanders (oder Esc) hebt die Auswahl auf"]}, {"version": "0.6.1", "date": "2026-09-28T16:43", "items": ["Kalender: Terminliste unter den Monaten hebt nur noch hervor, wenn die Maus über der Schrift steht"]}, {"version": "0.6", "date": "2026-09-28T16:21", "items": ["Dunkles Design: weißes Malteser-Logo (Kopfzeile und Startbildschirm)", "Start Selektion und Start Inhalt lassen sich auch bei Maßnahmen mit Detailplan ziehen (Zeitleiste, Kalender) oder in der Tabelle eintippen – die Dauer der Arbeitsschritte davor passt sich an", "Verbund-Darstellung: beim Überfahren nur noch eine, hervorgehobene Linie", "Kalender: Monate deutlicher abgesetzt (Kopfleiste, Rahmen, eigene Fläche)", "Feiertage zweispaltig – halb so hoch"]}, {"version": "0.5.2", "date": "2026-09-28T15:51", "items": ["Warnung, wenn die geöffnete Datei und der Speicherort nicht zusammenpassen (zwei Kopien arbeiten aneinander vorbei), mit Knopf „Speicherort neu wählen“", "Einstellungen zeigen, welche Datei geöffnet ist und in welchen Ordner gespeichert wird", "Programm-Update erkennt diesen Fall auch, wenn die Kopie in einem Ordner „Jahresplanung…“ liegt"]}, {"version": "0.5.1", "date": "2026-09-28T15:37", "items": ["Programm-Update: verbindet zuerst den Mailing-Ordner, prüft danach, ob die neue Version wirklich in der Datei steht, und meldet jeden Fehler mit Grund", "Programm-Update: Ausweg „Aktualisierte Datei herunterladen“, falls das Speichern im Ordner nicht klappt", "Programm-Update: Hinweis, wenn die App aus einem anderen Ordner geöffnet wurde als dem Mailing-Ordner"]}, {"version": "0.5", "date": "2026-09-28T15:25", "items": ["Startbildschirm mit Animation in Malteser-Farben, Logo und Versionsnummer (abschaltbar in den Einstellungen, Klick überspringt)", "Dunkles Design: Kästen heller abgesetzt, damit sie sich klar vom Hintergrund abheben", "Warnungen: Knopf zeigt ✓, wenn nichts zu prüfen ist; Anzeige aktualisiert sich zuverlässig nach dem Freigeben des Ordners", "Outlook-Export: Liste aller Termine, die in der Datei landen – passt sich der Auswahl an", "Kalender: Verbund-Darstellung dauerhaft ein-/ausblendbar (auch im PDF)", "Feiertage: kompaktere Tabelle ohne Erklärtexte"]}, {"version": "0.4", "date": "2026-09-28T14:28", "items": ["Einstellungen: Personen verwalten (Name, Farbe), dunkles Design, Versionsnummer und Änderungsliste", "Einstellungen: Standard-Vorlauf und „Max. Starts pro Woche“ entfernt", "Programm-Update einspielen, ohne dass Daten verloren gehen (⋯-Menü)", "PDF-Export mit Auswahl von Bereichen und Maßnahmen, „Wie aktuelle Ansicht“, ohne Dateipfad und Browser-Kopfzeile", "Outlook-Export: Terminarten, Maßnahmen, Person, Zeitraum wählbar; Aufteilung in mehrere Dateien; alle Termine ganztägig", "Jahresplanung: Kopfzeile repariert, Auflage linksbündig, S/I/P rechts der Beschriftung, „PAL-Status“, PAL nur bei „vorläufig“ farbig, hellere Häkchen", "Warnungen: Vorziehen auch bei Feiertagen, bei Detailplänen und beim PAL", "Zeitleiste: S/I/P-Knöpfe bei „Was steht an?“, Hervorheben ohne durchscheinende Wochenenden, Werktage vor PAL, Maßnahmen-Auswahl bleibt offen", "Detailpläne: ganze Abschnitte einer Person zuordnen, neue Schritte standardmäßig eine Woche lang", "Urlaub & Feiertage: Feiertage lassen sich umbenennen, verschieben und abschalten"]}, {"version": "0.3", "date": "2026-09-28T09:23", "items": ["Malteser-Logo, Datensicherung exportieren/importieren, PDF-Jahresübersicht (3 Seiten)", "Maßnahmen-Tabelle: Start Selektion/Inhalt als Datum statt Vorlauf, Spaltenbreiten ziehbar, „Hauptverantwortlich“", "Kalender: Verbindungslinie beim Überfahren, Urlaub-Knopf zum Ein-/Ausblenden", "Zeitleiste: Mausrad-Zoom, Klick auf den Namen zeigt die ganze Maßnahme, Markierungen in der Tagesmitte", "Detailpläne: Abschnitte einklappen, Zeilen ziehen, Farbe je Person, Balken verschieben und in der Länge ändern, Zoom", "Urlaub: Dialog „neuen Urlaub eintragen“"]}, {"version": "0.2", "date": "2026-09-25T19:50", "items": ["Weniger Reiter, einklappbare Bereiche, Termine im Kalender ziehen, Monats-Zoom in der Zeitleiste", "Startknopf für den Mailing-Ordner (eigenes Programmfenster)", "Automatisches Speichern im Mailing-Ordner, Excel-Ansicht für Kolleg:innen in Teams"]}, {"version": "0.1", "date": "2026-09-25T13:28", "items": ["Erste Programmversion aus der Excel-Jahresplanung: Kalender, Zeitleiste, Detailpläne mit Gantt, Urlaub, Warnungen, Export nach Excel, Outlook und PDF"]}];

/* ---------- Feiertage (NRW, bearbeitbar) inkl. eigener freier Tage */
// D.feiertage: { 'JJJJ-MM-TT' (gesetzliches Datum): { name?, datum?, off? } }
let _holYear = new Map();

}

/* ---------- Detailplan: Rückwärtsterminierung wie im Excel-Gantt */
const MAX_DAUER = 730;                        // längste Dauer eines Arbeitsschritts in Tagen
const FAR = 1100;                             // Termine mehr als ~3 Jahre vom PAL entfernt: Tippfehler vermuten
function planCalc(m) {
  const pal = dn(m.pal), steps = m.plan ? m.plan.steps : [];
  const byId = new Map(steps.map(s => [s.id, s]));
  const res = new Map(), busy = new Set();
  function calc(s) {
    if (res.has(s.id)) return res.get(s.id);
    if (busy.has(s.id)) return { start: null, end: null, err: 'Zirkelbezug' };
    busy.add(s.id);
    let e = null, err = null;
    const a = s.anker || { art: 'offen' }, off = +a.offset || 0;
    if (s.typ !== 'gruppe') {
      if (a.art === 'pal') e = pal != null ? pal + off : null;
      else if (a.art === 'fest') { e = dn(a.datum); if (e == null && a.datum) err = 'ungültiges Datum „' + a.datum + '“'; }
      else if (a.art === 'start' || a.art === 'ende') {
        const r = byId.get(a.ref);
        if (!r) err = 'Bezug fehlt';
        else { const rc = calc(r); if (rc.err) err = rc.err; const b = a.art === 'start' ? rc.start : rc.end; e = b != null ? b + off : null; }
      }
    }
    const dur = s.typ === 'aufgabe' ? clamp(Math.round(+s.dauer || 0), 0, MAX_DAUER) : 0;
    const out = { start: e != null ? e - dur : null, end: e, err };
    busy.delete(s.id);
    res.set(s.id, out);
    return out;
  }
  steps.forEach(calc);
  // Bereiche: Abschnitte mit Buchstaben; Start = festgelegter Beginn-Schritt oder frühester Schritt, Ende = spätester Schritt
  const ph = {};
  let cur = null;
  for (const s of steps) {
    if (s.typ === 'gruppe') { cur = s.bereich || null; continue; }
    if (!cur) continue;
    const r = res.get(s.id); if (!r || r.start == null) continue;
    const o = ph[cur] || (ph[cur] = { start: r.start, end: r.end, mark: s.id, steps: [] });
    o.steps.push(s.id);
    if (r.start < o.start) { o.start = r.start; o.mark = s.id; }
    if (r.end > o.end) o.end = r.end;
  }
  const marks = (m.plan && m.plan.marks) || {};
  for (const k of Object.keys(ph)) { const mk = marks[k]; if (mk && ph[k].steps.includes(mk)) { ph[k].mark = mk; ph[k].start = res.get(mk).start; } }
  return { map: res, ph };
}

/* ---------- Alles Abgeleitete für eine Darstellung */
let C = null;
// Ende je Bereich: eigenes Ende, sonst der nächste spätere Start, sonst das PAL
function phaseEnds(st, enx, pal) {
  const en = {}, all = Object.values(st);

    const nx = all.filter(v => v > st[k]);
    en[k] = nx.length ? Math.min(...nx) : pal != null ? Math.max(pal, st[k]) : st[k];
  }
  return en;
}
function derive() {
  _holYear = new Map();
  const keys = PH().map(p => p.key);
  const ms = D.massnahmen.map(m => {
    const pal = dn(m.pal), st = {}, enx = {};
    let pc = null;
    if (m.plan) { pc = planCalc(m); for (const k of keys) if (pc.ph[k]) { st[k] = pc.ph[k].start; enx[k] = pc.ph[k].end; } }
    else if (pal != null) for (const k of keys) {
      const v = m.vorlauf && m.vorlauf[k], e = m.ende && m.ende[k];
      if (isNum(v)) { st[k] = pal - v; if (isNum(e)) enx[k] = Math.max(st[k], pal - e); }
    }
    return { m, id: m.id, pal, st, en: phaseEnds(st, enx, pal), enx, pc, color: m.farbe || '#7F7F7F', s: st.S ?? null, i: st.I ?? null };
  });
  ms.sort((a, b) => (a.pal ?? 1e9) - (b.pal ?? 1e9) || a.m.name.localeCompare(b.m.name, 'de'));
  const byId = new Map(ms.map(x => [x.id, x]));
  const vac = D.urlaube.map(u => ({ u, von: dn(u.von), bis: dn(u.bis) || dn(u.von) })).filter(v => v.von != null && v.bis >= v.von)
    .map(v => v.bis - v.von > 400 ? Object.assign(v, { bis: v.von + 400, tooLong: true }) : v);   // Tippfehler im Jahr bremst sonst alle Ansichten
  C = { ms, byId, vac };

}
const vacOn = n => C.vac.filter(v => v.von <= n && n <= v.bis);
const visibleM = x => !UI.hiddenM.has(x.id);
const TYPE_LABEL = new Proxy({}, { get: (o, t) => t === 'P' ? 'PAL (Briefkasten)' : typeof t === 'string' ? startLabel(t) : undefined });
const showType = t => !UI.show || UI.show[t] !== false;             // neue Bereiche sind automatisch sichtbar

// Termine (S/I/P) eines Zeitraums, gefiltert nach Anzeige
function eventsIn(a, b, all = false) {
  const out = [];

    if (!all && !visibleM(x)) continue;
    for (const t of evKeys()) {

}
const inYear = (x, y) => [...Object.values(x.st), x.pal].some(n => n != null && ymd(n)[0] === y);
// Arbeitsschritte eines Bereichs im Detailplan, deren zugeordnete Person in dieser Zeit Urlaub hat
function phaseVacations(x, k) {

/* ---------- Warnungen */
function computeWarnings() {
  const W = [], y = UI.year, today = todayDn();
  const relevant = C.ms.filter(x => inYear(x, y) || x.pal == null);
  for (const x of relevant) {
    const nm = x.m.name || '(ohne Namen)';
    if (x.pal == null) { W.push(x.m.pal ? { lvl: 'warn', mid: x.id, text: `${nm}: PAL „${x.m.pal}“ ist kein gültiges Datum – bitte prüfen` } : { lvl: 'info', mid: x.id, text: nm + ': kein PAL eingetragen' }); continue; }
    const chk = (n, lab, t) => {
      if (n == null) return;
      const w = wd(n), hn = holName(n), isPal = t === 'P';
      const planLocked = !isPal && x.m.plan && !(x.pc && x.pc.ph[t]);
      const fix = planLocked ? null : { t, to: isPal ? prevPalDay(n) : prevWorkday(n) };
      if (hn) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf den Feiertag „${hn}“ (${fmtW(n)})` });
      else if ((!isPal && w >= 5) || (isPal && w === 6)) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf einen ${WDL[w]} (${fmtD(n)})` });
      const resp = (x.m.verantwortlich || '').trim();
      const away = vacOn(n).filter(v => !resp || v.u.wer === resp);
      if (away.length && !isPal) W.push({ lvl: resp ? 'warn' : 'info', mid: x.id, n,
        text: `${nm}: ${lab} am ${fmtW(n)} – im Urlaub: ${[...new Set(away.map(v => v.u.wer || '?'))].join(', ')}` });
    };
    for (const p of PH()) chk(x.st[p.key], startLabel(p.key), p.key);
    chk(x.pal, 'PAL', 'P');
    for (const p of PH()) {
      const n = x.st[p.key], lab = startLabel(p.key);
      if (n == null) continue;
      if (n > x.pal) W.push({ lvl: 'warn', mid: x.id, n, text: `${nm}: ${lab} (${fmtD(n)}) liegt nach dem PAL (${fmtD(x.pal)}) – Datum prüfen` });
      else if (x.pal - n > FAR) W.push({ lvl: 'warn', mid: x.id, n, text: `${nm}: ${lab} (${fmtD(n)}) liegt mehr als drei Jahre vor dem PAL – Datum prüfen` });
    }
    const def = PH().filter(p => x.st[p.key] != null);
    for (let j = 1; j < def.length; j++) if (x.st[def[j].key] < x.st[def[j - 1].key])
      W.push({ lvl: 'info', mid: x.id, text: `${nm}: ${startLabel(def[j].key)} liegt vor ${startLabel(def[j - 1].key)}` });
    if (x.pc) for (const s of x.m.plan.steps) {
      const r = x.pc.map.get(s.id);
      if (!r) continue;
      if (r.err) W.push({ lvl: 'warn', mid: x.id, step: s.id, text: `${nm} › ${s.name}: ${r.err}` + (/^ungültig/.test(r.err) ? ' – Datum prüfen' : ' in der Verknüpfung') });
      if (r.start == null || s.typ === 'gruppe') continue;
      if (Math.abs(r.start - x.pal) > FAR || Math.abs(r.end - x.pal) > FAR)
        W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.end, text: `${nm} › ${s.name}: Termin ${fmtD(r.start)} – ${fmtD(r.end)} liegt mehr als drei Jahre vom PAL entfernt – Datum prüfen` });
      if (s.wer) {
        const away = C.vac.filter(v => v.u.wer === s.wer && v.von <= r.end && v.bis >= r.start);
        if (away.length) W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.start,
          text: `${nm} › ${s.name}: ${s.wer} hat Urlaub (${away.map(v => fmtS(v.von) + '–' + fmtS(v.bis)).join(', ')})` });
      }
      if (r.end < today && (+s.fortschritt || 0) < 100 && s.typ === 'aufgabe')
        W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.end, text: `${nm} › ${s.name}: überfällig seit ${fmtD(r.end)} (${+s.fortschritt || 0} % erledigt)` });
    }
  }
  for (const u of D.urlaube) if ((u.von && dn(u.von) == null) || (u.bis && dn(u.bis) == null))
    W.push({ lvl: 'warn', text: `Urlaub ${u.wer || '?'}: „${u.von || ''}“ – „${u.bis || ''}“ ist kein gültiges Datum – bitte prüfen` });
  for (const v of C.vac) if (v.tooLong && (ymd(v.von)[0] === y || ymd(v.bis)[0] === y))
    W.push({ lvl: 'warn', n: v.von, text: `Urlaub ${v.u.wer || '?'} ab ${fmtD(v.von)} endet erst am ${fmtD(dn(v.u.bis))} – Datum prüfen` });
  return W;
}

const APP_DIR = 'Jahresplanung (automatisch)', INST = uid(), PRESENCE = { others: [], key: '', since: null };
async function presenceTick() {
  if (!FSA || ST.conn !== 'ok' || !ST.htmlDir || document.hidden) return;

    const dir = await ST.htmlDir.getDirectoryHandle(APP_DIR, { create: true }), mine = 'anwesend-' + INST + '.json';
    PRESENCE.since = PRESENCE.since || new Date().toISOString();
    const w = await (await dir.getFileHandle(mine, { create: true })).createWritable();
    await w.write(JSON.stringify({ name: UI.userName || '', inst: INST, since: PRESENCE.since, at: new Date().toISOString(), edit: LAST_EDIT, version: APP_INFO.version })); await w.close();
    const others = [], now = Date.now();
    for await (const [n, e] of dir.entries()) {

        const o = JSON.parse(await (await e.getFile()).text()), age = now - Date.parse(o.at);
        if (!(age < 86400000)) { dir.removeEntry(n).catch(() => {}); continue; }      // alte Dateien aufräumen

function logWithEntry(meta) {
  let base = {}; try { base = JSON.parse(SAVED_JSON) || {}; } catch (e) { /* */ }

  all.sort((a, b) => String(a.at).localeCompare(String(b.at)));

function startWatch() {
  clearInterval(ST.watch);
  ST.watch = setInterval(async () => {
    if (ST.conn !== 'ok' || ST.saving || document.hidden) return;
    ST.tick++;
    if (ST.tick % 4 === 0) scanCopies();                          // etwa jede Minute: Konfliktkopien von OneDrive?
    if (ST.tick % 2 === 0) presenceTick();                        // alle 30 Sekunden: wer arbeitet noch in der Jahresplanung?
    if (ST.conflict) return;
    try {

        const text = await f.text(), other = parseFileText(text);

        if (other.meta && other.meta.savedAt !== D.meta.savedAt) { externalChange(other, f.lastModified); return; }

  else { ST.conflict = null; UNDO.push(JSON.stringify(D)); D = normalize(c.other); SAVED_JSON = JSON.stringify(D); if (c.stamp != null) ST.stamp = c.stamp; clearDraft(); toast('Stand von ' + (c.other.meta.savedBy || 'der Datei') + ' geladen – deine Änderung ist mit Strg+Z zurückholbar (dann speichern).', 'ok'); }

/* ---------- ZIP (ohne Kompression) für .xlsx */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const now = new Date();
  const dtime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const ddate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let off = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type });
}

  const kindName = k => ({ P: 'PAL', steps: 'Arbeitsschritte', ms: 'Meilensteine', vac: 'Urlaube' })[k] || fileSafe('Start_' + phName(k));
  const onlyKind = Object.keys(o.kinds).filter(k => o.kinds[k]);
  if (o.split === 'one') {
    const suffix = onlyKind.length === 1 ? '_' + kindName(onlyKind[0]) : o.ms.size === 1 ? '_' + fileSafe(C.byId.get([...o.ms][0]).m.name) : '';
    download(base + suffix + '.ics', new Blob([icsFile('Jahresplanung ' + y + suffix.replace(/_/g, ' '), items)], { type: 'text/calendar' }));
  } else {
    const groups = new Map();
    items.forEach(e => { const k = o.split === 'kind' ? e.kind : e.mid || 'vac'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    const files = [...groups].map(([k, its]) => {

      return { name: base + '_' + nm + '.ics', data: icsFile('Jahresplanung ' + y + ' ' + nm.replace(/_/g, ' '), its) };
    });
    download(base + '_Kalender.zip', zipBlob(files, 'application/zip'));
  }
  toast(items.length + ' Termine exportiert', 'ok');
}

function applyFix(d, w) {
  const m = findM(d, w.mid), pal = dn(m && m.pal);
  if (!m || pal == null) return false;
  if (w.fix.t === 'P') { m.pal = ds(w.fix.to); return true; }
  if (m.plan) return !!adjustMark(m, w.fix.t, w.fix.to);

}

function fixRounds(d, mids, types) {

}
function fixDate(w) {

// Aussehen der Markierung je Einstellung: pastell (Standard für Bereiche), kräftig (Standard für PAL), gestreift, nur Rahmen
function chipStyle(t, color) {
  const dk = darkNow(), st = stilOf(t), bd = dk ? mix(color, 0.3, DARK_SURF) : mix(color, 0.35);
  if (st === 'kraeftig') return { background: color, color: onColor(color), borderColor: color };
  if (st === 'rahmen') return { background: 'var(--card)', color: inkC(color), borderColor: color, boxShadow: 'inset 0 0 0 0.5px ' + color };
  if (st === 'streifen') {
    const a = pastel(color), b = dk ? mix(color, 0.45, DARK_SURF) : mix(color, 0.55);
    return { background: 'repeating-linear-gradient(135deg, ' + a + ' 0 2px, ' + b + ' 2px 4px)', color: inkC(color), borderColor: bd };
  }
  return { background: pastel(color), color: inkC(color), borderColor: bd };
}
// Verbindungslinie im Kalender: vom ersten Termin an von hell nach kräftig – jedes Teilstück (Bereich) etwas kräftiger,
// das letzte bis zum PAL in voller Farbe. Liefert die Farben der linken und rechten Tageshälfte (Linie von Tagesmitte zu Tagesmitte).
// pts: [{ n, k }] nach Datum sortiert; das Teilstück ab pts[i] gehört zum Bereich pts[i].k – sein Aussehen kommt aus den Einstellungen („Linie“).
function lineHalves(n, pts, c) {

  const col = t => { let i = 0; while (i < k - 1 && t >= pts[i + 1].n) i++; return lineBg(pts[i].k, c, k <= 1 ? 1 : (k - 1 - i) / (k - 1)); };
  return [n > a ? col(n - 0.25) : 'none', n < b ? col(n + 0.25) : 'none'];
}
const linePts = (x, keys) => keys.map(k => ({ n: evDate(x, k), k })).filter(p => p.n != null).sort((p, q) => p.n - q.n);
const isPinnedChip = e => UI.pin === e.x.id && UI.pinDay === e.n && UI.pinT === e.t && !UI.printing;

// Verbund-Darstellung: je Maßnahme eine farbige Linie von der ersten bis zur letzten angezeigten Markierung, eigene Spur je Überlappung
function verbundLanes() {
  const out = [], ends = [];
  for (const x of C.ms.filter(visibleM)) {
    const pts = linePts(x, evKeys().filter(showType));
    if (pts.length < 2) continue;
    out.push({ x, a: pts[0].n, b: pts[pts.length - 1].n, pts });
  }
  out.sort((p, q) => p.a - q.a || q.b - p.b);

  return out;
}

/* ---------- Markierung im Kalender ziehen: P verschiebt das ganze Projekt, S/I nur dieses Datum */
function chipDrag(ev, e) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  const x = e.x, t = e.t, el = ev.currentTarget, sx = ev.clientX, sy = ev.clientY;
  const locked = t !== 'P' && !startMovable(x, t);
  let moved = false, dd = 0, ghost = null, lab = null, marks = [];
  const resp = (x.m.verantwortlich || '').trim();
  const clearMarks = () => { marks.forEach(c => { c.classList.remove('drop'); c.style.removeProperty('--dc'); c.removeAttribute('data-drop'); }); marks = []; };
  const mark = (n, k) => {
    if (n == null) return;
    const c = $('.day[data-dn="' + n + '"]');
    if (!c) return;
    c.classList.add('drop'); c.style.setProperty('--dc', x.color); c.dataset.drop = k;
    marks.push(c);
  };
  const move = m => {
    if (!moved) {
      if (Math.hypot(m.clientX - sx, m.clientY - sy) < 5) return;
      if (locked) { toast('Im Detailplan von „' + x.m.name + '“ gehört noch kein Abschnitt zum Bereich „' + phName(t) + '“.', 'warn'); sess.cancel(); return; }
      moved = true; hideTip(); document.body.classList.add('dragging');
      el.classList.add('dragsrc');
      ghost = h('span', { class: 'chip ghost ' + t, style: chipStyle(t, x.color) }, sym(t));
      lab = h('div', { class: 'drag-lab' });
      document.body.append(ghost, lab);
    }
    ghost.style.left = (m.clientX - 8) + 'px'; ghost.style.top = (m.clientY - 8) + 'px';
    const under = document.elementFromPoint(m.clientX, m.clientY);
    const cell = under && under.closest('.day[data-dn]');
    if (cell) dd = +cell.dataset.dn - e.n;
    const st = Object.assign({}, x.st);
    let p = x.pal, txt, w;
    if (t === 'P') {
      p += dd; for (const k of Object.keys(st)) st[k] += dd;
      txt = 'PAL ' + fmtW(p) + PH().filter(q => st[q.key] != null).map(q => ' · ' + sym(q.key) + ' ' + fmtWS(st[q.key])).join('');
      w = [['PAL', p], ...PH().filter(q => st[q.key] != null).map(q => [q.key, st[q.key]])].flatMap(([k, v]) => dateWarn(v, resp).filter(q => k !== 'PAL' || !/Samstag|Urlaub/.test(q)).map(q => k + ': ' + q));
    } else {
      st[t] += dd;
      txt = TYPE_LABEL[t] + ' ' + fmtW(st[t]) + ' · ' + workdaysBefore(st[t], p) + ' Werktage vor PAL';
      w = dateWarn(st[t], resp);
    }
    clearMarks();
    if (t === 'P') { mark(p, 'P'); for (const k of Object.keys(st)) mark(st[k], k); } else mark(st[t], t);
    setKids(lab, h('b', null, txt), dd ? h('span', { class: 'muted' }, ' (' + (dd > 0 ? '+' : '') + dd + ' Tage)') : null, w.length ? h('div', { class: 'warn' }, '⚠ ' + w.join(' · ')) : null);
    placeLab(lab, m.clientX, m.clientY);
  };
  const end = okay => {                        // Loslassen übernimmt; Abbruch (Rechtsklick, Esc, Fensterwechsel) lässt alles, wie es war
    document.body.classList.remove('dragging');
    el.classList.remove('dragsrc');
    clearMarks();
    if (ghost) ghost.remove();
    if (lab) lab.remove();
    if (!okay) return;
    if (!moved) { pinChip(el, x.id, e.n, t); return; }
    if (!dd) return;
    if (t === 'P') commit(d => { const m = findM(d, x.id); if (m && dn(m.pal) != null) m.pal = ds(dn(m.pal) + dd); }, x.m.name + ': PAL → ' + fmtW(x.pal + dd) + ' (alle Bereiche mitverschoben)');
    else moveStartTo(x.id, t, x.st[t] + dd);
  };
  const sess = dragSession(ev, el, move, end);
}

const TL_LABEL = 290;
const tlOpen = new Set();

}
function tlRange(rows, y) {

    if (!x.pc || !visibleM(x)) continue;

// Schritte, deren Dauer den Beginn des markierten Schritts bestimmt (entlang der Verknüpfungen bis zum PAL)
function influencingChain(p, markId) {
  const byId = new Map(p.steps.map(s => [s.id, s])), out = [], seen = new Set();
  let cur = byId.get(markId);
  if (!cur) return out;
  if (cur.typ === 'aufgabe') out.push(cur);
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    const a = cur.anker || {};
    if (a.art !== 'start' && a.art !== 'ende') break;
    const ref = byId.get(a.ref);
    if (!ref) break;
    if (a.art === 'start' && ref.typ === 'aufgabe') out.push(ref);
    cur = ref;
  }
  return out;
}
// Start eines Bereichs auf ein Datum legen: die Dauer des längsten Schritts davor (bis zum PAL) passt sich an,
// Schritte, von denen die Starts der anderen Bereiche abhängen, bleiben möglichst unberührt
function adjustMark(m, which, target) {
  const p = m.plan, pc = planCalc(m), ph = pc.ph[which], mark = ph && ph.mark;
  const r = mark && pc.map.get(mark);
  if (!r || r.start == null || target == null) return null;
  let delta = r.start - target;
  if (!delta) return { changed: [] };
  const theirs = new Set(Object.keys(pc.ph).filter(k => k !== which).flatMap(k => influencingChain(p, pc.ph[k].mark).map(s => s.id)));
  const mine = influencingChain(p, mark);
  let pool = mine.filter(s => !theirs.has(s.id));
  if (!pool.length) pool = mine;
  if (!pool.length) return null;
  pool = pool.slice().sort((a, b) => (+b.dauer || 0) - (+a.dauer || 0));
  const changed = [];
  if (delta > 0) { changed.push([pool[0].name, +pool[0].dauer || 0, (+pool[0].dauer || 0) + delta]); pool[0].dauer = (+pool[0].dauer || 0) + delta; }
  else {
    let rest = -delta;
    for (const s of pool) {
      const take = Math.min(Math.max(0, (+s.dauer || 0) - 1), rest);
      if (!take) continue;
      changed.push([s.name, +s.dauer, +s.dauer - take]); s.dauer = +s.dauer - take; rest -= take;
      if (!rest) break;

// Vorlage „Bereiche“: je Bereich ein Abschnitt mit einem Arbeitsschritt, rückwärts verkettet bis zum PAL (Briefkasten-Termin als Ziel)
function phasePlan(pal, starts) {
  const list = PH().filter(p => starts[p.key] != null).sort((a, b) => starts[a.key] - starts[b.key]);
  const steps = [], tasks = [];
  list.forEach(p => { const g = { id: uid(), typ: 'gruppe', name: p.name, bereich: p.key }, t = { id: uid(), typ: 'aufgabe', name: p.name, dauer: DEF_DAYS, fortschritt: 0, wer: '', kommentar: '' }; steps.push(g, t); tasks.push([t, starts[p.key]]); });
  tasks.forEach(([t, a], i) => {
    const next = tasks[i + 1];
    const end = next ? next[1] : pal != null ? pal : a + DEF_DAYS;
    t.dauer = Math.max(0, end - a);
    t.anker = next ? { art: 'start', ref: next[0].id, offset: 0 } : pal != null ? { art: 'pal', offset: 0 } : { art: 'fest', datum: ds(end) };
  });

  if (!steps.length) steps.push({ id: uid(), typ: 'gruppe', name: 'Arbeitsschritte' });

function barDrag(ev, ctx, mode) {

    else if (mode === 'left') { ns = Math.min(r.start + dd, r.end); ne = r.end; }

    else el.style.left = X(ne) + pxd / 2 + 'px';
    const w = s.wer ? C.vac.filter(v => v.u.wer === s.wer && v.von <= ne && v.bis >= ns).map(v => s.wer + ' Urlaub ' + fmtS(v.von) + '–' + fmtS(v.bis)) : [];
    setKids(lab, h('b', null, s.name), h('div', null, isTask ? fmtW(ns) + ' – ' + fmtW(ne) + ' (' + (ne - ns) + ' Tage)' : fmtW(ne)), w.length ? h('div', { class: 'warn' }, '⚠ ' + w.join(' · ')) : null);
    placeLab(lab, e.clientX, e.clientY);

  document.body.classList.add('dragging');
