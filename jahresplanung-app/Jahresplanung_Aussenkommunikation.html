        ...PH().map(p => XD(x.st[p.key] ?? null, 'dw', bd)), ...PH().map(p => x.st[p.key] != null && x.pal != null ? { v: workdaysBefore(x.st[p.key], x.pal), st: bd } : { v: '', st: bd }),
        XD(x.pal, 'dw', { ...bd, b: true }), { v: x.m.palStatus, st: bd }, { v: x.m.verantwortlich || '', st: bd },
        { v: x.m.art || '', st: bd }, isNum(x.m.auflage) ? { v: +x.m.auflage, st: bd } : { v: '', st: bd }, { v: x.m.hinweis || '', st: { ...bd, wrap: true } },
        { v: (warnBy.get(x.id) || []).join('; '), st: { ...bd, wrap: true, color: '#B45309' } }]);
    }
    const nc = 11 + 2 * PH().length - 2, lc = colName(nc - 1);
    sheets.push({ name: 'Übersicht', cols: [2.5, 30, ...PH().map(() => 15), ...PH().map(() => 8), 15, 11, 15, 12, 9, 40, 55], rows, merges: ['A1:' + lc + '1', 'A2:' + lc + '2'], heights: { 0: 22, 3: 30 },
      freeze: 'C5', filter: ms.length ? 'A4:' + lc + (4 + ms.length) : null, protect, grid: false });
  }

  // 2. Kalender: 12 Monate wie im Programm (S/I/P farbig)
  {
    const rows = [], merges = [], heights = {}, CW = 9, cols = [];
    for (let k = 0; k < 4; k++) cols.push(3.2, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 1.4);
    const set = (r, c, v) => { (rows[r] = rows[r] || [])[c] = v; };
    set(0, 0, { v: 'Jahresplanung Außenkommunikation ' + y + ' – Kalender', st: XS.title }); merges.push('A1:AI1'); heights[0] = 22;
    set(1, 0, { v: hint, st: XS.note }); merges.push('A2:AI2');
    set(2, 0, { v: [['P', 'PAL'], ...PH().map(p => [p.key, 'Start ' + p.name])].map(([k, l]) => sym(k) + ' = ' + l + ' (' + ({ kraeftig: 'kräftige Farbe', rahmen: 'ohne Füllung', streifen: 'Pastellton', pastell: 'Pastellton' })[stilOf(k)] + ')').join(' · ') + ' · hellgrau = Wochenende · dunkelgrau = Feiertag NRW', st: { sz: 9, color: '#404040' } }); merges.push('A3:AI3');
    const evAll = eventsIn(a, b, true), byDay = new Map();
    evAll.forEach(e => { if (!byDay.has(e.n)) byDay.set(e.n, []); byDay.get(e.n).push(e); });
    let r = 4;
    for (let band = 0; band < 3; band++) {
      const lists = [];
      for (let k = 0; k < 4; k++) {
        const mo = band * 4 + k + 1, c0 = k * CW, first = mkdn(y, mo, 1), last = first + daysIn(y, mo) - 1, start = first - wd(first);
        set(r, c0, { v: MON[mo - 1] + ' ' + y, st: { b: true, sz: 11, color: '#FFFFFF', fill: '#404040', v: 'center' } });
        for (let j = 1; j < 8; j++) set(r, c0 + j, { v: '', st: { fill: '#404040' } });
        merges.push(colName(c0) + (r + 1) + ':' + colName(c0 + 7) + (r + 1));
        set(r + 1, c0, { v: 'KW', st: { sz: 7, color: '#999999', h: 'center' } });
        WD.forEach((d, j) => set(r + 1, c0 + 1 + j, { v: d, st: { sz: 8, b: true, color: j >= 5 ? '#999999' : '#595959', h: 'center' } }));
        for (let w = 0; w < 6; w++) {
          const ws = start + 7 * w;
          set(r + 2 + w, c0, ws <= last ? { v: isoWeek(ws), st: { sz: 7, color: '#AAAAAA', h: 'center', v: 'top' } } : '');
          for (let d = 0; d < 7; d++) {
            const n = ws + d;
            if (n < first || n > last) { set(r + 2 + w, c0 + 1 + d, { v: '', st: { fill: '#FAFAFA', border: 'thin' } }); continue; }
            const evs = byDay.get(n) || [], hn = holName(n);
            const st = { h: 'center', v: 'top', wrap: true, sz: 9, border: 'thin' };
            const p = evs.find(e => e.t === 'P'), f = p || evs[0];
            if (f) Object.assign(st, markFill(f.t, f.x.color), { b: true });
            else if (hn) Object.assign(st, { fill: '#CFCFCF', b: true, color: '#262626' });
            else if (d >= 5) Object.assign(st, { fill: '#EDEDED', color: '#808080' });
            set(r + 2 + w, c0 + 1 + d, { v: ymd(n)[2] + (evs.length ? '\n' + evs.map(e => sym(e.t)).join(' ') : ''), st });
          }
        }
        // Terminliste unter dem Monat
        const lines = [], per = new Map();
        const hols = []; for (let n = first; n <= last; n++) { const hn = holName(n); if (hn) hols.push(fmtS(n) + ' ' + hn); }
        if (hols.length) lines.push({ v: hols.join(' · '), st: { sz: 8, color: '#8C8C8C' } });
        for (let n = first; n <= last; n++) for (const e of byDay.get(n) || []) { if (!per.has(e.x.id)) per.set(e.x.id, { x: e.x, ev: [] }); per.get(e.x.id).ev.push(e); }
        for (const { x, ev } of per.values()) lines.push({ v: ev.map(e => sym(e.t) + ' ' + fmtS(e.n)).join(' · ') + '  ' + x.m.name, st: { sz: 8, b: true, color: darker(x.color) } });
        const vm = C.vac.filter(v => v.bis >= first && v.von <= last);
        if (vm.length) lines.push({ v: 'Urlaub: ' + vm.map(v => (v.u.wer || '?') + ' ' + fmtS(Math.max(v.von, first)) + (v.bis > v.von ? '–' + fmtS(Math.min(v.bis, last)) : '')).join(', '), st: { sz: 8, color: '#8A6D00' } });
        lists.push(lines);
      }
      heights[r] = 17;
      for (let w = 0; w < 6; w++) heights[r + 2 + w] = 27;
      const L = Math.max(1, ...lists.map(l => l.length));
      for (let k = 0; k < 4; k++) {
        const c0 = k * CW;
        for (let li = 0; li < L; li++) {
          const rr = r + 8 + li, cell = lists[k][li];
          if (cell && cell.v.length > 62) { cell.st = { ...cell.st, wrap: true, v: 'top' }; heights[rr] = 22; }
          set(rr, c0, cell || '');
          merges.push(colName(c0) + (rr + 1) + ':' + colName(c0 + 7) + (rr + 1));
        }
      }
      for (let li = 0; li < L; li++) heights[r + 8 + li] = heights[r + 8 + li] || 12;
      r += 8 + L + 1;
    }
    sheets.push({ name: 'Kalender', cols, rows, merges, heights, protect, grid: false, onePage: true });
  }

  // 3. Zeitleiste nach Kalenderwochen
  {
    const weeks = []; for (let n = a - wd(a); n <= b; n += 7) weeks.push(n);
    const rows = [], merges = [], heights = { 0: 22, 3: 13 }, W0 = 2;
    rows.push([{ v: 'Jahresplanung Außenkommunikation ' + y + ' – Zeitleiste nach Kalenderwochen', st: XS.title }]);
    rows.push([{ v: hint, st: XS.note }]);
    merges.push('A1:' + colName(W0 + weeks.length - 1) + '1', 'A2:' + colName(W0 + weeks.length - 1) + '2');
    const mRow = [{ v: '', st: {} }, ''], kRow = [{ v: 'Maßnahme', st: { b: true, sz: 9 } }, { v: 'PAL', st: { b: true, sz: 9 } }];
    let prevM = null, mStart = W0;
    weeks.forEach((n, j) => {
      const mo = ymd(n + 3)[1];
      if (mo !== prevM) {
        if (prevM != null && j + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(j + W0 - 1) + '3');
        const span = weeks.slice(j).findIndex(q => ymd(q + 3)[1] !== mo);
        mRow[j + W0] = { v: span === 1 ? '' : MON[mo - 1], st: { b: true, sz: 9, fill: '#F2F2F2', border: 'thin' } };
        prevM = mo; mStart = j + W0;
      } else mRow[j + W0] = { v: '', st: { fill: '#F2F2F2', border: 'thin' } };
      kRow[j + W0] = { v: isoWeek(n), st: { sz: 7, color: '#808080', h: 'center' } };
    });
    if (weeks.length + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(weeks.length + W0 - 1) + '3');
    rows.push(mRow, kRow);
    for (const x of ms) {
      const row = [{ v: x.m.name, st: { b: true, color: darker(x.color), border: 'thin' } }, XD(x.pal, 'ds', { sz: 9, border: 'thin' })];
      weeks.forEach((n, j) => {
        const e = n + 6, has = v => v != null && v >= n && v <= e;
        const st = { sz: 7, h: 'center', v: 'center', border: 'thin', b: true };
        let v = '';
        // Woche im Bereich: der späteste Bereich, der in dieser Woche läuft, bestimmt die Farbe (hell → kräftiger)
        const phs = PH().filter(p => x.st[p.key] != null), inW = phs.map((p, i) => [p, i]).filter(([p]) => x.st[p.key] <= e && (x.en[p.key] ?? x.st[p.key]) >= n);
        if (has(x.pal)) { Object.assign(st, { fill: x.color, color: onColor(x.color) }); v = sym('P'); }
        else if (inW.length) {
          const [p, i] = inW[inW.length - 1], f = phs.length > 1 ? i / (phs.length - 1) : 0;
          const ln = lineOf(p.key);
          Object.assign(st, ln === 'kraeftig' ? { fill: x.color, color: onColor(x.color) } : ln === 'rahmen' ? { color: darker(x.color) } : ln === 'auto' ? { fill: mix(x.color, 0.75 - 0.30 * f), color: darker(x.color) } : { fill: pastel(x.color), color: darker(x.color) });
          v = phs.filter(q => has(x.st[q.key])).map(q => sym(q.key)).join('');
        }
        row[j + W0] = { v, st };
      });
      rows.push(row);
    }
    rows.push([]);
    const people = [...new Set(C.vac.filter(v => v.bis >= a && v.von <= b).map(v => v.u.wer || '?'))].sort((p, q) => p.localeCompare(q, 'de'));
    if (people.length) {
      rows.push([{ v: 'Urlaub (Arbeitstage je Woche)', st: XS.sub }]);
      for (const p of people) {
        const row = [{ v: p, st: { border: 'thin' } }, ''];
        weeks.forEach((n, j) => {
          const cnt = C.vac.filter(v => (v.u.wer || '?') === p).reduce((s, v) => s + (v.bis >= n && v.von <= n + 6 ? workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) : 0), 0);
          row[j + W0] = cnt ? { v: cnt, st: { sz: 7, h: 'center', border: 'thin', fill: pastel(personColor(p)) } } : { v: '', st: { border: 'thin' } };
        });
        rows.push(row);
      }
      const row = [{ v: 'gleichzeitig im Urlaub', st: { i: true, sz: 9, border: 'thin' } }, ''];
      weeks.forEach((n, j) => {
        const cnt = people.filter(p => C.vac.some(v => (v.u.wer || '?') === p && v.bis >= n && v.von <= n + 6 && workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) > 0)).length;
        row[j + W0] = cnt > 1 ? { v: cnt, st: { sz: 7, b: true, h: 'center', border: 'thin', fill: cnt > 2 ? '#F4B6B0' : '#FFD8A8' } } : { v: '', st: { border: 'thin' } };
      });
      rows.push(row, []);
    }
    sheets.push({ name: 'Zeitleiste', cols: [30, 11, ...weeks.map(() => 2.9)], rows, merges, heights, freeze: 'C5', protect, grid: false });
  }

  // 4. Termine (chronologisch)
  {
    const ev = eventsIn(a, b, true);
    const rows = [['Datum', 'KW', 'Maßnahme', 'Termin', 'Hauptverantwortlich', 'Hinweis'].map(t => ({ v: t, st: XS.head })),
      ...ev.map(e => {
        const notes = [];
        const hn = holName(e.n); if (hn) notes.push('Feiertag: ' + hn); else if (wd(e.n) >= 5) notes.push(WDL[wd(e.n)]);
        const away = vacOn(e.n); if (away.length) notes.push('Urlaub: ' + [...new Set(away.map(v => v.u.wer))].join(', '));
        return [XD(e.n), isoWeek(e.n), { v: e.x.m.name, st: Object.assign(markFill(e.t, e.x.color), e.t === 'P' ? { b: true } : {}) },
          TYPE_LABEL[e.t], e.x.m.verantwortlich || '', notes.join(' · ')];
      })];
    sheets.push({ name: 'Termine', cols: [16, 5, 30, 24, 16, 50], rows, freeze: 'A2', filter: rows.length > 1 ? 'A1:F' + rows.length : null, protect });
  }

  // 5. Detailpläne
  {
    const rows = [['Maßnahme', 'Abschnitt', 'Arbeitsschritt', 'Typ', 'Zugeordnet', 'Kommentar', 'Start', 'Dauer (Tage)', 'Ende'].map(t => ({ v: t, st: XS.head }))];
    for (const x of ms) if (x.pc) {
      let grp = '';
      for (const s of x.m.plan.steps) {
        if (s.typ === 'gruppe') { grp = s.name + (s.bereich ? ' (' + s.bereich + ' · ' + phName(s.bereich) + ')' : ''); continue; }
        const r = x.pc.map.get(s.id) || {};
        rows.push([{ v: x.m.name, st: { color: darker(x.color), b: true } }, grp, s.name, STEP_TYPES[s.typ], s.wer ? { v: s.wer, st: { fill: pastel(personColor(s.wer)) } } : '', s.kommentar || '', XD(r.start), s.typ === 'aufgabe' ? +s.dauer || 0 : '', XD(r.end)]);
      }
    }
    sheets.push({ name: 'Detailpläne', cols: [24, 22, 28, 12, 14, 24, 16, 10, 16], rows, freeze: 'A2', filter: rows.length > 1 ? 'A1:I' + rows.length : null, protect });
  }

  // 6. Urlaub und Feiertage
  {
    const rows = [['Wer', 'Von', 'Bis', 'Arbeitstage', 'Notiz'].map(t => ({ v: t, st: XS.head })),
      ...C.vac.filter(v => v.bis >= a && v.von <= b).sort((p, q) => p.von - q.von)
        .map(v => [{ v: v.u.wer || '?', st: { fill: pastel(personColor(v.u.wer)) } }, XD(v.von), XD(v.bis), workdays(v.von, v.bis), v.u.notiz || ''])];
    rows.push([], [{ v: 'Feiertage NRW ' + y, st: XS.sub }]);
    const hols = [...holidays(y)].concat(D.sondertage.filter(s => dn(s.datum) != null && ymd(dn(s.datum))[0] === y).map(s => [dn(s.datum), (s.name || 'freier Tag') + ' (eigener freier Tag)']))
      .sort((p, q) => p[0] - q[0]);
    hols.forEach(([n, t]) => rows.push([XD(n), { v: t, st: {} }]));
    sheets.push({ name: 'Urlaub & Feiertage', cols: [18, 16, 16, 12, 30], rows, freeze: 'A2', protect });
  }

  // 7. Änderungsprotokoll (neueste oben)
  {
    const rows = [['Gespeichert', 'Von', 'Änderung'].map(t => ({ v: t, st: XS.head }))];
    for (const e of (D.log || []).slice().reverse().slice(0, 200)) for (const t of e.items || []) rows.push([fmtStamp(e.at), e.by || '', { v: t, st: { wrap: true } }]);
    sheets.push({ name: 'Änderungen', cols: [22, 14, 100], rows, freeze: 'A2', protect });
  }
  return xlsxBlob(sheets, { readOnly: protect });
}
function exportExcel() {
  download('Jahresplanung_' + UI.year + '_Export_' + ds(todayDn()) + '.xlsx', viewWorkbook({ protect: false }));
  toast('Excel-Datei erstellt', 'ok');
}

/* ===================================================================== PDF-Export: Bereiche und Maßnahmen wählbar, jede Seite ohne Browser-Kopf-/Fußzeile */

const PDF_SECS = [['mass', 'Maßnahmen-Übersicht'], ['kal', 'Kalender'], ['tl', 'Zeitleiste'], ['ag', 'Was steht an?'], ['plaene', 'Detailpläne (je Plan eine Seite)'], ['urlaub', 'Urlaub & Feiertage']];
const VIEW_SECS = { jahr: ['mass', 'kal'], zeit: ['tl', 'ag'], plaene: ['plaene'], urlaub: ['urlaub'] };

// Auswahlliste der Maßnahmen (für PDF- und Kalender-Export)
function msPicker(sel, list, onChange) {
  const boxes = [];
  const all = on => { list.forEach(x => on ? sel.add(x.id) : sel.delete(x.id)); boxes.forEach(b => { b.checked = on; }); onChange && onChange(); };
  return h('div', { class: 'mspick' },
    h('div', { class: 'pop-h' }, 'Maßnahmen', h('span', null, h('button', { class: 'link', onclick: e => { e.preventDefault(); all(true); } }, 'alle'), ' · ',
      h('button', { class: 'link', onclick: e => { e.preventDefault(); all(false); } }, 'keine'))),
    list.map(x => {
      const b = h('input', { type: 'checkbox', checked: sel.has(x.id), onchange: e => { e.target.checked ? sel.add(x.id) : sel.delete(x.id); onChange && onChange(); } });
      boxes.push(b);
      return h('label', { class: 'mchk' }, b, h('span', { class: 'dot', style: { background: x.color } }), h('span', { class: 'nm' }, x.m.name || '(ohne Namen)'),
        x.pc ? h('span', { class: 'muted small' }, 'Plan') : null, h('span', { class: 'pal' }, x.pal != null ? fmtS(x.pal) : ''));
    }));
}

async function pdfDialog() {
  const y = UI.year, list = C.ms.filter(x => inYear(x, y));
  const last = UI.pdfOpts || {};
  const f = {
    secs: Object.assign({ mass: true, kal: true, tl: true, ag: false, plaene: false, urlaub: false }, last.secs),
    show: Object.assign(Object.fromEntries(evKeys().map(k => [k, true])), last.show), vac: last.vac !== false, verbund: !!UI.verbund,
    ms: new Set(list.map(x => x.id)),
    planCompact: !!UI.planCompact, planColl: null,        // Detailplan wie eingestellt: Tabelle eingeklappt nur, wenn sie es gerade ist
  };
  const wrap = h('div', { class: 'form pdfform' });
  const draw = () => {
    const cb = (obj, k, label, extra) => h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!obj[k], onchange: e => { obj[k] = e.target.checked; } }), label, extra || null);
    setKids(wrap, 
      h('div', { class: 'pdf-top' }, h('p', { class: 'muted small' }, 'Wähle, was ins PDF soll. Jeder Bereich beginnt auf einer neuen Seite (A4 quer).'),
        h('button', { class: 'ghostbtn', tip: 'übernimmt Reiter, Filter und angezeigte Maßnahmen von der Ansicht, die gerade offen ist', onclick: e => { e.preventDefault(); fromView(); draw(); } }, '⟲ Wie aktuelle Ansicht')),
      h('div', { class: 'pdf-cols' },
        h('div', null, h('h3', null, 'Bereiche'), h('div', { class: 'checks' }, PDF_SECS.map(([k, l]) => cb(f.secs, k, l))),
          h('h3', null, 'Termine'), h('div', { class: 'checks' }, evKeys().map(t => cb(f.show, t, TYPE_LABEL[t])), cb(f, 'vac', 'Urlaube anzeigen'),
            cb(f, 'verbund', 'Verbund-Darstellung im Kalender'),
            cb(f, 'planCompact', 'Detailpläne: nur Arbeitsschritte (Tabelle eingeklappt, Gantt breiter)'))),
        msPicker(f.ms, list)));
  };
  const fromView = () => {
    f.secs = Object.fromEntries(PDF_SECS.map(([k]) => [k, (VIEW_SECS[UI.view] || []).includes(k) && (UI.secOpen[k] !== false)]));
    if (!Object.values(f.secs).some(Boolean)) f.secs.mass = true;
    f.show = Object.fromEntries(evKeys().map(k => [k, showType(k)])); f.vac = UI.showVac; f.verbund = !!UI.verbund;
    f.ms = new Set(list.filter(x => visibleM(x)).map(x => x.id));
    if (UI.view === 'plaene' && UI.planSel) { f.ms = new Set([UI.planSel]); f.secs.plaene = true; }
    f.planCompact = !!UI.planCompact; f.planColl = JSON.parse(JSON.stringify(UI.planColl || {}));   // eingeklappte Tabelle und Abschnitte wie gerade zu sehen
  };
  draw();
  const ok = await modal('PDF exportieren', wrap, [['Abbrechen', false], ['PDF erstellen', true, 'primary']], { wide: true });
  if (!ok) return;
  if (!Object.values(f.secs).some(Boolean)) { toast('Kein Bereich gewählt.', 'warn'); return; }
  if (!f.ms.size && (f.secs.mass || f.secs.kal || f.secs.tl || f.secs.plaene)) { toast('Keine Maßnahme gewählt.', 'warn'); return; }
  UI.pdfOpts = { secs: f.secs, show: f.show, vac: f.vac }; saveUI();
  printPDF(f);
}

const TL_PER_PAGE = 16;
function printPDF(f) {
  const keys = ['show', 'hiddenM', 'showVac', 'hiddenP', 'monthLists', 'tlPlans', 'tlPxd', 'planSel', 'planCompact', 'planColl', 'planPxd', 'view', 'verbund', '_tl', '_pl'];
  const keep = {}; keys.forEach(k => { keep[k] = UI[k] instanceof Set ? new Set(UI[k]) : UI[k] && typeof UI[k] === 'object' ? JSON.parse(JSON.stringify(UI[k])) : UI[k]; });
  UI.show = { ...f.show }; UI.showVac = f.vac; UI.verbund = !!f.verbund; UI.hiddenP = new Set(); UI.monthLists = true; UI.tlPlans = false; UI.tlPxd = 0;
  UI.hiddenM = new Set(C.ms.filter(x => !f.ms.has(x.id)).map(x => x.id));
  UI.planCompact = f.planCompact ?? !!keep.planCompact; UI.planColl = f.planColl || {}; UI.planPxd = 0;
  UI.printing = true;
  derive();
  let doc;
  try { doc = buildPrintDoc(f); }
  finally { Object.assign(UI, keep); UI.printing = false; derive(); }
  $$('#printdoc').forEach(e => e.remove());
  document.body.append(doc);
  document.body.classList.add('printdoc-mode');
  const title = document.title;
  document.title = 'Jahresplanung_' + UI.year + '_' + ds(todayDn());       // Vorschlag für den Dateinamen
  PRINT_TITLE = title;
  setTimeout(() => window.print(), 80);
}
let PRINT_TITLE = null;
window.addEventListener('afterprint', () => {
  $$('#printdoc').forEach(e => e.remove()); document.body.classList.remove('printdoc-mode');
  if (PRINT_TITLE != null) { document.title = PRINT_TITLE; PRINT_TITLE = null; }
});

function buildPrintDoc(f) {
  const y = UI.year;
  const stand = 'Stand ' + fmtD(todayDn()) + (D.meta.savedAt ? ' · gespeichert ' + fmtStamp(D.meta.savedAt) : '');

function showSplash() {
  if (UI.splash === false || typeof SPLASH_ANIM === 'undefined') return;
  if (navigator.webdriver && !window.__splashTest) return;             // automatisierte Tests
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim = h('div', { class: 'splash-anim' });

  const close = () => {

  };
  const box = h('div', { class: 'splash', onclick: close, tip: null },
    h('div', { class: 'splash-mid' }, anim, h('img', { class: 'splash-logo', src: logoSrc(), alt: 'Malteser' })),

/* ===================================================================== Zusammenführen: wenn zwei gleichzeitig geändert haben */

// Grundregel (je Maßnahme, Urlaub, freiem Tag, Person – und darin je Feld):
// nur eine Seite hat etwas geändert → diese Änderung gilt; beide haben dasselbe Feld verschieden geändert → nachfragen.
const JS = v => JSON.stringify(v === undefined ? null : v);
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const contentOf = d => JSON.stringify(Object.assign({}, d, { meta: null }));
const sameContent = (a, b) => contentOf(a) === contentOf(b);
const MERGE_COLL = [['massnahmen', 'id'], ['urlaube', 'id'], ['sondertage', 'id'], ['personen', 'name']];

function mergeObj(b, m, t, where, conflicts, cnt) {
  b = b || {}; m = m || {}; t = t || {};
  const out = {};
  for (const f of new Set([...Object.keys(b), ...Object.keys(m), ...Object.keys(t)])) {
    const jb = JS(b[f]), jm = JS(m[f]), jt = JS(t[f]);
    let v;
    if (jm === jt) v = m[f];
    else if (jm === jb) { v = t[f]; cnt.t++; }
    else if (jt === jb) { v = m[f]; cnt.m++; }
    else { v = m[f]; conflicts.push(Object.assign({ field: f, mine: m[f], theirs: t[f] }, where)); }
    if (v !== undefined) out[f] = v;
  }
  return out;
}

  const idx = a => new Map((a || []).map(r => [r[key], r]));
  const B = idx(b), M = idx(m), T = idx(t);
  const order = [...T.keys(), ...[...M.keys()].filter(k => !T.has(k))];
  const res = [];
  for (const k of order) {
    const bv = B.get(k), mv = M.get(k), tv = T.get(k), jb = JS(bv), jm = JS(mv), jt = JS(tv);
    let v;
    if (jm === jt) v = mv;
    else if (jm === jb) { v = tv; cnt.t++; }                   // nur die anderen haben geändert (oder gelöscht)
    else if (jt === jb) { v = mv; cnt.m++; }                   // nur ich habe geändert (oder gelöscht)
    else if (mv && tv) v = mergeObj(bv, mv, tv, { coll, key: k, rec: mv }, conflicts, cnt);
    else { v = mv || tv; conflicts.push({ coll, key: k, field: null, rec: mv || tv, mine: mv, theirs: tv }); }   // gelöscht ↔ geändert

}

  const conflicts = [], cnt = { m: 0, t: 0 }, out = clone(theirs);
  for (const [coll, key] of MERGE_COLL) out[coll] = mergeList(base[coll], mine[coll], theirs[coll], key, coll, conflicts, cnt);
  out.settings = mergeObj(base.settings, mine.settings, theirs.settings, { coll: 'settings', key: null }, conflicts, cnt);
  out.feiertage = mergeObj(base.feiertage, mine.feiertage, theirs.feiertage, { coll: 'feiertage', key: null }, conflicts, cnt);
  out.meta = clone(theirs.meta);
  return { data: clone(out), conflicts, cnt };
}
function applyPick(data, c) {
  if (c.pick !== 'theirs') return;
  if (c.coll === 'settings' || c.coll === 'feiertage') { if (c.theirs === undefined) delete data[c.coll][c.field]; else data[c.coll][c.field] = clone(c.theirs); return; }
  const key = c.coll === 'personen' ? 'name' : 'id', arr = data[c.coll], i = arr.findIndex(r => r[key] === c.key);
  if (c.field == null) { if (c.theirs) { if (i >= 0) arr[i] = clone(c.theirs); else arr.push(clone(c.theirs)); } else if (i >= 0) arr.splice(i, 1); }
  else if (i >= 0) { if (c.theirs === undefined) delete arr[i][c.field]; else arr[i][c.field] = clone(c.theirs); }
}

/* ---------- Anzeige */
const FIELD_LABEL = { name: 'Name', pal: 'PAL', palStatus: 'PAL-Status', vorlauf: 'Starts der Bereiche', ende: 'Enden der Bereiche', bereiche: 'Bereiche', verantwortlich: 'Hauptverantwortlich',
  auflage: 'Auflage', art: 'Bitte', hinweis: 'Hinweis', farbe: 'Farbe', plan: 'Detailplan', wer: 'Person', von: 'von', bis: 'bis', notiz: 'Notiz', datum: 'Datum', year: 'Planungsjahr' };
function recLabel(coll, rec, key) {
  rec = rec || {};
  if (coll === 'massnahmen') return 'Maßnahme „' + (rec.name || '(ohne Namen)') + '“';
  if (coll === 'urlaube') return 'Urlaub ' + (rec.wer || '?') + ' ' + fmtS(dn(rec.von)) + '–' + fmtS(dn(rec.bis) ?? dn(rec.von));
  if (coll === 'sondertage') return 'Freier Tag „' + (rec.name || 'ohne Namen') + '“ ' + fmtS(dn(rec.datum));
  if (coll === 'personen') return 'Person ' + (rec.name || key);
  if (coll === 'feiertage') return 'Feiertage';
  return 'Einstellungen';
}
function valText(coll, field, v, rec) {
  if (field == null) return v ? 'behalten' : 'gelöscht';
  if (coll === 'feiertage') return !v ? 'wie gesetzlich' : v.off ? 'abgeschaltet' : [v.name, v.datum ? 'am ' + fmtD(dn(v.datum)) : ''].filter(Boolean).join(' ') || 'geändert';
  if (v == null || v === '') return '–';
  if (['pal', 'von', 'bis', 'datum'].includes(field)) return fmtW(dn(v));
  if (field === 'vorlauf' || field === 'ende') { const p = dn(rec && rec.pal); const e = Object.entries(v || {}); return e.length ? e.map(([k, n]) => k + ' ' + (p != null ? fmtS(p - n) : n + ' T.')).join(' · ') : '–'; }
  if (field === 'bereiche' && Array.isArray(v)) return v.map(p => (p.zeichen || p.key) + ' ' + p.name + (p.stil && p.stil !== 'pastell' ? ' (' + (STILE[p.stil] || p.stil) + ')' : '') + (p.linie && p.linie !== 'auto' ? ' Linie ' + (LINIEN[p.linie] || p.linie) : '')).join(', ');
  if (coll === 'settings' && field === 'pal' && v && typeof v === 'object') return 'PAL-Markierung ' + (v.zeichen || 'P') + ' (' + (STILE[v.stil] || v.stil || '') + ')';
  if (field === 'plan') return v && v.steps ? v.steps.length + ' Schritte' : 'kein Detailplan';
  if (typeof v === 'object') return JSON.stringify(v).slice(0, 60);
  return String(v).slice(0, 80);
}
const fieldName = (coll, f) => coll === 'feiertage' ? fmtD(dn(f)) : FIELD_LABEL[f] || f;

// Drei-Wege-Zusammenführung mit Rückfrage bei echten Überschneidungen; liefert die neuen Daten oder null (abgebrochen)
async function mergeWithUI(base, mine, theirs, who) {
  const r = merge3(base, mine, theirs);
  if (!r.conflicts.length) return normalize(r.data);
  r.conflicts.forEach(c => { c.pick = 'mine'; });
  const row = (c, i) => {
    const rec = c.rec || c.mine || c.theirs;
    const opt = (which, label, v) => h('label', { class: 'check' }, h('input', { type: 'radio', name: 'mc' + i, checked: c.pick === which, onchange: () => { c.pick = which; } }),
      h('b', null, label + ': '), valText(c.coll, c.field, v, rec));
    return h('div', { class: 'mrow' }, h('div', { class: 'mlab' }, recLabel(c.coll, rec, c.key), c.field != null ? ' › ' + fieldName(c.coll, c.field) : ''),
      opt('mine', 'deine Fassung', c.mine), opt('theirs', who, c.theirs));
  };
  const ok = await modal('Änderungen zusammenführen', h('div', { class: 'form mergeform' },
    h('p', null, 'Übernommen: ' + r.cnt.t + ' Änderung' + (r.cnt.t === 1 ? '' : 'en') + ' von ' + who + ' und ' + r.cnt.m + ' eigene. ' +
      'Bei ' + r.conflicts.length + ' Punkt' + (r.conflicts.length === 1 ? '' : 'en') + ' wurde dasselbe unterschiedlich geändert – bitte wählen:'),
    r.conflicts.map(row)), [['Abbrechen', false], ['Zusammenführen', true, 'primary']], { wide: true });
  if (!ok) return null;
  r.conflicts.forEach(c => applyPick(r.data, c));
  return normalize(r.data);
}

// Zwei Stände ohne gemeinsamen Ausgangspunkt vergleichen (z. B. OneDrive-Konfliktkopie): auswählen, was übernommen wird
async function compareDialog(other, label) {
  const items = [];
  for (const [coll, key] of MERGE_COLL) {
    const M = new Map(D[coll].map(r => [r[key], r])), O = new Map((other[coll] || []).map(r => [r[key], r]));
    for (const [k, o] of O) {
      const m = M.get(k);
      if (!m) items.push({ coll, key: k, kind: 'new', rec: o, take: true });
      else if (JS(m) !== JS(o)) items.push({ coll, key: k, kind: 'diff', rec: o, mine: m, take: false,
        fields: [...new Set([...Object.keys(m), ...Object.keys(o)])].filter(f => f !== 'id' && JS(m[f]) !== JS(o[f])) });
    }
    for (const [k, m] of M) if (!O.has(k)) items.push({ coll, key: k, kind: 'only', rec: m });
  }
  if (JS(D.feiertage) !== JS(other.feiertage)) items.push({ coll: 'feiertage', kind: 'diff', rec: other.feiertage, take: false, fields: [] });
  const act = items.filter(i => i.kind !== 'only');
  if (!act.length) { await modal('Keine Unterschiede', h('p', null, 'In ' + label + ' steht nichts, was hier fehlt oder anders ist.')); return normalize(clone(D)); }
  const line = it => {
    const cb = h('input', { type: 'checkbox', checked: it.take, onchange: e => { it.take = e.target.checked; } });
    return h('div', { class: 'mrow' }, h('label', { class: 'check' }, cb, h('b', null, recLabel(it.coll, it.rec, it.key))),
      it.kind === 'diff' && it.fields.length ? h('div', { class: 'mdiff muted small' }, it.fields.map(f =>
        h('div', null, fieldName(it.coll, f) + ': hier ' + valText(it.coll, f, it.mine[f], it.mine) + ' · dort ' + valText(it.coll, f, it.rec[f], it.rec)))) : null);
  };
  const sec = (title, list, hint) => list.length ? [h('h3', null, title + ' (' + list.length + ')'), hint ? h('p', { class: 'muted small' }, hint) : null, list.map(line)] : null;
  const only = items.filter(i => i.kind === 'only');
  const ok = await modal('Vergleichen und übernehmen', h('div', { class: 'form mergeform' },
    h('p', null, 'Vergleich des aktuellen Stands mit ' + label + '. Angehakte Einträge werden von dort übernommen.'),
    sec('Nur dort vorhanden', items.filter(i => i.kind === 'new'), 'meist neu angelegt – standardmäßig übernehmen'),
    sec('Unterschiedlich', items.filter(i => i.kind === 'diff'), 'welche Fassung neuer ist, lässt sich nicht erkennen – bitte prüfen'),
    only.length ? [h('h3', null, 'Nur hier vorhanden (' + only.length + ')'), h('p', { class: 'muted small' }, only.map(i => recLabel(i.coll, i.rec, i.key)).join(' · ') + ' – bleibt erhalten')] : null),
    [['Abbrechen', false], ['Übernehmen', true, 'primary']], { wide: true });
  if (!ok) return null;
  const out = clone(D);
  for (const it of act) {
    if (!it.take) continue;
    if (it.coll === 'feiertage') { out.feiertage = clone(it.rec); continue; }
    const key = it.coll === 'personen' ? 'name' : 'id', arr = out[it.coll], i = arr.findIndex(r => r[key] === it.key);
    if (i >= 0) arr[i] = clone(it.rec); else arr.push(clone(it.rec));
  }
  return normalize(out);
}

/* ---------- Änderungsprotokoll: lesbare Beschreibung, was sich zwischen zwei Ständen geändert hat */
function describeChanges(a, b, max = 12) {
  const out = [];
  for (const [coll, key] of MERGE_COLL) {
    const A = new Map((a[coll] || []).map(r => [r[key], r])), B = new Map((b[coll] || []).map(r => [r[key], r]));
    for (const [k, r] of B) {
      const o = A.get(k), lab = recLabel(coll, r, k);
      if (!o) { out.push(lab + ' angelegt'); continue; }
      if (JS(o) === JS(r)) continue;
      for (const f of [...new Set([...Object.keys(o), ...Object.keys(r)])].filter(f => JS(o[f]) !== JS(r[f]))) {
        if (f === 'plan') out.push(lab + ': ' + planChange(o.plan, r.plan));
        else if (f === 'vorlauf' || f === 'ende') {
          const pa = dn(o.pal), pb = dn(r.pal), va = o[f] || {}, vb = r[f] || {};
          for (const ph of new Set([...Object.keys(va), ...Object.keys(vb)])) if (va[ph] !== vb[ph])
            out.push(lab + ': ' + (f === 'ende' ? 'Ende ' + phName(ph) : startLabel(ph)) + ' ' + (va[ph] != null && pa != null ? fmtS(pa - va[ph]) : '–') + ' → ' + (vb[ph] != null && pb != null ? fmtS(pb - vb[ph]) : '–'));
        } else out.push(lab + ': ' + fieldName(coll, f) + ' ' + valText(coll, f, o[f], o) + ' → ' + valText(coll, f, r[f], r));
      }
    }
    for (const [k, o] of A) if (!B.has(k)) out.push(recLabel(coll, o, k) + ' gelöscht');
  }
  if (JS(a.feiertage) !== JS(b.feiertage)) out.push('Feiertage geändert');
  const sa = a.settings || {}, sb = b.settings || {};
  if (JS(sa.bereiche) !== JS(sb.bereiche)) out.push('Bereiche: ' + (sb.bereiche || []).map(p => (p.zeichen || p.key) + ' ' + p.name).join(', '));
  if (JS(sa.pal) !== JS(sb.pal)) out.push('PAL-Markierung: ' + ((sb.pal || {}).zeichen || 'P') + ' (' + (STILE[(sb.pal || {}).stil] || '') + ')');
  if (sa.year !== sb.year) out.push('Planungsjahr ' + sa.year + ' → ' + sb.year);
  return out.length > max ? out.slice(0, max).concat('… und ' + (out.length - max) + ' weitere Änderungen') : out;
}
function planChange(p, q) {
  if (!p) return 'Detailplan angelegt';
  if (!q) return 'Detailplan entfernt';
  const A = new Map(p.steps.map(s => [s.id, s])), B = new Map(q.steps.map(s => [s.id, s])), parts = [];
  const what = (o, s, k) => k === 'dauer' ? 'Dauer ' + (+o.dauer || 0) + ' → ' + (+s.dauer || 0) + ' Tage' : k === 'wer' ? 'Person ' + (o.wer || '–') + ' → ' + (s.wer || '–')
    : k === 'fortschritt' ? (+s.fortschritt >= 100 ? 'erledigt' : 'Fortschritt ' + (+s.fortschritt || 0) + ' %') : k === 'bereich' ? 'Bereich ' + (s.bereich ? s.bereich + ' ' + phName(s.bereich) : '–')
    : k === 'anker' ? 'Termin verschoben' : k === 'name' ? 'umbenannt (vorher „' + o.name + '“)' : k === 'typ' ? 'jetzt ' + (STEP_TYPES[s.typ] || s.typ) : k === 'kommentar' ? 'Kommentar geändert' : k;
  for (const [id, s] of B) {
    const o = A.get(id);
    if (!o) parts.push('„' + s.name + '“ neu');
    else if (JS(o) !== JS(s)) parts.push('„' + s.name + '“ ' + ['name', 'dauer', 'wer', 'anker', 'bereich', 'typ', 'fortschritt', 'kommentar'].filter(k => JS(o[k]) !== JS(s[k])).map(k => what(o, s, k)).join(', '));
  }
  for (const [id, s] of A) if (!B.has(id)) parts.push('„' + s.name + '“ gelöscht');
  if (!parts.length && JS(p.marks) !== JS(q.marks)) parts.push('Beginn eines Bereichs neu festgelegt');
  if (!parts.length) parts.push('Reihenfolge geändert');
  return 'Detailplan: ' + parts.slice(0, 4).join('; ') + (parts.length > 4 ? ' … (' + (parts.length - 4) + ' weitere)' : '');
}
function logDialog() {
  let q = '';
  const list = h('div', { class: 'logview' });
  const draw = () => {
    const ents = (D.log || []).slice().reverse().filter(e => !q || (e.by || '').toLowerCase().includes(q) || (e.items || []).some(t => t.toLowerCase().includes(q)));
    setKids(list, ents.length ? ents.slice(0, 200).map(e => h('div', { class: 'logent' },
      h('div', { class: 'loghead' }, h('b', null, fmtStamp(e.at)), e.by ? ' · ' + e.by : ''),
      h('ul', null, (e.items || []).map(t => h('li', null, t))))) : h('p', { class: 'muted' }, q ? 'Nichts gefunden.' : 'Noch keine Änderungen protokolliert – das Protokoll beginnt mit Version 0.8.'));
  };
  draw();
  modal('Änderungsprotokoll', h('div', { class: 'form' },
    h('p', { class: 'muted small' }, 'Bei jedem Speichern hält die App fest, wer was geändert hat (die letzten ' + LOG_MAX + ' Speicherungen). Neueste oben.'),
    h('input', { placeholder: 'suchen, z. B. „Sommermailing“ oder „Eva“', oninput: e => { q = e.target.value.trim().toLowerCase(); draw(); } }), list), null, { wide: true });
}

/* ===================================================================== Datenprüfung: Auffälligkeiten finden und Reparatur vorschlagen */

// Jeder Fund: Text, vorgeschlagene Reparatur (Beschriftung) und eine Funktion, die sie auf den Datenstand d anwendet
function checkData(d = D) {
  const out = [], keys = PH().map(p => p.key);
  const add = (text, label, fix) => out.push({ text, label, fix, on: true });
  for (const m of d.massnahmen) {
    const nm = '„' + (m.name || '(ohne Namen)') + '“', mid = m.id, M = dd => findM(dd, mid);
    if (m.pal && dn(m.pal) == null) add(nm + ': PAL „' + m.pal + '“ ist kein gültiges Datum', 'PAL leeren (danach neu eintragen)', dd => { M(dd).pal = null; });
    if (str(m.verantwortlich) !== str(m.verantwortlich).trim()) add(nm + ': Hauptverantwortlich „' + m.verantwortlich + '“ mit Leerzeichen am Rand', 'Leerzeichen entfernen', dd => { M(dd).verantwortlich = str(M(dd).verantwortlich).trim(); });
    for (const k of Object.keys(m.vorlauf || {})) {
      if (!keys.includes(k)) add(nm + ': Start für den nicht mehr vorhandenen Bereich „' + k + '“', 'entfernen', dd => { delete M(dd).vorlauf[k]; });
      else if (m.vorlauf[k] < 0) add(nm + ': ' + startLabel(k) + ' liegt nach dem PAL', startLabel(k) + ' entfernen', dd => { delete M(dd).vorlauf[k]; });
    }
    for (const k of Object.keys(m.ende || {})) {
      if (!keys.includes(k) || !isNum((m.vorlauf || {})[k])) add(nm + ': Ende für „' + k + '“ ohne Start', 'entfernen', dd => { delete M(dd).ende[k]; });
      else if (m.ende[k] > m.vorlauf[k]) add(nm + ': Ende von „' + phName(k) + '“ liegt vor dessen Start', 'Ende entfernen', dd => { delete M(dd).ende[k]; });
    }
    if (!m.plan) continue;
    const pc = planCalc(m);
    let cycleFixed = false;
    for (const s of m.plan.steps) {
      if (s.typ === 'gruppe') continue;
      const sid = s.id, S = dd => M(dd).plan.steps.find(q => q.id === sid), sn = nm + ' › „' + (s.name || '?') + '“';
      const a = s.anker || {}, r = pc.map.get(sid) || {};
      if (a.art === 'fest' && dn(a.datum) == null) add(sn + ': Datum „' + (a.datum || '') + '“ ungültig', 'Termin lösen (neu eintragen)', dd => { S(dd).anker = { art: 'offen' }; });
      else if ((a.art === 'start' || a.art === 'ende') && !m.plan.steps.some(q => q.id === a.ref)) add(sn + ': hängt an einem gelöschten Schritt', 'an den PAL hängen', dd => { S(dd).anker = { art: 'pal', offset: 0 }; });
      else if (r.err === 'Zirkelbezug' && !cycleFixed) { cycleFixed = true; add(sn + ': Zirkelbezug (Schritte hängen im Kreis voneinander ab)', 'Kreis lösen: diesen Schritt an den PAL hängen', dd => { S(dd).anker = { art: 'pal', offset: 0 }; }); }
      if (s.typ === 'aufgabe' && !(isNum(s.dauer) && +s.dauer >= 0 && +s.dauer <= MAX_DAUER && Math.round(+s.dauer) === +s.dauer))
        add(sn + ': Dauer „' + s.dauer + '“ ungültig', 'auf ' + clamp(Math.round(+s.dauer || 0), 0, MAX_DAUER) + ' Tage setzen', dd => { S(dd).dauer = clamp(Math.round(+S(dd).dauer || 0), 0, MAX_DAUER); });
      if (str(s.wer) !== str(s.wer).trim()) add(sn + ': Person „' + s.wer + '“ mit Leerzeichen am Rand', 'Leerzeichen entfernen', dd => { S(dd).wer = str(S(dd).wer).trim(); });
    }
  }
  for (const u of d.urlaube) {
    const uid0 = u.id, U = dd => dd.urlaube.find(q => q.id === uid0), un = 'Urlaub ' + (u.wer || '?');
    const a = dn(u.von), b = dn(u.bis);
    if (a == null) add(un + ': Beginn „' + (u.von || '') + '“ ungültig', 'Urlaub löschen', dd => { dd.urlaube = dd.urlaube.filter(q => q.id !== uid0); });
    else if (u.bis && b == null) add(un + ' ab ' + fmtD(a) + ': Ende „' + u.bis + '“ ungültig', 'Ende = Beginn setzen', dd => { U(dd).bis = U(dd).von; });
    else if (b != null && b < a) add(un + ': Ende ' + fmtD(b) + ' liegt vor dem Beginn ' + fmtD(a), 'Beginn und Ende tauschen', dd => { const x = U(dd); [x.von, x.bis] = [x.bis, x.von]; });
    if (str(u.wer) !== str(u.wer).trim()) add(un + ': Name mit Leerzeichen am Rand', 'Leerzeichen entfernen', dd => { U(dd).wer = str(U(dd).wer).trim(); });
  }
  for (const s of d.sondertage) if (dn(s.datum) == null) { const sid = s.id; add('Freier Tag „' + (s.name || '?') + '“: Datum „' + (s.datum || '') + '“ ungültig', 'löschen', dd => { dd.sondertage = dd.sondertage.filter(q => q.id !== sid); }); }
  const names = new Map();
  for (const p of d.personen) names.set(p.name, (names.get(p.name) || 0) + 1);
  for (const [n, c] of names) if (c > 1) add('Person „' + n + '“ steht ' + c + '× in der Liste', 'doppelte Einträge entfernen', dd => { let seen = false; dd.personen = dd.personen.filter(p => p.name !== n || (!seen && (seen = true))); });
  return out;
}
const checkSig = list => list.map(i => i.text).join('|');
async function checkDialog() {
  const list = checkData();
  if (!list.length) { toast('Datenprüfung: keine Auffälligkeiten.', 'ok'); return; }
  const ok = await modal('Datenprüfung', h('div', { class: 'form mergeform' },
    h('p', null, list.length + ' Auffälligkeit' + (list.length === 1 ? '' : 'en') + ' gefunden. Angehakte Vorschläge werden repariert (Strg+Z macht es rückgängig).'),
    list.map(it => h('div', { class: 'mrow' }, h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: it.on, onchange: e => { it.on = e.target.checked; } }),
      h('span', null, h('b', null, it.text), h('div', { class: 'muted small' }, '→ ' + it.label)))))),
    [['Schließen', false], ['Reparieren', true, 'primary']], { wide: true });
  if (ok) {
    const todo = list.filter(i => i.on);
    if (todo.length && commit(d => { for (const it of todo) it.fix(d); }, todo.length + ' Auffälligkeit' + (todo.length === 1 ? '' : 'en') + ' repariert')) UI.checkSeen = null;
  } else { UI.checkSeen = checkSig(list); saveUI(); }
  renderNow();
}
