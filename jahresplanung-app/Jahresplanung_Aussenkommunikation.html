const CHANGELOG = [{"version": "0.15.4", "date": "2026-10-08T13:38", "items": ["Zeitleiste: Bereiche (Selektion, Inhalt, Produktion …) und PAL lassen sich wie im Kalender ein- und ausblenden – die Knöpfe stehen über der Zeitleiste; die Einstellung gilt für Zeitleiste, Kalender und „Was steht an?“ gemeinsam"]}, {"version": "0.15.3", "date": "2026-10-08T09:28", "items": ["Ohne Startdatei: Die Jahresplanung wird direkt geöffnet – Doppelklick auf „Jahresplanung_Aussenkommunikation.html“ im (synchronisierten) Mailing-Ordner im Windows-Explorer; sie öffnet sich im Standardbrowser", "Das Update-Paket enthält nur noch die Programmdatei; die alte „Jahresplanung starten.cmd“ im Mailing-Ordner kann gelöscht werden", "Hinweise in der App und in der Excel-Ansicht nennen den neuen Weg"]}, {"version": "0.15.2", "date": "2026-10-08T07:56", "items": ["Browser ohne Speichern in den Mailing-Ordner (z. B. Firefox, Safari, Brave): Hinweis-Leiste mit Erklärung und Anleitung, Edge oder Chrome als Standardbrowser festzulegen (Knopf zu den Windows-Einstellungen) – auch nach „Speichern“", "Startdatei „Jahresplanung starten“ öffnet immer den Standardbrowser – Edge und Chrome als eigenes Programmfenster; Edge wird auch an ungewöhnlichen Installationsorten gefunden"]}, {"version": "0.15.1", "date": "2026-10-07T11:04", "items": ["Datensicherung unter Einstellungen → Allgemein: „Sicherung speichern …“ (Speicherort wählen) und „Sicherung hochladen …“ (vorher wird der aktuelle Stand automatisch gesichert; Strg+Z möglich)", "⋯-Menü und Export-Menü ohne „Daten aus anderer Datei übernehmen“, „Kopie speichern unter“ und „Daten als JSON sichern“", "Urlaub ↔ Aufgaben zusätzlich geprüft: Urlaub kürzen, löschen, Aufgabe oder ganzen Abschnitt an jemand anderen übergeben, Rückgängig, Neuladen – die Aufgaben passen sich jedes Mal an"]}, {"version": "0.15", "date": "2026-10-07T10:35", "items": ["Urlaub und Abwesenheit der zugeordneten Person verlängern ihre Aufgaben im Detailplan: Die Dauer zählt nur ihre Werktage (2 Tage Urlaub → Aufgabe 2 Werktage länger, Nachfolger rücken mit; am PAL hängende Aufgaben beginnen früher). In der Zeile steht „+2“, bei den Warnungen oben ein Hinweis. Aufgaben mit fester Dauer werden nicht verlängert (dann Warnung)", "Ferienzeiten erscheinen grau wie Wochenenden (Kalender, Zeitleiste, Urlaubsübersicht) – sie bleiben Werktage", "⋯-Menü schlanker: Speichern immer automatisch (Schalter entfällt); „Speicherort neu wählen“ und „Änderungsprotokoll“ unter Einstellungen → Allgemein; Urlaub-Einträge und „Hilfe“ entfernt", "Reiter „Auswertung“ ohne „Beta“", "Auswertung: rote Zahl an jeder Maßnahme, bei der Spenden in „Prüfen“ warten (Regel-Treffer oder von Hand vorgemerkt); eingeklappt nennt die Übersicht diese Maßnahmen"]}, {"version": "0.14", "date": "2026-10-07T09:07", "items": ["Einstellungen als eigene Seite mit Rubriken: Allgemein, Bereiche & Personen, Urlaub & Feiertage, Vorlagen für Detailpläne, Version", "Ferienzeiten: unter Urlaub & Feiertage („+ Ferienzeiten eintragen“) im Kalender-Fenster ohne Person, mit Notiz – erscheinen im Kalender, in der Zeitleiste und in der Urlaubsübersicht; Ferientage bleiben Werktage", "Urlaub-/Ferien-Fenster ohne die Hinweistexte", "Verknüpfte Termine haben immer dasselbe Datum: Verlängern schiebt die Nachfolger, früher beginnen oder Verschieben eines Nachfolgers zieht die Vorgänger (und alles davor) mit; der PAL bleibt fest", "Das Ende einer Aufgabe ist der Übergabetag (nächster Werktag) – endet sie freitags, steht als Ende der Montag, an dem der Nachfolger beginnt", "Verknüpfungen mit Abstand aus früheren Versionen: Hinweis im Plan mit „Angleichen“", "Neuer Detailplan: „Blanko“ (leer), „Einfach“ oder eine Vorlage; Vorlagen in den Einstellungen bearbeiten, kopieren, löschen und neu anlegen – z. B. für Presse- und Öffentlichkeitsarbeit mit eigenen Abschnitten", "„Als Vorlage speichern …“ im Kopf eines Detailplans", "Abschnitt löschen: Rückfrage „Alle Aufgaben darin mitlöschen“ (vorausgewählt) – ohne Häkchen bleibt nur der Inhalt; der Briefkasten-Termin (PAL) bleibt immer", "Buchungen hinzugefügt: Zusammenfassung in sechs Feldern (Zeitraum, neue Spenden, Gesamtsumme, Überschneidung, doppelte Spenden, erkannte Regeln); in der Liste steht am Zeilenende das Schlagwort der passenden Regel in der Farbe der Maßnahme"]}, {"version": "0.13.7", "date": "2026-10-06T11:18", "items": ["Detailplan: die Dauer der Arbeitsschritte zählt in Werktagen (Mo–Fr ohne Feiertage und eigene freie Tage) – links mit „WT“ angezeigt und so eingegeben; Wochenenden und Feiertage verlängern einen Schritt automatisch", "Ein Schritt beginnt immer an einem Werktag; Verschieben behält die Dauer in Werktagen", "„Detailplan anlegen“: die Starts aus „Werktage bis PAL“ werden in Werktagen eingeplant; neue Aufgaben dauern 5 Werktage", "Bestehende Pläne werden beim ersten Öffnen umgerechnet – die Termine bleiben gleich, nur Schritte, die bisher an einem Samstag oder Sonntag begannen, rücken auf den Werktag"]}, {"version": "0.13.6", "date": "2026-10-06T10:38", "items": ["Neue Maßnahme: wer nur den PAL einträgt, bekommt keine Starts mehr für Selektion, Inhalt und Produktion – die trägt man selbst ein (oder sie kommen aus dem Detailplan)", "Detailpläne: „+ Detailplan anlegen“ ist ein roter Knopf"]}, {"version": "0.13.5", "date": "2026-10-06T08:48", "items": ["Neu: ⋯ → „Daten zurücksetzen …“ – wahlweise alle Spenden-Zuordnungen (auch „Prüfen“ und allgemeine Spenden), die Schlagwort-Regeln, die Exportdateien der Spendeneingänge und die Maßnahmen eines Jahres entfernen; Einstellungen, Personen, Urlaube und Feiertage bleiben; vorher wird automatisch eine Datensicherung heruntergeladen, Strg+Z holt die Planungsdaten zurück", "„+ Buchung hinzufügen“: der Export landet im Ordner „Spendeneingänge JJJJ“ des Jahres, aus dem die Buchungen stammen (bisher im zuerst gefundenen Ordner)", "Startdatei: ruft PowerShell mit vollem Pfad auf; geht das nicht, öffnet sich das Programm in einem normalen Edge-Fenster (vorher blieb das Fenster bei Umlauten im Pfad leer)"]}, {"version": "0.13.4", "date": "2026-10-05T14:44", "items": ["Auswertung: der Knopf heißt „+ Buchung hinzufügen“ und ist rot", "Nach dem Hinzufügen eine kurze Zusammenfassung: wie viele Spenden neu sind, wie viele doppelt erkannt wurden und ob sich Zeiträume mit bisherigen Dateien überschneiden (mit welchen); darunter die neuen Spenden in einer Liste (etwa 10 sichtbar, der Rest zum Rollen); mit ✕, „Schließen“ oder Esc wegklicken"]}, {"version": "0.13.3", "date": "2026-10-05T14:34", "items": ["Spenden zuordnen: zwischen den Spalten je ein Griff (drei kleine Striche) – ziehen macht die mittlere Spalte auf beiden Seiten gleich schmaler oder breiter, „Offen“ und „Zugeordnet“ werden entsprechend breiter; Doppelklick stellt drei gleiche Spalten wieder her; die Breite bleibt gespeichert", "Kennzahlen: auch die Bezeichnungen der Kacheln stehen mittig (Erlös bleibt links)"]}, {"version": "0.13.2", "date": "2026-10-05T14:20", "items": ["Spenden zuordnen: die Schlagworte der Regel sammeln sich in einer eigenen Zeile darunter – das Eingabefeld rutscht nicht mehr nach rechts", "Kennzahlen: unter der Responsequote steht die absolute Zahl (z. B. „36 Spenden“) statt der Auflage", "Erlös: Betrag in der Mitte; „Spenden … − Kosten …“ steht nur noch im Hinweis beim Überfahren", "Zahlen in den Kacheln (Spendensumme, Ø-Spende, Responsequote, ROI) stehen mittig"]}, {"version": "0.13.1", "date": "2026-10-05T14:02", "items": ["Zeitleiste: ohne eigene Auswahl „Maßnahmen“ – sie zeigt, was in der Tabelle oben angehakt ist; „Urlaub“ steht rechts, der Schalter „Detailpläne“ entfällt (einzelne Pläne weiter mit ▸ an der Maßnahme aufklappen); eingeklappt ohne Zusatztext", "Maßnahmen: die Anzahl im Kopf entfällt", "Detailpläne: es erscheinen nur Pläne, deren PAL im gewählten Jahr liegt; „Plan ›“ bei einer Maßnahme aus einem anderen Jahr wechselt in dieses Jahr"]}, {"version": "0.13", "date": "2026-10-05T11:35", "items": ["Neuer Aufbau nach den drei Aufgaben: Reiter „Jahresplanung“ (planen), „Detailpläne“ (durchführen) und „Auswertung“ (auswerten)", "Jahresplanung: unter den Maßnahmen die Zeitleiste (Gantt, zum Ausklappen), darunter der Kalender und „Was steht an?“ – der Reiter „Zeitleiste“ entfällt", "Zeitleiste: wer die Seite mit dem Mausrad blättert, blättert über die Zeitleiste hinweg weiter; gezoomt wird nach einer kurzen Pause (Strg+Mausrad zoomt immer)", "Urlaub & Feiertage: über ⋯ → „Urlaub & Feiertage …“ und in den Einstellungen; ⋯ → „Urlaub / Abwesenheit eintragen …“ öffnet direkt das Eintragen", "Programm-Update direkt aus dem ZIP-Paket – kein Entpacken mehr: im Dialog wählen, ins Fenster ziehen oder im Mailing-Ordner speichern (die App meldet das Paket dann selbst und entfernt es nach dem Einspielen)", "Spenden zuordnen: was von Hand in „Prüfen“ liegt, bleibt dort auch beim Wechsel der Maßnahme und wird der gerade gewählten zugeordnet", "„Offen“ und „Zugeordnet“: Knopf „Alle markieren“ / „Markierung aufheben“", "Auswertung: die Tabelle heißt „Maßnahmen 2027“; ein leerer Hinweis zeigt „–“ wie in der Jahresplanung"]}, {"version": "0.12.8", "date": "2026-10-05T09:10", "items": ["Regeln und Suche verstehen jetzt Suchausdrücke: * als Platzhalter (z. B. *bericht findet auch „Jaresbericht“, Jahres* alles, was so beginnt), ? für genau ein Zeichen, ~Wort für kleine Tippfehler, „A + B“ für beides, -Wort zum Ausschließen", "Kleine Hilfe zu den Suchausdrücken: am ⓘ neben „Regel“ sofort, über dem Schlagwort- und dem Suchfeld nach etwa 2 Sekunden Verweilen", "„Offen“: Daueraufträge einblenden, ausblenden oder nur Daueraufträge zeigen", "Die Liste in der Mitte (Prüfen) beginnt ganz oben in der Spalte", "Übersicht: hinter der Auflage steht „Stk.“, hinter den Kosten „€“; jede Spalte – auch ROI und Hinweis – lässt sich in der Breite ziehen"]}, {"version": "0.12.7", "date": "2026-10-05T08:04", "items": ["Der Reiter heißt jetzt „Auswertung“ (mit „Beta“); die Überschrift „Spenden 2027“ und der Erklärsatz entfallen, „Neu einlesen“ und „Datei hinzufügen“ stehen im Kopf der Übersicht", "Übersicht: Spalte „Hinweis“ (dasselbe Feld wie in der Jahresplanung, hier direkt eintragbar); Spaltenbreiten ziehen wie in der Jahresplanung", "Neu: „Allgemeine Spenden“ je Jahr als erste Zeile – für Spenden ohne Maßnahme; mit Häkchen „Daueraufträge vorschlagen“; zählen nicht in die Summe der Maßnahmen", "Rücklauf im Vergleich: jede Maßnahme lässt sich per Knopf ein- und ausblenden", "„Spenden zuordnen“: Schlagwort tippen filtert „Offen“ sofort (Vorschau), Enter übernimmt es in die Regel; in der Mitte ein Knopf zum Zuordnen (markierte oder alle), alle Knöpfe einzeilig; Linie oben in der Mitte entfernt", "Detailplan im dunklen Design: das P im Kopf und in der PAL-Zeile ist wieder rot", "Kopfzeile: Umbruch in zwei Zeilen wird zuverlässiger erkannt"]}, {"version": "0.12.6", "date": "2026-10-03T20:39", "items": ["Zuordnen: ein Klick auf eine offene Spende schiebt sie sofort in die Mitte zum Prüfen (Strg+Klick oder Umschalt+Klick markiert mehrere)", "„Filter ▸“ steht oben rechts im Kasten „Offen“", "Die mittlere Spalte (Prüfen) kommt ohne Überschrift und Erklärtexte aus", "Übersicht: „Rücklauf im Vergleich“ zum Ausklappen; die Erklärzeile zu Responsequote und ROI entfällt", "Datumsfelder: statt „Datum unvollständig“ heißt es jetzt „Dieses Datum gibt es nicht (z. B. 31.06.) oder es ist unvollständig“"]}, {"version": "0.12.5", "date": "2026-10-03T19:12", "items": ["Spenden: liegen zugeordnete Spenden vor dem PAL (z. B. weil der PAL nachträglich geändert wurde), erscheint ein Hinweis mit „Diese … lösen“; außerdem ein Eintrag in der Hinweisliste oben", "Zahlen deutsch eingeben: Auflage und Kosten (Übersicht, Maßnahmen-Tabelle, Bearbeiten-Dialog) verstehen „1.500“ und „1.234,50“ – vorher wurde „1.500“ zu 2 und „1234,50“ zu 123.450", "Spenden: der Reiter liest beim Öffnen und beim Zurückkehren ins Fenster neu ein (neue Exporte sofort sichtbar)", "Regeln: ohne PAL macht eine Regel keine Vorschläge (sonst über alle Jahre); das Ende des Zeitraums kann nicht mehr vor dem Beginn liegen", "Mehr als 200 Spenden auf einmal nach „Prüfen“ erst nach Rückfrage; Zeilen ohne lesbares Datum/Betrag werden im Datei-Hinweis gemeldet", "Zusammenführen: keine Rückfragen mehr zu abgelehnten Vorschlägen und Vormerkungen – nur echte Zuordnungskonflikte", "Kopie einer Maßnahme ohne Kosten; Rückgängig-Verlauf begrenzt den Speicher bei sehr vielen Zuordnungen"]}, {"version": "0.12.4", "date": "2026-10-03T18:41", "items": ["Regel: Häkchen „Daueraufträge ausschließen“ – die Regel schlägt dann keine Daueraufträge vor", "Regel: Knopf „↻ Regel neu anwenden“ – holt Vorschläge zurück nach „Prüfen“, die (z. B. versehentlich mit „Alle zurück“) nach „Offen“ geschickt wurden", "„Offen“: Suche, Zeitraum und „Daueraufträge ausblenden“ sind eingeklappt („Filter ▸“); eine Zeile zeigt, was gerade gilt", "Übersicht: Spaltenbreiten lassen sich ziehen (wie in der Jahresplanung), Doppelklick setzt zurück", "Kennzahlen: Namen größer und fett; darunter eine Zeile „Erlös“ (Spenden minus Kosten) – grün, bei Verlust rot"]}, {"version": "0.12.3", "date": "2026-10-03T17:55", "items": ["Spenden: der Bereich der Maßnahme (Name, Kennzahlen, Grafiken) lässt sich ein- und ausklappen", "Grafiken: Wochenenden grau hinterlegt; das P am PAL ist grau statt rot", "Richtwerte sind ausgeblendet; unter ⋯ → Einstellungen → „Spenden: Richtwerte“ lassen sie sich einschalten und anpassen", "Übersicht ohne Spalte „in Prüfung“", "Zuordnen: die drei Listen beginnen auf derselben Höhe, die Knöpfe stehen unten bündig; „Daueraufträge ausblenden“ als Häkchen; Betragsfilter entfernt"]}, {"version": "0.12.2", "date": "2026-10-03T17:10", "items": ["Spenden: der Kasten unter der Übersicht zeigt groß den Namen der gewählten Maßnahme in ihrer Farbe – Auswahl, PAL, Auflage und Kosten stehen nur noch in der Übersicht (Maßnahme per Klick auf die Zeile wählen, Auflage und Kosten direkt dort eintragen)", "Zuordnen beginnt am PAL: der Filter „von“ steht immer auf dem PAL der Maßnahme (auch nach einer PAL-Änderung)", "Die Grafiken beginnen am PAL; eine Spende vor dem PAL verlängert sie nicht mehr, sondern steht als „inkl. … vor dem PAL“ dabei und ist in den Listen markiert", "„Offen“: Knopf „Daueraufträge ausblenden“"]}, {"version": "0.12.1", "date": "2026-10-03T16:49", "items": ["Keine „überfällig“-Hinweise mehr: Termine werden nicht mit dem heutigen Datum verglichen (auch nicht in „Was steht an?“)", "Spenden: der Verwendungszweck steht immer in jeder Zeile; Namen auf Wunsch („Namen zeigen“). Daueraufträge bleiben in der Liste und sind farbig markiert", "Spenden: in „Prüfen“ schickt „← Alle zurück“ alles auf einmal zurück zu „Offen“ (ohne vorher zu markieren; Strg+Z holt es zurück)", "Spenden: Kennzahlen als 2×2 (Spendensumme, Ø-Spende, darunter Responsequote und ROI); rechts daneben die Zeitspanne der Eingänge (Summe aufaddiert) und die Spenden pro Tag. Nettoertrag, „In Prüfung“ und der Abschnitt „Verlauf“ entfallen"]}, {"version": "0.12", "date": "2026-10-03T16:04", "items": ["Neuer Reiter „Spenden (Beta)“: Spendeneingänge den Maßnahmen zuordnen und auswerten", "Exporte (CSV oder Excel) einfach in den Ordner „Spendeneingänge …“ im Mailing-Ordner legen, über „+ Datei hinzufügen“ ablegen oder in den Reiter ziehen; die App liest sie beim Öffnen, beim Zurückkehren ins Fenster, alle zwei Minuten und auf Knopfdruck. Buchungen aus überlappenden Exporten zählen nur einmal; Abbuchungen werden übergangen", "Drei Spalten: links offene Spenden (mit Suche, Zeitraum, Mindestbetrag), in der Mitte „Prüfen“, rechts die zugeordneten. Erst „zuordnen“ zählt eine Spende für die Maßnahme", "Regel je Maßnahme: Schlagworte im Verwendungszweck (z. B. „JB“) und ein Zeitraum ab PAL – passende Spenden landen automatisch in „Prüfen“, auch aus später hinzugefügten Exporten; abgelehnte Vorschläge kommen nicht wieder. Der Reiter zeigt, wie viele Spenden auf Prüfung warten", "Kennzahlen je Maßnahme: Spendensumme, Anzahl, Ø-Spende und Median, Responsequote, ROI (mit Richtwerten), Nettoertrag – Kosten neu an der Maßnahme (auch im Bearbeiten-Dialog). Übersichtstabelle aller Maßnahmen des Jahres wie in der Mailing-Übersicht", "Verlauf: Spendeneingänge je Woche und kumuliert ab dem PAL, Vergleich der Rückläufe aller Maßnahmen (Tage nach PAL), Wochenwerte als Tabelle", "Datenschutz: In der Planungsdatei stehen nur Zuordnung, Datum und Betrag – Namen, IBAN und Verwendungszweck bleiben in den Exporten im Ordner"]}, {"version": "0.11.3", "date": "2026-10-03T14:47", "items": ["Urlaub / Abwesenheit: im Kalendarium sind gespeicherte Tage der gewählten Person jetzt markiert statt gesperrt – anklicken (oder darüberziehen) nimmt sie heraus, gestrichelt bis zum Speichern; unten stehen die Änderungen je Person (neu / entfernt). Notizen bestehender Einträge bleiben erhalten"]}, {"version": "0.11.2", "date": "2026-10-03T14:00", "items": ["Urlaub / Abwesenheit eintragen: die anderen Personen verschwinden beim Wechseln nicht, sondern stehen als blasse Striche in ihrer Farbe im Hintergrund – schon gespeicherte Einträge und gerade markierte Tage; Maus darauf zeigt, wer"]}, {"version": "0.11.1", "date": "2026-10-03T13:14", "items": ["Urlaub / Abwesenheit eintragen: alle zwölf Monate auf einen Blick (Jahr umschaltbar)", "Jede Markierung behält die Person und Art, die beim Markieren eingestellt war – man kann nacheinander Urlaub und Abwesenheiten für mehrere Personen markieren und alles auf einmal speichern; unten steht je Person und Art eine Zusammenfassung"]}, {"version": "0.11", "date": "2026-10-03T12:37", "items": ["Detailplan: das P neben „PAL“ im Kopf ist rot (wie in Tabelle und Gantt)", "Feste Dauer: im ⋯-Menü einer Aufgabe „Dauer festlegen (fix)“ – kleines Schloss neben der Dauer; solche Aufgaben bleiben beim anteiligen Anpassen unverändert", "Bereichsstart verschieben (Zeitleiste, Kalender, Kopf des Detailplans): das Ende des Abschnitts bleibt, alle Schritte darin werden anteilig kürzer bzw. länger – Dauern und Abstände, feste Dauern ausgenommen", "Warnung nach dem PAL: zusätzlich „Auf den PAL stauchen“ – Beginn und PAL bleiben, die Schritte dazwischen werden anteilig kürzer", "Urlaub / Abwesenheit: neuer Dialog mit Kalendarium – Person aus den Einstellungen, Urlaub oder Abwesenheit, Tage anklicken oder Zeiträume ziehen (mehrere auf einmal), schon belegte Tage sind gesperrt; Knopf „+ neuen Urlaub eintragen“ oben rechts in der Karte", "Abwesenheiten erscheinen gestreift (Übersicht, Kalender, Zeitleiste); in der Liste lässt sich die Art umstellen; Excel und Outlook-Export nennen die Art"]}, {"version": "0.10.2", "date": "2026-10-02T15:28", "items": ["Detailplan: mit Strg gesetzte Verknüpfungen dürfen jetzt auch über Abschnitte gehen (z. B. Ende „Selektion abgeschlossen“ → Beginn „Thema definieren“) – dann wandert der Inhalt mit der Selektion; Kreise und der Briefkasten-Termin bleiben ausgeschlossen", "Bereichsstart verschieben: der Ausgleich (längster mitwandernder Schritt) bleibt im eigenen Abschnitt", "Alte, unsichtbare Verknüpfungen über Abschnitte (aus Vorlagen und älteren Versionen) werden weiterhin gelöst, die Termine bleiben"]}, {"version": "0.10.1", "date": "2026-10-02T15:00", "items": ["Detailplan-Gantt: Strg+Klick auf einen Punkt (Gelenk) löst die Verknüpfung – hängt dort nur eine, sofort; bei mehreren erscheint direkt an der Stelle eine Auswahl. Strg + Ziehen legt wie bisher eine Verknüpfung an", "Solange Strg gedrückt ist, treten die Punkte im Gantt in der Farbe der Maßnahme hervor", "Strg+Klick auf ein verknüpftes Datum in der Tabelle: bei nur einer Verknüpfung wird sie gleich gelöst; die Meldung nennt beide Schritte (Strg+Z macht es rückgängig)"]}, {"version": "0.10", "date": "2026-10-02T13:28", "items": ["Detailplan: Verknüpfungen laufen jetzt vorwärts – der Beginn eines Schritts hängt am Ende seiner Vorgänger; ein Ende kann beliebig viele Anfänge haben, ein Beginn mehrere Vorgänger (es zählt das späteste Ende). Wird ein Schritt länger oder rückt er, wandert alles danach mit", "Verknüpfen mit Strg: Strg gedrückt halten und vom Ende eines Schritts auf den Beginn eines anderen ziehen – in der Tabelle oder im Gantt; dabei bleiben nur die passenden Daten sichtbar (selber Abschnitt, kein Kreis). Strg+Klick auf ein verknüpftes Datum löst eine Verknüpfung", "Anzeige: im Gantt kleine Gelenke an jeder Verknüpfung, in der Tabelle Kalendersymbole in der Farbe der Maßnahme; beim Hinzeigen bleibt nur das verbundene Datum farbig", "Warnung, wenn ein Schritt eines Bereichs nach dem PAL endet – mit „Alles vor den PAL rücken“: der PAL und die Dauern bleiben, die Kette davor rückt nach vorn", "Dauer ändern hält jetzt den Beginn fest, das Ende wandert (vorher umgekehrt)", "Bestehende Pläne werden beim Öffnen umgestellt, alle Termine bleiben gleich"]}, {"version": "0.9.7", "date": "2026-10-02T10:23", "items": ["Detailplan: Abschnitte sind unabhängig – wer einen Schritt oder Abschnitt verschiebt, nimmt keine Schritte anderer Abschnitte mehr mit; innerhalb eines Abschnitts wandern verknüpfte Schritte weiter mit, der PAL verschiebt weiterhin alles", "Bestehende Verknüpfungen über Abschnitte hinweg (z. B. Inhalt hängt an der Selektion) werden beim Laden am PAL festgemacht – alle Termine bleiben, wie sie sind", "Hinweis am Balken zeigt, woran der Schritt hängt und welche Schritte an ihm hängen"]}, {"version": "0.9.6", "date": "2026-09-30T17:04", "items": ["Detailplan-Gantt: der Briefkasten-Termin ist ein rotes P statt der Raute (in der Tabelle ebenfalls rot); ziehen verschiebt das PAL und den ganzen Plan – die Balken wandern schon beim Ziehen mit", "PAL verschieben (Detailplan, Kalender, Zeitleiste) nimmt jetzt auch Schritte mit festem Datum mit", "Gantts: Aufgaben laufen von Tagesmitte zu Tagesmitte – Meilensteine, PAL-Linie und Balkenenden liegen genau übereinander (Detailplan, PDF, aufgeklappte Pläne in der Zeitleiste)", "Ziel und Meilenstein zusammengelegt: alle Ziele werden Meilensteine; „Ziel“ (rot) steht nur noch beim Briefkasten-Termin"]}, {"version": "0.9.5", "date": "2026-09-30T16:06", "items": ["Kalender: die Linie eines Abschnitts endet spätestens am PAL – auch wenn ein Schritt darin später endet", "Detailplan: in der Zeile „Briefkasten-Termin“ steht rechts neben dem Schloss das P des PAL"]}, {"version": "0.9.4", "date": "2026-09-30T15:59", "items": ["Kalender: ohne Detailplan läuft die Linie eines Abschnitts bis zum PAL (bzw. bis zum eingetragenen Ende) statt nur bis zum Start des nächsten Bereichs"]}, {"version": "0.9.3", "date": "2026-09-30T15:44", "items": ["Kalender: ist der letzte angezeigte Termin einer Maßnahme nicht der PAL (z. B. nur „D“ eingeblendet), läuft die Linie bis zum Ende dieses Abschnitts weiter – mit kleinem Endstrich; so sieht man, wie lange der Bereich dauert (Ende laut Detailplan, sonst bis zum nächsten Start bzw. PAL)"]}, {"version": "0.9.2", "date": "2026-09-30T15:10", "items": ["Kalender: ist eine Maßnahme angeklickt (festgehalten), blendet ein Klick auf einen Buchstaben in ihrer Terminzeile unter dem Monat diesen Bereich aus – wie die Knöpfe oben; ausgeblendete Buchstaben bleiben dort blass stehen und blenden per Klick wieder ein", "Die Verbindungslinie beim Hervorheben berücksichtigt ausgeblendete Bereiche"]}, {"version": "0.9.1", "date": "2026-09-30T14:51", "items": ["Kalender: „Bearbeiten“ öffnet den Detailplan der Maßnahme; gibt es noch keinen, das Fenster zum Anlegen (Einfach / Komplex / Kopie). Das Bearbeiten-Fenster gibt es weiter über ⋯ in der Maßnahmen-Tabelle", "Start im Kalender oder in der Zeitleiste verschieben (Detailplan): reicht das Kürzen der Schritte nicht, fragt die App mit Begründung nach – „Nur bis …“ oder „Ganzen Abschnitt verschieben“ – statt nur zu warnen", "Detailplan: der Briefkasten-Termin ist wieder eine normale Zeile im Abschnitt (kein eigener Abschnitt), rot, nicht fett; das Datum ist fest (Schloss) und die Raute im Gantt lässt sich nicht ziehen – das PAL ändert man im Kopf oder in der Tabelle"]}, {"version": "0.9", "date": "2026-09-30T14:34", "items": ["Namensfelder (Detailplan, Hauptverantwortlich, Urlaub): ein Klick zeigt immer alle Personen – auch wenn schon ein Name eingetragen ist; Tippen filtert, „– niemand“ leert das Feld, ein neuer Name wird mit Enter als Person angelegt", "Detailplan: ganzen Abschnitt verschieben – den grauen Abschnittsbalken im Gantt ziehen oder im ⋯-Menü „Abschnitt verschieben …“; alle Schritte darin wandern mit", "Detailplan: der Briefkasten-Termin (PAL) ist immer ein eigener Abschnitt und rot hervorgehoben; er hängt fest am PAL (Datum dort ändern oder Raute ziehen = PAL verschieben) und lässt sich nicht löschen. Bestehende Pläne wurden automatisch umgestellt", "Detailplan: Hinweise an den Balken ohne „Ziehen = …“ und mit Werktagen statt Tagen; beim Ziehen gibt es nur noch ein (helles) Fenster", "Maßnahmen-Tabelle: Spalte heißt jetzt „Spendenbitte“, mit dezentem Auswahlpfeil (auch in PDF und Excel)", "Vergleich mit einer Konfliktkopie: ältere Kopien werden vorher auf den aktuellen Aufbau gebracht, damit keine scheinbaren Unterschiede auftauchen"]}, {"version": "0.8.11", "date": "2026-09-30T13:48", "items": ["Kopfzeile bei kleinerem Fenster: oben Logo, Titel, Jahr und die Knöpfe, die Reiter (Jahresplanung … Urlaub & Feiertage) in einer eigenen zweiten Zeile; bei breitem Fenster wie bisher alles in einer Zeile"]}, {"version": "0.8.10", "date": "2026-09-30T13:37", "items": ["PDF Maßnahmen-Übersicht: bei den Starts oben das Datum, darunter klein die Werktage bis zum PAL", "PDF Kalender: passt auf eine Seite – schmaler Kopf ohne Logo, kompaktere Terminlisten; bei sehr vielen Terminen wird der Kalender automatisch etwas verkleinert"]}, {"version": "0.8.9", "date": "2026-09-30T12:26", "items": ["Häkchen „anzeigen“: wird die letzte angehakte Maßnahme abgewählt, sind wieder alle angehakt", "Klick auf eine Maßnahme im Kalender wählt vorübergehend nur diese aus – die Tabelle zeigt dann nur bei ihr ein Häkchen; wird sie im Kalender wieder gelöst (Klick daneben oder Esc), gilt wieder die vorherige Auswahl. Ein Häkchen-Klick in der Zeit übernimmt „nur diese“ als Ausgangspunkt"]}, {"version": "0.8.8", "date": "2026-09-30T12:16", "items": ["Kalender: der Hinweis an den Kästchen ist einfacher – je Termin eine Zeile, z. B. „S Start Selektion: Fr 02.04.2027 · 53 WT“ (gilt auch in der Zeitleiste)", "Häkchen „anzeigen“ bei den Maßnahmen: sind alle angehakt, bleibt nach einem Klick nur diese Maßnahme angehakt; sind alle aus, wird nur die angeklickte angehakt; sonst wird sie umgeschaltet. Strg+Klick schaltet immer nur diese eine um. Gleich in der Seitenleiste und im Filter der Zeitleiste"]}, {"version": "0.8.7", "date": "2026-09-30T12:09", "items": ["Detailplan: in der Abschnittszeile läuft der Text der Bereichsauswahl (z. B. „– ohne Bereich“) nicht mehr unter den Pfeil"]}, {"version": "0.8.6", "date": "2026-09-30T11:28", "items": ["PDF-Export von Detailplänen: die Tabelle links wird nur noch eingeklappt, wenn sie in der Ansicht eingeklappt ist – sonst kommen alle Spalten mit ins PDF. „Wie aktuelle Ansicht“ übernimmt auch eingeklappte Abschnitte", "Neues Häkchen im PDF-Fenster: „Detailpläne: nur Arbeitsschritte (Tabelle eingeklappt, Gantt breiter)“ – vorbelegt wie die aktuelle Ansicht", "PDF mit voller Tabelle: schmalere Spalten, Gantt passt vollständig aufs Blatt, Auswahlfelder ohne Pfeile, PAL ohne Rahmen"]}, {"version": "0.8.5", "date": "2026-09-30T11:20", "items": ["Maßnahmen-Tabelle in der Werktage-Ansicht: Spaltenköpfe „Zeit bis PAL für“ / „Selektion“ (bzw. Inhalt, Produktion)", "Leere Datumsfelder in der Maßnahmen-Tabelle zeigen einen hellgrauen Strich mit dezentem Kalendersymbol statt „tt.mm.jjjj“; Klick auf den Strich öffnet das Feld zum Eintippen, Klick aufs Symbol die Datumsauswahl", "Kalendersymbole in der Maßnahmen-Tabelle dezenter (beim Darüberfahren deutlicher)"]}, {"version": "0.8.4", "date": "2026-09-30T11:05", "items": ["Detailplan: das Zeichen des Bereichs (z. B. S, I, D, X) steht jetzt in der Abschnittszeile statt am ersten Arbeitsschritt; die Auswahl daneben zeigt nur noch den Namen", "Detailplan-Gantt: alle Abschnittsbalken wieder einheitlich grau – auch bei neuen Bereichen oder einer eigenen Linie (die Linien-Einstellung gilt für Kalender und Zeitleiste)", "„+ Aufgabe“ und „+ Abschnitt“ ganz hellgrau, damit sie in den Hintergrund treten (beim Darüberfahren dunkler)"]}, {"version": "0.8.3", "date": "2026-09-30T10:20", "items": ["Einstellungen „Bereiche und Markierungen“: je Bereich zusätzlich die Linie wählbar – abgestuft (wie bisher, von hell nach kräftig), pastell, kräftig, gestreift oder nur Rahmen, mit Vorschau", "Die Linie gilt für die Verbindungslinie im Kalender (auch in der Verbund-Darstellung), die Balken der Bereiche in der Zeitleiste, die Abschnittsbalken im Detailplan-Gantt (Abschnitte ohne Bereich bleiben grau) sowie PDF und Excel-Zeitleiste"]}, {"version": "0.8.2", "date": "2026-09-30T09:54", "items": ["Maßnahmen-Tabelle: Schalter „Datum – Werktage“ dezenter und heller; Werktage-Felder ohne Pfeile – eintippen oder ins Feld klicken und mit dem Mausrad hoch/runter", "Detailplan-Kopf neu geordnet: oben Name und PAL, die Legende oben rechts; darunter die Starts der Bereiche. Die Knöpfe −/+/Zurücksetzen sind weg (Zoomen weiter mit dem Mausrad, ganz herausdrehen zeigt den ganzen Plan)", "Detailplan-Tabelle: „+ Aufgabe“ (statt „+ neuer Arbeitsschritt“) legt ohne Fenster direkt eine neue Zeile an – Name ist markiert, einfach lostippen; im ⋯-Menü „Neue Aufgabe darunter“", "Detailplan-Tabelle ruhiger: Griffe und Auswahlpfeile heller, Kopfzeile etwas dunkler, Kommentare hellgrau kursiv, Bereich am Abschnitt dezenter (der Abschnittsname hat mehr Platz), rechts erst die Anzahl der Schritte, dann der Zeitraum", "Einstellungen „Bereiche und Markierungen“: Zeichen und Begriff je Bereich und für das PAL änderbar, weitere Bereiche mit eigenem Buchstaben; Aussehen je Markierung: pastell, kräftig, gestreift oder nur Rahmen – gilt im Kalender, in der Zeitleiste, in Tabellen, PDF und Excel. Voreinstellung wie bisher"]}, {"version": "0.8.1", "date": "2026-09-30T08:55", "items": ["Maßnahmen-Tabelle: Spaltenköpfe zweizeilig („Start der“ / „Selektion“, „Start des“ / „Inhalts“, „Start der“ / „Produktion“), Köpfe und Werte der Bereiche linksbündig", "Die Spalten der Bereiche sind grau hinterlegt und durch Striche getrennt; darüber sitzt ein Schalter „Datum – Werktage“ (ersetzt den alten Umschalter oben rechts)", "Spaltenbreite ziehen: es ändert sich nur die Nachbarspalte rechts, alle anderen bleiben stehen. Die Breiten bleiben nach Neustart und Programm-Update erhalten (je Rechner)", "Detailplan anlegen: PAL ist Pflicht; die Starts der Bereiche wahlweise als Datum oder als Werktage bis zum PAL (das andere rechnet sich aus). Dann „Einfach“ (nur die Bereiche und PAL), „Komplex“ (Aufbau wie Sommer-/Weihnachtsmailing, ohne Personen) oder „Kopie aus vorherigem Plan“"]}, {"version": "0.8", "date": "2026-09-29T17:06", "items": ["Bereiche: Selektion (S), Inhalt (I) und neu Produktion (D) bis zum PAL – überall im Programm (Tabelle, Kalender, Zeitleiste, Detailpläne, Was steht an?, Outlook, Excel, PDF). Weitere Bereiche mit eigenem Buchstaben lassen sich in den Einstellungen anlegen", "Ein Bereich läuft von seinem Start bis zum nächsten Start (der letzte bis zum PAL); bei Bedarf mit eigenem Ende (Bearbeiten-Fenster) – bei Detailplänen ergibt sich der Zeitraum aus den Schritten des Abschnitts", "Detailpläne: jeder Abschnitt wird einem Bereich zugeordnet; neue Vorlage „Bereiche“ (je Bereich ein Abschnitt, dann PAL). Sommer- und Weihnachtsmailing wurden automatisch umgestellt („Mailing“ geteilt in Inhalt und Produktion)", "Maßnahmen-Tabelle: Umschalter „📅 Datum | ⏱ Werktage“ – die Starts als Datum oder als Werktage bis zum PAL (auch eintippen); 🏖-Hinweis, wenn jemand, der im Detailplan in diesem Bereich eingetragen ist, Urlaub hat", "Kalender: Terminliste mit den Symbolen links und ohne Datum; „Bearbeiten“ steht nach einem Klick hinter den Zeilen der Maßnahme (nicht mehr unter der Markierung); die Verbindungslinie wird je Bereich kräftiger", "Zeitleiste: je Bereich ein Balken mit Griff; überlappende Bereiche liegen übereinander", "Wer arbeitet gerade? Anzeige „👥 Name“ in der Kopfzeile und ein Hinweis, wenn jemand anderes gerade ändert (über OneDrive, kann etwa eine Minute nachhinken)", "Änderungsprotokoll: bei jedem Speichern wird festgehalten, wer was geändert hat (⋯ → Änderungsprotokoll, auch als Blatt „Änderungen“ in der Excel-Ansicht)", "Datenprüfung: Auffälligkeiten (ungültige Daten, Leerzeichen in Namen, lose Verknüpfungen …) werden gemeldet und auf Knopfdruck repariert (⋯ → Daten prüfen)", "Doppelklicks lösen nichts mehr doppelt aus (✕ löscht nur einen Eintrag, „+ Maßnahme“ legt eine an, Fenster bleiben offen)", "Farbwahl im Bearbeiten-Fenster funktioniert; Menüs öffnen am unteren Rand nach oben; die Warnliste verdeckt bei 150 % Skalierung keine Knöpfe mehr", "PDF: die Zeitleiste wird auf mehrere Seiten verteilt, jede Seite mit Monatsleiste"]}, {"version": "0.7", "date": "2026-09-29T14:52", "items": ["Update-Schutz: Ein noch offenes Fenster mit älterer Version erkennt eine neuere Programmversion im Ordner, speichert nicht mehr und bittet um Neustart – das Update wird nicht mehr zurückgedreht", "Speichern: klappt es einmal nicht (Datei kurz gesperrt), versucht die App es automatisch erneut und zeigt ehrlich „Nicht gespeichert“ an; die Excel-Ansicht wird ebenfalls nachgeholt", "Gleichzeitiges Arbeiten: Konflikte lassen sich zusammenführen – Änderungen beider Seiten bleiben erhalten, nur bei echten Überschneidungen fragt die App", "OneDrive-Konfliktkopien im Mailing-Ordner werden erkannt; Vergleichen, Übernehmen und Wegräumen per Knopf. Hinweis, wenn eine Kopie statt der Hauptdatei geöffnet ist", "Startknopf öffnet immer die Hauptdatei (nicht mehr versehentlich eine Kopie)", "Ungespeicherte Änderungen aus dem Browser gehen nicht mehr verloren, wenn inzwischen jemand anderes gespeichert hat – sie werden zusammengeführt", "„Maßnahme bearbeiten“ überschreibt keine Änderungen anderer mehr (nur die im Fenster geänderten Felder werden übernommen)", "Datumsfelder: nur vollständige Daten im Bereich Planungsjahr ± 5 Jahre; Tippfehler wie „20277“ oder „27“ werden abgewiesen, halb gelöschte Daten nicht mehr als „leer“ gespeichert", "Warnungen bei unplausiblen Terminen (Start nach dem PAL, Termine Jahre vom PAL entfernt, extrem lange Urlaube); solche Werte bremsen die Ansichten nicht mehr aus", "„Alle vorziehen“: erst PAL, dann Start Selektion/Inhalt – nichts landet mehr neu auf einem Wochenende; auch beim einzelnen PAL-Vorziehen", "Ziehen im Kalender, in der Zeitleiste und im Detailplan: Rechtsklick, Esc oder Fensterwechsel brechen sauber ab (nichts bleibt „hängen“, nichts wird versehentlich verschoben)", "Beschädigte Datei: die App startet nicht mehr leer, sondern sperrt das Speichern und bietet Wege zur Wiederherstellung an", "Excel-Ansicht in Teams zeigt immer das Planungsjahr aus den Einstellungen – nicht das Jahr, das jemand gerade ansieht", "Programm-Update warnt, wenn die gewählte Datei älter ist als die installierte Version", "Strg+S in einem offenen Fenster öffnet keinen zweiten Dialog mehr; ein Fehler mitten in einer Änderung nimmt die Änderung vollständig zurück", "Interne Tests liegen jetzt im Projekt (Ordner tests)"]}, {"version": "0.6.4", "date": "2026-09-29T10:15", "items": ["Kalender: auch Klick auf P hält die Maßnahme hervorgehoben, „Bearbeiten“ erscheint darunter"]}, {"version": "0.6.3", "date": "2026-09-28T17:10", "items": ["Kalender: Klick auf S oder I hält die Maßnahme hervorgehoben, „Bearbeiten“ erscheint direkt darunter (P öffnet weiterhin direkt)", "Kalender: Verbindungslinie zweifarbig – vom ersten zum zweiten Termin heller, vom zweiten zum dritten kräftig (auch in der Verbund-Darstellung)", "Startbildschirm: Malteser-Logo 50 % größer"]}, {"version": "0.6.2", "date": "2026-09-28T17:00", "items": ["Kalender: Klick auf eine Zeile der Terminliste hält die Maßnahme hervorgehoben – daneben erscheint „Bearbeiten“; andere Maßnahmen lassen sich währenddessen per Maus hervorheben; Klick woanders (oder Esc) hebt die Auswahl auf"]}, {"version": "0.6.1", "date": "2026-09-28T16:43", "items": ["Kalender: Terminliste unter den Monaten hebt nur noch hervor, wenn die Maus über der Schrift steht"]}, {"version": "0.6", "date": "2026-09-28T16:21", "items": ["Dunkles Design: weißes Malteser-Logo (Kopfzeile und Startbildschirm)", "Start Selektion und Start Inhalt lassen sich auch bei Maßnahmen mit Detailplan ziehen (Zeitleiste, Kalender) oder in der Tabelle eintippen – die Dauer der Arbeitsschritte davor passt sich an", "Verbund-Darstellung: beim Überfahren nur noch eine, hervorgehobene Linie", "Kalender: Monate deutlicher abgesetzt (Kopfleiste, Rahmen, eigene Fläche)", "Feiertage zweispaltig – halb so hoch"]}, {"version": "0.5.2", "date": "2026-09-28T15:51", "items": ["Warnung, wenn die geöffnete Datei und der Speicherort nicht zusammenpassen (zwei Kopien arbeiten aneinander vorbei), mit Knopf „Speicherort neu wählen“", "Einstellungen zeigen, welche Datei geöffnet ist und in welchen Ordner gespeichert wird", "Programm-Update erkennt diesen Fall auch, wenn die Kopie in einem Ordner „Jahresplanung…“ liegt"]}, {"version": "0.5.1", "date": "2026-09-28T15:37", "items": ["Programm-Update: verbindet zuerst den Mailing-Ordner, prüft danach, ob die neue Version wirklich in der Datei steht, und meldet jeden Fehler mit Grund", "Programm-Update: Ausweg „Aktualisierte Datei herunterladen“, falls das Speichern im Ordner nicht klappt", "Programm-Update: Hinweis, wenn die App aus einem anderen Ordner geöffnet wurde als dem Mailing-Ordner"]}, {"version": "0.5", "date": "2026-09-28T15:25", "items": ["Startbildschirm mit Animation in Malteser-Farben, Logo und Versionsnummer (abschaltbar in den Einstellungen, Klick überspringt)", "Dunkles Design: Kästen heller abgesetzt, damit sie sich klar vom Hintergrund abheben", "Warnungen: Knopf zeigt ✓, wenn nichts zu prüfen ist; Anzeige aktualisiert sich zuverlässig nach dem Freigeben des Ordners", "Outlook-Export: Liste aller Termine, die in der Datei landen – passt sich der Auswahl an", "Kalender: Verbund-Darstellung dauerhaft ein-/ausblendbar (auch im PDF)", "Feiertage: kompaktere Tabelle ohne Erklärtexte"]}, {"version": "0.4", "date": "2026-09-28T14:28", "items": ["Einstellungen: Personen verwalten (Name, Farbe), dunkles Design, Versionsnummer und Änderungsliste", "Einstellungen: Standard-Vorlauf und „Max. Starts pro Woche“ entfernt", "Programm-Update einspielen, ohne dass Daten verloren gehen (⋯-Menü)", "PDF-Export mit Auswahl von Bereichen und Maßnahmen, „Wie aktuelle Ansicht“, ohne Dateipfad und Browser-Kopfzeile", "Outlook-Export: Terminarten, Maßnahmen, Person, Zeitraum wählbar; Aufteilung in mehrere Dateien; alle Termine ganztägig", "Jahresplanung: Kopfzeile repariert, Auflage linksbündig, S/I/P rechts der Beschriftung, „PAL-Status“, PAL nur bei „vorläufig“ farbig, hellere Häkchen", "Warnungen: Vorziehen auch bei Feiertagen, bei Detailplänen und beim PAL", "Zeitleiste: S/I/P-Knöpfe bei „Was steht an?“, Hervorheben ohne durchscheinende Wochenenden, Werktage vor PAL, Maßnahmen-Auswahl bleibt offen", "Detailpläne: ganze Abschnitte einer Person zuordnen, neue Schritte standardmäßig eine Woche lang", "Urlaub & Feiertage: Feiertage lassen sich umbenennen, verschieben und abschalten"]}, {"version": "0.3", "date": "2026-09-28T09:23", "items": ["Malteser-Logo, Datensicherung exportieren/importieren, PDF-Jahresübersicht (3 Seiten)", "Maßnahmen-Tabelle: Start Selektion/Inhalt als Datum statt Vorlauf, Spaltenbreiten ziehbar, „Hauptverantwortlich“", "Kalender: Verbindungslinie beim Überfahren, Urlaub-Knopf zum Ein-/Ausblenden", "Zeitleiste: Mausrad-Zoom, Klick auf den Namen zeigt die ganze Maßnahme, Markierungen in der Tagesmitte", "Detailpläne: Abschnitte einklappen, Zeilen ziehen, Farbe je Person, Balken verschieben und in der Länge ändern, Zoom", "Urlaub: Dialog „neuen Urlaub eintragen“"]}, {"version": "0.2", "date": "2026-09-25T19:50", "i const DAY = 86400000;

/* ---------- Detailplan: Termine je Schritt
   Ein Schritt hängt mit seinem Ende am PAL oder an einem festen Datum – oder (ab 0.10) mit seinem Beginn am Ende eines oder mehrerer
   Vorgänger im selben Abschnitt: Beginn = spätestes Ende der Vorgänger + Abstand ({ art: 'nach', refs: [...], offset }). */
const MAX_DAUER = 730;                        // längste Dauer eines Arbeitsschritts (Werktage)
const FAR = 1100;                             // Termine mehr als ~3 Jahre vom PAL entfernt: Tippfehler vermuten

function planCalc(m, days = !(m.plan && m.plan.wt)) {
  const pal = dn(m.pal), steps = m.plan ? m.plan.steps : [];
  const byId = new Map(steps.map(s => [s.id, s]));
  const res = new Map(), busy = new Set();
  function calc(s) {
    if (res.has(s.id)) return res.get(s.id);
    if (busy.has(s.id)) return { start: null, end: null, err: 'Zirkelbezug' };
    busy.add(s.id);
    let e = null, err = null, b = null;
    const a = s.anker || { art: 'offen' }, off = +a.offset || 0;
    if (s.typ !== 'gruppe') {
      if (a.art === 'nach') {
        const refs = Array.isArray(a.refs) ? a.refs : [];
        let mx = null, ok = 0;
        for (const id of refs) { const r = byId.get(id); if (!r || r.typ === 'gruppe') continue; ok++; const rc = calc(r); if (rc.err) { err = rc.err; break; } if (rc.end != null && (mx == null || rc.end > mx)) mx = rc.end; }
        if (!err && !ok) err = 'Bezug fehlt';
        if (!err && mx != null) b = mx + off;
      }
      else if (a.art === 'pal') e = pal != null ? pal + off : null;
      else if (a.art === 'fest') { e = dn(a.datum); if (e == null && a.datum) err = 'ungültiges Datum „' + a.datum + '“'; }
      else if (a.art === 'start' || a.art === 'ende') {
        const r = byId.get(a.ref);
        if (!r) err = 'Bezug fehlt';
        else { const rc = calc(r); if (rc.err) err = rc.err; const b = a.art === 'start' ? rc.start : rc.end; e = b != null ? b + off : null; }
      }
    }
    const dur = s.typ === 'aufgabe' ? clamp(Math.round(+s.dauer || 0), 0, MAX_DAUER) : 0;
    if (b != null && !days && b !== pal) b = nextWorkday(b);      // (am PAL – auch an einem Samstag – bleibt der Beginn auf dem Übergabetag)
    // Werktage: das Ende einer Aufgabe ist der Übergabetag – der nächste Werktag nach der Arbeit (dort beginnt ein verknüpfter Nachfolger,
    // beide zeigen dasselbe Datum); höchstens bis zum PAL (fällt der auf einen Samstag, bleibt er das Ende)
    const hand = n => days || dur <= 0 || n == null ? n : handover(n, pal);
    // Urlaub/Abwesenheit der zugeordneten Person verlängert die Aufgabe (nicht bei fester Dauer)
    const aw = !days && dur > 0 && s.typ === 'aufgabe' && !s.fix ? awayDays(s.wer) : null;
    const out = b != null ? { start: b, end: days ? b + dur : hand(addWT(b, dur, aw)), err } : { start: e != null ? (days ? e - dur : subWT(e, dur, aw)) : null, end: hand(e), err };
    if (aw && out.start != null && out.end != null) { const x = wtSpan(out.start, out.end) - wtSpan(out.start, out.end, aw); if (x > 0) out.away = x; }
    busy.delete(s.id);
    res.set(s.id, out);
    return out;
  }
  steps.forEach(calc);
  // Bereiche: Abschnitte mit Buchstaben; Start = festgelegter Beginn-Schritt oder frühester Schritt, Ende = spätester Schritt
  const ph = {};
  let cur = null;
  for (const s of steps) {
    if (s.typ === 'gruppe') { cur = s.bereich || null; continue; }
    if (!cur) continue;
    const r = res.get(s.id); if (!r || r.start == null) continue;
    const o = ph[cur] || (ph[cur] = { start: r.start, end: r.end, mark: s.id, steps: [] });
    o.steps.push(s.id);
    if (r.start < o.start) { o.start = r.start; o.mark = s.id; }
    if (r.end > o.end) o.end = r.end;

  for (const k of Object.keys(ph)) { const mk = marks[k]; if (mk && ph[k].steps.includes(mk)) { ph[k].mark = mk; ph[k].start = res.get(mk).start; } }

}

const vacOn = n => C.vac.filter(v => v.von <= n && n <= v.bis);

/* ---------- Warnungen */
function computeWarnings() {
  const W = [], y = UI.year;              // bewusst kein Abgleich mit dem heutigen Datum (keine „überfällig“-Hinweise)
  const relevant = C.ms.filter(x => inYear(x, y) || x.pal == null);
  for (const x of relevant) {
    const nm = x.m.name || '(ohne Namen)';
    if (x.pal == null) { W.push(x.m.pal ? { lvl: 'warn', mid: x.id, text: `${nm}: PAL „${x.m.pal}“ ist kein gültiges Datum – bitte prüfen` } : { lvl: 'info', mid: x.id, text: nm + ': kein PAL eingetragen' }); continue; }
    const chk = (n, lab, t) => {
      if (n == null) return;
      const w = wd(n), hn = holName(n), isPal = t === 'P';
      const planLocked = !isPal && x.m.plan && !(x.pc && x.pc.ph[t]);
      const fix = planLocked ? null : { t, to: isPal ? prevPalDay(n) : prevWorkday(n) };
      if (hn) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf den Feiertag „${hn}“ (${fmtW(n)})` });
      else if ((!isPal && w >= 5) || (isPal && w === 6)) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf einen ${WDL[w]} (${fmtD(n)})` });
      const resp = (x.m.verantwortlich || '').trim();
      const away = vacOn(n).filter(v => !resp || v.u.wer === resp);
      if (away.length && !isPal) W.push({ lvl: resp ? 'warn' : 'info', mid: x.id, n,
        text: `${nm}: ${lab} am ${fmtW(n)} – im Urlaub: ${[...new Set(away.map(v => v.u.wer || '?'))].join(', ')}` });
    };
    for (const p of PH()) chk(x.st[p.key], startLabel(p.key), p.key);
    chk(x.pal, 'PAL', 'P');
    for (const p of PH()) {
      const n = x.st[p.key], lab = startLabel(p.key);
      if (n == null) continue;
      if (n > x.pal) W.push({ lvl: 'warn', mid: x.id, n, text: `${nm}: ${lab} (${fmtD(n)}) liegt nach dem PAL (${fmtD(x.pal)}) – Datum prüfen` });
      else if (x.pal - n > FAR) W.push({ lvl: 'warn', mid: x.id, n, text: `${nm}: ${lab} (${fmtD(n)}) liegt mehr als drei Jahre vor dem PAL – Datum prüfen` });
    }
    const def = PH().filter(p => x.st[p.key] != null);
    for (let j = 1; j < def.length; j++) if (x.st[def[j].key] < x.st[def[j - 1].key])
      W.push({ lvl: 'info', mid: x.id, text: `${nm}: ${startLabel(def[j].key)} liegt vor ${startLabel(def[j - 1].key)}` });
    if (x.pc) for (const s of x.m.plan.steps) {
      const r = x.pc.map.get(s.id);
      if (!r) continue;
      if (r.err) W.push({ lvl: 'warn', mid: x.id, step: s.id, text: `${nm} › ${s.name}: ${r.err}` + (/^ungültig/.test(r.err) ? ' – Datum prüfen' : ' in der Verknüpfung') });
      if (r.start == null || s.typ === 'gruppe') continue;
      if (Math.abs(r.start - x.pal) > FAR || Math.abs(r.end - x.pal) > FAR)
        W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.end, text: `${nm} › ${s.name}: Termin ${fmtD(r.start)} – ${fmtD(r.end)} liegt mehr als drei Jahre vom PAL entfernt – Datum prüfen` });
      if (s.wer) {
        const away = C.vac.filter(v => v.u.wer === s.wer && v.von <= r.end && v.bis >= r.start), when = away.map(v => fmtS(v.von) + '–' + fmtS(v.bis)).join(', ');
        if (r.away) W.push({ lvl: 'info', mid: x.id, step: s.id, n: r.start,   // Aufgabe ist schon um die freien Tage verlängert
          text: `${nm} › ${s.name}: +${r.away} ${r.away === 1 ? 'Werktag' : 'Werktage'} wegen ${away.some(v => isAbw(v.u)) && !away.every(v => isAbw(v.u)) ? 'Urlaub/Abwesenheit' : away.some(v => isAbw(v.u)) ? 'Abwesenheit' : 'Urlaub'} ${s.wer} (${when})` });
        else if (away.length && !(s.typ === 'aufgabe' && !s.fix)) W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.start,

  for (const [mid, n] of preByM) { const x = C.byId.get(mid); if (relevant.includes(x)) W.push({ lvl: 'info', mid, text: `${x.m.name || '(ohne Namen)'}: ${n} zugeordnete Spende${n === 1 ? '' : 'n'} vor dem PAL – im Reiter „Auswertung“ prüfen` }); }
  for (const u of D.urlaube) if ((u.von && dn(u.von) == null) || (u.bis && dn(u.bis) == null))

  return W;
}

function buildFile(data, css = $('#jp-style').textContent, js = $('#jp-app').textContent) {

    '<title>Jahresplanung Außenkommunikation</title>\n<link rel="icon" href="' + FAVICON + '">\n<style id="jp-style">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
    '<' + S + ' type="application/json" id="jp-data">' + json + '</' + S + '>\n<' + S + ' id="jp-app">' + js + '</' + S + '>\n</body>\n</html>\n';

function parseFileText(text) {

    const t = text.trim();
    if (t.startsWith('{')) return JSON.parse(t);
    const m = t.match(/<script[^>]*id="jp-data"[^>]*>([\s\S]*?)<\/script>/i);
    return m ? JSON.parse(m[1]) : null;
  } catch (e) { return null; }
}

// Ordner-Zugriff im Browser merken (IndexedDB), damit beim nächsten Start ein Klick reicht
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('jahresplanung', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

// Programmdatei im Ordner suchen (auch im Unterordner „Jahresplanung …“); liefert Datei und Ordner
async function findHtml(dir) {
  const name = currentFileName();
  try { return { file: await dir.getFileHandle(name), dir }; } catch (e) { /* weiter suchen */ }
  const subs = [], files = [];
  for await (const [n, e] of dir.entries()) { if (e.kind === 'directory' && /^Jahresplanung/i.test(n)) subs.push(e); if (e.kind === 'file' && /^Jahresplanung.*\.html?$/i.test(n)) files.push(e); }
  for (const sd of subs) { try { return { file: await sd.getFileHandle(name), dir: sd }; } catch (e) { /* */ } }
  const main = files.find(f => f.name === DEFAULT_FILE) || files[0];
  return main ? { file: main, dir } : null;
}
async function attachFolder(create) {
  let found = await findHtml(ST.dir);
  if (!found && create) found = { file: await ST.dir.getFileHandle(currentFileName(), { create: true }), dir: ST.dir };
  if (!found) { ST.conn = 'none'; return false; }
  ST.html = found.file; ST.htmlDir = found.dir;
  const f = await ST.html.getFile();
  ST.stamp = f.lastModified;
  ST.conn = 'ok';
  const text = f.size ? await f.text() : '', other = text ? parseFileText(text) : null;
  if (other && BROKEN) {                        // geöffnete Datei kaputt, die im Ordner lesbar: diese nehmen
    BROKEN = null; D = normalize(other); SAVED_JSON = JSON.stringify(D); UNDO.length = 0; REDO.length = 0;
    toast('Die geöffnete Datei war beschädigt – der Stand aus dem Mailing-Ordner wurde geladen.', 'ok');

  scanUpdatePkg();

  safeRender();                                 // u. a. Hinweis, falls Datei und Speicherort nicht zusammenpassen
  return true;
}
// Liegt im Ordner eine neuere Programmversion? Dann nicht mehr speichern (sonst käme die alte Version zurück)

/* ---------- Wer arbeitet gerade? Jedes offene App-Fenster legt im Unterordner „Jahresplanung (automatisch)“ eine kleine

const APP_DIR = 'Jahresplanung (automatisch)', INST = uid(), PRESENCE = { others: [], key: '', since: null };
async function presenceTick() {
  if (!FSA || ST.conn !== 'ok' || !ST.htmlDir || document.hidden) return;
  try {
    const dir = await ST.htmlDir.getDirectoryHandle(APP_DIR, { create: true }), mine = 'anwesend-' + INST + '.json';
    PRESENCE.since = PRESENCE.since || new Date().toISOString();
    const w = await (await dir.getFileHandle(mine, { create: true })).createWritable();
    await w.write(JSON.stringify({ name: UI.userName || '', inst: INST, since: PRESENCE.since, at: new Date().toISOString(), edit: LAST_EDIT, version: APP_INFO.version })); await w.close();
    const others = [], now = Date.now();
    for await (const [n, e] of dir.entries()) {
      if (e.kind !== 'file' || !/^anwesend-.+\.json$/.test(n) || n === mine) continue;
      try {
        const o = JSON.parse(await (await e.getFile()).text()), age = now - Date.parse(o.at);
        if (!(age < 86400000)) { dir.removeEntry(n).catch(() => {}); continue; }      // alte Dateien aufräumen
        if (age < 180000) others.push(o);
      } catch (x) { /* halb synchronisiert: nächstes Mal */ }
    }
    const key = JSON.stringify(others.map(o => [o.inst, o.name, o.edit]));

async function saveAll(opts = {}) {

  if (ST.newer && !opts.force) { if (!opts.auto) toast('Im Ordner liegt eine neuere Programmversion (' + ST.newer.version + '). Bitte zuerst neu starten (Hinweis oben).', 'err'); return false; }

    if (opts.auto) return false;
    if (!await connectFolder()) return false;

  if (ST.conflict && !opts.force) { if (!opts.auto) toast('Erst den Konflikt oben lösen (Stand laden oder überschreiben).', 'warn'); return false; }

    const f = await ST.html.getFile();

      const text = await f.text(), other = parseFileText(text);
      if (noteNewer(text, other)) { ST.saving = false; if (!isDirty() && other) externalChange(other, f.lastModified); return false; }

        ST.saving = false; throw Object.assign(new Error('Die Datei im Ordner ist gerade nicht lesbar (wird sie synchronisiert?)'), { name: 'Unreadable' });

      ST.stamp = f.lastModified;
    }

    data.meta.savedAt = new Date().toISOString();
    data.meta.savedBy = UI.userName || '';
    data.meta.rev = (+D.meta.rev || 0) + 1;                 // Datenstand-Nummer, zählt jedes Speichern
    data.log = logWithEntry(data.meta);                     // Änderungsprotokoll: was seit dem letzten Speichern geändert wurde
    const w = await ST.html.createWritable();

    ST.stamp = (await ST.html.getFile()).lastModified;
    D.meta = data.meta; D.log = data.log; SAVED_JSON = JSON.stringify(D); clearDraft();

    clearTimeout(ST.retry); ST.retry = null;

// Protokoll = bisherige Einträge (aus Datei und aktuellem Stand zusammengeführt) + ein Eintrag mit den Änderungen seit dem letzten Speichern
function logWithEntry(meta) {
  let base = {}; try { base = JSON.parse(SAVED_JSON) || {}; } catch (e) { /* */ }
  const seen = new Set(), all = [];
  for (const e of [...(base.log || []), ...(D.log || [])]) { const k = e.at + '|' + e.by + '|' + (e.items || []).join('|'); if (!seen.has(k)) { seen.add(k); all.push(e); } }
  all.sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const items = base.massnahmen ? describeChanges(base, D) : [];
  if (items.length) all.push({ at: meta.savedAt, by: meta.savedBy || '', items });
  return all.slice(-LOG_MAX);
}

/* ---------- Änderungen anderer erkennen (die Datei wird per OneDrive synchronisiert) */
function externalChange(other, stamp) {
  if (!isDirty() || BROKEN) {
    D = normalize(other); SAVED_JSON = JSON.stringify(D); UNDO.length = 0; REDO.length = 0; ST.conflict = null; BROKEN = null;
    if (stamp != null) ST.stamp = stamp;
    toast('Neuer Stand geladen (gespeichert ' + fmtStamp(other.meta.savedAt) + (other.meta.savedBy ? ' von ' + other.meta.savedBy : '') + ')', 'ok');
    safeRender();
  } else {
    ST.conflict = { other, stamp };
    clearTimeout(ST.timer); ST.timer = null;
    safeRender();
  }
}
function startWatch() {
  clearInterval(ST.watch);
  ST.watch = setInterval(async () => {
    if (ST.conn !== 'ok' || ST.saving || document.hidden) return;
    ST.tick++;
    if (ST.tick % 4 === 0) scanCopies();                          // etwa jede Minute: Konfliktkopien von OneDrive?
    if (ST.tick % 4 === 2) scanUpdatePkg();                       // etwa jede Minute: Update-Paket im Mailing-Ordner?
    if (ST.tick % 2 === 0) presenceTick();                        // alle 30 Sekunden: wer arbeitet noch in der Jahresplanung?
    if (ST.conflict) return;
    try {
      const f = await ST.html.getFile();
      if (f.lastModified !== ST.stamp) {
        const text = await f.text(), other = parseFileText(text);
        if (!other) return;                                        // Datei kurz nicht lesbar (Synchronisierung): beim nächsten Mal
        ST.stamp = f.lastModified;
        if (noteNewer(text, other)) { if (!isDirty()) externalChange(other, f.lastModified); return; }
        if (other.meta && other.meta.savedAt !== D.meta.savedAt) { externalChange(other, f.lastModified); return; }
      }
      // Sicherheitsnetz: ungespeichert, aber kein Speichern geplant → jetzt speichern
      if (isDirty() && !ST.timer && !ST.retry && UI.autoSave !== false && !ST.newer && !BROKEN) saveAll({ auto: true });
    } catch (e) { /* Datei kurz nicht lesbar (Synchronisierung) */ }
  }, 15000);
}
// Konflikt lösen: zusammenführen (empfohlen), meinen Stand behalten oder den anderen laden
async function resolveConflict(how) {
  const c = ST.conflict; if (!c) return;
  if (how === 'merge') {
    const theirs = normalize(JSON.parse(JSON.stringify(c.other)));
    const merged = await mergeWithUI(JSON.parse(SAVED_JSON), D, theirs, c.other.meta.savedBy || 'der/die andere');
    if (!merged || ST.conflict !== c) return;
    ST.conflict = null; UNDO.push(JSON.stringify(D)); REDO.length = 0;
    D = merged; SAVED_JSON = JSON.stringify(theirs); if (c.stamp != null) ST.stamp = c.stamp;
    toast('Zusammengeführt – wird gespeichert.', 'ok');
    changed(); saveAll({ auto: true });
  } else if (how === 'mine') { ST.conflict = null; saveAll({ force: true }); }
  else { ST.conflict = null; UNDO.push(JSON.stringify(D)); D = normalize(c.other); SAVED_JSON = JSON.stringify(D); if (c.stamp != null) ST.stamp = c.stamp; clearDraft(); toast('Stand von ' + (c.other.meta.savedBy || 'der Datei') + ' geladen – deine Änderung ist mit Strg+Z zurückholbar (dann speichern).', 'ok'); }
  renderNow();
}
// neu zeichnen, aber nicht mitten im Tippen

const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

  const enc = new TextEncoder();

    if (enc.encode(cur + ch).length > lim) { out.push(cur); cur = ch; lim = 74; } else cur += ch;

  const files = [
    { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>' },
    { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      (wb.readOnly ? '<fileSharing readOnlyRecommended="1"/>' : '') + '<sheets>' +
      sheets.map((s, i) => '<sheet name="' + xesc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets>' +
      (sheets.some(s => s.filter) ? '<definedNames>' + sheets.map((s, i) => s.filter ? '<definedName name="_xlnm._FilterDatabase" localSheetId="' + i + '" hidden="1">\'' + xesc(s.name) + '\'!' + s.filter.replace(/([A-Z]+)(\d+)/g, '$$$1$$$2') + '</definedName>' : '').join('') + '</definedNames>' : '') + '</workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: 'xl/styles.xml', data: styles },
    ...sheetXmls.map((x, i) => ({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: x })),
  ];
  return zipBlob(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ---------- Ansichts-Excel: gleicher Stand wie im Programm, zum Anschauen (auch in Teams) */
const XS = {
  head: { b: true, color: '#FFFFFF', fill: '#404040', v: 'center', wrap: true },

  note: { i: true, sz: 9, color: '#6B6B6B' },

const XD = (n, t = 'dw', st) => n == null ? '' : { v: n, t, st };

function viewWorkbook(opts = {}) {             // Excel immer in heller Optik; opts.year: dieses Jahr zeigen (Ansichts-Excel: Planungsjahr)

  if (other) { UI.year = opts.year; derive(); }

}
function viewWorkbookLight(opts = {}) {
  const y = UI.year, a = mkdn(y, 1, 1), b = mkdn(y, 12, 31), protect = opts.protect !== false;
  const stand = D.meta.savedAt ? 'Stand: gespeichert ' + fmtStamp(D.meta.savedAt) + (D.meta.savedBy ? ' von ' + D.meta.savedBy : '') : 'Stand: ' + fmtD(todayDn());
  const hint = protect ? 'Nur zur Ansicht – bearbeitet wird im Programm („' + DEFAULT_FILE + '“ im Mailing-Ordner). Änderungen hier werden beim nächsten Speichern überschrieben. ' + stand : stand;

  const warnBy = new Map();
  C.warnings.forEach(w => { if (w.mid) warnBy.set(w.mid, (warnBy.get(w.mid) || []).concat(w.text.replace(/^[^:]+: /, ''))); });
  const sheets = [];

  // 1. Übersicht
  {
    const rows = [[{ v: 'Jahresplanung Außenkommunikation ' + y, st: XS.title }], [{ v: hint, st: XS.note }], [],
      ['', 'Maßnahme', ...PH().map(p => 'Start ' + p.name), ...PH().map(p => 'WT bis PAL (' + sym(p.key) + ')'), 'PAL', 'PAL-Status', 'Hauptverantwortlich', 'Spendenbitte', 'Auflage', 'Hinweis', 'Bitte prüfen'].map(t => ({ v: t, st: XS.head }))];
    for (const x of ms) {
      const bd = { border: 'thin', v: 'top' };
      rows.push([{ v: '', st: { fill: x.color, border: 'thin' } }, { v: x.m.name, st: { ...bd, b: true, color: darker(x.color) } },
        ...PH().map(p => XD(x.st[p.key] ?? null, 'dw', bd)), ...PH().map(p => x.st[p.key] != null && x.pal != null ? { v: workdaysBefore(x.st[p.key], x.pal), st: bd } : { v: '', st: bd }),
        XD(x.pal, 'dw', { ...bd, b: true }), { v: x.m.palStatus, st: bd }, { v: x.m.verantwortlich || '', st: bd },
        { v: x.m.art || '', st: bd }, isNum(x.m.auflage) ? { v: +x.m.auflage, st: bd } : { v: '', st: bd }, { v: x.m.hinweis || '', st: { ...bd, wrap: true } },
        { v: (warnBy.get(x.id) || []).join('; '), st: { ...bd, wrap: true, color: '#B45309' } }]);
    }
    const nc = 11 + 2 * PH().length - 2, lc = colName(nc - 1);
    sheets.push({ name: 'Übersicht', cols: [2.5, 30, ...PH().map(() => 15), ...PH().map(() => 8), 15, 11, 15, 12, 9, 40, 55], rows, merges: ['A1:' + lc + '1', 'A2:' + lc + '2'], heights: { 0: 22, 3: 30 },
      freeze: 'C5', filter: ms.length ? 'A4:' + lc + (4 + ms.length) : null, protect, grid: false });
  }

  // 2. Kalender: 12 Monate wie im Programm (S/I/P farbig)
  {
    const rows = [], merges = [], heights = {}, CW = 9, cols = [];
    for (let k = 0; k < 4; k++) cols.push(3.2, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 1.4);
    const set = (r, c, v) => { (rows[r] = rows[r] || [])[c] = v; };
    set(0, 0, { v: 'Jahresplanung Außenkommunikation ' + y + ' – Kalender', st: XS.title }); merges.push('A1:AI1'); heights[0] = 22;
    set(1, 0, { v: hint, st: XS.note }); merges.push('A2:AI2');
    set(2, 0, { v: [['P', 'PAL'], ...PH().map(p => [p.key, 'Start ' + p.name])].map(([k, l]) => sym(k) + ' = ' + l + ' (' + ({ kraeftig: 'kräftige Farbe', rahmen: 'ohne Füllung', streifen: 'Pastellton', pastell: 'Pastellton' })[stilOf(k)] + ')').join(' · ') + ' · hellgrau = Wochenende · dunkelgrau = Feiertag NRW', st: { sz: 9, color: '#404040' } }); merges.push('A3:AI3');
    const evAll = eventsIn(a, b, true), byDay = new Map();
    evAll.forEach(e => { if (!byDay.has(e.n)) byDay.set(e.n, []); byDay.get(e.n).push(e); });
    let r = 4;
    for (let band = 0; band < 3; band++) {
      const lists = [];
      for (let k = 0; k < 4; k++) {
        const mo = band * 4 + k + 1, c0 = k * CW, first = mkdn(y, mo, 1), last = first + daysIn(y, mo) - 1, start = first - wd(first);
        set(r, c0, { v: MON[mo - 1] + ' ' + y, st: { b: true, sz: 11, color: '#FFFFFF', fill: '#404040', v: 'center' } });
        for (let j = 1; j < 8; j++) set(r, c0 + j, { v: '', st: { fill: '#404040' } });
        merges.push(colName(c0) + (r + 1) + ':' + colName(c0 + 7) + (r + 1));
        set(r + 1, c0, { v: 'KW', st: { sz: 7, color: '#999999', h: 'center' } });
        WD.forEach((d, j) => set(r + 1, c0 + 1 + j, { v: d, st: { sz: 8, b: true, color: j >= 5 ? '#999999' : '#595959', h: 'center' } }));
        for (let w = 0; w < 6; w++) {
          const ws = start + 7 * w;
          set(r + 2 + w, c0, ws <= last ? { v: isoWeek(ws), st: { sz: 7, color: '#AAAAAA', h: 'center', v: 'top' } } : '');
          for (let d = 0; d < 7; d++) {
            const n = ws + d;
            if (n < first || n > last) { set(r + 2 + w, c0 + 1 + d, { v: '', st: { fill: '#FAFAFA', border: 'thin' } }); continue; }
            const evs = byDay.get(n) || [], hn = holName(n);
            const st = { h: 'center', v: 'top', wrap: true, sz: 9, border: 'thin' };
            const p = evs.find(e => e.t === 'P'), f = p || evs[0];
            if (f) Object.assign(st, markFill(f.t, f.x.color), { b: true });
            else if (hn) Object.assign(st, { fill: '#CFCFCF', b: true, color: '#262626' });
            else if (d >= 5) Object.assign(st, { fill: '#EDEDED', color: '#808080' });
            set(r + 2 + w, c0 + 1 + d, { v: ymd(n)[2] + (evs.length ? '\n' + evs.map(e => sym(e.t)).join(' ') : ''), st });
          }
        }
        // Terminliste unter dem Monat
        const lines = [], per = new Map();
        const hols = []; for (let n = first; n <= last; n++) { const hn = holName(n); if (hn) hols.push(fmtS(n) + ' ' + hn); }
        if (hols.length) lines.push({ v: hols.join(' · '), st: { sz: 8, color: '#8C8C8C' } });
        for (let n = first; n <= last; n++) for (const e of byDay.get(n) || []) { if (!per.has(e.x.id)) per.set(e.x.id, { x: e.x, ev: [] }); per.get(e.x.id).ev.push(e); }
        for (const { x, ev } of per.values()) lines.push({ v: ev.map(e => sym(e.t) + ' ' + fmtS(e.n)).join(' · ') + '  ' + x.m.name, st: { sz: 8, b: true, color: darker(x.color) } });
        const vm = C.vac.filter(v => v.bis >= first && v.von <= last);
        if (vm.length) lines.push({ v: 'Urlaub: ' + vm.map(v => (v.u.wer || '?') + ' ' + fmtS(Math.max(v.von, first)) + (v.bis > v.von ? '–' + fmtS(Math.min(v.bis, last)) : '')).join(', '), st: { sz: 8, color: '#8A6D00' } });
        lists.push(lines);
      }
      heights[r] = 17;
      for (let w = 0; w < 6; w++) heights[r + 2 + w] = 27;
      const L = Math.max(1, ...lists.map(l => l.length));
      for (let k = 0; k < 4; k++) {
        const c0 = k * CW;
        for (let li = 0; li < L; li++) {
          const rr = r + 8 + li, cell = lists[k][li];
          if (cell && cell.v.length > 62) { cell.st = { ...cell.st, wrap: true, v: 'top' }; heights[rr] = 22; }
          set(rr, c0, cell || '');
          merges.push(colName(c0) + (rr + 1) + ':' + colName(c0 + 7) + (rr + 1));
        }
      }
      for (let li = 0; li < L; li++) heights[r + 8 + li] = heights[r + 8 + li] || 12;
      r += 8 + L + 1;
    }
    sheets.push({ name: 'Kalender', cols, rows, merges, heights, protect, grid: false, onePage: true });
  }

  // 3. Zeitleiste nach Kalenderwochen
  {
    const weeks = []; for (let n = a - wd(a); n <= b; n += 7) weeks.push(n);
    const rows = [], merges = [], heights = { 0: 22, 3: 13 }, W0 = 2;
    rows.push([{ v: 'Jahresplanung Außenkommunikation ' + y + ' – Zeitleiste nach Kalenderwochen', st: XS.title }]);
    rows.push([{ v: hint, st: XS.note }]);
    merges.push('A1:' + colName(W0 + weeks.length - 1) + '1', 'A2:' + colName(W0 + weeks.length - 1) + '2');
    const mRow = [{ v: '', st: {} }, ''], kRow = [{ v: 'Maßnahme', st: { b: true, sz: 9 } }, { v: 'PAL', st: { b: true, sz: 9 } }];
    let prevM = null, mStart = W0;
    weeks.forEach((n, j) => {
      const mo = ymd(n + 3)[1];
      if (mo !== prevM) {
        if (prevM != null && j + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(j + W0 - 1) + '3');

        mRow[j + W0] = { v: span === 1 ? '' : MON[mo - 1], st: { b: true, sz: 9, fill: '#F2F2F2', border: 'thin' } };
        prevM = mo; mStart = j + W0;
      } else mRow[j + W0] = { v: '', st: { fill: '#F2F2F2', border: 'thin' } };

    });
    if (weeks.length + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(weeks.length + W0 - 1) + '3');
    rows.push(mRow, kRow);
    for (const x of ms) {
      const row = [{ v: x.m.name, st: { b: true, color: darker(x.color), border: 'thin' } }, XD(x.pal, 'ds', { sz: 9, border: 'thin' })];
      weeks.forEach((n, j) => {
        const e = n + 6, has = v => v != null && v >= n && v <= e;
        const st = { sz: 7, h: 'center', v: 'center', border: 'thin', b: true };
        let v = '';
        // Woche im Bereich: der späteste Bereich, der in dieser Woche läuft, bestimmt die Farbe (hell → kräftiger)
        const phs = PH().filter(p => x.st[p.key] != null), inW = phs.map((p, i) => [p, i]).filter(([p]) => x.st[p.key] <= e && (x.en[p.key] ?? x.st[p.key]) >= n);
        if (has(x.pal)) { Object.assign(st, { fill: x.color, color: onColor(x.color) }); v = sym('P'); }
        else if (inW.length) {
          const [p, i] = inW[inW.length - 1], f = phs.length > 1 ? i / (phs.length - 1) : 0;
          const ln = lineOf(p.key);
          Object.assign(st, ln === 'kraeftig' ? { fill: x.color, color: onColor(x.color) } : ln === 'rahmen' ? { color: darker(x.color) } : ln === 'auto' ? { fill: mix(x.color, 0.75 - 0.30 * f), color: darker(x.color) } : { fill: pastel(x.color), color: darker(x.color) });
          v = phs.filter(q => has(x.st[q.key])).map(q => sym(q.key)).join('');

          const cnt = C.vac.filter(v => (v.u.wer || '?') === p).reduce((s, v) => s + (v.bis >= n && v.von <= n + 6 ? workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) : 0), 0);
          row[j + W0] = cnt ? { v: cnt, st: { sz: 7, h: 'center', border: 'thin', fill: pastel(personColor(p)) } } : { v: '', st: { border: 'thin' } };
        });
        rows.push(row);
      }
      const row = [{ v: 'gleichzeitig im Urlaub', st: { i: true, sz: 9, border: 'thin' } }, ''];
      weeks.forEach((n, j) => {
        const cnt = people.filter(p => C.vac.some(v => (v.u.wer || '?') === p && v.bis >= n && v.von <= n + 6 && workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) > 0)).length;
        row[j + W0] = cnt > 1 ? { v: cnt, st: { sz: 7, b: true, h: 'center', border: 'thin', fill: cnt > 2 ? '#F4B6B0' : '#FFD8A8' } } : { v: '', st: { border: 'thin' } };
      });

    }
    sheets.push({ name: 'Zeitleiste', cols: [30, 11, ...weeks.map(() => 2.9)], rows, merges, heights, freeze: 'C5', protect, grid: false });
  }

  // 4. Termine (chronologisch)
  {
    const ev = eventsIn(a, b, true);
    const rows = [['Datum', 'KW', 'Maßnahme', 'Termin', 'Hauptverantwortlich', 'Hinweis'].map(t => ({ v: t, st: XS.head })),
      ...ev.map(e => {

  // 5. Detailpläne
  {
    const rows = [['Maßnahme', 'Abschnitt', 'Arbeitsschritt', 'Typ', 'Zugeordnet', 'Kommentar', 'Start', 'Dauer (WT)', 'Ende'].map(t => ({ v: t, st: XS.head }))];

        const r = x.pc.map.get(s.id) || {};

  }

  // 6. Urlaub und Feiertage
  {
    const rows = [['Wer', 'Von', 'Bis', 'Arbeitstage', 'Notiz', 'Art'].map(t => ({ v: t, st: XS.head })),
      ...C.vac.filter(v => v.bis >= a && v.von <= b).sort((p, q) => p.von - q.von)
        .map(v => [{ v: v.u.wer || '?', st: { fill: pastel(personColor(v.u.wer)) } }, XD(v.von), XD(v.bis), workdays(v.von, v.bis), v.u.notiz || '', vacKind(v.u)])];
    rows.push([], [{ v: 'Feiertage NRW ' + y, st: XS.sub }]);
    const hols = [...holidays(y)].concat(D.sondertage.filter(s => dn(s.datum) != null && ymd(dn(s.datum))[0] === y).map(s => [dn(s.datum), (s.name || 'freier Tag') + ' (eigener freier Tag)']))
      .sort((p, q) => p[0] - q[0]);
    hols.forEach(([n, t]) => rows.push([XD(n), { v: t, st: {} }]));

  }

  // 7. Änderungsprotokoll (neueste oben)
  {
    const rows = [['Gespeichert', 'Von', 'Änderung'].map(t => ({ v: t, st: XS.head }))];
    for (const e of (D.log || []).slice().reverse().slice(0, 200)) for (const t of e.items || []) rows.push([fmtStamp(e.at), e.by || '', { v: t, st: { wrap: true } }]);
    sheets.push({ name: 'Änderungen', cols: [22, 14, 100], rows, freeze: 'A2', protect });
  }
  return xlsxBlob(sheets, { readOnly: protect });
}
