/* ===================================================================== PDF-Export: Bereiche und Maßnahmen wählbar, jede Seite ohne Browser-Kopf-/Fußzeile */

const PDF_SECS = [['mass', 'Maßnahmen-Übersicht'], ['kal', 'Kalender'], ['tl', 'Zeitleiste'], ['ag', 'Was steht an?'], ['plaene', 'Detailpläne (je Plan eine Seite)'], ['urlaub', 'Urlaub & Feiertage']];
const VIEW_SECS = { jahr: ['mass', 'tl', 'kal', 'ag'], plaene: ['plaene'], urlaub: ['urlaub'] };
const SEC_CLOSED0 = new Set(['tl']);                 // anfangs eingeklappte Bereiche (wie in section(..., { open: false }))

// Auswahlliste der Maßnahmen (für PDF- und Kalender-Export)
function msPicker(sel, list, onChange) {
  const boxes = [];
  const all = on => { list.forEach(x => on ? sel.add(x.id) : sel.delete(x.id)); boxes.forEach(b => { b.checked = on; }); onChange && onChange(); };
  return h('div', { class: 'mspick' },
    h('div', { class: 'pop-h' }, 'Maßnahmen', h('span', null, h('button', { class: 'link', onclick: e => { e.preventDefault(); all(true); } }, 'alle'), ' · ',
      h('button', { class: 'link', onclick: e => { e.preventDefault(); all(false); } }, 'keine'))),
    list.map(x => {
      const b = h('input', { type: 'checkbox', checked: sel.has(x.id), onchange: e => { e.target.checked ? sel.add(x.id) : sel.delete(x.id); onChange && onChange(); } });
      boxes.push(b);
      return h('label', { class: 'mchk' }, b, h('span', { class: 'dot', style: { background: x.color } }), h('span', { class: 'nm' }, x.m.name || '(ohne Namen)'),
        x.pc ? h('span', { class: 'muted small' }, 'Plan') : null, h('span', { class: 'pal' }, x.pal != null ? fmtS(x.pal) : ''));
    }));
}

async function pdfDialog() {
  const y = UI.year, list = C.ms.filter(x => inYear(x, y));
  const last = UI.pdfOpts || {};
  const f = {
    secs: Object.assign({ mass: true, kal: true, tl: true, ag: false, plaene: false, urlaub: false }, last.secs),
    show: Object.assign(Object.fromEntries(evKeys().map(k => [k, true])), last.show), vac: last.vac !== false, verbund: !!UI.verbund,
    ms: new Set(list.map(x => x.id)),
    planCompact: !!UI.planCompact, planColl: null,        // Detailplan wie eingestellt: Tabelle eingeklappt nur, wenn sie es gerade ist
  };
  const wrap = h('div', { class: 'form pdfform' });
  const draw = () => {
    const cb = (obj, k, label, extra) => h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!obj[k], onchange: e => { obj[k] = e.target.checked; } }), label, extra || null);
    setKids(wrap, 
      h('div', { class: 'pdf-top' }, h('p', { class: 'muted small' }, 'Wähle, was ins PDF soll. Jeder Bereich beginnt auf einer neuen Seite (A4 quer).'),
        h('button', { class: 'ghostbtn', tip: 'übernimmt Reiter, Filter und angezeigte Maßnahmen von der Ansicht, die gerade offen ist', onclick: e => { e.preventDefault(); fromView(); draw(); } }, '⟲ Wie aktuelle Ansicht')),
      h('div', { class: 'pdf-cols' },
        h('div', null, h('h3', null, 'Bereiche'), h('div', { class: 'checks' }, PDF_SECS.map(([k, l]) => cb(f.secs, k, l))),
          h('h3', null, 'Termine'), h('div', { class: 'checks' }, evKeys().map(t => cb(f.show, t, TYPE_LABEL[t])), cb(f, 'vac', 'Urlaube anzeigen'),
            cb(f, 'verbund', 'Verbund-Darstellung im Kalender'),
            cb(f, 'planCompact', 'Detailpläne: nur Arbeitsschritte (Tabelle eingeklappt, Gantt breiter)'))),
        msPicker(f.ms, list)));
  };
  const fromView = () => {
    const vs = UI.view === 'einstellungen' ? (UI.settTab === 'urlaub' ? ['urlaub'] : []) : VIEW_SECS[UI.view] || [];
    f.secs = Object.fromEntries(PDF_SECS.map(([k]) => [k, vs.includes(k) && (UI.secOpen[k] !== undefined ? UI.secOpen[k] : !SEC_CLOSED0.has(k))]));
    if (!Object.values(f.secs).some(Boolean)) f.secs.mass = true;
    f.show = Object.fromEntries(evKeys().map(k => [k, showType(k)])); f.vac = UI.showVac; f.verbund = !!UI.verbund;
    f.ms = new Set(list.filter(x => visibleM(x)).map(x => x.id));
    if (UI.view === 'plaene' && UI.planSel) { f.ms = new Set([UI.planSel]); f.secs.plaene = true; }
    f.planCompact = !!UI.planCompact; f.planColl = JSON.parse(JSON.stringify(UI.planColl || {}));   // eingeklappte Tabelle und Abschnitte wie gerade zu sehen
  };
  draw();
  const ok = await modal('PDF exportieren', wrap, [['Abbrechen', false], ['PDF erstellen', true, 'primary']], { wide: true });
  if (!ok) return;
  if (!Object.values(f.secs).some(Boolean)) { toast('Kein Bereich gewählt.', 'warn'); return; }
  if (!f.ms.size && (f.secs.mass || f.secs.kal || f.secs.tl || f.secs.plaene)) { toast('Keine Maßnahme gewählt.', 'warn'); return; }
  UI.pdfOpts = { secs: f.secs, show: f.show, vac: f.vac }; saveUI();
  printPDF(f);
}

const TL_PER_PAGE = 16;
function printPDF(f) {
  const keys = ['show', 'hiddenM', 'showVac', 'hiddenP', 'monthLists', 'tlPlans', 'tlPxd', 'planSel', 'planCompact', 'planColl', 'planPxd', 'view', 'verbund', '_tl', '_pl'];
  const keep = {}; keys.forEach(k => { keep[k] = UI[k] instanceof Set ? new Set(UI[k]) : UI[k] && typeof UI[k] === 'object' ? JSON.parse(JSON.stringify(UI[k])) : UI[k]; });
  UI.show = { ...f.show }; UI.showVac = f.vac; UI.verbund = !!f.verbund; UI.hiddenP = new Set(); UI.monthLists = true; UI.tlPlans = false; UI.tlPxd = 0;
  UI.hiddenM = new Set(C.ms.filter(x => !f.ms.has(x.id)).map(x => x.id));
  UI.planCompact = f.planCompact ?? !!keep.planCompact; UI.planColl = f.planColl || {}; UI.planPxd = 0;
  UI.printing = true;
  derive();
  let doc;
  try { doc = buildPrintDoc(f); }
  finally { Object.assign(UI, keep); UI.printing = false; derive(); }
  $$('#printdoc').forEach(e => e.remove());
  document.body.append(doc);
  document.body.classList.add('printdoc-mode');
  const title = document.title;
  document.title = 'Jahresplanung_' + UI.year + '_' + ds(todayDn());       // Vorschlag für den Dateinamen
  PRINT_TITLE = title;
  setTimeout(() => window.print(), 80);
}
let PRINT_TITLE = null;
window.addEventListener('afterprint', () => {
  $$('#printdoc').forEach(e => e.remove()); document.body.classList.remove('printdoc-mode');
  if (PRINT_TITLE != null) { document.title = PRINT_TITLE; PRINT_TITLE = null; }
});

// Kalender auf eine A4-Seite: Höhe aus festen Zeilenhöhen (Druck-CSS) abschätzen, bei Bedarf verkleinern.
// 210 mm Seite − 2 × 9 mm Rand − schmaler Kopf ≈ 690 px; mit Reserve für andere Schriften/Browser 620 px.
const CAL_FIT = 620;
function fitCalendar(box) {
  const months = $$('.month', box), verbund = !!$('.cal.verbund', box);
  const hMonth = m => {
    const mhol = $('.mhol', m), lines = $$('.mline', m).length + (mhol ? Math.ceil(mhol.textContent.length / 58) : 0);
    return 17 + 11 + 6 * ((verbund ? 22 : 19) + 1) + 8 + 11 * lines;
  };
  let total = 0;
  for (let i = 0; i < months.length; i += 4) total += Math.max(...months.slice(i, i + 4).map(hMonth));
  total += 5 * (Math.ceil(months.length / 4) - 1) + 4;
  if (total > CAL_FIT) box.style.zoom = String(Math.max(0.6, CAL_FIT / total).toFixed(3));
  box.dataset.est = String(total);
}
function buildPrintDoc(f) {
  const y = UI.year;
  const stand = 'Stand ' + fmtD(todayDn()) + (D.meta.savedAt ? ' · gespeichert ' + fmtStamp(D.meta.savedAt) : '');
  const head = title => h('header', { class: 'pd-head' }, h('img', { src: LOGO, alt: 'Malteser' }),
    h('div', null, h('h1', null, title), h('span', null, 'Fundraising · Diözese Paderborn')), h('span', { class: 'pd-stand' }, stand));
  // schmaler Kopf ohne Logo (Kalender: alles muss auf eine Seite)
  const slimHead = title => h('header', { class: 'pd-head slim' }, h('h1', null, title), h('span', { class: 'pd-stand' }, stand));
  // Seitenrahmen: Kopf- und Fußabstand wiederholen sich auf jeder Druckseite
  const frame = (hd, content) => h('section', { class: 'pd-page' }, h('table', { class: 'pd-frame' },
    h('thead', null, h('tr', null, h('td', null, h('div', { class: 'pd-sp' })))),
    h('tbody', null, h('tr', null, h('td', null, hd, content))),
    h('tfoot', null, h('tr', null, h('td', null, h('div', { class: 'pd-sp' }))))));
  const page = (title, ...content) => frame(head(title), content);
  const ms = C.ms.filter(x => f.ms.has(x.id) && inYear(x, y));
  const pages = [];
  if (f.secs.mass) {
    const chipH = t => demoChip(t);
    pages.push(page('Maßnahmen ' + y, h('table', { class: 'pd-table' },
      h('thead', null, h('tr', null, h('th'), h('th', null, 'Maßnahme'), h('th', null, 'Hauptverantwortlich'), h('th', null, 'Auflage'),
        PH().map(p => h('th', null, 'Start ' + p.name + ' ', chipH(p.key))), h('th', null, 'PAL ', chipH('P')), h('th', null, 'PAL-Status'), h('th', null, 'Spendenbitte'), h('th', null, 'Hinweis'))),
      h('tbody', null, ms.map(x => h('tr', null,
        h('td', null, h('span', { class: 'dot', style: { background: x.color } })),
        h('td', { class: 'nm', style: { color: inkC(x.color) } }, x.m.name),
        h('td', null, x.m.verantwortlich || ''), h('td', { class: 'num' }, isNum(x.m.auflage) ? (+x.m.auflage).toLocaleString('de-DE') : ''),
        PH().map(p => h('td', { class: 'st' }, x.st[p.key] != null ? [h('div', null, fmtW(x.st[p.key])), x.pal != null ? h('div', { class: 'wt' }, workdaysBefore(x.st[p.key], x.pal) + ' WT') : null] : '–')),   // oben Datum, darunter Werktage
        h('td', { class: 'pal' + (x.m.palStatus !== 'fest' ? ' vorl' : '') }, fmtW(x.pal)),
        h('td', null, x.m.palStatus), h('td', null, x.m.art || ''), h('td', { class: 'hinweis' }, x.m.hinweis || '')))))));
  }
  if (f.secs.kal) { const cal = h('div', { class: 'pd-kal' }, calendarBody()); fitCalendar(cal); pages.push(frame(slimHead('Kalender ' + y), cal)); }
  // Zeitleiste seitenweise: je Seite höchstens TL_PER_PAGE Maßnahmen, jede Seite mit eigener Monatsleiste, Urlaube auf der letzten
  if (f.secs.tl) {
    const all = C.ms.filter(x => visibleM(x) && inYear(x, y)), n = Math.max(1, Math.ceil(all.length / TL_PER_PAGE));
    for (let i = 0; i < n; i++) {
      const part = all.slice(i * TL_PER_PAGE, (i + 1) * TL_PER_PAGE);
      pages.push(page('Zeitleiste ' + y + (n > 1 ? ' (' + (i + 1) + '/' + n + ')' : ''), timelineSection({ only: new Set(part.map(x => x.id)), rangeRows: all, noVac: i < n - 1 }).body));
    }
  }
  if (f.secs.ag) { const a = agendaSection(); pages.push(page('Was steht an? · ' + (a.summary || ''), a.body)); }
  if (f.secs.plaene) for (const x of ms.filter(x => x.pc)) {
    UI.planSel = x.id;
    const box = h('div', { class: 'pd-plan' });
    VIEW_FN.plaene(box);
    $$('.view-head, .ptabs, .phead .tools, datalist', box).forEach(e => e.remove());
    pages.push(page('Detailplan ' + x.m.name, box));
  }
  if (f.secs.urlaub) {
    const box = h('div', { class: 'pd-urlaub' });
    VIEW_FN.urlaub(box);
    $$('.view-head, datalist, .addline, button, .screen-only', box).forEach(e => e.remove());
    pages.push(page('Urlaub & Feiertage ' + y, box));
  }
  if (pages.length) pages[pages.length - 1].classList.add('last');
  return h('div', { id: 'printdoc' }, pages);
}

      const t = getTime();

})();

  const close = () => {
    if (closed) return; closed = true;
    box.classList.add('out');

    setTimeout(() => box.remove(), 450);

  const box = h('div', { class: 'splash', onclick: close, tip: null },

/* ===================================================================== Zusammenführen: wenn zwei gleichzeitig geändert haben */

// Grundregel (je Maßnahme, Urlaub, freiem Tag, Person – und darin je Feld):

const JS = v => JSON.stringify(v === undefined ? null : v);

function mergeObj(b, m, t, where, conflicts, cnt) {
  b = b || {}; m = m || {}; t = t || {};

  for (const f of new Set([...Object.keys(b), ...Object.keys(m), ...Object.keys(t)])) {
    const jb = JS(b[f]), jm = JS(m[f]), jt = JS(t[f]);
    let v;
    if (jm === jt) v = m[f];
    else if (jm === jb) { v = t[f]; cnt.t++; }
    else if (jt === jb) { v = m[f]; cnt.m++; }
    else { v = m[f]; conflicts.push(Object.assign({ field: f, mine: m[f], theirs: t[f] }, where)); }

}
function mergeList(b, m, t, key, coll, conflicts, cnt) {

    else if (jm === jb) { v = tv; cnt.t++; }                   // nur die anderen haben geändert (oder gelöscht)
    else if (jt === jb) { v = mv; cnt.m++; }                   // nur ich habe geändert (oder gelöscht)
    else if (mv && tv) v = mergeObj(bv, mv, tv, { coll, key: k, rec: mv }, conflicts, cnt);

}

  out.feiertage = mergeObj(base.feiertage, mine.feiertage, theirs.feiertage, { coll: 'feiertage', key: null }, conflicts, cnt);

    out.spenden[sub] = mergeObj((base.spenden || {})[sub], (mine.spenden || {})[sub], (theirs.spenden || {})[sub], { coll: 'spenden', key: sub, rec: { sub } }, cf, cnt);

  if (c.coll === 'spenden') { const o = data.spenden[c.key]; if (c.theirs === undefined) delete o[c.field]; else o[c.field] = clone(c.theirs); return; }

  else if (i >= 0) { if (c.theirs === undefined) delete arr[i][c.field]; else arr[i][c.field] = clone(c.theirs); }
}

// Zwei Stände ohne gemeinsamen Ausgangspunkt vergleichen (z. B. OneDrive-Konfliktkopie): auswählen, was übernommen wird

        h('div', null, fieldName(it.coll, f) + ': hier ' + valText(it.coll, f, it.mine[f], it.mine) + ' · dort ' + valText(it.coll, f, it.rec[f], it.rec)))) : null);
  };

/* ---------- Änderungsprotokoll: lesbare Beschreibung, was sich zwischen zwei Ständen geändert hat */
function describeChanges(a, b, max = 12) {
  const out = [];
  for (const [coll, key] of MERGE_COLL) {
    const A = new Map((a[coll] || []).map(r => [r[key], r])), B = new Map((b[coll] || []).map(r => [r[key], r]));

        if (f === 'plan') out.push(lab + ': ' + planChange(o.plan, r.plan));
        else if (f === 'vorlauf' || f === 'ende') {
          const pa = dn(o.pal), pb = dn(r.pal), va = o[f] || {}, vb = r[f] || {};
          for (const ph of new Set([...Object.keys(va), ...Object.keys(vb)])) if (va[ph] !== vb[ph])
            out.push(lab + ': ' + (f === 'ende' ? 'Ende ' + phName(ph) : startLabel(ph)) + ' ' + (va[ph] != null && pa != null ? fmtS(pa - va[ph]) : '–') + ' → ' + (vb[ph] != null && pb != null ? fmtS(pb - vb[ph]) : '–'));
        } else out.push(lab + ': ' + fieldName(coll, f) + ' ' + valText(coll, f, o[f], o) + ' → ' + valText(coll, f, r[f], r));
      }

  for (const [k, z] of Object.entries(zb)) if (!za[k] || za[k].m !== z.m) cnt1(plus, z.m);
  for (const [k, z] of Object.entries(za)) if (!zb[k] || zb[k].m !== z.m) cnt1(minus, z.m);
  const mName = id => { if (isAllg(id)) return '„Allgemeine Spenden ' + id.slice(5) + '“'; const m = (b.massnahmen || []).find(q => q.id === id) || (a.massnahmen || []).find(q => q.id === id); return '„' + ((m && m.name) || '?') + '“'; };
  for (const [id, n] of plus) out.push('Spenden: ' + n + ' der Maßnahme ' + mName(id) + ' zugeordnet');
  for (const [id, n] of minus) out.push('Spenden: ' + n + ' Zuordnung' + (n === 1 ? '' : 'en') + ' bei ' + mName(id) + ' gelöst');
  const sa = a.settings || {}, sb = b.settings || {};
  if (JS(sa.bereiche) !== JS(sb.bereiche)) out.push('Bereiche: ' + (sb.bereiche || []).map(p => (p.zeichen || p.key) + ' ' + p.name).join(', '));
  if (JS(sa.pal) !== JS(sb.pal)) out.push('PAL-Markierung: ' + ((sb.pal || {}).zeichen || 'P') + ' (' + (STILE[(sb.pal || {}).stil] || '') + ')');
  if (sa.year !== sb.year) out.push('Planungsjahr ' + sa.year + ' → ' + sb.year);
  if (JS(sa.richtwerte) !== JS(sb.richtwerte)) out.push('Richtwerte der Spenden-Kennzahlen geändert');

}

  const out = [], keys = PH().map(p => p.key);
  const add = (text, label, fix) => out.push({ text, label, fix, on: true });
  for (const m of d.massnahmen) {
    const nm = '„' + (m.name || '(ohne Namen)') + '“', mid = m.id, M = dd => findM(dd, mid);
    if (m.pal && dn(m.pal) == null) add(nm + ': PAL „' + m.pal + '“ ist kein gültiges Datum', 'PAL leeren (danach neu eintragen)', dd => { M(dd).pal = null; });
    if (str(m.verantwortlich) !== str(m.verantwortlich).trim()) add(nm + ': Hauptverantwortlich „' + m.verantwortlich + '“ mit Leerzeichen am Rand', 'Leerzeichen entfernen', dd => { M(dd).verantwortlich = str(M(dd).verantwortlich).trim(); });

  if (!list || !list.length) return h('div', { class: 'sp-charts empty muted small' }, 'Sobald Spenden zugeordnet sind, stehen hier die Zeitspanne der Eingänge und die Spenden pro Tag.');
  const sr = spSeries(x.m, list);
  return h('div', { class: 'sp-charts' },
    h('div', { class: 'sp-cht' }, h('b', null, 'Zeitspanne der Eingänge'), h('span', { class: 'muted' }, sr.lo != null ? ' · ' + fmtD(sr.lo) + ' – ' + fmtD(sr.hi) + ' (' + (sr.hi - sr.lo + 1) + ' Tage), Summe kumuliert' : ''),
      sr.pre ? h('span', { class: 'warn small' }, ' · inkl. ' + spCount(sr.pre) + ' vor dem PAL (' + eur(sr.preSum) + ')') : null),
    h('div', { class: 'sp-chart', dataset: { chart: 'span', mid: x.id } }),
    h('div', { class: 'sp-cht' }, h('b', null, 'Spenden pro Tag'), h('span', { class: 'muted' }, ' · grau hinterlegt: Wochenenden')),
    h('div', { class: 'sp-chart', dataset: { chart: 'day', mid: x.id } }));
}
const spDayLab = (sr, n) => fmtW(n) + (sr.pal != null && n >= sr.pal ? ' · Tag ' + (n - sr.pal) + ' ab PAL' : sr.pal != null ? ' · vor dem PAL' : '');
function spXTicks(svg, g, sr, X) {
  const pxd = g.pw / sr.days, step = [7, 14, 28, 56, 91, 182].find(s => s * pxd >= 58) || 365, a = sr.pal ?? sr.d0, y0 = g.mt + g.ph;
  for (let n = a - Math.floor((a - sr.d0) / step) * step; n <= sr.d1; n += step) svg.append(sv('text', { class: 'sp-ax', x: X(n - sr.d0), y: y0 + 16, 'text-anchor': 'middle' }, fmtS(n)));
}
function spFrame(el, H, ml = 70) {
  const W = Math.max(320, Math.floor(el.clientWidth)), g = { W, H, ml, mr: 70, mt: 18, mb: 26 };
  g.pw = W - g.ml - g.mr; g.ph = H - g.mt - g.mb;
  const svg = sv('svg', { width: W, height: H, class: 'sp-svg', role: 'img' });
  el.replaceChildren(svg);
  return { svg, g };
}
function spYAxis(svg, g, max) {
  const ticks = niceTicks(max), top = ticks[ticks.length - 1] || 1, Y = v => g.mt + g.ph - v / top * g.ph;
  for (const t of ticks) svg.append(sv('line', { class: 'sp-grid', x1: g.ml, x2: g.ml + g.pw, y1: Y(t), y2: Y(t) }), sv('text', { class: 'sp-ax', x: g.ml - 8, y: Y(t) + 4, 'text-anchor': 'end' }, tickLab(t)));
  return Y;
}
function spPalMark(svg, g, x) {
  svg.append(sv('line', { class: 'sp-pal', x1: x, x2: x, y1: g.mt - 4, y2: g.mt + g.ph }),
    sv('rect', { class: 'sp-palbox', x: x - 7, y: g.mt - 16, width: 14, height: 14, rx: 3 }), sv('text', { class: 'sp-paltx', x, y: g.mt - 5, 'text-anchor': 'middle' }, sym('P')));
}
function spDraw(el) {
  const kind = el.dataset.chart, by = spByM();
  if (kind === 'cmp') { const ids = el.dataset.ids.split(',').filter(id => C.byId.has(id) && by.get(id)); if (!ids.length) { el.replaceChildren(h('p', { class: 'muted small' }, 'Alle Maßnahmen ausgeblendet – oben wieder einblenden.')); return; } return spDrawCmp(el, ids, by); }
  const x = spX(el.dataset.mid), list = x && by.get(x.id);
  if (!list || !list.length) return;
  const sr = spSeries(x.m, list), { svg, g } = spFrame(el, 150, 62);
  const X = i => g.ml + (i + 0.5) / sr.days * g.pw, y0 = g.mt + g.ph;
  spWeekends(svg, g, sr);
  if (kind === 'span') spDrawSpan(svg, g, x, sr, X); else spDrawDay(svg, g, x, sr, X);
  svg.append(sv('line', { class: 'sp-base', x1: g.ml, x2: g.ml + g.pw, y1: y0, y2: y0 }));
  spXTicks(svg, g, sr, X);
  if (sr.pal != null) spPalMark(svg, g, g.ml + (sr.pal - sr.d0) / sr.days * g.pw);
}
// Wochenenden grau hinterlegt (Sa + So als ein Streifen)
function spWeekends(svg, g, sr) {
  const pxd = g.pw / sr.days;
  for (let i = 0; i < sr.days; i++) {
    if (wd(sr.d0 + i) < 5) continue;
    let j = i; while (j + 1 < sr.days && wd(sr.d0 + j + 1) >= 5) j++;
    svg.append(sv('rect', { class: 'sp-we', x: g.ml + i * pxd, y: g.mt, width: (j - i + 1) * pxd, height: g.ph }));
    i = j;
  }
}
// Zeitspanne: Summe der zugeordneten Spenden, aufaddiert vom PAL bis zur letzten Spende
function spDrawSpan(svg, g, x, sr, X) {
  const Y = spYAxis(svg, g, sr.cum[sr.days - 1] / 100), y0 = g.mt + g.ph, L = sr.last;
  const pts = sr.cum.slice(0, L + 1).map((v, i) => X(i).toFixed(1) + ',' + Y(v / 100).toFixed(1));
  svg.append(sv('path', { class: 'sp-area', fill: x.color, d: 'M' + X(0) + ',' + y0 + 'L' + pts.join('L') + 'L' + X(L) + ',' + y0 + 'Z' }),
    sv('polyline', { class: 'sp-line', stroke: x.color, points: pts.join(' ') }),
    sv('circle', { class: 'sp-dot', cx: X(L), cy: Y(sr.cum[L] / 100), r: 4.5, fill: x.color }),
    sv('text', { class: 'sp-endl', x: X(L) + 9, y: Y(sr.cum[L] / 100) + 4 }, eur0(sr.cum[L])));
  spCross(svg, g, {
    at: px => clamp(Math.round((px - g.ml) / g.pw * sr.days - 0.5), 0, L), x: X,
    dots: i => [sv('circle', { class: 'sp-dot', cx: X(i), cy: Y(sr.cum[i] / 100), r: 4.5, fill: x.color })],
    tip: i => h('div', null, h('b', null, eur(sr.cum[i])), h('div', { class: 'muted small' }, 'bis ' + spDayLab(sr, sr.d0 + i)),
      sr.cnt[i] ? h('div', null, 'an diesem Tag: ' + eur(sr.day[i]) + ' (' + spCount(sr.cnt[i]) + ')') : null) });
}
// Spenden pro Tag: eine Säule je Tag – zeigt, wann viel hereinkommt und wann es abebbt
function spDrawDay(svg, g, x, sr, X) {
  const Y = spYAxis(svg, g, Math.max(...sr.day) / 100), y0 = g.mt + g.ph, pxd = g.pw / sr.days;
  const bw = Math.min(24, Math.max(1, pxd - (pxd >= 5 ? 2 : 1)));
  for (let i = 0; i < sr.days; i++) {
    const grp = sv('g', { class: 'sp-bin' });
    if (sr.day[i]) {
      const bx = X(i) - bw / 2, top = Y(sr.day[i] / 100), r = Math.min(4, bw / 2, y0 - top);
      grp.append(sv('path', { class: 'sp-bar', fill: x.color, d: `M${bx},${y0}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${y0}Z` }));
    }
    const hit = sv('rect', { class: 'sp-hit', x: g.ml + i * pxd, y: g.mt, width: pxd, height: g.ph });
    setTip(hit, () => h('div', null, h('b', null, sr.day[i] ? eur(sr.day[i]) : 'keine Spenden'), sr.cnt[i] ? h('div', null, spCount(sr.cnt[i])) : null, h('div', { class: 'muted small' }, spDayLab(sr, sr.d0 + i))));
    grp.append(hit); svg.append(grp);
  }
}
function spDrawCmp(el, ids, by) {
  const ser = ids.map(id => {
    const x = C.byId.get(id), list = by.get(id).filter(z => z.d >= x.pal), last = Math.max(0, ...list.map(z => z.d - x.pal));
    const day = []; for (const z of list) day[z.d - x.pal] = (day[z.d - x.pal] || 0) + z.b;
    const cum = []; for (let t = 0, s = 0; t <= last; t++) { s += day[t] || 0; cum[t] = s; }
    return { x, cum, last };
  }).filter(s => s.cum[s.last] > 0);
  if (!ser.length) { el.replaceChildren(); return; }
  const T = Math.min(365, Math.max(56, ...ser.map(s => s.last))), { svg, g } = spFrame(el, 230, 70);
  g.mr = 150; g.pw = g.W - g.ml - g.mr;
  const X = t => g.ml + t / T * g.pw, Y = spYAxis(svg, g, Math.max(...ser.map(s => s.cum[Math.min(s.last, T)])) / 100), y0 = g.mt + g.ph;
  for (let t = 0; t <= T; t += T > 120 ? 28 : 14) svg.append(sv('text', { class: 'sp-ax', x: X(t), y: y0 + 16, 'text-anchor': 'middle' }, t === 0 ? 'PAL' : '+' + t + ' T.'));
  svg.append(sv('line', { class: 'sp-base', x1: g.ml, x2: g.ml + g.pw, y1: y0, y2: y0 }));
  const ends = [];
  for (const s of ser) {
    const L = Math.min(s.last, T), pts = s.cum.slice(0, L + 1).map((v, t) => X(t).toFixed(1) + ',' + Y(v / 100).toFixed(1));
    svg.append(sv('polyline', { class: 'sp-line', stroke: s.x.color, points: pts.join(' ') }), sv('circle', { class: 'sp-dot', cx: X(L), cy: Y(s.cum[L] / 100), r: 4.5, fill: s.x.color }));
    ends.push({ y: Y(s.cum[L] / 100), x: X(L), s });
  }
  if (ser.length <= 4) {                                          // Namen am Linienende, solange sie sich nicht überlappen
    ends.sort((a, b) => a.y - b.y);
    if (ends.every((e, i) => !i || e.y - ends[i - 1].y >= 13)) for (const e of ends) svg.append(sv('text', { class: 'sp-endl', x: e.x + 9, y: e.y + 4 }, (e.s.x.m.name || '?').slice(0, 22)));
  }
  spCross(svg, g, {
    at: px => clamp(Math.round((px - g.ml) / g.pw * T), 0, T), x: X,
    dots: t => ser.filter(s => t <= s.last).map(s => sv('circle', { class: 'sp-dot', cx: X(t), cy: Y(s.cum[t] / 100), r: 4.5, fill: s.x.color })),
    tip: t => h('div', null, h('div', { class: 'muted small' }, t === 0 ? 'am PAL' : t + ' Tage nach dem PAL'),
      ser.map(s => ({ s, v: s.cum[Math.min(t, s.last)] })).sort((a, b) => b.v - a.v).map(({ s, v }) => h('div', { class: 'sp-tiprow' },
        h('span', { class: 'sp-lkey', style: { background: s.x.color } }), h('b', null, eur0(v)), ' ', h('span', { class: 'muted' }, s.x.m.name || '?')))) });
}
// Fadenkreuz: senkrechte Linie folgt der Maus, rastet am nächsten Tag ein; Werte im Hinweisfenster
function spCross(svg, g, cfg) {
  const line = sv('line', { class: 'sp-xh', y1: g.mt, y2: g.mt + g.ph, visibility: 'hidden' }), dots = sv('g', { class: 'sp-xdots' });
  const ov = sv('rect', { class: 'sp-ov', x: g.ml, y: g.mt, width: g.pw, height: g.ph });
  svg.append(line, dots, ov);
  ov.addEventListener('mousemove', ev => {
    const i = cfg.at(ev.clientX - svg.getBoundingClientRect().left), xx = cfg.x(i);
    line.setAttribute('x1', xx); line.setAttribute('x2', xx); line.setAttribute('visibility', 'visible');
    dots.replaceChildren(...cfg.dots(i));
    tipEl.replaceChildren(cfg.tip(i)); tipEl.classList.add('on'); placeTip(ev);
  });
  ov.addEventListener('mouseleave', () => { line.setAttribute('visibility', 'hidden'); dots.replaceChildren(); hideTip(); });
}
