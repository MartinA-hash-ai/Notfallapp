<style id="jp-style">:root {
  --red: #E30714; --red-d: #b8000c; --ink: #262626; --ink2: #404040; --muted: #6b6b6b; --faint: #9a9a9a; --line: #e2e2e2; --line2: #d0d0d0; --line3: #f1f1f1;
  --bg: #f7f7f5; --card: #ffffff; --input: #ffffff; --soft: #fafafa; --head: #f5f5f4; --hover: #f1f1f1; --solid: #404040;
  --we: #efefef; --hol1: #e4e4e4; --hol2: #cfcfcf; --warn: #b45309; --warnbg: #fff4e0; --warnline: #f0c27a; --vorl: #9a3412; --vorlbg: #fff4ee;
  --errbg: #fdecea; --errline: #f5b5ae; --errink: #8a1c12; --okbg: #e8f5e9; --okline: #a5d6a7; --okink: #1b5e20; --infobg: #f1f3f5;
  --runbg: #e3f2fd; --runink: #0d47a1; --flash: #fff3a8; --chipbg: #e6e6e6;
  --chk-line: #d9d9d9; --chk-on: #f2f2f2; --chk-mark: #ababab;
  --monthbg: #ffffff; --monthhead: #f0f0ed; --monthline: #d6d6d3; --monthout: #f7f7f5;
  --ok: #2e7d32; --focus: #1F77B4; --side: 250px; --radius: 8px;
  --hatch: repeating-linear-gradient(135deg, var(--hol1) 0 3px, var(--hol2) 3px 5px);
  color-scheme: light;
}
@media screen {
  html[data-theme=dark] {
    --red: #ff3b3b; --red-d: #ff6b6b; --ink: #e8e8e8; --ink2: #d0d0d0; --muted: #a3a6ab; --faint: #83878d; --line: #3b3e43; --line2: #4b4e54; --line3: #33363a;
    --bg: #141516; --card: #26282b; --input: #1e2022; --soft: #2b2d31; --head: #303236; --hover: #36383c; --solid: #44474c;
    --we: #2e3034; --hol1: #33363a; --hol2: #43464b; --warn: #f0a24a; --warnbg: #3a2b14; --warnline: #7a5a22; --vorl: #ffb088; --vorlbg: #33231a;
    --errbg: #3b1d1c; --errline: #7a3430; --errink: #ffb4ab; --okbg: #1c3320; --okline: #3f6e45; --okink: #9fdca6; --infobg: #25282c;
    --runbg: #1a2c40; --runink: #9ccaff; --flash: #5a5220; --chipbg: #3a3c40;
    --chk-line: #4a4d52; --chk-on: #2c2e31; --chk-mark: #8a8e94;
    --monthbg: #1d1f22; --monthhead: #373a3f; --monthline: #52555b; --monthout: #191a1d;
    --ok: #7fd08a; --focus: #5aa9e6;
    color-scheme: dark;
  }
  html[data-theme=dark] button.primary { color: #fff; }
  html[data-theme=dark] .chip.demo.P { background: #bdbdbd; color: #1e1f21; }
  html[data-theme=dark] .backdrop { background: rgba(0,0,0,.55); }
  html[data-theme=dark] .g-row.grp { background: rgba(255,255,255,.03); }
  html[data-theme=dark] .g-bar:hover .grip { background: rgba(255,255,255,.18); }
  html[data-theme=dark] .col-rs:hover { background: rgba(255,255,255,.1); }
  html[data-theme=dark] .g-dia, html[data-theme=dark] .dia, html[data-theme=dark] .handle { box-shadow: 0 0 0 2px var(--card); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--card); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; line-height: 1.2; }
button:hover:not(:disabled) { border-color: var(--faint); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--red-d); border-color: var(--red-d); }
button.danger { color: var(--red-d); }
button.icon { padding: 4px 8px; min-width: 30px; }
button.link { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; }
button.mini { padding: 0 3px; font-size: 9px; line-height: 12px; border-color: transparent; background: transparent; color: var(--faint); }
button.mini:hover:not(:disabled) { color: var(--ink); }
input, select, textarea { border: 1px solid var(--line2); border-radius: 5px; padding: 4px 6px; background: var(--input); }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
input[type=number] { width: 70px; }
input.bad { border-color: var(--red); background: var(--errbg); }
label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.warn { color: var(--warn); }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }

/* ---------- Kopfzeile */
header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 8px; height: 34px; background: var(--red); border-radius: 2px; }
.brand .logo { height: 36px; width: auto; flex: none; display: block; }
.brand strong { display: block; font-size: 15px; }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.year { display: flex; align-items: center; gap: 4px; }
.year .y { font-size: 20px; font-weight: 700; min-width: 54px; text-align: center; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: none; border-radius: 6px; padding: 7px 11px; color: var(--ink2); font-weight: 500; }
.tab:hover { background: var(--bg); }
.tab.on { background: var(--ink2); color: #fff; }
.actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.warnbtn { font-weight: 600; color: var(--muted); }
.warnbtn.has { color: var(--warn); border-color: var(--warnline); background: var(--warnbg); }
.warnbtn .sub { font-weight: 400; }
.save { min-width: 124px; }
.save { background: var(--card); border-color: var(--line2); }
.save.ok { color: var(--ok); }
.menu { position: fixed; z-index: 60; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; min-width: 200px; }
.menu > button { display: block; width: 100%; text-align: left; border: 0; padding: 8px 12px; border-radius: 5px; }
.menu > button:hover { background: var(--bg); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu.colors { padding: 10px; min-width: 0; }
.sw-grid { display: grid; grid-template-columns: repeat(6, 26px); gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.menu .custom { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; }
.menu .custom input { width: 44px; height: 26px; padding: 0 2px; }
.banners .banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--warnbg); border-bottom: 1px solid var(--warnline); }
.banner span { flex: 1; }
.banners .banner.err { background: var(--errbg); border-bottom-color: var(--errline); color: var(--errink); }
.pathbox { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all; }

/* ---------- Grundlayout */
.body { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 60px); }
.body.with-side { grid-template-columns: var(--side) 1fr; }
main { padding: 16px 24px 60px; min-width: 0; overflow-x: auto; }
.view-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.view-head > p { margin: 0; flex-basis: 100%; }
.view-head .tools { margin-left: auto; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tools.sub { margin: 4px 0 14px; }
.hint { margin: 2px 0 12px; font-size: 13px; }
.empty { padding: 30px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line2); border-radius: var(--radius); margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.side-open { font-size: 12px; }
.error { padding: 20px; color: var(--red-d); }
.inl { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Seitenleiste */
aside.side { position: sticky; top: 51px; align-self: start; max-height: calc(100vh - 51px); overflow: auto; background: var(--card); border-right: 1px solid var(--line); padding: 8px 14px 20px; font-size: 13px; }
aside.side .collapse { float: right; font-size: 12px; padding: 1px 6px; min-width: 0; }
aside.side h3 { display: flex; justify-content: space-between; align-items: baseline; }
aside.side h3 .links { text-transform: none; letter-spacing: 0; font-weight: 400; }
.tchk, .mchk { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
.mchk:hover { background: var(--bg); }
.mchk .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchk .pal { font-size: 11px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.vdot { display: inline-block; width: 14px; height: 5px; border-radius: 3px; flex: none; margin-right: 4px; vertical-align: middle; }
.legend > div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.lg { display: inline-block; width: 18px; height: 14px; border-radius: 3px; border: 1px solid var(--line2); flex: none; }
.lg.we { background: var(--we); }
.lg.hol { background: var(--hatch); }
.lg.today { border: 2px solid var(--red); }
.lg.vac { height: 5px; border: 0; background: linear-gradient(90deg, #E0A100 0 33%, #5E81AC 33% 66%, #B55D9C 66%); }

/* ---------- Markierungen S / I / P */
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 2px; border-radius: 3px; font-size: 10px; font-weight: 700; line-height: 1; border: 1px solid transparent; cursor: pointer; flex: none; }
.chip.demo { cursor: default; background: var(--chipbg); color: var(--ink2); border-color: var(--line2); }
.chip.demo.P { background: #595959; color: #fff; }
main.hl .chip:not(.hl-on):not(.demo), main.hl .mline:not(.hl-on) { opacity: .15; }
main.hl .chip.hl-on { transform: scale(1.25); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink); }

/* ---------- Kalender */
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
.month { background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius); overflow: hidden; }
.month > header { background: var(--ink2); color: #fff; font-weight: 700; padding: 6px 12px; font-size: 15px; }
.mgrid { display: grid; grid-template-columns: 24px repeat(7, 1fr); }
.mgrid .wh { font-size: 11px; font-weight: 600; text-align: center; color: var(--muted); padding: 3px 0; border-bottom: 1px solid var(--line); }
.mgrid .wh.kw, .mgrid .kw { font-size: 9px; color: var(--faint); font-weight: 400; }
.mgrid .kw { padding: 3px 0 0 3px; border-right: 1px solid var(--line); }
.day { position: relative; height: 48px; border-right: 1px solid var(--line3); border-bottom: 1px solid var(--line3); padding: 2px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day:nth-child(8n) { border-right: 0; }
.day.out { background: var(--soft); }
.day.we { background: var(--we); }
.day.we .dnum { color: var(--faint); }
.day.hol { background: var(--hatch); }
.day.hol .dnum { font-weight: 800; color: var(--ink2); }
.day.today { box-shadow: inset 0 0 0 2px var(--red); z-index: 1; }
.dnum { font-size: 13px; line-height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.vbars { position: absolute; left: 2px; right: 2px; bottom: 2px; display: flex; flex-direction: column; gap: 1px; }
.vbars span { height: 3px; border-radius: 2px; }
.vbars.multi span { height: 2px; }
.vcount { position: absolute; right: 1px; top: 1px; font-size: 9px; background: var(--card); border-radius: 6px; padding: 0 3px; line-height: 11px; box-shadow: 0 0 0 1px var(--line2); }
.mlist { padding: 6px 10px 8px; font-size: 11.5px; border-top: 1px solid var(--line); min-height: 28px; }
.mhol { color: var(--faint); margin-bottom: 3px; }
.mline { cursor: pointer; padding: 1px 0; width: fit-content; max-width: 100%; }   /* Hervorheben nur über der Schrift, nicht in der leeren Zeile daneben */
.mline .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.mline b { font-weight: 600; }
.mline.pinned { background: var(--hover); border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
.mline-edit { margin-left: 8px; font-size: 11px; line-height: 1.3; padding: 0 7px; background: var(--head); border: 1px solid var(--line); color: var(--faint); border-radius: 5px; font-weight: 400; vertical-align: 1px; }
.mline-edit:hover:not(:disabled) { color: var(--ink2); border-color: var(--line2); }
.day > .chip-edit { position: absolute; z-index: 6; top: calc(100% - 7px); left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.chip.pinned { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink); }
.mvac { margin-top: 3px; color: var(--muted); }
.vtag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; border: 1px solid; margin: 1px 3px 1px 0; color: var(--ink); }

/* ---------- Tooltip, Meldungen, Dialoge */
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--card); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 9px 11px; font-size: 13px; max-width: 360px; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
.tt-title { font-weight: 700; border-left: 4px solid; padding-left: 7px; margin-bottom: 5px; }
.tt-title.plain { border: 0; padding: 0; }
.tt-row { display: flex; align-items: center; gap: 5px; margin: 3px 0; }
.tt-row.cur { font-weight: 600; }
.tt-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
.tt-note { font-size: 12px; margin-top: 4px; font-style: italic; }
.tt-hol { font-weight: 600; margin: 3px 0; }
.tt-vac { margin-top: 4px; }
.tt-foot { color: var(--faint); font-size: 11px; margin-top: 6px; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast { background: var(--solid); color: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.2); max-width: 560px; transition: opacity .4s; }
.toast.ok { background: var(--ok); }
.toast.warn { background: var(--warn); }
.toast.err { background: var(--red-d); }
.toast.out { opacity: 0; }
.backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { background: var(--card); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.3); width: 100%; max-width: 520px; max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { max-width: 720px; }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.modal > header h2 { margin: 0; }
.modal-body { padding: 6px 18px 12px; overflow: auto; }
.modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.modal > footer .left { margin-right: auto; }
.form { display: flex; flex-direction: column; gap: 10px; }
.frow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 4px 10px; }
.frow small { grid-column: 2; color: var(--muted); font-size: 11.5px; }
.frow input:not([type=number]):not([type=date]):not([type=checkbox]):not([type=radio]):not([type=color]), .frow textarea, .frow select { width: 100%; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.calcline { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); }
.swatch.big { width: 30px; height: 30px; }
.help p { margin: 4px 0 10px; }

/* ---------- Warnungen */
.warnpanel { position: fixed; top: 51px; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 40; background: var(--card); border-left: 1px solid var(--line2); box-shadow: -10px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.warnpanel > header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.warnpanel h2 { margin: 0; }
.wbody { overflow: auto; padding: 0 16px 20px; }
.witem { border-left: 3px solid var(--warn); background: var(--warnbg); margin: 5px 0; padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 13px; }
.witem .wtext { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 0; }
.witem .wfix { margin-top: 4px; font-size: 12px; padding: 2px 8px; border-color: var(--warnline); }
.fixall { width: 100%; margin: 2px 0 6px; font-size: 12.5px; background: var(--card); border-color: var(--warnline); color: var(--warn); }
.witem.info { border-left-color: #9aa5b1; background: var(--infobg); }
.wsum { background: var(--infobg); padding: 7px 10px; border-radius: 6px; margin-top: 12px; }
.ok { color: var(--ok); }

/* ---------- Tabellen */
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th { text-align: left; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--ink2); padding: 7px 6px; white-space: nowrap; position: sticky; top: 0; }
table.grid td { border-bottom: 1px solid var(--line3); padding: 3px 5px; vertical-align: middle; }
table.grid tr:hover td { background: var(--soft); }
table.grid td input:not([type=checkbox]):not([type=color]), table.grid td select { border-color: transparent; background: transparent; width: 100%; padding: 4px 5px; }
table.grid td input:hover, table.grid td select:hover { border-color: var(--line2); background: var(--card); }
table.grid td input:focus, table.grid td select:focus { background: var(--card); }
.mtable td.name { min-width: 250px; }
.mtable td.name input { font-weight: 700; }
.mtable td.num { width: 70px; }
.mtable td.num input { text-align: left; }
.mtable td.calc { white-space: nowrap; color: var(--ink2); background: var(--soft); font-size: 12.5px; }
.mtable td.calc.other { font-style: italic; color: var(--faint); }
.mtable td.pal { white-space: nowrap; }
.mtable td.pal.vorl { background: var(--vorlbg); }
.mtable td.pal input { font-weight: 700; width: 140px !important; }
.mtable td.pal.vorl input { color: var(--vorl); }
.mtable td.pal:not(.vorl) input { color: var(--ink); }
.mtable td.hinweis { min-width: 200px; }
.mtable td.hinweis input { font-size: 12px; color: var(--ink2); }
.mtable td.col { width: 34px; text-align: center; }
.wdn { font-size: 11px; color: var(--muted); margin-left: 2px; }
.wi { display: inline-block; margin-left: 4px; font-size: 12px; font-weight: 700; color: var(--warn); cursor: help; }
.wi.info { color: var(--faint); }
.warns .wi { background: var(--warnbg); border-radius: 9px; padding: 0 7px; }
.warns .wi.info { background: var(--infobg); }
.derived { display: inline-block; width: 100%; text-align: right; color: var(--muted); font-style: italic; padding-right: 6px; }
.status { font-size: 11.5px; border-radius: 10px; padding: 2px 9px; }
.status.vorl { background: var(--warnbg); border-color: var(--warnline); color: var(--vorl); }

/* ===================================================================== Hilfsfunktionen: Datum, Farbe, DOM */

const DAY = 86400000;
const p2 = v => String(v).padStart(2, '0');
const mkdn = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);          // Tagesnummer (Tage seit 1970, UTC)
const dn = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return (y && m && d) ? mkdn(y, m, d) : null; };
const ymd = n => { const d = new Date(n * DAY); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()]; };
const ds = n => { const [y, m, d] = ymd(n); return y + '-' + p2(m) + '-' + p2(d); };
const todayDn = () => { const t = new Date(); return mkdn(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const wd = n => (new Date(n * DAY).getUTCDay() + 6) % 7;                      // 0 = Montag … 6 = Sonntag
const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const isNum = v => v !== null && v !== '' && v !== undefined && !isNaN(v);

function isoWeek(n) {
  const th = n - wd(n) + 3;
  const y = ymd(th)[0], j4 = mkdn(y, 1, 4);
  return 1 + Math.round((th - (j4 - wd(j4) + 3)) / 7);
}
const isoWeekYear = n => ymd(n - wd(n) + 3)[0];

const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WDL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MONS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

const fmtD = n => { if (n == null) return '–'; const [y, m, d] = ymd(n); return p2(d) + '.' + p2(m) + '.' + y; };
const fmtW = n => n == null ? '–' : WD[wd(n)] + ' ' + fmtD(n);
const fmtS = n => { if (n == null) return '–'; const [, m, d] = ymd(n); return p2(d) + '.' + p2(m) + '.'; };
const fmtWS = n => n == null ? '–' : WD[wd(n)] + ' ' + fmtS(n);
function relDays(n, base) {
  const d = n - base;
  if (d === 0) return 'heute';
  if (d === 1) return 'morgen';
  if (d === -1) return 'gestern';
  return d > 0 ? 'in ' + d + ' Tagen' : 'vor ' + (-d) + ' Tagen';
}

/* ---------- Feiertage NRW (Osterformel nach Gauß) */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), n = h + l - 7 * m + 114;
  return mkdn(y, Math.floor(n / 31), (n % 31) + 1);
}
const _holCache = new Map();
function holidaysNRW(y) {
  if (_holCache.has(y)) return _holCache.get(y);
  const e = easter(y), m = new Map();
  [[mkdn(y, 1, 1), 'Neujahr'], [e - 2, 'Karfreitag'], [e + 1, 'Ostermontag'], [mkdn(y, 5, 1), 'Tag der Arbeit'],
   [e + 39, 'Christi Himmelfahrt'], [e + 50, 'Pfingstmontag'], [e + 60, 'Fronleichnam'], [mkdn(y, 10, 3), 'Tag der Deutschen Einheit'],
   [mkdn(y, 11, 1), 'Allerheiligen'], [mkdn(y, 12, 25), '1. Weihnachtsfeiertag'], [mkdn(y, 12, 26), '2. Weihnachtsfeiertag']]
    .forEach(([n, t]) => m.set(n, t));
  _holCache.set(y, m);
  return m;
}

/* ---------- Farben */
const hex2rgb = h => { h = String(h || '#888888').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) || 0); };
const rgb2hex = r => '#' + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (h, t, w = '#ffffff') => { const a = hex2rgb(h), b = hex2rgb(w); return rgb2hex(a.map((v, i) => v + (b[i] - v) * t)); };
// Farbtöne der Maßnahmen; im dunklen Modus zur dunklen Fläche hin gemischt (Druck und Excel immer hell)
let DARK = false, LIGHT_ONLY = 0;
const darkNow = () => DARK && !LIGHT_ONLY && !(typeof UI !== 'undefined' && UI.printing);
const DARK_SURF = '#26282b';
const pastel = h => darkNow() ? mix(h, 0.66, DARK_SURF) : mix(h, 0.75);
const midtone = h => darkNow() ? mix(h, 0.4, DARK_SURF) : mix(h, 0.45);
const logoSrc = () => darkNow() ? LOGO_DARK : LOGO;                      // weißes Logo im dunklen Design
const inkC = h => darkNow() ? mix(h, 0.45, '#ffffff') : mix(h, 0.12, '#000000');   // Schrift in Maßnahmenfarbe
function lum(h) {
  const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const onColor = h => lum(h) > 0.42 ? '#1a1a1a' : '#ffffff';

const PALETTE = [['Blau', '#1F77B4'], ['Orange', '#E6550D'], ['Grün', '#2CA02C'], ['Magenta', '#C2185B'], ['Türkis', '#0097A7'],
  ['Rot', '#C62828'], ['Dunkelblau', '#283593'], ['Oliv', '#7C8B1F'], ['Violett', '#7B3FA0'], ['Braun', '#8D5B3A'], ['Gold', '#B8860B']];

/* ---------- DOM */

function h(tag, props, ...kids) {

    else if (k === 'style') { if (typeof v === 'string') e.setAttribute('style', v); else for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) e.style.setProperty(sk, sv); else e.style[sk] = sv; } }

const put = (parent, ...kids) => { parent.append(...kids.flat(Infinity).filter(k => k != null && k !== false)); return parent; };

/* ---------- Tooltip (ein gemeinsames Element, Inhalt wird beim Überfahren erzeugt) */
const TIPS = new WeakMap();
function setTip(el, fnOrText) { TIPS.set(el, fnOrText); }
let tipEl = null, tipFor = null;
function initTips() {
  tipEl = h('div', { id: 'tip', role: 'tooltip' });
  document.body.append(tipEl);
  document.addEventListener('mouseover', ev => {
    let t = ev.target;
    while (t && t !== document.body && !TIPS.has(t)) t = t.parentElement;
    if (!t || !TIPS.has(t) || t === document.body) { hideTip(); return; }
    if (t === tipFor) return;
    tipFor = t;
    const c = TIPS.get(t);
    tipEl.replaceChildren(typeof c === 'function' ? c() : h('div', null, c));
    tipEl.classList.add('on');
    placeTip(ev);
  });
  document.addEventListener('mousemove', ev => { if (tipFor) placeTip(ev); });
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('mousedown', hideTip, true);
}
function placeTip(ev) {
  const r = tipEl.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  let x = ev.clientX + 14, y = ev.clientY + 16;
  if (x + r.width > W - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > H - 8) y = ev.clientY - r.height - 12;
  tipEl.style.left = Math.max(8, x) + 'px';
  tipEl.style.top = Math.max(8, y) + 'px';
}
function placeLab(lab, x, y) {
  const r = lab.getBoundingClientRect();
  lab.style.left = (x + 16 + r.width > innerWidth - 8 ? Math.max(8, x - r.width - 16) : x + 16) + 'px';
  lab.style.top = Math.max(8, y - r.height - 14) + 'px';
}
function hideTip() { tipFor = null; if (tipEl) tipEl.classList.remove('on'); }

/* ---------- Meldungen und Dialoge */
function toast(text, kind = '') {
  const t = h('div', { class: 'toast ' + kind }, text), box = $('#toasts');
  while (box.children.length >= 3) box.firstChild.remove();
  box.append(t);
  setTimeout(() => t.classList.add('out'), 3200);
  setTimeout(() => t.remove(), 3700);
}
function modal(title, body, buttons, opts = {}) {
  return new Promise(resolve => {
    const close = v => { back.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') close(null); };
    const box = h('div', { class: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
      h('header', null, h('h2', null, title), h('button', { class: 'icon', 'aria-label': 'Schließen', onclick: () => close(null) }, '✕')),
      h('div', { class: 'modal-body' }, body),
      h('footer', null, (buttons || [['OK', true, 'primary']]).map(([label, val, cls]) => h('button', { class: cls || '', onclick: () => close(typeof val === 'function' ? val() : val) }, label))));
    const back = h('div', { class: 'backdrop', onmousedown: e => { if (e.target === back) close(null); } }, box);
    document.body.append(back);
    document.addEventListener('keydown', key);
    const f = box.querySelector('input,select,textarea,footer button.primary');
    if (f) setTimeout(() => f.focus(), 30);

}
const confirmBox = (title, text, yes = 'Ja', no = 'Abbrechen') =>
  modal(title, h('p', null, text), [[no, false], [yes, true, 'primary']]).then(v => v === true);

function download(filename, blob) {
  const a = h('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Feiertage (NRW, bearbeitbar) inkl. eigener freier Tage */
// D.feiertage: { 'JJJJ-MM-TT' (gesetzliches Datum): { name?, datum?, off? } }
let _holYear = new Map();
function holidays(y) {
  if (_holYear.has(y)) return _holYear.get(y);
  const out = new Map(), ov = (D && D.feiertage) || {};
  for (const [n, t] of holidaysNRW(y)) {
    const o = ov[ds(n)] || {};
    if (o.off) continue;
    out.set(dn(o.datum) ?? n, o.name || t);
  }
  _holYear.set(y, out);
  return out;
}
function holName(n) {
  const y = ymd(n)[0];
  const f = holidays(y).get(n);
  if (f) return f;
  const s = D.sondertage.find(x => dn(x.datum) === n);
  return s ? (s.name || 'freier Tag') : null;
}
const isWorkday = n => wd(n) < 5 && !holName(n);
function prevWorkday(n) { let k = n; while (!isWorkday(k) && n - k < 14) k--; return k; }
// PAL darf auf einen Samstag fallen, aber nicht auf Sonntag oder Feiertag
function prevPalDay(n) { let k = n; while ((wd(k) === 6 || holName(k)) && n - k < 14) k--; return k; }
// Werktage (Mo–Fr ohne Feiertage) von n bis zum Tag vor dem PAL
const workdaysBefore = (n, pal) => n == null || pal == null ? null : n < pal ? workdays(n, pal - 1) : -workdays(pal, n - 1);
function workdays(a, b) { let c = 0; for (let n = a; n <= b; n++) if (isWorkday(n)) c++; return c; }

/* ---------- Personen */
function personColor(name) {
  const p = D.personen.find(x => x.name === name);
  if (p) return p.farbe;
  let hsh = 0; for (const ch of String(name)) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
  return PERSON_COLORS[hsh % PERSON_COLORS.length];
}
function ensurePersons(d) {
  const names = new Set();
  d.urlaube.forEach(u => u.wer && names.add(u.wer.trim()));
  d.massnahmen.forEach(m => { if (m.verantwortlich) names.add(m.verantwortlich.trim()); (m.plan?.steps || []).forEach(s => s.wer && names.add(s.wer.trim())); });
  for (const n of names) if (n && !d.personen.some(p => p.name === n)) {
    const used = new Set(d.personen.map(p => p.farbe));
    d.personen.push({ name: n, farbe: PERSON_COLORS.find(c => !used.has(c)) || PERSON_COLORS[d.personen.length % PERSON_COLORS.length] });
  }
}

/* ---------- Detailplan: Rückwärtsterminierung wie im Excel-Gantt */
function planCalc(m) {
  const pal = dn(m.pal), steps = m.plan ? m.plan.steps : [];
  const byId = new Map(steps.map(s => [s.id, s]));
  const res = new Map(), busy = new Set();
  function calc(s) {
    if (res.has(s.id)) return res.get(s.id);
    if (busy.has(s.id)) return { start: null, end: null, err: 'Zirkelbezug' };
    busy.add(s.id);
    let e = null, err = null;
    const a = s.anker || { art: 'offen' }, off = +a.offset || 0;
    if (s.typ !== 'gruppe') {
      if (a.art === 'pal') e = pal != null ? pal + off : null;
      else if (a.art === 'fest') e = dn(a.datum);
      else if (a.art === 'start' || a.art === 'ende') {
        const r = byId.get(a.ref);
        if (!r) err = 'Bezug fehlt';
        else { const rc = calc(r); if (rc.err) err = rc.err; const b = a.art === 'start' ? rc.start : rc.end; e = b != null ? b + off : null; }
      }
    }
    const dur = s.typ === 'aufgabe' ? Math.max(0, Math.round(+s.dauer || 0)) : 0;
    const out = { start: e != null ? e - dur : null, end: e, err };
    busy.delete(s.id);
    res.set(s.id, out);
    return out;
  }
  steps.forEach(calc);
  const g = id => (id && res.get(id)) ? res.get(id).start : null;
  return { map: res, s: g(m.plan && m.plan.markS), i: g(m.plan && m.plan.markI) };
}

/* ---------- Alles Abgeleitete für eine Darstellung */
let C = null;
function derive() {
  _holYear = new Map();
  const ms = D.massnahmen.map(m => {
    const pal = dn(m.pal);
    let s = null, i = null, pc = null;
    if (m.plan) { pc = planCalc(m); s = pc.s; i = pc.i; }
    else if (pal != null) {
      if (isNum(m.vorlaufS)) s = pal - Math.round(+m.vorlaufS);
      if (isNum(m.vorlaufI)) i = pal - Math.round(+m.vorlaufI);
    }
    return { m, id: m.id, pal, s, i, pc, color: m.farbe || '#7F7F7F', vS: pal != null && s != null ? pal - s : null, vI: pal != null && i != null ? pal - i : null };
  });
  ms.sort((a, b) => (a.pal ?? 1e9) - (b.pal ?? 1e9) || a.m.name.localeCompare(b.m.name, 'de'));
  const byId = new Map(ms.map(x => [x.id, x]));
  const vac = D.urlaube.map(u => ({ u, von: dn(u.von), bis: dn(u.bis) || dn(u.von) })).filter(v => v.von != null && v.bis >= v.von);
  C = { ms, byId, vac };
  C.warnings = computeWarnings();
  return C;
}
const vacOn = n => C.vac.filter(v => v.von <= n && n <= v.bis);
const visibleM = x => !UI.hiddenM.has(x.id);
const TYPES = [['S', 's', 'Start Selektion'], ['I', 'i', 'Start inhaltliche Arbeit'], ['P', 'pal', 'PAL']];
const TYPE_LABEL = { S: 'Start Selektion', I: 'Start inhaltliche Arbeit', P: 'PAL (Briefkasten)' };

// Termine (S/I/P) eines Zeitraums, gefiltert nach Anzeige
function eventsIn(a, b, all = false) {
  const out = [];
  for (const x of C.ms) {
    if (!all && !visibleM(x)) continue;
    for (const [t, k] of TYPES) {
      if (!all && !UI.show[t]) continue;
      const n = x[k];
      if (n != null && n >= a && n <= b) out.push({ n, t, x });
    }
  }
  return out.sort((p, q) => p.n - q.n || 'SIP'.indexOf(p.t) - 'SIP'.indexOf(q.t));
}
const inYear = (x, y) => [x.s, x.i, x.pal].some(n => n != null && ymd(n)[0] === y);

/* ---------- Warnungen */
function computeWarnings() {
  const W = [], y = UI.year, today = todayDn();
  const relevant = C.ms.filter(x => inYear(x, y) || x.pal == null);
  for (const x of relevant) {
    const nm = x.m.name || '(ohne Namen)';
    if (x.pal == null) { W.push({ lvl: 'info', mid: x.id, text: nm + ': kein PAL eingetragen' }); continue; }
    const chk = (n, lab, isPal) => {
      if (n == null) return;
      const w = wd(n), hn = holName(n);
      const t = isPal ? 'P' : lab === 'Start Selektion' ? 'S' : 'I';
      const planLocked = !isPal && x.m.plan && (t === 'S' ? !x.m.plan.markS : !x.m.plan.markI);
      const fix = planLocked ? null : { t, to: isPal ? prevPalDay(n) : prevWorkday(n) };
      if (hn) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf den Feiertag „${hn}“ (${fmtW(n)})` });
      else if ((!isPal && w >= 5) || (isPal && w === 6)) W.push({ lvl: 'warn', mid: x.id, n, fix, text: `${nm}: ${lab} fällt auf einen ${WDL[w]} (${fmtD(n)})` });
      const resp = (x.m.verantwortlich || '').trim();
      const away = vacOn(n).filter(v => !resp || v.u.wer === resp);
      if (away.length && !isPal) W.push({ lvl: resp ? 'warn' : 'info', mid: x.id, n,
        text: `${nm}: ${lab} am ${fmtW(n)} – im Urlaub: ${[...new Set(away.map(v => v.u.wer || '?'))].join(', ')}` });
    };
    chk(x.s, 'Start Selektion'); chk(x.i, 'Start inhaltliche Arbeit'); chk(x.pal, 'PAL', true);
    if (x.s != null && x.i != null && x.s > x.i) W.push({ lvl: 'info', mid: x.id, text: `${nm}: Start inhaltliche Arbeit liegt vor Start Selektion` });
    if (x.pc) for (const s of x.m.plan.steps) {
      const r = x.pc.map.get(s.id);
      if (!r) continue;
      if (r.err) W.push({ lvl: 'warn', mid: x.id, step: s.id, text: `${nm} › ${s.name}: ${r.err} in der Verknüpfung` });
      if (r.start == null || s.typ === 'gruppe') continue;
      if (s.wer) {
        const away = C.vac.filter(v => v.u.wer === s.wer && v.von <= r.end && v.bis >= r.start);
        if (away.length) W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.start,
          text: `${nm} › ${s.name}: ${s.wer} hat Urlaub (${away.map(v => fmtS(v.von) + '–' + fmtS(v.bis)).join(', ')})` });
      }
      if (r.end < today && (+s.fortschritt || 0) < 100 && s.typ === 'aufgabe')
        W.push({ lvl: 'warn', mid: x.id, step: s.id, n: r.end, text: `${nm} › ${s.name}: überfällig seit ${fmtD(r.end)} (${+s.fortschritt || 0} % erledigt)` });
    }
  }
  return W;
}

/* ---------- Änderungen, Rückgängig */
function commit(fn, msg) {
  const before = JSON.stringify(D);
  fn(D);
  ensurePersons(D);
  const after = JSON.stringify(D);
  if (before === after) return false;
  UNDO.push(before); if (UNDO.length > 100) UNDO.shift();
  REDO.length = 0;
  changed();
  if (msg) toast(msg);
  return true;
}
function undo() {
  if (!UNDO.length) { toast('Nichts rückgängig zu machen'); return; }
  REDO.push(JSON.stringify(D)); D = JSON.parse(UNDO.pop()); changed(); toast('Rückgängig gemacht');
}
function redo() {
  if (!REDO.length) return;
  UNDO.push(JSON.stringify(D)); D = JSON.parse(REDO.pop()); changed(); toast('Wiederhergestellt');
}
function changed() { saveDraft(); scheduleAutosave(); requestRender(); }
const isDirty = () => JSON.stringify(D) !== SAVED_JSON;
const findM = (d, id) => d.massnahmen.find(m => m.id === id);

/* ===================================================================== Speichern: die Datei speichert sich selbst (App + Daten in einer HTML-Datei) */

  for (const f of files) {

const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  const out = []; let cur = '', lim = 75;
  for (const ch of line) {
    if (enc.encode(cur + ch).length > lim) { out.push(cur); cur = ch; lim = 74; } else cur += ch;
  }

}
const icsDate = n => ds(n).replace(/-/g, '');

  return ['BEGIN:VEVENT', 'UID:' + uidv + '@jahresplanung.local', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + icsDate(a), 'DTEND;VALUE=DATE:' + icsDate(b + 1),

    'X-MICROSOFT-CDO-BUSYSTATUS:FREE', 'END:VEVENT'].filter(Boolean);
}
const ICS_KINDS = [['S', 'Start Selektion'], ['I', 'Start inhaltliche Arbeit'], ['P', 'PAL (Briefkasten)'], ['steps', 'Arbeitsschritte aus Detailplänen'], ['ms', 'Meilensteine/Ziele aus Detailplänen'], ['vac', 'Urlaube']];
// alle wählbaren Kalendereinträge; jeder Eintrag ist ganztägig
function icsItems(o) {
  const a = o.from, b = o.to, out = [];
  const who = o.person, match = n => !who || (n || '') === who;
  for (const x of C.ms) {
    if (!o.ms.has(x.id)) continue;
    for (const [t, k, lab] of TYPES) {
      if (!o.kinds[t] || x[k] == null || x[k] < a || x[k] > b || !match(x.m.verantwortlich)) continue;
      out.push({ kind: t, mid: x.id, uid: x.id + '-' + t + '-' + ds(x[k]), a: x[k], b: x[k], lab: t === 'P' ? 'PAL' : lab, summary: (t === 'P' ? 'PAL' : lab) + ' · ' + x.m.name,
        desc: [x.m.name, TYPE_LABEL[t] + ': ' + fmtW(x[k]), x.pal != null && t !== 'P' ? 'PAL: ' + fmtW(x.pal) : '', t === 'P' && x.m.palStatus !== 'fest' ? 'PAL noch vorläufig' : '',
          x.m.verantwortlich ? 'Hauptverantwortlich: ' + x.m.verantwortlich : '', x.m.hinweis].filter(Boolean).join('\n') });
    }
    if (x.pc) for (const s of x.m.plan.steps) {
      const r = x.pc.map.get(s.id), isPoint = s.typ !== 'aufgabe', kind = isPoint ? 'ms' : 'steps';
      if (!o.kinds[kind] || !r || r.start == null || s.typ === 'gruppe' || r.end < a || r.start > b || !match(s.wer)) continue;
      out.push({ kind, mid: x.id, uid: x.id + '-' + s.id, a: isPoint ? r.end : r.start, b: isPoint ? r.end : Math.max(r.start, r.end - 1), lab: (isPoint ? '◆ ' : '') + s.name + (s.wer ? ' (' + s.wer + ')' : ''),
        summary: (isPoint ? '◆ ' : '') + s.name + ' · ' + x.m.name, desc: [x.m.name, s.wer ? 'Zugeordnet: ' + s.wer : '', s.kommentar, isPoint ? '' : fmtW(r.start) + ' – ' + fmtW(r.end)].filter(Boolean).join('\n') });

function icsFile(name, items) {

function highlight(id) {

  $$('.day.span', main).forEach(c => { c.classList.remove('span'); c.style.removeProperty('--hcl'); c.style.removeProperty('--hcr'); });
  const x = id && C.byId.get(id);

  const pts = [x.s, x.i, x.pal].filter(v => v != null).sort((p, q) => p - q);
  if (pts.length < 2) return;
  const a = Math.min(...pts), b = Math.max(...pts), cells = new Map($$('.day[data-dn]', main).map(c => [+c.dataset.dn, c]));
  for (let n = a; n <= b; n++) {

    c.classList.add('span'); c.style.setProperty('--hcl', l); c.style.setProperty('--hcr', r);
  }
}

/* ---------- Markierung im Kalender ziehen: P verschiebt das ganze Projekt, S/I nur dieses Datum */
function chipDrag(ev, e) {

    if (n == null) return;

      lab = h('div', { class: 'drag-lab' });
      document.body.append(ghost, lab);

    const under = document.elementFromPoint(m.clientX, m.clientY);
    const cell = under && under.closest('.day[data-dn]');
    if (cell) dd = +cell.dataset.dn - e.n;
    let s = x.s, i = x.i, p = x.pal, txt, w;
    if (t === 'P') {
      p += dd; if (s != null) s += dd; if (i != null) i += dd;
      txt = 'PAL ' + fmtW(p) + (s != null ? ' · S ' + fmtWS(s) : '') + (i != null ? ' · I ' + fmtWS(i) : '');
      w = [p, s, i].flatMap((v, k) => v == null ? [] : dateWarn(v, resp).filter(q => k > 0 || !/Samstag|Urlaub/.test(q)).map(q => ['PAL', 'S', 'I'][k] + ': ' + q));
    } else {
      const n = (t === 'S' ? s : i) + dd;
      txt = TYPE_LABEL[t] + ' ' + fmtW(n) + ' · ' + workdaysBefore(n, p) + ' Werktage vor PAL';
      w = dateWarn(n, resp);
      if (t === 'S') s = n; else i = n;
    }
    clearMarks();
    if (t === 'P') { mark(p, 'P'); mark(s, 'S'); mark(i, 'I'); } else mark(t === 'S' ? s : i, t);
    setKids(lab, h('b', null, txt), dd ? h('span', { class: 'muted' }, ' (' + (dd > 0 ? '+' : '') + dd + ' Tage)') : null, w.length ? h('div', { class: 'warn' }, '⚠ ' + w.join(' · ')) : null);
    placeLab(lab, m.clientX, m.clientY);
  };
  const stop = () => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', stop);
    document.body.classList.remove('dragging');
    el.classList.remove('dragsrc');

    const wasMoved = moved;

const STEP_TYPES = { gruppe: 'Abschnitt', aufgabe: 'Aufgabe', meilenstein: 'Meilenstein', ziel: 'Ziel' };
const PL_ROW = 32;
const DEF_DAYS = 7;                            // Standarddauer neuer bzw. noch nicht geplanter Schritte

/* ---------- Rechenhilfen am Datenobjekt */
// Schritte, deren Dauer den Beginn des markierten Schritts bestimmt (entlang der Verknüpfungen bis zum PAL)
function influencingChain(p, markId) {
  const byId = new Map(p.steps.map(s => [s.id, s])), out = [], seen = new Set();
  let cur = byId.get(markId);
  if (!cur) return out;
  if (cur.typ === 'aufgabe') out.push(cur);
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    const a = cur.anker || {};
    if (a.art !== 'start' && a.art !== 'ende') break;
    const ref = byId.get(a.ref);
    if (!ref) break;
    if (a.art === 'start' && ref.typ === 'aufgabe') out.push(ref);
    cur = ref;
  }
  return out;
}
// Start Selektion / Start Inhalt auf ein Datum legen: die Dauer des längsten Schritts dazwischen passt sich an
function adjustMark(m, which, target) {
  const p = m.plan, mark = which === 'S' ? p.markS : p.markI, other = which === 'S' ? p.markI : p.markS;
  const r = planCalc(m).map.get(mark);
  if (!r || r.start == null || target == null) return null;
  let delta = r.start - target;
  if (!delta) return { changed: [] };
  const theirs = new Set(other ? influencingChain(p, other).map(s => s.id) : []);
  const mine = influencingChain(p, mark);
  let pool = mine.filter(s => !theirs.has(s.id));
  if (!pool.length) pool = mine;
  if (!pool.length) return null;
  pool = pool.slice().sort((a, b) => (+b.dauer || 0) - (+a.dauer || 0));
  const changed = [];
  if (delta > 0) { changed.push([pool[0].name, +pool[0].dauer || 0, (+pool[0].dauer || 0) + delta]); pool[0].dauer = (+pool[0].dauer || 0) + delta; }
  else {
    let rest = -delta;
    for (const s of pool) {
      const take = Math.min(Math.max(0, (+s.dauer || 0) - 1), rest);
      if (!take) continue;
      changed.push([s.name, +s.dauer, +s.dauer - take]); s.dauer = +s.dauer - take; rest -= take;
      if (!rest) break;
    }
    if (rest) return { changed, partial: true };
  }
  return { changed };
}
// Start Selektion/Inhalt einer Maßnahme auf ein Datum legen (Zeitleiste, Kalender): ohne Plan über den Vorlauf,
// mit Detailplan über die Dauer der Schritte davor. Liefert die Meldung für den Hinweis.
function startMovable(x, t) { return !x.m.plan || !!(t === 'S' ? x.m.plan.markS : x.m.plan.markI); }
function moveStartTo(id, t, n) {
  let res = null;
  const x = C.byId.get(id), label = t === 'S' ? 'Start Selektion' : 'Start Inhalt';
  commit(d => {
    const m = findM(d, id), pal = dn(m.pal);
    if (m.plan) res = adjustMark(m, t, n);
    else if (pal != null) { if (t === 'S') m.vorlaufS = Math.max(0, pal - n); else m.vorlaufI = Math.max(0, pal - n); res = { changed: [] }; }
  });
  if (!res) return;
  const det = res.changed.length ? ' – Detailplan: ' + res.changed.map(([nm, a, b]) => '„' + nm + '“ ' + a + ' → ' + b + ' Tage').join(', ') : '';
  toast(x.m.name + ': ' + label + ' → ' + fmtW(n) + det + (res.partial ? ' (kürzer geht nicht)' : ''), res.partial ? 'warn' : '');
}
// Schritt auf neuen Beginn/Ende setzen (Verknüpfung bleibt, der Versatz wird angepasst)
function setStepSpan(m, sid, ns, ne) {
  const s = m.plan.steps.find(q => q.id === sid);
  if (!s || s.typ === 'gruppe') return;
  if (s.typ !== 'aufgabe') ns = ne;
  const r = planCalc(m).map.get(sid) || {};
  const a = s.anker || { art: 'offen' };
  const pal = dn(m.pal);
  if (a.art === 'fest') s.anker = { art: 'fest', datum: ds(ne) };
  else if (r.end == null || a.art === 'offen') s.anker = pal != null ? { art: 'pal', offset: ne - pal } : { art: 'fest', datum: ds(ne) };
  else a.offset = (+a.offset || 0) + (ne - r.end);
  if (s.typ === 'aufgabe') s.dauer = Math.max(0, ne - ns);

function barDrag(ev, ctx, mode) {

  const { x, s, r, pxd, X, el } = ctx, sx = ev.clientX;

  const move = e => {

    else if (mode === 'left') { ns = Math.min(r.start + dd, r.end); ne = r.end; }
    else { ns = r.start; ne = Math.max(r.end + dd, r.start); }
    if (isTask) { el.style.left = X(ns) + 'px'; el.style.width = Math.max(3, (ne - ns) * pxd) + 'px'; }
    else el.style.left = X(ne) + pxd / 2 + 'px';
    const w = s.wer ? C.vac.filter(v => v.u.wer === s.wer && v.von <= ne && v.bis >= ns).map(v => s.wer + ' Urlaub ' + fmtS(v.von) + '–' + fmtS(v.bis)) : [];
    setKids(lab, h('b', null, s.name), h('div', null, isTask ? fmtW(ns) + ' – ' + fmtW(ne) + ' (' + (ne - ns) + ' Tage)' : fmtW(ne)), w.length ? h('div', { class: 'warn' }, '⚠ ' + w.join(' · ')) : null);

    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
    document.body.classList.remove('dragging'); lab.remove();
    if (!moved || (ns === r.start && ne === r.end)) return;

  const table = ev.currentTarget.closest('.pl-table'), src = ev.currentTarget.closest('.pl-row');
  document.body.classList.add('dragging');
  src.classList.add('dragrow');
  let target = null, after = false;
  const clear = () => $$('.pl-row.drop-before, .pl-row.drop-after', table).forEach(r => r.classList.remove('drop-before', 'drop-after'));
  const move = e => {

    if (!best && rows.length) { const last = rows[rows.length - 1]; if (e.clientY >= last.getBoundingClientRect().bottom) { best = last; after = true; } }

  const hint = protect ? 'Nur zur Ansicht – bearbeitet wird im Programm („Jahresplanung starten“). Änderungen hier werden beim nächsten Speichern überschrieben. ' + stand : stand;
  const ms = C.ms.filter(x => (x.pal != null && ymd(x.pal)[0] === y) || inYear(x, y));
  const warnBy = new Map();
  C.warnings.forEach(w => { if (w.mid) warnBy.set(w.mid, (warnBy.get(w.mid) || []).concat(w.text.replace(/^[^:]+: /, ''))); });
  const sheets = [];

  // 1. Übersicht
  {
    const rows = [[{ v: 'Jahresplanung Außenkommunikation ' + y, st: XS.title }], [{ v: hint, st: XS.note }], [],
      ['', 'Maßnahme', 'Start Selektion', 'Start inhaltliche Arbeit', 'PAL', 'PAL-Status', 'Hauptverantwortlich', 'Art der Bitte', 'Auflage', 'Hinweis', 'Bitte prüfen'].map(t => ({ v: t, st: XS.head }))];
    for (const x of ms) {
      const bd = { border: 'thin', v: 'top' };
      rows.push([{ v: '', st: { fill: x.color, border: 'thin' } }, { v: x.m.name, st: { ...bd, b: true, color: darker(x.color) } },
        XD(x.s, 'dw', bd), XD(x.i, 'dw', bd), XD(x.pal, 'dw', { ...bd, b: true }), { v: x.m.palStatus, st: bd }, { v: x.m.verantwortlich || '', st: bd },
        { v: x.m.art || '', st: bd }, isNum(x.m.auflage) ? { v: +x.m.auflage, st: bd } : { v: '', st: bd }, { v: x.m.hinweis || '', st: { ...bd, wrap: true } },
        { v: (warnBy.get(x.id) || []).join('; '), st: { ...bd, wrap: true, color: '#B45309' } }]);
    }
    sheets.push({ name: 'Übersicht', cols: [2.5, 30, 15, 17, 15, 11, 15, 12, 9, 40, 55], rows, merges: ['A1:K1', 'A2:K2'], heights: { 0: 22, 3: 30 },
      freeze: 'C5', filter: ms.length ? 'A4:K' + (4 + ms.length) : null, protect, grid: false });
  }

  // 2. Kalender: 12 Monate wie im Programm (S/I/P farbig)
  {
    const rows = [], merges = [], heights = {}, CW = 9, cols = [];
    for (let k = 0; k < 4; k++) cols.push(3.2, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 5.4, 1.4);
    const set = (r, c, v) => { (rows[r] = rows[r] || [])[c] = v; };
    set(0, 0, { v: 'Jahresplanung Außenkommunikation ' + y + ' – Kalender', st: XS.title }); merges.push('A1:AI1'); heights[0] = 22;
    set(1, 0, { v: hint, st: XS.note }); merges.push('A2:AI2');
    set(2, 0, { v: 'P = PAL (kräftige Farbe der Maßnahme) · S = Start Selektion · I = Start inhaltliche Arbeit (Pastellton) · hellgrau = Wochenende · dunkelgrau = Feiertag NRW', st: { sz: 9, color: '#404040' } }); merges.push('A3:AI3');
    const evAll = eventsIn(a, b, true), byDay = new Map();
    evAll.forEach(e => { if (!byDay.has(e.n)) byDay.set(e.n, []); byDay.get(e.n).push(e); });
    let r = 4;
    for (let band = 0; band < 3; band++) {
      const lists = [];
      for (let k = 0; k < 4; k++) {
        const mo = band * 4 + k + 1, c0 = k * CW, first = mkdn(y, mo, 1), last = first + daysIn(y, mo) - 1, start = first - wd(first);
        set(r, c0, { v: MON[mo - 1] + ' ' + y, st: { b: true, sz: 11, color: '#FFFFFF', fill: '#404040', v: 'center' } });
        for (let j = 1; j < 8; j++) set(r, c0 + j, { v: '', st: { fill: '#404040' } });
        merges.push(colName(c0) + (r + 1) + ':' + colName(c0 + 7) + (r + 1));
        set(r + 1, c0, { v: 'KW', st: { sz: 7, color: '#999999', h: 'center' } });
        WD.forEach((d, j) => set(r + 1, c0 + 1 + j, { v: d, st: { sz: 8, b: true, color: j >= 5 ? '#999999' : '#595959', h: 'center' } }));
        for (let w = 0; w < 6; w++) {
          const ws = start + 7 * w;
          set(r + 2 + w, c0, ws <= last ? { v: isoWeek(ws), st: { sz: 7, color: '#AAAAAA', h: 'center', v: 'top' } } : '');
          for (let d = 0; d < 7; d++) {
            const n = ws + d;
            if (n < first || n > last) { set(r + 2 + w, c0 + 1 + d, { v: '', st: { fill: '#FAFAFA', border: 'thin' } }); continue; }
            const evs = byDay.get(n) || [], hn = holName(n);
            const st = { h: 'center', v: 'top', wrap: true, sz: 9, border: 'thin' };
            const p = evs.find(e => e.t === 'P'), f = p || evs[0];
            if (f) Object.assign(st, f.t === 'P' ? { fill: f.x.color, color: onColor(f.x.color), b: true } : { fill: pastel(f.x.color), color: darker(f.x.color), b: true });
            else if (hn) Object.assign(st, { fill: '#CFCFCF', b: true, color: '#262626' });
            else if (d >= 5) Object.assign(st, { fill: '#EDEDED', color: '#808080' });
            set(r + 2 + w, c0 + 1 + d, { v: ymd(n)[2] + (evs.length ? '\n' + evs.map(e => e.t).join(' ') : ''), st });
          }
        }
        // Terminliste unter dem Monat
        const lines = [], per = new Map();
        const hols = []; for (let n = first; n <= last; n++) { const hn = holName(n); if (hn) hols.push(fmtS(n) + ' ' + hn); }
        if (hols.length) lines.push({ v: hols.join(' · '), st: { sz: 8, color: '#8C8C8C' } });
        for (let n = first; n <= last; n++) for (const e of byDay.get(n) || []) { if (!per.has(e.x.id)) per.set(e.x.id, { x: e.x, ev: [] }); per.get(e.x.id).ev.push(e); }
        for (const { x, ev } of per.values()) lines.push({ v: x.m.name + ':  ' + ev.map(e => e.t + ' ' + fmtS(e.n)).join(' · '), st: { sz: 8, b: true, color: darker(x.color) } });
        const vm = C.vac.filter(v => v.bis >= first && v.von <= last);
        if (vm.length) lines.push({ v: 'Urlaub: ' + vm.map(v => (v.u.wer || '?') + ' ' + fmtS(Math.max(v.von, first)) + (v.bis > v.von ? '–' + fmtS(Math.min(v.bis, last)) : '')).join(', '), st: { sz: 8, color: '#8A6D00' } });
        lists.push(lines);
      }
      heights[r] = 17;
      for (let w = 0; w < 6; w++) heights[r + 2 + w] = 27;
      const L = Math.max(1, ...lists.map(l => l.length));
      for (let k = 0; k < 4; k++) {
        const c0 = k * CW;
        for (let li = 0; li < L; li++) {
          const rr = r + 8 + li, cell = lists[k][li];
          if (cell && cell.v.length > 62) { cell.st = { ...cell.st, wrap: true, v: 'top' }; heights[rr] = 22; }
          set(rr, c0, cell || '');
          merges.push(colName(c0) + (rr + 1) + ':' + colName(c0 + 7) + (rr + 1));
        }
      }
      for (let li = 0; li < L; li++) heights[r + 8 + li] = heights[r + 8 + li] || 12;
      r += 8 + L + 1;
    }
    sheets.push({ name: 'Kalender', cols, rows, merges, heights, protect, grid: false, onePage: true });
  }

  // 3. Zeitleiste nach Kalenderwochen
  {
    const weeks = []; for (let n = a - wd(a); n <= b; n += 7) weeks.push(n);
    const rows = [], merges = [], heights = { 0: 22, 3: 13 }, W0 = 2;
    rows.push([{ v: 'Jahresplanung Außenkommunikation ' + y + ' – Zeitleiste nach Kalenderwochen', st: XS.title }]);
    rows.push([{ v: hint, st: XS.note }]);
    merges.push('A1:' + colName(W0 + weeks.length - 1) + '1', 'A2:' + colName(W0 + weeks.length - 1) + '2');
    const mRow = [{ v: '', st: {} }, ''], kRow = [{ v: 'Maßnahme', st: { b: true, sz: 9 } }, { v: 'PAL', st: { b: true, sz: 9 } }];
    let prevM = null, mStart = W0;
    weeks.forEach((n, j) => {
      const mo = ymd(n + 3)[1];
      if (mo !== prevM) {
        if (prevM != null && j + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(j + W0 - 1) + '3');
        const span = weeks.slice(j).findIndex(q => ymd(q + 3)[1] !== mo);
        mRow[j + W0] = { v: span === 1 ? '' : MON[mo - 1], st: { b: true, sz: 9, fill: '#F2F2F2', border: 'thin' } };
        prevM = mo; mStart = j + W0;
      } else mRow[j + W0] = { v: '', st: { fill: '#F2F2F2', border: 'thin' } };
      kRow[j + W0] = { v: isoWeek(n), st: { sz: 7, color: '#808080', h: 'center' } };
    });
    if (weeks.length + W0 - 1 > mStart) merges.push(colName(mStart) + '3:' + colName(weeks.length + W0 - 1) + '3');
    rows.push(mRow, kRow);
    for (const x of ms) {
      const row = [{ v: x.m.name, st: { b: true, color: darker(x.color), border: 'thin' } }, XD(x.pal, 'ds', { sz: 9, border: 'thin' })];
      weeks.forEach((n, j) => {
        const e = n + 6, has = v => v != null && v >= n && v <= e;
        const st = { sz: 7, h: 'center', v: 'center', border: 'thin', b: true };
        let v = '';
        const selEnd = x.i != null ? x.i : x.pal;
        if (has(x.pal)) { Object.assign(st, { fill: x.color, color: onColor(x.color) }); v = 'P'; }
        else if (x.i != null && x.pal != null && x.i <= e && x.pal >= n) { Object.assign(st, { fill: midtone(x.color), color: darker(x.color) }); v = has(x.i) ? 'I' : ''; }
        else if (x.s != null && selEnd != null && x.s <= e && selEnd > n) { Object.assign(st, { fill: pastel(x.color), color: darker(x.color) }); v = has(x.s) ? 'S' : ''; }
        row[j + W0] = { v, st };
      });
      rows.push(row);
    }
    rows.push([]);
    const people = [...new Set(C.vac.filter(v => v.bis >= a && v.von <= b).map(v => v.u.wer || '?'))].sort((p, q) => p.localeCompare(q, 'de'));
    if (people.length) {
      rows.push([{ v: 'Urlaub (Arbeitstage je Woche)', st: XS.sub }]);
      for (const p of people) {
        const row = [{ v: p, st: { border: 'thin' } }, ''];
        weeks.forEach((n, j) => {
          const cnt = C.vac.filter(v => (v.u.wer || '?') === p).reduce((s, v) => s + (v.bis >= n && v.von <= n + 6 ? workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) : 0), 0);
          row[j + W0] = cnt ? { v: cnt, st: { sz: 7, h: 'center', border: 'thin', fill: pastel(personColor(p)) } } : { v: '', st: { border: 'thin' } };
        });
        rows.push(row);
      }
      const row = [{ v: 'gleichzeitig im Urlaub', st: { i: true, sz: 9, border: 'thin' } }, ''];
      weeks.forEach((n, j) => {
        const cnt = people.filter(p => C.vac.some(v => (v.u.wer || '?') === p && v.bis >= n && v.von <= n + 6 && workdays(Math.max(v.von, n), Math.min(v.bis, n + 6)) > 0)).length;
        row[j + W0] = cnt > 1 ? { v: cnt, st: { sz: 7, b: true, h: 'center', border: 'thin', fill: cnt > 2 ? '#F4B6B0' : '#FFD8A8' } } : { v: '', st: { border: 'thin' } };
      });
      rows.push(row, []);
    }
    sheets.push({ name: 'Zeitleiste', cols: [30, 11, ...weeks.map(() => 2.9)], rows, merges, heights, freeze: 'C5', protect, grid: false });
  }

  // 4. Termine (chronologisch)
  {
    const ev = eventsIn(a, b, true);
    const rows = [['Datum', 'KW', 'Maßnahme', 'Termin', 'Hauptverantwortlich', 'Hinweis'].map(t => ({ v: t, st: XS.head })),
      ...ev.map(e => {
        const notes = [];
        const hn = holName(e.n); if (hn) notes.push('Feiertag: ' + hn); else if (wd(e.n) >= 5) notes.push(WDL[wd(e.n)]);
        const away = vacOn(e.n); if (away.length) notes.push('Urlaub: ' + [...new Set(away.map(v => v.u.wer))].join(', '));
        return [XD(e.n), isoWeek(e.n), { v: e.x.m.name, st: e.t === 'P' ? { fill: e.x.color, color: onColor(e.x.color), b: true } : { fill: pastel(e.x.color), color: darker(e.x.color) } },
          TYPE_LABEL[e.t], e.x.m.verantwortlich || '', notes.join(' · ')];
      })];
    sheets.push({ name: 'Termine', cols: [16, 5, 30, 24, 16, 50], rows, freeze: 'A2', filter: rows.length > 1 ? 'A1:F' + rows.length : null, protect });
  }

  // 5. Detailpläne
  {
    const rows = [['Maßnahme', 'Abschnitt', 'Arbeitsschritt', 'Typ', 'Zugeordnet', 'Kommentar', 'Start', 'Dauer (Tage)', 'Ende'].map(t => ({ v: t, st: XS.head }))];
    for (const x of ms) if (x.pc) {
      let grp = '';
      for (const s of x.m.plan.steps) {
        if (s.typ === 'gruppe') { grp = s.name; continue; }
        const r = x.pc.map.get(s.id) || {};
        rows.push([{ v: x.m.name, st: { color: darker(x.color), b: true } }, grp, s.name, STEP_TYPES[s.typ], s.wer ? { v: s.wer, st: { fill: pastel(personColor(s.wer)) } } : '', s.kommentar || '', XD(r.start), s.typ === 'aufgabe' ? +s.dauer || 0 : '', XD(r.end)]);
      }
    }
    sheets.push({ name: 'Detailpläne', cols: [24, 22, 28, 12, 14, 24, 16, 10, 16], rows, freeze: 'A2', filter: rows.length > 1 ? 'A1:I' + rows.length : null, protect });
  }

  // 6. Urlaub und Feiertage
  {
    const rows = [['Wer', 'Von', 'Bis', 'Arbeitstage', 'Notiz'].map(t => ({ v: t, st: XS.head })),
      ...C.vac.filter(v => v.bis >= a && v.von <= b).sort((p, q) => p.von - q.von)
        .map(v => [{ v: v.u.wer || '?', st: { fill: pastel(personColor(v.u.wer)) } }, XD(v.von), XD(v.bis), workdays(v.von, v.bis), v.u.notiz || ''])];
    rows.push([], [{ v: 'Feiertage NRW ' + y, st: XS.sub }]);
    const hols = [...holidays(y)].concat(D.sondertage.filter(s => dn(s.datum) != null && ymd(dn(s.datum))[0] === y).map(s => [dn(s.datum), (s.name || 'freier Tag') + ' (eigener freier Tag)']))
      .sort((p, q) => p[0] - q[0]);
    hols.forEach(([n, t]) => rows.push([XD(n), { v: t, st: {} }]));
    sheets.push({ name: 'Urlaub & Feiertage', cols: [18, 16, 16, 12, 30], rows, freeze: 'A2', protect });
  }
  return xlsxBlob(sheets, { readOnly: protect });
}
function exportExcel() {
  download('Jahresplanung_' + UI.year + '_Export_' + ds(todayDn()) + '.xlsx', viewWorkbook({ protect: false }));
  toast('Excel-Datei erstellt', 'ok');
}

/* ===================================================================== PDF-Export: Bereiche und Maßnahmen wählbar, jede Seite ohne Browser-Kopf-/Fußzeile */

const PDF_SECS = [['mass', 'Maßnahmen-Übersicht'], ['kal', 'Kalender'], ['tl', 'Zeitleiste'], ['ag', 'Was steht an?'], ['plaene', 'Detailpläne (je Plan eine Seite)'], ['urlaub', 'Urlaub & Feiertage']];
const VIEW_SECS = { jahr: ['mass', 'kal'], zeit: ['tl', 'ag'], plaene: ['plaene'], urlaub: ['urlaub'] };

// Auswahlliste der Maßnahmen (für PDF- und Kalender-Export)
function msPicker(sel, list, onChange) {
  const boxes = [];
  const all = on => { list.forEach(x => on ? sel.add(x.id) : sel.delete(x.id)); boxes.forEach(b => { b.checked = on; }); onChange && onChange(); };
  return h('div', { class: 'mspick' },
    h('div', { class: 'pop-h' }, 'Maßnahmen', h('span', null, h('button', { class: 'link', onclick: e => { e.preventDefault(); all(true); } }, 'alle'), ' · ',
      h('button', { class: 'link', onclick: e => { e.preventDefault(); all(false); } }, 'keine'))),
    list.map(x => {
      const b = h('input', { type: 'checkbox', checked: sel.has(x.id), onchange: e => { e.target.checked ? sel.add(x.id) : sel.delete(x.id); onChange && onChange(); } });
      boxes.push(b);
      return h('label', { class: 'mchk' }, b, h('span', { class: 'dot', style: { background: x.color } }), h('span', { class: 'nm' }, x.m.name || '(ohne Namen)'),
        x.pc ? h('span', { class: 'muted small' }, 'Plan') : null, h('span', { class: 'pal' }, x.pal != null ? fmtS(x.pal) : ''));
    }));
}

async function pdfDialog() {
  const y = UI.year, list = C.ms.filter(x => inYear(x, y));
  const last = UI.pdfOpts || {};
  const f = {
    secs: Object.assign({ mass: true, kal: true, tl: true, ag: false, plaene: false, urlaub: false }, last.secs),
    show: Object.assign({ S: true, I: true, P: true }, last.show), vac: last.vac !== false, verbund: !!UI.verbund,
    ms: new Set(list.map(x => x.id)),
  };
  const wrap = h('div', { class: 'form pdfform' });
  const draw = () => {
    const cb = (obj, k, label, extra) => h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!obj[k], onchange: e => { obj[k] = e.target.checked; } }), label, extra || null);
    setKids(wrap, 
      h('div', { class: 'pdf-top' }, h('p', { class: 'muted small' }, 'Wähle, was ins PDF soll. Jeder Bereich beginnt auf einer neuen Seite (A4 quer).'),
        h('button', { class: 'ghostbtn', tip: 'übernimmt Reiter, Filter und angezeigte Maßnahmen von der Ansicht, die gerade offen ist', onclick: e => { e.preventDefault(); fromView(); draw(); } }, '⟲ Wie aktuelle Ansicht')),
      h('div', { class: 'pdf-cols' },
        h('div', null, h('h3', null, 'Bereiche'), h('div', { class: 'checks' }, PDF_SECS.map(([k, l]) => cb(f.secs, k, l))),
          h('h3', null, 'Termine'), h('div', { class: 'checks' }, cb(f.show, 'S', 'Start Selektion'), cb(f.show, 'I', 'Start inhaltliche Arbeit'), cb(f.show, 'P', 'PAL'), cb(f, 'vac', 'Urlaube anzeigen'),
            cb(f, 'verbund', 'Verbund-Darstellung im Kalender'))),
        msPicker(f.ms, list)));
  };
  const fromView = () => {
    f.secs = Object.fromEntries(PDF_SECS.map(([k]) => [k, (VIEW_SECS[UI.view] || []).includes(k) && (UI.secOpen[k] !== false)]));
    if (!Object.values(f.secs).some(Boolean)) f.secs.mass = true;
    f.show = { ...UI.show }; f.vac = UI.showVac; f.verbund = !!UI.verbund;
    f.ms = new Set(list.filter(x => visibleM(x)).map(x => x.id));
    if (UI.view === 'plaene' && UI.planSel) { f.ms = new Set([UI.planSel]); f.secs.plaene = true; }
  };
  draw();
  const ok = await modal('PDF exportieren', wrap, [['Abbrechen', false], ['PDF erstellen', true, 'primary']], { wide: true });
  if (!ok) return;
  if (!Object.values(f.secs).some(Boolean)) { toast('Kein Bereich gewählt.', 'warn'); return; }
  if (!f.ms.size && (f.secs.mass || f.secs.kal || f.secs.tl || f.secs.plaene)) { toast('Keine Maßnahme gewählt.', 'warn'); return; }
  UI.pdfOpts = { secs: f.secs, show: f.show, vac: f.vac }; saveUI();
  printPDF(f);
}

function printPDF(f) {
  const keys = ['show', 'hiddenM', 'showVac', 'hiddenP', 'monthLists', 'tlPlans', 'tlPxd', 'planSel', 'planCompact', 'planColl', 'planPxd', 'view', 'verbund'];
  const keep = {}; keys.forEach(k => { keep[k] = UI[k] instanceof Set ? new Set(UI[k]) : UI[k] && typeof UI[k] === 'object' ? JSON.parse(JSON.stringify(UI[k])) : UI[k]; });
  UI.show = { ...f.show }; UI.showVac = f.vac; UI.verbund = !!f.verbund; UI.hiddenP = new Set(); UI.monthLists = true; UI.tlPlans = false; UI.tlPxd = 0;
  UI.hiddenM = new Set(C.ms.filter(x => !f.ms.has(x.id)).map(x => x.id));
  UI.planCompact = true; UI.planColl = {}; UI.planPxd = 0;
  UI.printing = true;
  derive();
  let doc;
  try { doc = buildPrintDoc(f); }
  finally { Object.assign(UI, keep); UI.printing = false; derive(); }
  $$('#printdoc').forEach(e => e.remove());
  document.body.append(doc);
  document.body.classList.add('printdoc-mode');
  const title = document.title;
  document.title = 'Jahresplanung_' + UI.year + '_' + ds(todayDn());       // Vorschlag für den Dateinamen
  PRINT_TITLE = title;
  setTimeout(() => window.print(), 80);
}
let PRINT_TITLE = null;
window.addEventListener('afterprint', () => {
  $$('#printdoc').forEach(e => e.remove()); document.body.classList.remove('printdoc-mode');
  if (PRINT_TITLE != null) { document.title = PRINT_TITLE; PRINT_TITLE = null; }
});

function buildPrintDoc(f) {
  const y = UI.year;
  const stand = 'Stand ' + fmtD(todayDn()) + (D.meta.savedAt ? ' · gespeichert ' + fmtStamp(D.meta.savedAt) : '');
  const head = title => h('header', { class: 'pd-head' }, h('img', { src: LOGO, alt: 'Malteser' }),
    h('div', null, h('h1', null, title), h('span', null, 'Fundraising · Diözese Paderborn')), h('span', { class: 'pd-stand' }, stand));
  // Seitenrahmen: Kopf- und Fußabstand wiederholen sich auf jeder Druckseite
  const page = (title, ...content) => h('section', { class: 'pd-page' }, h('table', { class: 'pd-frame' },
    h('thead', null, h('tr', null, h('td', null, h('div', { class: 'pd-sp' })))),
    h('tbody', null, h('tr', null, h('td', null, head(title), content))),
    h('tfoot', null, h('tr', null, h('td', null, h('div', { class: 'pd-sp' }))))));
  const ms = C.ms.filter(x => f.ms.has(x.id) && inYear(x, y));
  const pages = [];
  if (f.secs.mass) {
    const chipH = t => h('span', { class: 'chip demo ' + t }, t);
    pages.push(page('Maßnahmen ' + y, h('table', { class: 'pd-table' },
      h('thead', null, h('tr', null, h('th'), h('th', null, 'Maßnahme'), h('th', null, 'Hauptverantwortlich'), h('th', null, 'Auflage'),
        h('th', null, 'Start Selektion ', chipH('S')), h('th', null, 'Start Inhalt ', chipH('I')), h('th', null, 'PAL ', chipH('P')), h('th', null, 'PAL-Status'), h('th', null, 'Bitte'), h('th', null, 'Hinweis'))),
      h('tbody', null, ms.map(x => h('tr', null,
        h('td', null, h('span', { class: 'dot', style: { background: x.color } })),
        h('td', { class: 'nm', style: { color: inkC(x.color) } }, x.m.name),
        h('td', null, x.m.verantwortlich || ''), h('td', { class: 'num' }, isNum(x.m.auflage) ? (+x.m.auflage).toLocaleString('de-DE') : ''),
        h('td', null, fmtW(x.s)), h('td', null, fmtW(x.i)), h('td', { class: 'pal' + (x.m.palStatus !== 'fest' ? ' vorl' : '') }, fmtW(x.pal)),
        h('td', null, x.m.palStatus), h('td', null, x.m.art || ''), h('td', { class: 'hinweis' }, x.m.hinweis || '')))))));
  }
  if (f.secs.kal) pages.push(page('Kalender ' + y, calendarBody()));
  if (f.secs.tl) pages.push(page('Zeitleiste ' + y, timelineSection().body));
  if (f.secs.ag) { const a = agendaSection(); pages.push(page('Was steht an? · ' + (a.summary || ''), a.body)); }
  if (f.secs.plaene) for (const x of ms.filter(x => x.pc)) {
    UI.planSel = x.id;
    const box = h('div', { class: 'pd-plan' });
    VIEW_FN.plaene(box);
    $$('.view-head, .ptabs, .phead .tools, datalist', box).forEach(e => e.remove());
    pages.push(page('Detailplan ' + x.m.name, box));
  }
  if (f.secs.urlaub) {
    const box = h('div', { class: 'pd-urlaub' });
    VIEW_FN.urlaub(box);
    $$('.view-head, datalist, .addline, button, .screen-only', box).forEach(e => e.remove());
    pages.push(page('Urlaub & Feiertage ' + y, box));
  }
  if (pages.length) pages[pages.length - 1].classList.add('last');
  return h('div', { id: 'printdoc' }, pages);
}

/* ===================================================================== Startbildschirm mit Animation (kleine Lottie-Wiedergabe, offline) */

// Unterstützt genau das, was die Startanimation braucht: Form- und Vorkompositions-Ebenen, Pfade, Ellipsen,
// Füllung, Kontur, Pfad-Trimmen, Gruppen-Transformation und animierte Werte mit Bezier-Easing (auch räumlich).
const Lottie = (() => {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); return e; };
  function easing(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = X(t) - x, d = dX(t); if (Math.abs(e) < 1e-6) return Y(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let a = 0, b = 1; t = x;
      for (let i = 0; i < 40; i++) { const v = X(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) a = t; else b = t; t = (a + b) / 2; }
      return Y(t);
    };
  }
  const arr = v => Array.isArray(v) ? v : [v];
  const pick = (v, d) => { const a = arr(v); return a[Math.min(d, a.length - 1)]; };
  // räumliche Bewegung entlang einer Bezier-Kurve, gleichmäßig nach Weglänge
  function spatial(k) {
    if (k._sp) return k._sp;
    const P0 = k.s, P3 = k._next.s, P1 = P0.map((v, i) => v + (k.to[i] || 0)), P2 = P3.map((v, i) => v + (k.ti[i] || 0));
    const pt = t => P0.map((_, i) => (1 - t) ** 3 * P0[i] + 3 * (1 - t) ** 2 * t * P1[i] + 3 * (1 - t) * t * t * P2[i] + t ** 3 * P3[i]);
    const N = 150, pts = [pt(0)], len = [0];
    for (let j = 1; j <= N; j++) { const q = pt(j / N), p = pts[j - 1]; pts.push(q); len.push(len[j - 1] + Math.hypot(q[0] - p[0], q[1] - p[1])); }
    return (k._sp = { pts, len, total: len[N] });
  }
  function value(prop, t) {
    if (!prop) return null;
    if (!prop.a) return prop.k;
    const K = prop.k;
    if (!K._ready) { K.forEach((k, i) => { k._next = K[i + 1]; }); K._ready = true; }
    if (t <= K[0].t) return K[0].s;
    for (let n = 0; n < K.length - 1; n++) {
      const a = K[n], b = K[n + 1];
      if (t >= b.t && n < K.length - 2) continue;
      if (t >= b.t) return b.s;
      if (a.h) return a.s;
      const u = (t - a.t) / (b.t - a.t), s = arr(a.s), e = arr(b.s);
      if (!a._ease) a._ease = s.map((_, d) => easing(pick(a.o.x, d), pick(a.o.y, d), pick(a.i.x, d), pick(a.i.y, d)));
      if (a.to && a.ti && (a.to.some(v => v) || a.ti.some(v => v))) {
        const sp = spatial(a), want = clamp(a._ease[0](u), 0, 1) * sp.total;
        let j = 1; while (j < sp.len.length - 1 && sp.len[j] < want) j++;
        const f = sp.len[j] === sp.len[j - 1] ? 0 : (want - sp.len[j - 1]) / (sp.len[j] - sp.len[j - 1]);
        return sp.pts[j - 1].map((v, i) => v + (sp.pts[j][i] - v) * f);
      }
      const out = s.map((v, d) => v + (e[d] - v) * a._ease[d](u));
      return Array.isArray(a.s) ? out : out[0];
    }
    return K[K.length - 1].s;
  }
  const n0 = v => Array.isArray(v) ? v[0] : v;
  function transform(ks, t) {
    const p = value(ks.p, t) || [0, 0], a = value(ks.a, t) || [0, 0], s = value(ks.s, t) || [100, 100], r = n0(value(ks.r, t)) || 0;
    return `translate(${p[0]},${p[1]}) rotate(${r}) scale(${s[0] / 100},${s[1] / 100}) translate(${-a[0]},${-a[1]})`;
  }
  const opac = (ks, t) => ks && ks.o ? n0(value(ks.o, t)) / 100 : 1;
  const rgb = c => `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`;
  function pathD(k) {
    const { v, i, o, c } = k; if (!v || !v.length) return '';
    let d = `M${v[0][0]},${v[0][1]}`;
    const seg = (a, b) => { d += `C${v[a][0] + o[a][0]},${v[a][1] + o[a][1]} ${v[b][0] + i[b][0]},${v[b][1] + i[b][1]} ${v[b][0]},${v[b][1]}`; };
    for (let n = 1; n < v.length; n++) seg(n - 1, n);
    if (c) { seg(v.length - 1, 0); d += 'Z'; }
    return d;
  }
  // baut die SVG-Elemente einmal auf und liefert Aktualisierer je Zeitpunkt
  function buildShapes(items, parent, ups, getTime) {
    const paths = items.filter(q => q.ty === 'sh' || q.ty === 'el'), trim = items.find(q => q.ty === 'tm');
    // Reihenfolge wie in Lottie: was zuerst steht, liegt oben → in Listenreihenfolge sammeln, rückwärts einfügen
    const nodes = [];
    for (const it of items) {
      if (it.ty === 'gr') {
        const tr = (it.it || []).find(q => q.ty === 'tr'), ge = el('g');
        if (tr) ups.push(() => { const t = getTime(); ge.setAttribute('transform', transform(tr, t)); ge.setAttribute('opacity', opac(tr, t)); });
        buildShapes(it.it || [], ge, ups, getTime);
        nodes.push(ge);
      } else if (it.ty === 'fl' || it.ty === 'st') for (const ps of paths) nodes.push(styledPath(ps, it, trim, ups, getTime));
    }
    for (const nd of nodes.reverse()) parent.append(nd);
  }
  function styledPath(ps, st, trim, ups, getTime) {
    const e = ps.ty === 'el' ? el('ellipse') : el('path', { d: pathD(ps.ks.a ? ps.ks.k[0].s[0] : ps.ks.k) });
    if (st.ty === 'fl') e.setAttribute('stroke', 'none');
    else { e.setAttribute('fill', 'none'); e.setAttribute('stroke-linecap', ['butt', 'butt', 'round', 'square'][st.lc || 1]); e.setAttribute('stroke-linejoin', ['miter', 'miter', 'round', 'bevel'][st.lj || 1]); }
    if (trim && st.ty === 'st') e.setAttribute('pathLength', '100');
    ups.push(() => {
      const t = getTime();
      if (ps.ty === 'el') { const sz = value(ps.s, t), p = value(ps.p, t); e.setAttribute('cx', p[0]); e.setAttribute('cy', p[1]); e.setAttribute('rx', sz[0] / 2); e.setAttribute('ry', sz[1] / 2); }
      const c = value(st.c, t), o = n0(value(st.o, t)) / 100;
      if (st.ty === 'fl') { e.setAttribute('fill', rgb(c)); e.setAttribute('fill-opacity', o); }
      else { e.setAttribute('stroke', rgb(c)); e.setAttribute('stroke-opacity', o); e.setAttribute('stroke-width', n0(value(st.w, t))); }
      if (trim && st.ty === 'st') {
        const s = n0(value(trim.s, t)), en = n0(value(trim.e, t)), off = (n0(value(trim.o, t)) || 0) / 3.6, a = Math.min(s, en), b = Math.max(s, en);
        if (b - a < 0.01) e.setAttribute('visibility', 'hidden');
        else { e.removeAttribute('visibility'); e.setAttribute('stroke-dasharray', `${b - a} 200`); e.setAttribute('stroke-dashoffset', -(a + off)); }
      }
    });
    return e;
  }
  function buildLayers(layers, assets, parent, ups, getCompTime) {
    for (const L of layers.slice().reverse()) {
      const g = el('g'), lt = getCompTime;                // Schlüsselbilder in Kompositionszeit (wie lottie-web)
      ups.push(() => {
        const ct = getCompTime(), vis = ct >= L.ip && ct < L.op;
        g.setAttribute('display', vis ? 'inline' : 'none');
        if (!vis) return;
        const t = lt();
        g.setAttribute('transform', transform(L.ks, t)); g.setAttribute('opacity', opac(L.ks, t));
      });
      if (L.ty === 4) buildShapes(L.shapes || [], g, ups, lt);
      else if (L.ty === 0) { const asset = assets.find(a => a.id === L.refId); if (asset) buildLayers(asset.layers, assets, g, ups, () => (getCompTime() - (L.st || 0)) / (L.sr || 1)); }
      parent.append(g);
    }
  }
  function load(anim, box) {
    const svg = el('svg', { viewBox: `0 0 ${anim.w} ${anim.h}`, preserveAspectRatio: 'xMidYMid meet', 'aria-hidden': 'true' });
    let frame = anim.ip;
    const ups = [];
    buildLayers(anim.layers, anim.assets || [], svg, ups, () => frame);
    box.append(svg);
    const go = f => { frame = f; ups.forEach(u => u()); };
    go(anim.ip);
    return {
      svg, goTo: go,
      play(onDone) {
        const t0 = performance.now(), dur = (anim.op - anim.ip) / anim.fr * 1000;
        const step = now => {
          const f = anim.ip + Math.min(1, (now - t0) / dur) * (anim.op - 1 - anim.ip);
          go(f);
          if (now - t0 < dur && svg.isConnected) requestAnimationFrame(step); else if (onDone) onDone();
        };
        requestAnimationFrame(step);
      },
    };
  }
  return { load };
})();

function showSplash() {
  if (UI.splash === false || typeof SPLASH_ANIM === 'undefined') return;
  if (navigator.webdriver && !window.__splashTest) return;             // automatisierte Tests
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim = h('div', { class: 'splash-anim' });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    box.classList.add('out');
    document.removeEventListener('keydown', close, true);
    setTimeout(() => box.remove(), 450);
  };
  const box = h('div', { class: 'splash', onclick: close, tip: null },
    h('div', { class: 'splash-mid' }, anim, h('img', { class: 'splash-logo', src: logoSrc(), alt: 'Malteser' })),
    h('div', { class: 'splash-ver' }, 'Version ' + APP_INFO.version));
  document.body.append(box);
  document.addEventListener('keydown', close, true);
  const player = Lottie.load(JSON.parse(JSON.stringify(SPLASH_ANIM)), anim);
  if (reduce) { player.goTo(SPLASH_ANIM.op - 1); setTimeout(close, 900); }
  else player.play(() => setTimeout(close, 350));
}
